name: Build ImmortalWrt Newifi-D2 Stable v11

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  CONFIG_FILE: newifi-d2.config
  TZ: Asia/Shanghai
  MAX_FIRMWARE_SIZE: 33554432  # 32MB
  CCACHE_DIR: /workdir/immortalwrt/.ccache

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium
          df -h
          sudo apt-get update
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.eu.org/init_build_environment.sh)'
          sudo ln -sf /usr/share/zoneinfo/$TZ /etc/localtime
          echo "$TZ" | sudo tee /etc/timezone > /dev/null
          sudo mkdir -p /workdir
          sudo chown -R "$USER":"$USER" /workdir

      - name: 3. 克隆 ImmortalWrt 稳定分支源码
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none immortalwrt
          ln -sf /workdir/immortalwrt $GITHUB_WORKSPACE/immortalwrt

      - name: 4. 完美覆盖 Xray 核心、建立软链接并预建 AGH 环境 (files/)
        run: |
          cd immortalwrt
          mkdir -p files/usr/bin
          mkdir -p files/etc/uci-defaults
          mkdir -p files/etc/hotplug.d/net
          mkdir -p files/etc/config
          mkdir -p files/usr/share/passwall/rules
          mkdir -p files/etc/adguardhome

          echo "🔍 正在从 GitHub 官方抓取最新稳定版 Xray-core (mips32le)..."
          XRAY_URL=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | \
            jq -r '.assets[] | select(.name | test("linux-mips32le.*zip")) | .browser_download_url' | head -n 1)
          
          if [ -z "$XRAY_URL" ] || [ "$XRAY_URL" = "null" ]; then
            XRAY_URL="https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-mips32le.zip"
          fi

          echo "📥 正在下载并覆盖 Xray 核心: $XRAY_URL"
          curl -sL --retry 5 "$XRAY_URL" -o /tmp/xray.zip
          unzip -o /tmp/xray.zip xray -d /tmp/xray-extract
          
          # 覆盖二进制文件并赋予执行权限
          cp /tmp/xray-extract/xray files/usr/bin/xray
          chmod +x files/usr/bin/xray
          
          # 建立 PassWall 兼容软链接，确保组件更新界面完美识别版本
          mkdir -p files/usr/share/passwall
          ln -sf /usr/bin/xray files/usr/share/passwall/xray || true

          echo "✅ Xray 核心覆盖与 PassWall 兼容映射完成！"

          # A. 无线默认开启与中文命名 (alon / alon 5G)
          cat << 'EOF' > files/etc/uci-defaults/97-wifi-defaults
          #!/bin/sh
          uci set wireless.radio0.disabled='0'
          uci set wireless.radio1.disabled='0'
          uci set wireless.default_radio0.ssid='alon'
          uci set wireless.default_radio0.encryption='none'
          uci set wireless.default_radio0.disabled='0'
          uci set wireless.default_radio1.ssid='alon 5G'
          uci set wireless.default_radio1.encryption='none'
          uci set wireless.default_radio1.disabled='0'
          uci commit wireless
          exit 0
          EOF

          # B. 统一调度初始化：Turbo ACC、Passwall、AGH、USB打印 默认配置与自启
          cat << 'EOF' > files/etc/uci-defaults/98-optimize-defaults
          #!/bin/sh
          if uci get turboacc.@global[0] >/dev/null 2>&1; then
              uci set turboacc.@global[0].sw_flow='1'
              uci set turboacc.@global[0].hw_flow='1'
              uci set turboacc.@global[0].fullcone_nat='1'
              uci commit turboacc
          fi

          if uci get passwall.@global[0] >/dev/null 2>&1; then
              uci set passwall.@global[0].enabled='1'
              uci set passwall.@global[0].tcp_proxy_mode='gfwlist'
              uci set passwall.@global[0].udp_proxy_mode='gfwlist'
              uci set passwall.@global[0].dns_mode='xray'
              uci set passwall.@global[0].dns_direct='223.5.5.5'
              uci set passwall.@global[0].dns_remote='1.1.1.1'
              uci set passwall.@global[0].tcp_fastopen='1'
              uci commit passwall
          fi

          # 修复 AdGuard Home 配置，确保 LuCI 界面稳定挂载与后台显示
          if uci get adguardhome.@global[0] >/dev/null 2>&1; then
              uci set adguardhome.@global[0].enabled='1'
              uci set adguardhome.@global[0].port='3000'
              uci commit adguardhome
          else
              uci set adguardhome.@global[0]='global'
              uci set adguardhome.@global[0].enabled='1'
              uci set adguardhome.@global[0].port='3000'
              uci commit adguardhome
          fi

          # 统一拉起系统核心守护进程
          /etc/init.d/ksmbd enable
          /etc/init.d/ksmbd start 2>/dev/null
          /etc/init.d/p910nd enable
          /etc/init.d/p910nd start 2>/dev/null
          /etc/init.d/adguardhome enable
          /etc/init.d/adguardhome start 2>/dev/null
          exit 0
          EOF

          # C. 随身WiFi / USB网卡开机自动拨号绑定 (usbwan)
          cat << 'EOF' > files/etc/uci-defaults/99-usbwan-boot
          #!/bin/sh
          for IFACE in usb0 usb1 eth1 eth2; do
            [ -e "/sys/class/net/$IFACE" ] || continue
            if readlink -f "/sys/class/net/$IFACE/device" | grep -q usb; then
              if ! uci get network.usbwan >/dev/null 2>&1; then
                uci set network.usbwan=interface
                uci set network.usbwan.proto='dhcp'
                uci set network.usbwan.device="$IFACE"
                uci set network.usbwan.metric='10'
                uci commit network
                WAN_ZONE=$(uci show firewall 2>/dev/null | grep -E "zone\[[0-9]+\]\.name='wan'" | head -1 | sed -n "s/.*zone\[\([0-9]*\)\].*/\1/p")
                [ -n "$WAN_ZONE" ] && uci add_list firewall.@zone[$WAN_ZONE].network='usbwan' 2>/dev/null
                uci commit firewall
                /etc/init.d/network reload
                /etc/init.d/firewall reload
              fi
              break
            fi
          done
          exit 0
          EOF

          # D. USB 网卡热插拔动态即插即用脚本
          cat << 'EOF' > files/etc/hotplug.d/net/20-usbwan
          #!/bin/sh
          [ -n "$INTERFACE" ] || exit 0
          case "$INTERFACE" in usb*|eth1|eth2) ;; *) exit 0 ;; esac
          is_usb_dev() {
            if [ -e "/sys/class/net/$INTERFACE/device/uevent" ]; then
              grep -q "DEVTYPE=usb_interface" "/sys/class/net/$INTERFACE/device/uevent" 2>/dev/null && return 0
              readlink -f "/sys/class/net/$INTERFACE/device" 2>/dev/null | grep -q usb && return 0
            else
              readlink -f "/sys/class/net/$INTERFACE/device" 2>/dev/null | grep -q usb && return 0
            fi
            return 1
          }
          find_wan_zone() {
            uci show firewall 2>/dev/null | grep -E "zone\[[0-9]+\]\.name='wan'" | head -1 | sed -n "s/.*zone\[\([0-9]*\)\].*/\1/p"
          }
          case "$ACTION" in
            add)
              is_usb_dev || exit 0
              uci get network.usbwan >/dev/null 2>&1 && exit 0
              uci set network.usbwan=interface
              uci set network.usbwan.proto='dhcp'
              uci set network.usbwan.device="$INTERFACE"
              uci set network.usbwan.metric='10'
              uci commit network
              WAN_ZONE=$(find_wan_zone)
              if [ -n "$WAN_ZONE" ]; then
                uci add_list firewall.@zone[$WAN_ZONE].network='usbwan' 2>/dev/null
                uci commit firewall
              fi
              /etc/init.d/network reload
              /etc/init.d/firewall reload
              ;;
            remove)
              CUR_DEV=$(uci get network.usbwan.device 2>/dev/null)
              [ "$CUR_DEV" = "$INTERFACE" ] || exit 0
              uci delete network.usbwan 2>/dev/null
              uci commit network
              WAN_ZONE=$(find_wan_zone)
              if [ -n "$WAN_ZONE" ]; then
                uci del_list firewall.@zone[$WAN_ZONE].network='usbwan' 2>/dev/null
                uci commit firewall
              fi
              /etc/init.d/network reload
              /etc/init.d/firewall reload
              ;;
          esac
          EOF

          # E. 局域网共享 (Ksmbd) 与 USB 打印服务 (p910nd) 预置配置文件
          cat << 'EOF' > files/etc/config/ksmbd
          config globals
              option workgroup 'WORKGROUP'
              option description 'Newifi-D2'
          config share
              option name 'usb'
              option path '/mnt'
              option read_only 'no'
              option guest_ok 'yes'
              option create_mask '0666'
              option dir_mask '0777'
          EOF

          cat << 'EOF' > files/etc/config/p910nd
          config p910nd
              option enabled '1'
              option device '/dev/usb/lp0'
              option port '0'
              option bidirectional '0'
          EOF

          # F. 内核网络调优、BBR 及每日凌晨 4 点自动释放内存缓存
          cat << 'EOF' > files/etc/sysctl.conf
          fs.file-max = 655350
          net.core.somaxconn = 1024
          net.ipv4.tcp_max_syn_backlog = 8192
          net.ipv4.tcp_rmem = 4096 87380 8388608
          net.ipv4.tcp_wmem = 4096 65536 8388608
          net.ipv4.tcp_congestion_control = bbr
          vm.min_free_kbytes = 16384
          EOF

          mkdir -p files/etc/crontabs
          echo "0 4 * * * sync && echo 3 > /proc/sys/vm/drop_caches" > files/etc/crontabs/root

          chmod +x files/etc/hotplug.d/net/20-usbwan files/etc/uci-defaults/* 2>/dev/null || true
          echo "🔧 稳定分支语法校验版与统一调度环境配置完成。"

      - name: 5. 缓存 CCache 与 dl (升级至 v11 强制清除旧缓存)
        uses: actions/cache@v4
        with:
          path: |
            /workdir/immortalwrt/.ccache
            /workdir/immortalwrt/dl
          key: ${{ runner.os }}-imm-d2-stable-v11-${{ hashFiles('newifi-d2.config') }}
          restore-keys: |
            ${{ runner.os }}-imm-d2-stable-v11-

      - name: 6. 更新并安装 Feeds
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 7. 加载配置与依赖校验
        run: |
          mv "$CONFIG_FILE" immortalwrt/.config
          cd immortalwrt
          grep -q '^CONFIG_CCACHE=y' .config || echo 'CONFIG_CCACHE=y' >> .config
          make defconfig

      - name: 8. 修改 LAN IP 为 192.168.2.1
        run: |
          cd immortalwrt
          sed -i 's/192\.168\.1\.1/192.168.2.1/g' package/base-files/files/bin/config_generate 2>/dev/null || true

      - name: 9. 下载源码包
        run: |
          cd immortalwrt
          export CCACHE_DIR="$CCACHE_DIR"
          ccache -M 5G
          make download -j8 || make download -j1 V=s
          find dl -size -1024c -exec rm -f {} \;

      - name: 10. 预置 PassWall 最新分流规则
        run: |
          cd immortalwrt
          RULES_DIR="files/usr/share/passwall/rules"
          curl -sL --retry 3 "https://fastly.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/gfw.txt" -o "$RULES_DIR/gfwlist"
          curl -sL --retry 3 "https://fastly.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/china-list.txt" -o "$RULES_DIR/chnlist" || true

      - name: 11. 开始编译固件（多线程编译，带单线程错误降级）
        id: compile
        run: |
          cd immortalwrt
          export CCACHE_DIR="$CCACHE_DIR"
          make -j$(nproc) || make -j1 V=s 2>&1 | tee build.log

      - name: 12. 编译失败时上传错误日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build_error_logs
          path: immortalwrt/build.log
          if-no-files-found: warn

      - name: 13. 检查体积并准备发布
        id: check_size
        if: steps.compile.outcome == 'success'
        run: |
          cd immortalwrt/bin/targets/ramips/mt7621
          if ls *sysupgrade.bin 1> /dev/null 2>&1; then
            FIRMWARE=$(ls *sysupgrade.bin | head -n 1)
            SIZE=$(stat -c%s "$FIRMWARE")
            SIZE_MB=$(echo "scale=2; $SIZE / 1024 / 1024" | bc)
            echo "📦 固件体积: ${SIZE_MB} MB"
            if [ "$SIZE" -gt "$MAX_FIRMWARE_SIZE" ]; then 
              echo "❌ 体积超限！"; exit 1
            fi
            echo "✅ 体积合规"
            echo "FIRMWARE_PATH=$PWD" >> "$GITHUB_ENV"
            echo "TAG_DATE=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"
          else
            echo "❌ 未生成 sysupgrade.bin 文件。请检查编译日志。"
            exit 1
          fi

      - name: 14. 发布 Release 版本
        uses: softprops/action-gh-release@v2
        if: steps.check_size.outcome == 'success'
        with:
          tag_name: ImmortalWrt-D2-Stable-v11-${{ env.TAG_DATE }}
          name: ImmortalWrt Newifi-D2 稳定分支无暗病终极版 [${{ env.TAG_DATE }}]
          body: |
            ## 🚀 稳定分支 v11 无暗病终极版说明

            本固件基于 **ImmortalWrt 24.10 稳定分支** 为 **Newifi-D2 (MT7621)** 统一调度编译。

            ### 💎 核心优化亮点：
            1. **Xray 完美识别**：采用双保险机制（系统生成基础 + 脚本强力覆盖最新稳定版），并通过软链接完美对接 PassWall 组件更新。
            2. **AdGuard Home 稳定可见**：补齐中文化语言包并预建工作目录，后台稳定开机自启、菜单永不丢失。
            3. **开箱即用生态**：集成 USB 打印服务 (p910nd)、Ksmbd 共享、Turbo ACC 加速、随身 Wi-Fi 热插拔及 PassWall 默认分流规则。
          files: ${{ env.FIRMWARE_PATH }}/*sysupgrade.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

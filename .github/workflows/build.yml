name: Build Newifi-D2 LEDE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装编译依赖环境
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-distutils rsync unzip zlib1g-dev \
            file wget swig libelf-dev libgmp-dev libmpc-dev libmpfr-dev autoconf automake libtool

      - name: 克隆 LEDE 源码 (Newifi-D2 专用)
        run: |
          git clone --depth 1 https://github.com/coolsnowwolf/lede.git openwrt

      - name: 更新并安装 Feeds 软件源
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 自动下载并解压 PassWall 源码到 package 目录
        run: |
          rm -rf openwrt/package/passwall-packages openwrt/package/passwall
          mkdir -p openwrt/package/passwall-packages openwrt/package/passwall
          
          # 自动下载并解压主程序
          wget -qO passwall.zip https://github.com/Openwrt-Passwall/openwrt-passwall/archive/refs/heads/main.zip
          unzip -q passwall.zip -d /tmp/
          cp -r /tmp/openwrt-passwall-main/* openwrt/package/passwall/
          
          # 自动下载并解压依赖包
          wget -qO passwall-packages.zip https://github.com/Openwrt-Passwall/openwrt-passwall-packages/archive/refs/heads/main.zip
          unzip -q passwall-packages.zip -d /tmp/
          cp -r /tmp/openwrt-passwall-packages-main/* openwrt/package/passwall-packages/

      - name: 注入自定义配置文件 (.config)
        run: |
          if [ -f .config ]; then
            cp .config openwrt/.config
          else
            echo "Error: .config file not found in root directory!"
            exit 1
          fi

      - name: 预下载编译固件所需的软件包 (防止断网报错)
        run: |
          cd openwrt
          make defconfig
          make download -j8

      - name: 开始编译固件
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: 收集并打包编译好的固件
        uses: actions/upload-artifact@v4
        with:
          name: Newifi-D2-OpenWrt-Firmware
          path: openwrt/bin/targets/*/*/*.bin

name: Build ImmortalWrt Newifi-D2 Stable

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  CONFIG_FILE: newifi-d2.config
  TZ: Asia/Shanghai
  MAX_FIRMWARE_SIZE: 33030144 # 31.5 MB
  CCACHE_DIR: /workdir/openwrt/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. 检出源码仓库
        uses: actions/checkout@v4

      - name: 2. 初始化环境 (官方脚本)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/news /usr/local/doc
          df -h
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.eu.org/init_build_environment.sh)'
          sudo ln -sf /usr/share/zoneinfo/$TZ /etc/localtime
          echo "$TZ" | sudo tee /etc/timezone > /dev/null
          sudo mkdir -p /workdir
          sudo chown -R "$USER":"$USER" /workdir

      - name: 3. 克隆源码
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 4. 缓存 CCache 与 dl
        uses: actions/cache@v4
        with:
          path: |
            /workdir/openwrt/.ccache
            /workdir/openwrt/dl
          key: ${{ runner.os }}-immortalwrt-${{ hashFiles('newifi-d2.config') }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-

      - name: 5. 更新 Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 6. 加载配置并检查
        run: |
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "❌ 未找到 $CONFIG_FILE"
            exit 1
          fi
          mv "$CONFIG_FILE" openwrt/.config
          cd openwrt

          grep -q '^CONFIG_CCACHE=y' .config || echo 'CONFIG_CCACHE=y' >> .config
          make defconfig

          echo "🔍 关键项检查..."

          # PassWall2 Nftables 透明代理
          if grep -q '^CONFIG_PACKAGE_luci-app-passwall2_Nftables_Transparent_Proxy=y' .config; then
            echo "✅ PassWall2 Nftables 透明代理已启用"
          else
            echo "⚠️ PassWall2 Nftables 透明代理未启用，尝试自动补全..."
            echo 'CONFIG_PACKAGE_luci-app-passwall2_Nftables_Transparent_Proxy=y' >> .config
            echo 'CONFIG_PACKAGE_dnsmasq_full_nftset=y' >> .config
            make defconfig
            grep -q '^CONFIG_PACKAGE_luci-app-passwall2_Nftables_Transparent_Proxy=y' .config \
              && echo "✅ 补全成功" \
              || echo "⚠️ 补全失败，请检查源码是否支持"
          fi

          # 检查其他关键依赖
          grep -q '^CONFIG_PACKAGE_dnsmasq_full_nftset=y' .config \
            && echo "✅ dnsmasq-full nftset 已启用" \
            || echo "⚠️ dnsmasq-full nftset 未启用"

          grep -q '^CONFIG_PACKAGE_miniupnpd-nftables=y' .config \
            && echo "✅ miniupnpd-nftables 已启用" \
            || echo "⚠️ miniupnpd-nftables 未启用"

          grep -q '^CONFIG_PACKAGE_zram-swap=y' .config \
            && echo "✅ ZRAM 已启用" \
            || echo "⚠️ ZRAM 未启用"

      - name: 7. 修改默认 IP 为 192.168.2.1
        run: |
          cd openwrt
          OLD_PATH="package/base-files/files/bin/config_generate"
          NEW_PATH="package/base-files/luci2/bin/config_generate"
          MODIFIED=false
          if [ -f "$NEW_PATH" ]; then
            sed -i 's/192\.168\.1\.1/192.168.2.1/g' "$NEW_PATH"
            MODIFIED=true
          elif [ -f "$OLD_PATH" ]; then
            sed -i 's/192\.168\.1\.1/192.168.2.1/g' "$OLD_PATH"
            MODIFIED=true
          fi
          [ "$MODIFIED" = true ] && echo "✅ 默认 IP 已修改" || echo "⚠️ 未找到 config_generate"

      - name: 8. 配置 CCache 并下载源码
        run: |
          cd openwrt
          mkdir -p "$CCACHE_DIR"
          ccache -M 2G
          ccache -s
          make download -j8 || (echo "⚠️ 并发下载失败，单线程重试..." && make download -j1 V=s)
          find dl -size -1024c -exec rm -f {} \;

      - name: 9. 开始编译固件 (并行 + 内存保护)
        id: compile
        run: |
          cd openwrt
          echo "🚀 使用 -j4 并行编译，单进程虚拟内存限制 3GB..."
          if (ulimit -v 3000000; make -j4 V=s > build.log 2>&1); then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "❌ 编译失败！"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            tail -n 200 build.log
            exit 1
          fi

      - name: 9.5 失败时上传日志
        if: failure() && steps.compile.outputs.status == 'failed'
        uses: actions/upload-artifact@v4
        with:
          name: build_error_logs
          path: openwrt/build.log

      - name: 10. 检查固件体积
        id: check_size
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          cd openwrt/bin/targets/ramips/mt7621
          FIRMWARE=$(ls *sysupgrade.bin 2>/dev/null | head -n 1)
          [ -z "$FIRMWARE" ] && { echo "❌ 未找到 sysupgrade.bin"; exit 1; }
          SIZE=$(stat -c%s "$FIRMWARE")
          SIZE_MB=$(echo "scale=2; $SIZE / 1024 / 1024" | bc)
          MAX_MB=$(echo "scale=2; $MAX_FIRMWARE_SIZE / 1024 / 1024" | bc)
          REMAINING=$(echo "scale=2; ($MAX_FIRMWARE_SIZE - $SIZE) / 1024 / 1024" | bc)

          echo "📦 $FIRMWARE"
          echo "📊 ${SIZE_MB} MB / 上限 ${MAX_MB} MB / 剩余 ${REMAINING} MB"

          if [ "$SIZE" -gt "$MAX_FIRMWARE_SIZE" ]; then
            echo "❌ 超限，刷入会变砖！"
            exit 1
          fi
          echo "✅ 大小合规"
          echo "FIRMWARE_PATH=$PWD" >> "$GITHUB_ENV"
          echo "TAG_DATE=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"

      - name: 11. 上传 Artifacts
        uses: actions/upload-artifact@v4
        if: steps.check_size.outcome == 'success' && !cancelled()
        with:
          name: ImmortalWrt_NewifiD2_Stable
          path: ${{ env.FIRMWARE_PATH }}/*sysupgrade.bin
          if-no-files-found: error

      - name: 12. 发布 Release
        uses: softprops/action-gh-release@v2
        if: steps.check_size.outcome == 'success' && !cancelled()
        with:
          tag_name: Newifi-D2-Stable-${{ env.TAG_DATE }}
          name: Newifi-D2 精简稳定版 [${{ env.TAG_DATE }}]
          body: |
            ### 固件特性
            * **源码**: ImmortalWrt `openwrt-24.10`
            * **代理**: PassWall2 + Xray（**Nftables 透明代理**）
            * **网络**: WWAN 无线中继 / USB 手机共享 (RNDIS/CDC/iPhone)
            * **工具**: DDNS (DNSPod) / TTYD / 定时重启 / UPnP (nftables)
            * **优化**: ZRAM / 默认主题 / IPv6 用户态裁剪 / 并行编译
            * **默认 IP**: `192.168.2.1`
            * **注意**: 已剔除 NTFS、iptables/ipset、Turbo ACC。PassWall2 完美适配 nftables 环境。
          files: ${{ env.FIRMWARE_PATH }}/*sysupgrade.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

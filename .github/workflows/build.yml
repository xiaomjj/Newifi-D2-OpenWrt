name: Build ImmortalWrt Newifi-D2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  CONFIG_FILE: newifi-d2.config
  TZ: Asia/Shanghai
  MAX_FIRMWARE_SIZE: 33030144  # 31.5 MB 上限
  CCACHE_DIR: /workdir/immortalwrt/.ccache

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 初始化编译环境 (Ubuntu)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 清理多余的软件包释放空间
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium
          df -h
          sudo apt-get update
          # 使用 ImmortalWrt 官方脚本安装依赖
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.eu.org/init_build_environment.sh)'
          sudo ln -sf /usr/share/zoneinfo/$TZ /etc/localtime
          echo "$TZ" | sudo tee /etc/timezone > /dev/null
          # 准备工作目录并授权
          sudo mkdir -p /workdir
          sudo chown -R "$USER":"$USER" /workdir

      - name: 3. 克隆 ImmortalWrt 源码
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none immortalwrt
          ln -sf /workdir/immortalwrt $GITHUB_WORKSPACE/immortalwrt

      - name: 4. 注入预置文件并修复格式
        run: |
          mkdir -p immortalwrt/files
          cp -a files/. immortalwrt/files/ 2>/dev/null || true
          echo "🔧 修复 Windows 换行符 (CRLF -> LF)..."
          find immortalwrt/files -type f -exec sed -i 's/\r$//' {} + 2>/dev/null || true
          # 给所有脚本赋予执行权限
          chmod +x immortalwrt/files/etc/hotplug.d/net/20-usbwan immortalwrt/files/etc/uci-defaults/* 2>/dev/null || true

      - name: 5. 缓存 CCache 与 dl 加速后续编译
        uses: actions/cache@v4
        with:
          path: |
            /workdir/immortalwrt/.ccache
            /workdir/immortalwrt/dl
          key: ${{ runner.os }}-imm-d2-${{ hashFiles('newifi-d2.config') }}
          restore-keys: |
            ${{ runner.os }}-imm-d2-

      - name: 6. 更新 Feeds 与源码净化
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          echo "🔪 物理阉割源码中默认捆绑的无关插件..."
          for pkg in ssr-plus openclash turboacc ddns upnp nlbwmon wol ttyd sqm watchcat; do
            sed -i "/luci-app-$pkg/d" feeds/luci/collections/luci/Makefile 2>/dev/null || true
          done
          echo "✅ 源码级净化完成"

      - name: 7. 加载配置与终极依赖校验
        run: |
          mv "$CONFIG_FILE" immortalwrt/.config
          cd immortalwrt
          
          grep -q '^CONFIG_CCACHE=y' .config || echo 'CONFIG_CCACHE=y' >> .config
          make defconfig
          
          # 清除非内核模块的 =m 标记，强制加入固件
          sed -i '/^CONFIG_PACKAGE_kmod-/!s/^CONFIG_PACKAGE_\(.*\)=m/# CONFIG_PACKAGE_\1 is not set/g' .config
          make defconfig

          # 死锁强制添加指定项，防止被系统遗漏
          REQUIRED_PKGS=(
            "CONFIG_PACKAGE_luci-app-passwall"
            "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray"
            "CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy"
            "CONFIG_PACKAGE_xray-core"
            "CONFIG_PACKAGE_kmod-nft-tproxy"
            "CONFIG_PACKAGE_kmod-nft-socket"
            "CONFIG_PACKAGE_kmod-tun"
            "CONFIG_PACKAGE_kmod-inet-diag"
            "CONFIG_PACKAGE_dnsmasq-full"
            "CONFIG_PACKAGE_zram-swap"
            "CONFIG_PACKAGE_block-mount"
            "CONFIG_PACKAGE_relayd"
            "CONFIG_PACKAGE_luci-proto-relay"
            "CONFIG_PACKAGE_kmod-usb-net"
            "CONFIG_PACKAGE_kmod-usb-net-rndis"
            "CONFIG_PACKAGE_kmod-usb-net-cdc-ether"
            "CONFIG_PACKAGE_kmod-usb-net-ipheth"
            "CONFIG_PACKAGE_usbmuxd"
            "CONFIG_PACKAGE_kmod-usb-printer"
            "CONFIG_PACKAGE_p910nd"
            "CONFIG_PACKAGE_luci-app-p910nd"
            "CONFIG_PACKAGE_kmod-fs-ksmbd"
            "CONFIG_PACKAGE_ksmbd-server"
            "CONFIG_PACKAGE_luci-i18n-base-zh-cn"
            "CONFIG_PACKAGE_luci-i18n-firewall-zh-cn"
            "CONFIG_PACKAGE_luci-i18n-passwall-zh-cn"
            "CONFIG_PACKAGE_luci-i18n-p910nd-zh-cn"
          )
          for pkg in "${REQUIRED_PKGS[@]}"; do
            if grep -q "^${pkg}=y" .config; then
              echo "✅ ${pkg}"
            else
              echo "${pkg}=y" >> .config
            fi
          done
          make defconfig

          # 终极大检查：发现垃圾立即中止编译
          echo "🛡️ 终极校验：发现垃圾立即中止！..."
          for pkg in "luci-app-ssr-plus" "luci-app-openclash" "luci-app-turboacc" "luci-app-ddns" "luci-app-upnp" "luci-app-wol" "luci-app-nlbwmon" "luci-app-ttyd" "luci-app-samba4" "v2ray-core"; do
            if grep -q "^CONFIG_PACKAGE_${pkg}=y" .config; then
              echo "❌ 致命错误：发现未授权的插件 ${pkg}！"
              exit 1
            fi
          done

      - name: 8. 修改默认后台 IP 为 192.168.2.1
        run: |
          cd immortalwrt
          sed -i 's/192\.168\.1\.1/192.168.2.1/g' package/base-files/files/bin/config_generate 2>/dev/null || true

      - name: 9. 下载源码包 (并发下载 + 单线程重试兜底)
        run: |
          cd immortalwrt
          export CCACHE_DIR="$CCACHE_DIR"
          ccache -M 5G
          make download -j8 || make download -j1 V=s
          find dl -size -1024c -exec rm -f {} \;

      - name: 10. 预置 Xray 核心与 PassWall 分流规则库
        run: |
          cd immortalwrt
          
          # 1. 动态获取并解压 Xray 核心
          mkdir -p files/usr/bin
          echo "📥 获取 Xray 最新 mips32le 核心..."
          XRAY_URL=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | \
            jq -r '.assets[] | select(.name | test("linux-mips32le.*zip")) | .browser_download_url' | head -n 1)
          curl -sL --retry 3 "$XRAY_URL" -o /tmp/xray.zip
          unzip -o /tmp/xray.zip xray -d /tmp/xray-extract
          cp /tmp/xray-extract/xray files/usr/bin/xray
          chmod 0755 files/usr/bin/xray
          
          # 2. 预置 PassWall 规则库（免首次更新等待）
          mkdir -p files/usr/share/passwall/rules
          RULES_DIR="files/usr/share/passwall/rules"
          echo "📥 下载 PassWall 分流规则..."
          curl -sL --retry 3 "https://fastly.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/gfw.txt" -o "$RULES_DIR/gfwlist"
          curl -sL --retry 3 "https://fastly.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/china-list.txt" -o "$RULES_DIR/chnlist"
          curl -sL --retry 3 "https://ispip.clang.cn/all_cn.txt" -o "$RULES_DIR/chnroute"

      - name: 11. 开始编译固件
        id: compile
        run: |
          cd immortalwrt
          export CCACHE_DIR="$CCACHE_DIR"
          # 编译日志输出到文件并同步打印
          make -j2 V=s 2>&1 | tee build.log || (tail -n 200 build.log && exit 1)

      - name: 12. 编译失败时上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build_error_logs
          path: immortalwrt/build.log
          if-no-files-found: warn

      - name: 13. 检查固件体积并准备发布
        id: check_size
        if: steps.compile.outcome == 'success'
        run: |
          cd immortalwrt/bin/targets/ramips/mt7621
          FIRMWARE=$(ls *sysupgrade.bin | head -n 1)
          SIZE=$(stat -c%s "$FIRMWARE")
          SIZE_MB=$(echo "scale=2; $SIZE / 1024 / 1024" | bc)
          echo "📦 固件体积: ${SIZE_MB} MB"
          if [ "$SIZE" -gt "$MAX_FIRMWARE_SIZE" ]; then 
            echo "❌ 体积超限！"; exit 1
          fi
          echo "✅ 体积合规"
          echo "FIRMWARE_PATH=$PWD" >> "$GITHUB_ENV"
          echo "TAG_DATE=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"

      - name: 14. 发布 Release 版本
        uses: softprops/action-gh-release@v2
        if: steps.check_size.outcome == 'success'
        with:
          tag_name: ImmortalWrt-D2-PW-${{ env.TAG_DATE }}
          name: ImmortalWrt Newifi-D2 PassWall 纯净版 [${{ env.TAG_DATE }}]
          body: |
            ## 🚀 固件特色与产品介绍

            本固件基于 **ImmortalWrt 24.10** 稳定版源码为 **Newifi-D2 (MT7621)** 深度定制，剔除了一切多余的臃肿插件，只为“极致纯净、稳定养老”而生。

            ### ✨ 核心功能特性
            * **代理解析**：采用 **PassWall + Xray (Nftables 透明代理)**。已预置最新版 Xray 核心与全套分流规则库（gfwlist/chnlist/chnroute），刷机即用，无需漫长下载。
            * **性能优化**：预置底层网络调优（UDP Buffer 扩容、TCP BBR 拥塞控制），彻底解决 MT7621 跑 Hysteria2/TUIC 等新协议的断流问题。
            * **ZRAM 防溢出**：已启用 ZRAM 虚拟内存，缓解 512MB 物理内存压力，确保系统长期运行不 OOM 崩溃。
            * **绝对纯净**：强硬阉割 OpenClash、SSR+、TurboACC 等源码自带私货，LuCI 界面干干净净。

            ### 🔌 硬件即插即用（开箱即用配置）
            * **WiFi 预设**：默认广播免密 WiFi（2.4G: `alon` / 5G: `alon 5G`），手机直连即可进入 `192.168.2.1` 后台。
            * **文件共享**：内置 **ksmbd** 核心（支持 NTFS / exFAT / ext4 / FAT32），U 盘插入自动挂载至 `\\192.168.2.1\usb`。
            * **USB 打印**：内置 **p910nd**，USB 打印机插上即可通过 `9100` 端口打印。
            * **USB 网络共享**：支持安卓/苹果手机及随身 WiFi。插上手机自动建接口，拔下自动删配置，绝无残留。
            * **无线中继**：已内置 `relayd`，支持无线桥接扩展。

            ### ⚠️ 刷机后必做操作
            1. **重置配置**：如果在 Breed 或 LuCI 刷机，请**务必取消勾选**“保留配置”，以免旧固件的残留导致菜单错乱。
            2. **配置节点**：进入 `服务 -> PassWall`，在节点列表中填入你的代理节点信息，保存应用即可科学上网。
            3. **修改 WiFi 密码**：为了安全，进入后台后请前往 `网络 -> 无线` 为 `alon` 设置强密码。
          files: ${{ env.FIRMWARE_PATH }}/*sysupgrade.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build LEDE Newifi-D2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: newifi-d2.config
  TZ: Asia/Shanghai
  MAX_FIRMWARE_SIZE: 33030144   # 31.5 MB
  CCACHE_DIR: /workdir/lede/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. 检出仓库（含 files/）
        uses: actions/checkout@v4

      - name: 2. 初始化环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium /usr/local/news /usr/local/doc
          df -h
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.eu.org/init_build_environment.sh)'
          sudo ln -sf /usr/share/zoneinfo/$TZ /etc/localtime
          echo "$TZ" | sudo tee /etc/timezone > /dev/null
          sudo mkdir -p /workdir
          sudo chown -R "$USER":"$USER" /workdir

      - name: 3. 克隆 LEDE 源码
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none lede
          ln -sf /workdir/lede $GITHUB_WORKSPACE/lede

      - name: 4. 把仓库 files/ 覆盖到 lede/files/
        run: |
          mkdir -p lede/files
          cp -a files/. lede/files/

      - name: 5. 缓存 CCache 与 dl
        uses: actions/cache@v4
        with:
          path: |
            /workdir/lede/.ccache
            /workdir/lede/dl
          key: ${{ runner.os }}-lede-d2-${{ hashFiles('newifi-d2.config') }}
          restore-keys: |
            ${{ runner.os }}-lede-d2-

      - name: 6. 更新 Feeds
        run: |
          cd lede
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 7. 修补 feeds（只做必要修补，不加包）
        run: |
          cd lede
          find feeds/ -type f -name "*.mk" -exec sed -i '/kmod-fs-exfat-oot/d' {} + || true
          echo "✅ feeds 修补完成"

      - name: 8. 加载配置、净化并校验已选项
        run: |
          if [ ! -f "$CONFIG_FILE" ]; then echo "❌ 未找到 $CONFIG_FILE"; exit 1; fi
          mv "$CONFIG_FILE" lede/.config
          cd lede

          grep -q '^CONFIG_CCACHE=y' .config || echo 'CONFIG_CCACHE=y' >> .config
          make defconfig

          # 只清理非 kmod 的 =m
          sed -i '/^CONFIG_PACKAGE_kmod-/!s/^CONFIG_PACKAGE_\(.*\)=m/# CONFIG_PACKAGE_\1 is not set/g' .config
          make defconfig

          # 强制检查已选择项，防止被 make defconfig 误删
          REQUIRED_PKGS=(
            "CONFIG_PACKAGE_luci-app-passwall"
            "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray"
            "CONFIG_PACKAGE_xray-core"
            "CONFIG_PACKAGE_luci-i18n-passwall-zh-cn"
            "CONFIG_PACKAGE_dnsmasq-full"
            "CONFIG_PACKAGE_zram-swap"
            "CONFIG_PACKAGE_block-mount"
            "CONFIG_PACKAGE_relayd"
            "CONFIG_PACKAGE_luci-proto-relay"
            "CONFIG_PACKAGE_kmod-usb-net"
            "CONFIG_PACKAGE_kmod-usb-net-rndis"
            "CONFIG_PACKAGE_kmod-usb-net-cdc-ether"
            "CONFIG_PACKAGE_kmod-usb-net-ipheth"
            "CONFIG_PACKAGE_usbmuxd"
            "CONFIG_PACKAGE_usb-modeswitch"
            "CONFIG_PACKAGE_kmod-usb-printer"
            "CONFIG_PACKAGE_p910nd"
            "CONFIG_PACKAGE_luci-app-p910nd"
            "CONFIG_PACKAGE_luci-i18n-p910nd-zh-cn"
            "CONFIG_PACKAGE_kmod-fs-ksmbd"
            "CONFIG_PACKAGE_ksmbd-server"
            "CONFIG_PACKAGE_luci-i18n-base-zh-cn"
            "CONFIG_PACKAGE_luci-i18n-firewall-zh-cn"
          )
          for pkg in "${REQUIRED_PKGS[@]}"; do
            if grep -q "^${pkg}=y" .config; then
              echo "✅ ${pkg}"
            else
              echo "${pkg}=y" >> .config
            fi
          done
          make defconfig

          # 强制关闭冲突及未选择的包
          sed -i 's/^CONFIG_PACKAGE_autosamba=y/# CONFIG_PACKAGE_autosamba is not set/' .config
          sed -i 's/^CONFIG_PACKAGE_samba4-server=y/# CONFIG_PACKAGE_samba4-server is not set/' .config
          sed -i 's/^CONFIG_PACKAGE_luci-app-samba4=y/# CONFIG_PACKAGE_luci-app-samba4 is not set/' .config
          sed -i 's/^CONFIG_PACKAGE_v2ray-core=y/# CONFIG_PACKAGE_v2ray-core is not set/' .config
          sed -i 's/^CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray=y/# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray is not set/' .config
          make defconfig

          if grep -q '^CONFIG_PACKAGE_v2ray-core=y' .config; then
            echo "❌ v2ray-core 被意外选中"; exit 1
          fi
          echo "✅ 仅 Xray，Samba4/v2ray 已关闭"

      - name: 9. 修改默认 IP 为 192.168.2.1
        run: |
          cd lede
          OLD_PATH="package/base-files/files/bin/config_generate"
          if [ -f "$OLD_PATH" ]; then
            sed -i 's/192\.168\.1\.1/192.168.2.1/g' "$OLD_PATH"
          fi

      - name: 10. 配置 CCache 与下载源码
        run: |
          cd lede
          mkdir -p "$CCACHE_DIR"
          export CCACHE_DIR="$CCACHE_DIR"
          ccache -M 5G
          make download -j8 || (echo "⚠️ 并发下载失败，单线程重试..." && make download -j1 V=s)
          find dl -size -1024c -exec rm -f {} \;

      - name: 11. 预置 Xray 核心与 PassWall 规则（零下载目标）
        run: |
          cd lede

          # ---- Xray mipsle 核心 (使用正确的 mips32le 命名) ----
          mkdir -p files/usr/bin
          XRAY_VERSION="latest"
          XRAY_FILE_SF="Xray-linux-mips32le-softfloat.zip"
          XRAY_FILE_STD="Xray-linux-mips32le.zip"
          
          echo "📥 下载 Xray mipsle 核心 ($XRAY_VERSION)..."
          rm -f /tmp/xray.zip
          
          # 优先尝试 softfloat 版本，失败则尝试普通版本
          curl -sL --retry 3 --connect-timeout 20 \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/${XRAY_FILE_SF}" \
            -o /tmp/xray.zip || \
          curl -sL --retry 3 --connect-timeout 20 \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/${XRAY_FILE_STD}" \
            -o /tmp/xray.zip

          if file /tmp/xray.zip | grep -q "Zip archive"; then
            unzip -o /tmp/xray.zip xray -d /tmp/xray-extract
            cp /tmp/xray-extract/xray files/usr/bin/xray
            chmod 0755 files/usr/bin/xray
            echo "✅ Xray 已嵌入: $(ls -lh files/usr/bin/xray | awk '{print $5}')"
          else
            echo "❌ Xray 下载失败，请检查网络"; head -c 300 /tmp/xray.zip; exit 1
          fi

          # ---- PassWall 规则 ----
          mkdir -p files/usr/share/passwall/rules
          RULES_DIR="files/usr/share/passwall/rules"
          
          echo "📥 下载 gfwlist / chnlist / chnroute..."
          # gfwlist
          curl -sL --retry 3 "https://fastly.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/gfw.txt" -o "$RULES_DIR/gfwlist"
          # chnlist
          curl -sL --retry 3 "https://fastly.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/china-list.txt" -o "$RULES_DIR/chnlist" || \
          curl -sL --retry 3 "https://fastly.jsdelivr.net/gh/felixonmars/dnsmasq-china-list@master/accelerated-domains.china.conf" -o "$RULES_DIR/chnlist"
          # chnroute (使用PassWall默认源)
          curl -sL --retry 3 "https://ispip.clang.cn/all_cn.txt" -o "$RULES_DIR/chnroute"

          for f in gfwlist chnlist chnroute; do
            if [ ! -s "$RULES_DIR/$f" ]; then
              echo "❌ $f 为空，检查下载源"; exit 1
            fi
            echo "✅ $f: $(wc -l < "$RULES_DIR/$f") 行"
          done

      - name: 12. 开始编译固件
        id: compile
        run: |
          cd lede
          export CCACHE_DIR="$CCACHE_DIR"
          make -j2 V=s > build.log 2>&1 || (tail -n 200 build.log && exit 1)

      - name: 13. 失败时上传日志
        if: failure() && steps.compile.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: build_error_logs
          path: lede/build.log

      - name: 14. 检查固件体积
        id: check_size
        if: steps.compile.outcome == 'success'
        run: |
          cd lede/bin/targets/ramips/mt7621
          FIRMWARE=$(ls *sysupgrade.bin | head -n 1)
          SIZE=$(stat -c%s "$FIRMWARE")
          SIZE_MB=$(echo "scale=2; $SIZE / 1024 / 1024" | bc)
          echo "📦 固件大小: ${SIZE_MB} MB（上限 $MAX_FIRMWARE_SIZE bytes）"
          if [ "$SIZE" -gt "$MAX_FIRMWARE_SIZE" ]; then
            echo "❌ 超限，当前: $SIZE bytes"
            exit 1
          fi
          echo "✅ 大小合规"
          echo "FIRMWARE_PATH=$PWD" >> "$GITHUB_ENV"
          echo "TAG_DATE=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"

      - name: 15. 上传 Artifacts
        uses: actions/upload-artifact@v4
        if: steps.check_size.outcome == 'success'
        with:
          name: LEDE_NewifiD2
          path: ${{ env.FIRMWARE_PATH }}/*sysupgrade.bin

      - name: 16. 发布 Release
        uses: softprops/action-gh-release@v2
        if: steps.check_size.outcome == 'success'
        with:
          tag_name: LEDE-D2-${{ env.TAG_DATE }}
          name: LEDE Newifi-D2 [${{ env.TAG_DATE }}]
          body: |
            ### 已包含
            * PassWall + Xray（仅 Xray，核心与规则已预置）
            * relayd 无线中继
            * ksmbd 文件共享（SMB2/3，预置即插即用）
            * p910nd USB 打印（Raw 9100，预置即插即用）
            * USB 网络共享（安卓 RNDIS / CDC-Ether / iPhone ipheth / 随身 WiFi，插上自动建、拔掉自动删）
            * USB 存储挂载（ext4/vfat）
            * ZRAM
            * 中文界面（base / firewall / PassWall / p910nd）
            ### 未包含
            OpenClash、v2ray、Samba4、Aria2/BT/PT、DDNS、ZeroTier、frpc、ttyd、UPnP、CUPS/AirPrint、NTFS/exFAT
          files: ${{ env.FIRMWARE_PATH }}/*sysupgrade.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Newifi-D2 LEDE

on:
  repository_dispatch:
  workflow_dispatch:

# 限制单次任务，确保每次只跑一个最新的，避免资源浪费和冲突
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检查代码仓库
      uses: actions/checkout@v4

    - name: 初始化并安装编译依赖环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -y update
        sudo -E apt-get -y install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo -E apt-get -y install libelf-dev libssl-dev build-time-dependency-tools
        sudo -E apt-get -y autoremove --purge
        sudo -E apt-get clean
        sudo timedatectl set-timezone "Asia/Shanghai"

    - name: 克隆 Lean 大佬的 LEDE 源码
      run: |
        git clone --depth 1 https://github.com/coolsnowwolf/lede openwrt

    - name: 加载自定义的 .config 配置文件与 Feeds
      run: |
        cp .config openwrt/.config
        cd openwrt
        # 更新与安装扩展 feeds，确保所有插件和依赖包声明完整
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        make defconfig

    - name: 下载第三方依赖与软件包 (Download dl)
      run: |
        cd openwrt
        make download -j8

    - name: 预先编译关键底层依赖（解决并发时序与头文件缺失）
      run: |
        cd openwrt
        echo "正在强制预先编译 pcre2 及核心工具链依赖..."
        # 强制单线程优先编译 pcre2，从根本上杜绝 libselinux 等模块找不到 pcre2.h 的报错
        make package/libs/libpcre2/compile V=s || true
        make tools/compile -j$(nproc) || true
        make toolchain/compile -j$(nproc) || true

    - name: 开始多线程编译固件
      run: |
        cd openwrt
        echo -e "当前系统可用核心数: $(nproc)"
        # 优先多线程并发编译；若因偶发时序报错中断，自动降级为单线程排查并输出详细日志 (V=s)
        make -j$(nproc) || make -j1 V=s

    - name: 提取并打包编译产物
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt-Newifi-D2-LEDE
        path: openwrt/bin/targets/ramips/mt7621/*

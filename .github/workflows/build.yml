name: Build LEDE Newifi-D2 OpenClash

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: newifi-d2.config
  TZ: Asia/Shanghai
  MAX_FIRMWARE_SIZE: 33030144 # 31.5 MB
  CCACHE_DIR: /workdir/lede/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. 检出源码仓库
        uses: actions/checkout@v4

      - name: 2. 初始化环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium /usr/local/news /usr/local/doc
          df -h
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.eu.org/init_build_environment.sh)'
          sudo ln -sf /usr/share/zoneinfo/$TZ /etc/localtime
          echo "$TZ" | sudo tee /etc/timezone > /dev/null
          sudo mkdir -p /workdir
          sudo chown -R "$USER":"$USER" /workdir

      - name: 3. 克隆 LEDE 源码
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none lede
          ln -sf /workdir/lede $GITHUB_WORKSPACE/lede

      - name: 4. 缓存 CCache 与 dl
        uses: actions/cache@v4
        with:
          path: |
            /workdir/lede/.ccache
            /workdir/lede/dl
          key: ${{ runner.os }}-lede-oc-${{ hashFiles('newifi-d2.config') }}
          restore-keys: |
            ${{ runner.os }}-lede-oc-

      - name: 5. 更新 Feeds
        run: |
          cd lede
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 6. 修补 feeds 中缺失的 exfat-oot 依赖
        run: |
          cd lede
          HIT=0
          while IFS= read -r f; do
            HIT=1
            sed -i -E 's/[A-Za-z0-9_:!+-]*kmod-fs-exfat-oot//g' "$f"
          done < <(grep -rl 'kmod-fs-exfat-oot' feeds/ 2>/dev/null || true)
          if [ "$HIT" -eq 0 ]; then echo "✅ 无残留"; else echo "✅ 修补完成"; fi

      - name: 7. 加载配置、深度净化并校验
        run: |
          if [ ! -f "$CONFIG_FILE" ]; then echo "❌ 未找到 $CONFIG_FILE"; exit 1; fi
          mv "$CONFIG_FILE" lede/.config
          cd lede
          
          grep -q '^CONFIG_CCACHE=y' .config || echo 'CONFIG_CCACHE=y' >> .config
          make defconfig

          # 🧹 终极净化：强制抹杀所有处于 =m 状态的包，防止 SSR/KMS 等夹带
          echo "🧹 净化 .config: 清除所有 =m 状态，防止生成额外 .ipk..."
          sed -i 's/^CONFIG_PACKAGE_\(.*\)=m/# CONFIG_PACKAGE_\1 is not set/g' .config
          make defconfig

          echo "🔍 深度校验核心依赖..."
          MISSING=0
          REQUIRED_PKGS=(
            "CONFIG_PACKAGE_luci-app-openclash"
            "CONFIG_PACKAGE_dnsmasq-full"
            "CONFIG_PACKAGE_iptables-mod-tproxy"
            "CONFIG_PACKAGE_iptables-mod-extra"
            "CONFIG_PACKAGE_kmod-tun"
            "CONFIG_PACKAGE_ruby"
            "CONFIG_PACKAGE_luci-app-upnp"
            "CONFIG_PACKAGE_zram-swap"
            "CONFIG_PACKAGE_block-mount"
            "CONFIG_PACKAGE_ntfs-3g"
            "CONFIG_PACKAGE_luci-app-samba4"
            "CONFIG_PACKAGE_luci-app-aria2"
            "CONFIG_PACKAGE_luci-app-zerotier"
          )

          for pkg in "${REQUIRED_PKGS[@]}"; do
            if grep -q "^${pkg}=y" .config; then
              echo "✅ ${pkg} 已成功保留"
            else
              echo "⚠️ ${pkg} 被丢弃，强制补全..."
              echo "${pkg}=y" >> .config
              MISSING=1
            fi
          done

          if [ "$MISSING" -eq 1 ]; then
            make defconfig
            for pkg in "${REQUIRED_PKGS[@]}"; do
              grep -q "^${pkg}=y" .config || { echo "❌ 致命错误: ${pkg} 依赖冲突"; exit 1; }
            done
          fi

          echo "🔍 补齐 UPnP 后端..."
          if ! grep -q '^CONFIG_PACKAGE_miniupnpd=y' .config; then
            echo 'CONFIG_PACKAGE_miniupnpd-iptables=y' >> .config
            echo 'CONFIG_PACKAGE_miniupnpd=y' >> .config
          fi

      - name: 8. 修改默认 IP 为 192.168.2.1
        run: |
          cd lede
          OLD_PATH="package/base-files/files/bin/config_generate"
          if [ -f "$OLD_PATH" ]; then
            sed -i 's/192\.168\.1\.1/192.168.2.1/g' "$OLD_PATH"
          fi

      - name: 9. 配置 CCache 与下载源码
        run: |
          cd lede
          mkdir -p "$CCACHE_DIR"
          export CCACHE_DIR="$CCACHE_DIR"
          ccache -M 5G
          make download -j8 || (echo "⚠️ 并发下载失败，单线程重试..." && make download -j1 V=s)
          find dl -size -1024c -exec rm -f {} \;

      - name: 10. 嵌入 Mihomo (Clash Meta) 专属内核
        run: |
          cd lede
          echo "📥 下载 Mihomo 内核 (mipsle-softfloat)..."
          mkdir -p files/etc/openclash/core
          
          # 获取最新版本，MT7621 固定使用 mipsle-softfloat
          MIHOMO_URL="https://github.com/MetaCubeX/mihomo/releases/latest/download/mihomo-linux-mipsle-softfloat.gz"
          
          if wget -q -O /tmp/mihomo.gz "$MIHOMO_URL"; then
            gzip -dc /tmp/mihomo.gz > files/etc/openclash/core/clash_meta
            chmod 0755 files/etc/openclash/core/clash_meta
            echo "✅ Mihomo 内核已成功嵌入: $(ls -lh files/etc/openclash/core/clash_meta | awk '{print $5}')"
          else
            echo "❌ 内核下载失败，请检查网络或源地址"
            exit 1
          fi

      - name: 11. 开始编译固件
        id: compile
        run: |
          cd lede
          export CCACHE_DIR="$CCACHE_DIR"
          if (ulimit -v 3000000; make -j4 V=s > build.log 2>&1); then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            tail -n 200 build.log
            exit 1
          fi

      - name: 12. 失败时上传日志
        if: failure() && steps.compile.outputs.status != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: build_error_logs
          path: lede/build.log

      - name: 13. 严格检查固件体积
        id: check_size
        if: steps.compile.outputs.status == 'success'
        run: |
          cd lede/bin/targets/ramips/mt7621
          FIRMWARE=$(ls *sysupgrade.bin | head -n 1)
          SIZE=$(stat -c%s "$FIRMWARE")
          SIZE_MB=$(echo "scale=2; $SIZE / 1024 / 1024" | bc)
          
          echo "📦 固件大小: ${SIZE_MB} MB"
          if [ "$SIZE" -gt "$MAX_FIRMWARE_SIZE" ]; then
            echo "❌ 超限，当前: $SIZE bytes"
            exit 1
          fi
          echo "✅ 大小合规"
          echo "FIRMWARE_PATH=$PWD" >> "$GITHUB_ENV"
          echo "TAG_DATE=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"

      - name: 14. 上传 Artifacts
        uses: actions/upload-artifact@v4
        if: steps.check_size.outcome == 'success'
        with:
          name: LEDE_NewifiD2_OpenClash
          path: ${{ env.FIRMWARE_PATH }}/*sysupgrade.bin

      - name: 15. 发布 Release
        uses: softprops/action-gh-release@v2
        if: steps.check_size.outcome == 'success'
        with:
          tag_name: LEDE-Newifi-D2-OC-${{ env.TAG_DATE }}
          name: LEDE Newifi-D2 OpenClash 纯净版 [${{ env.TAG_DATE }}]
          body: |
            ### 固件特性
            * **代理**: OpenClash (已内置 Mihomo/Meta 专属内核)
            * **存储**: USB 自动挂载 / Samba4 共享 / Aria2 下载
            * **网络**: ZeroTier 组网 / frpc 穿透 / USB 共享 / 无线中继
            * **工具**: 流量监控 / 硬盘休眠 / 释放内存 / 自定义命令
            * **说明**: 强制纯净编译，无任何多余夹带插件。
          files: ${{ env.FIRMWARE_PATH }}/*sysupgrade.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

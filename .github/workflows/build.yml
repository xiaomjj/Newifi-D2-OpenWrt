name: Build LEDE Newifi-D2 OpenClash

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: newifi-d2.config
  TZ: Asia/Shanghai
  MAX_FIRMWARE_SIZE: 33030144 # 31.5 MB
  CCACHE_DIR: /workdir/lede/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. 检出源码仓库
        uses: actions/checkout@v4

      - name: 2. 初始化环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium /usr/local/news /usr/local/doc
          df -h
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.eu.org/init_build_environment.sh)'
          sudo ln -sf /usr/share/zoneinfo/$TZ /etc/localtime
          echo "$TZ" | sudo tee /etc/timezone > /dev/null
          sudo mkdir -p /workdir
          sudo chown -R "$USER":"$USER" /workdir

      - name: 3. 克隆 LEDE 源码
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none lede
          ln -sf /workdir/lede $GITHUB_WORKSPACE/lede

      - name: 4. 缓存 CCache 与 dl
        uses: actions/cache@v4
        with:
          path: |
            /workdir/lede/.ccache
            /workdir/lede/dl
          key: ${{ runner.os }}-lede-oc-${{ hashFiles('newifi-d2.config') }}
          restore-keys: |
            ${{ runner.os }}-lede-oc-

      - name: 5. 更新 Feeds
        run: |
          cd lede
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 6. 修补 feeds 中缺失的依赖
        run: |
          cd lede
          find feeds/ -type f -name "*.mk" -exec sed -i '/kmod-fs-exfat-oot/d' {} +
          echo "✅ 依赖修补完成"

      - name: 7. 加载配置、深度净化并校验
        run: |
          if [ ! -f "$CONFIG_FILE" ]; then echo "❌ 未找到 $CONFIG_FILE"; exit 1; fi
          mv "$CONFIG_FILE" lede/.config
          cd lede
          
          grep -q '^CONFIG_CCACHE=y' .config || echo 'CONFIG_CCACHE=y' >> .config
          make defconfig

          # 🧹 净化 .config
          echo "🧹 净化 .config: 清除所有 =m 状态..."
          sed -i 's/^CONFIG_PACKAGE_\(.*\)=m/# CONFIG_PACKAGE_\1 is not set/g' .config
          make defconfig

          echo "🔍 深度校验 OpenClash 及核心依赖..."
          REQUIRED_PKGS=(
            "CONFIG_PACKAGE_luci-app-openclash"
            "CONFIG_PACKAGE_dnsmasq-full"
            "CONFIG_PACKAGE_iptables-mod-tproxy"
            "CONFIG_PACKAGE_iptables-mod-extra"
            "CONFIG_PACKAGE_kmod-tun"
            "CONFIG_PACKAGE_ruby"
            "CONFIG_PACKAGE_ruby-yaml"
            "CONFIG_PACKAGE_bash"
            "CONFIG_PACKAGE_curl"
            "CONFIG_PACKAGE_ca-certificates"
            "CONFIG_PACKAGE_ipset"
            "CONFIG_PACKAGE_ip-full"
            "CONFIG_PACKAGE_libcap"
            "CONFIG_PACKAGE_libcap-bin"
            "CONFIG_PACKAGE_luci-app-upnp"
            "CONFIG_PACKAGE_zram-swap"
            "CONFIG_PACKAGE_block-mount"
            "CONFIG_PACKAGE_ntfs-3g"
            "CONFIG_PACKAGE_luci-app-samba4"
            "CONFIG_PACKAGE_luci-app-aria2"
            "CONFIG_PACKAGE_luci-app-zerotier"
          )

          for pkg in "${REQUIRED_PKGS[@]}"; do
            if grep -q "^${pkg}=y" .config; then
              echo "✅ ${pkg} 已预置"
            else
              echo "${pkg}=y" >> .config
            fi
          done
          make defconfig

          if ! grep -q '^CONFIG_PACKAGE_miniupnpd=y' .config; then
            echo 'CONFIG_PACKAGE_miniupnpd-iptables=y' >> .config
            echo 'CONFIG_PACKAGE_miniupnpd=y' >> .config
          fi

      - name: 8. 修改默认 IP 为 192.168.2.1
        run: |
          cd lede
          OLD_PATH="package/base-files/files/bin/config_generate"
          if [ -f "$OLD_PATH" ]; then
            sed -i 's/192\.168\.1\.1/192.168.2.1/g' "$OLD_PATH"
          fi

      - name: 9. 配置 CCache 与下载源码
        run: |
          cd lede
          mkdir -p "$CCACHE_DIR"
          export CCACHE_DIR="$CCACHE_DIR"
          ccache -M 5G
          make download -j8 || (echo "⚠️ 并发下载失败，单线程重试..." && make download -j1 V=s)
          find dl -size -1024c -exec rm -f {} \;

      - name: 10. 强行预置 OpenClash 全套养老组件（带文件校验）
        run: |
          cd lede
          CORE_DIR="files/etc/openclash/core"
          GEO_DIR="files/etc/openclash"
          mkdir -p "$CORE_DIR" "$GEO_DIR"
          
          VERSION="v1.19.33"
          MIHOMO_FILE="mihomo-linux-mipsle-softfloat-${VERSION}.gz"
          
          echo "📥 开始下载 Mihomo 内核 ($VERSION)..."
          rm -f /tmp/mihomo.gz
          
          curl -sL --retry 3 --connect-timeout 20 "https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/${MIHOMO_FILE}" -o /tmp/mihomo.gz || \
          curl -sL --retry 3 --connect-timeout 20 "https://ghfast.top/https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/${MIHOMO_FILE}" -o /tmp/mihomo.gz

          if file /tmp/mihomo.gz | grep -q "gzip compressed"; then
            gzip -dc /tmp/mihomo.gz > "$CORE_DIR/clash_meta"
            chmod 0755 "$CORE_DIR/clash_meta"
            echo "✅ Mihomo 内核已成功嵌入！大小: $(ls -lh $CORE_DIR/clash_meta | awk '{print $5}')"
          else
            echo "❌ 下载的文件不是有效的 gzip 压缩包，以下是下载内容预览："
            cat /tmp/mihomo.gz
            exit 1
          fi

          echo "📥 预置最新的 GeoIP / GeoSite / Country 规则库..."
          curl -sL --retry 3 "https://ghfast.top/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country-lite.mmdb" -o "$GEO_DIR/Country.mmdb"
          curl -sL --retry 3 "https://ghfast.top/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat" -o "$GEO_DIR/GeoSite.dat"
          curl -sL --retry 3 "https://ghfast.top/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat" -o "$GEO_DIR/GeoIP.dat"
          echo "✅ 规则库全部写入完成！"

      - name: 11. 开始编译固件
        id: compile
        run: |
          cd lede
          export CCACHE_DIR="$CCACHE_DIR"
          make -j4 V=s > build.log 2>&1 || (tail -n 200 build.log && exit 1)

      - name: 12. 失败时上传日志
        if: failure() && steps.compile.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: build_error_logs
          path: lede/build.log

      - name: 13. 严格检查固件体积
        id: check_size
        if: steps.compile.outcome == 'success'
        run: |
          cd lede/bin/targets/ramips/mt7621
          FIRMWARE=$(ls *sysupgrade.bin | head -n 1)
          SIZE=$(stat -c%s "$FIRMWARE")
          SIZE_MB=$(echo "scale=2; $SIZE / 1024 / 1024" | bc)
          
          echo "📦 固件大小: ${SIZE_MB} MB"
          if [ "$SIZE" -gt "$MAX_FIRMWARE_SIZE" ]; then
            echo "❌ 超限，当前: $SIZE bytes"
            exit 1
          fi
          echo "✅ 大小合规"
          echo "FIRMWARE_PATH=$PWD" >> "$GITHUB_ENV"
          echo "TAG_DATE=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"

      - name: 14. 上传 Artifacts
        uses: actions/upload-artifact@v4
        if: steps.check_size.outcome == 'success'
        with:
          name: LEDE_NewifiD2_OpenClash_养老版
          path: ${{ env.FIRMWARE_PATH }}/*sysupgrade.bin

      - name: 15. 发布 Release
        uses: softprops/action-gh-release@v2
        if: steps.check_size.outcome == 'success'
        with:
          tag_name: LEDE-Newifi-D2-OC-${{ env.TAG_DATE }}
          name: LEDE Newifi-D2 OpenClash 养老版 [${{ env.TAG_DATE }}]
          body: |
            ### 固件特性（养老专用）
            * **OpenClash**: 内置 Mihomo 专属内核 + 完整 GeoIP/GeoSite/Country 规则库，刷机即用。
            * **纯净轻 NAS**: 支持 USB 存储自动挂载 / Samba4 共享 / Aria2 高速下载。
            * **远程管理**: ZeroTier 组网 / frpc 内网穿透 / ttyd 终端。
            * **内存防护**: 启用 ZRAM Swap 防止 512MB 内存溢出。
          files: ${{ env.FIRMWARE_PATH }}/*sysupgrade.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

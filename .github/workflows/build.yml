name: Build Newifi-D2 LEDE

on:
  repository_dispatch:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: 检查代码仓库
      uses: actions/checkout@v4

    - name: 初始化并安装编译依赖环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -y update
        sudo -E apt-get -y install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo -E apt-get -y install libelf-dev libssl-dev
        sudo -E apt-get -y autoremove --purge
        sudo -E apt-get clean
        sudo timedatectl set-timezone "Asia/Shanghai"

    - name: 克隆 Lean 大佬的 LEDE 源码
      run: |
        git clone --depth 1 https://github.com/coolsnowwolf/lede openwrt

    - name: 添加必要的第三方软件仓库源（防止插件遗漏或被删）
      run: |
        cd openwrt
        # 在默认 feeds 文件中追加主流插件仓库，确保 PassWall 及相关依赖 100% 稳定加载
        echo 'src-git helloworld https://github.com/fw876/helloworld' >> feeds.conf.default
        echo 'src-git passwall https://github.com/xiaorouji/openwrt-passwall' >> feeds.conf.default

    - name: 加载自定义的 .config 配置文件与 Feeds
      run: |
        cp .config openwrt/.config
        cd openwrt
        # 更新与安装扩展 feeds
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        make defconfig

    - name: 验证核心插件是否加载成功（防遗漏安全检查）
      run: |
        cd openwrt
        echo "检查 PassWall 编译配置状态："
        grep -i "passwall" .config || echo "提示: 未检测到 passwall 显式配置，请确认 .config"

    - name: 下载第三方依赖与软件包 (Download dl)
      run: |
        cd openwrt
        make download -j8

    - name: 开始多线程编译固件
      run: |
        cd openwrt
        echo -e "当前系统可用核心数: $(nproc)"
        # 优先多线程并发编译；若因时序报错自动降级为单线程排查 (V=s)
        make -j$(nproc) || make -j1 V=s

    - name: 收集并整理固件产物路径
      id: organize
      run: |
        cd openwrt/bin/targets/ramips/mt7621/
        echo "FIRMWARE_DIR=$PWD" >> $GITHUB_ENV
        # 严格使用正斜杠和纯数字时间戳，杜绝生成非法 Tag 字符
        TAG_TIME=$(date +'%Y%m%d-%H%M')
        echo "TAG_DATE=$TAG_TIME" >> $GITHUB_ENV

    - name: 提取并备份编译产物 (Artifacts - 完整包)
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt-Newifi-D2-LEDE-All
        path: ${{ env.FIRMWARE_DIR }}/

    - name: 自动发布纯净 .bin 固件到 Releases 页面
      uses: softprops/action-gh-release@v2
      with:
        tag_name: auto-build-${{ env.TAG_DATE }}
        name: Newifi-D2 LEDE 自动编译固件 [${{ env.TAG_DATE }}]
        body: |
          ### 💡 固件详情
          * **设备型号**: Newifi-D2 (MT7621)
          * **源码来源**: Lean LEDE (自带 Feeds + 官方 PassWall 仓库源)
          * **集成功能**: 默认主题、USB 打印机服务、PassWall + Sing-Box、USB 存储挂载、4G/网络共享
          * **默认 IP**: `192.168.2.1`
          * **说明**: 此处直接提供精简的 `.bin` 刷机固件，方便直接刷入。
        files: |
          ${{ env.FIRMWARE_DIR }}/*sysupgrade*.bin

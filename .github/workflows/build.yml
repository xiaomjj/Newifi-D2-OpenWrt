name: Build LEDE Newifi-D2 OpenClash

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: newifi-d2.config
  TZ: Asia/Shanghai
  MAX_FIRMWARE_SIZE: 33030144 # 31.5 MB
  CCACHE_DIR: /workdir/lede/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. 检出源码仓库
        uses: actions/checkout@v4

      - name: 2. 初始化环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium /usr/local/news /usr/local/doc
          df -h
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.eu.org/init_build_environment.sh)'
          sudo ln -sf /usr/share/zoneinfo/$TZ /etc/localtime
          echo "$TZ" | sudo tee /etc/timezone > /dev/null
          sudo mkdir -p /workdir
          sudo chown -R "$USER":"$USER" /workdir

      - name: 3. 克隆 LEDE 源码
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none lede
          ln -sf /workdir/lede $GITHUB_WORKSPACE/lede

      - name: 4. 缓存 CCache 与 dl
        uses: actions/cache@v4
        with:
          path: |
            /workdir/lede/.ccache
            /workdir/lede/dl
          key: ${{ runner.os }}-lede-oc-${{ hashFiles('newifi-d2.config') }}
          restore-keys: |
            ${{ runner.os }}-lede-oc-

      - name: 5. 更新 Feeds
        run: |
          cd lede
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 6. 修补 feeds 中缺失的依赖
        run: |
          cd lede
          find feeds/ -type f -name "*.mk" -exec sed -i '/kmod-fs-exfat-oot/d' {} +
          echo "✅ 依赖修补完成"

      - name: 7. 加载配置、深度净化并校验
        run: |
          if [ ! -f "$CONFIG_FILE" ]; then echo "❌ 未找到 $CONFIG_FILE"; exit 1; fi
          mv "$CONFIG_FILE" lede/.config
          cd lede
          
          grep -q '^CONFIG_CCACHE=y' .config || echo 'CONFIG_CCACHE=y' >> .config
          make defconfig

          # 🧹 终极净化：强制抹杀所有处于 =m 状态的包
          echo "🧹 净化 .config: 清除所有 =m 状态..."
          sed -i 's/^CONFIG_PACKAGE_\(.*\)=m/# CONFIG_PACKAGE_\1 is not set/g' .config
          make defconfig

          echo "🔍 深度校验核心依赖..."
          REQUIRED_PKGS=(
            "CONFIG_PACKAGE_luci-app-openclash"
            "CONFIG_PACKAGE_dnsmasq-full"
            "CONFIG_PACKAGE_iptables-mod-tproxy"
            "CONFIG_PACKAGE_iptables-mod-extra"
            "CONFIG_PACKAGE_kmod-tun"
            "CONFIG_PACKAGE_ruby"
            "CONFIG_PACKAGE_luci-app-upnp"
            "CONFIG_PACKAGE_zram-swap"
            "CONFIG_PACKAGE_block-mount"
            "CONFIG_PACKAGE_ntfs-3g"
            "CONFIG_PACKAGE_luci-app-samba4"
            "CONFIG_PACKAGE_luci-app-aria2"
            "CONFIG_PACKAGE_luci-app-zerotier"
          )

          for pkg in "${REQUIRED_PKGS[@]}"; do
            if grep -q "^${pkg}=y" .config; then
              echo "✅ ${pkg} 已成功保留"
            else
              echo "${pkg}=y" >> .config
            fi
          done
          make defconfig

          if ! grep -q '^CONFIG_PACKAGE_miniupnpd=y' .config; then
            echo 'CONFIG_PACKAGE_miniupnpd-iptables=y' >> .config
            echo 'CONFIG_PACKAGE_miniupnpd=y' >> .config
          fi

      - name: 8. 修改默认 IP 为 192.168.2.1
        run: |
          cd lede
          OLD_PATH="package/base-files/files/bin/config_generate"
          if [ -f "$OLD_PATH" ]; then
            sed -i 's/192\.168\.1\.1/192.168.2.1/g' "$OLD_PATH"
          fi

      - name: 9. 配置 CCache 与下载源码
        run: |
          cd lede
          mkdir -p "$CCACHE_DIR"
          export CCACHE_DIR="$CCACHE_DIR"
          ccache -M 5G
          make download -j8 || (echo "⚠️ 并发下载失败，单线程重试..." && make download -j1 V=s)
          find dl -size -1024c -exec rm -f {} \;

      - name: 10. 嵌入 Mihomo 内核及 GeoIP 规则库（多路镜像重试）
        run: |
          cd lede
          CORE_DIR="files/etc/openclash/core"
          GEO_DIR="files/etc/openclash"
          mkdir -p "$CORE_DIR" "$GEO_DIR"
          
          echo "📥 正在获取 Mihomo 最新版本信息..."
          API_URL="https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"
          VERSION=$(curl -s $API_URL | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          [ -z "$VERSION" ] && VERSION="v1.19.33"
          echo "🔖 最新版本号: $VERSION"
          
          MIHOMO_FILE="mihomo-linux-mipsle_softfloat-${VERSION}.gz"
          
          # 多路候选下载源
          URLS=(
            "https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/${MIHOMO_FILE}"
            "https://ghfast.top/https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/${MIHOMO_FILE}"
            "https://mirror.ghproxy.com/https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/${MIHOMO_FILE}"
          ]
          
          SUCCESS=0
          for url in "${URLS[@]}"; do
            echo "📥 尝试从以下地址下载内核: $url"
            if wget -q --tries=2 --timeout=30 -O /tmp/mihomo.gz "$url"; then
              if gzip -dc /tmp/mihomo.gz > "$CORE_DIR/clash_meta"; then
                chmod 0755 "$CORE_DIR/clash_meta"
                echo "✅ Mihomo 内核下载并解压成功！"
                SUCCESS=1
                break
              fi
            fi
            echo "⚠️ 当前源下载失败，切换下一个..."
          done
          
          if [ "$SUCCESS" -eq 0 ]; then
            echo "❌ 所有下载源均失败，跳过预置内核（固件仍可正常编译，刷机后可在 OpenClash 后台更新）"
          fi

          echo "📥 下载预置 GeoIP / GeoSite 规则库..."
          wget -q --tries=3 -O "$GEO_DIR/Country.mmdb" https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country-lite.mmdb || true
          wget -q --tries=3 -O "$GEO_DIR/GeoSite.dat" https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat || true
          wget -q --tries=3 -O "$GEO_DIR/GeoIP.dat" https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat || true
          echo "✅ 规则库预置完成"

      - name: 11. 开始编译固件
        id: compile
        run: |
          cd lede
          export CCACHE_DIR="$CCACHE_DIR"
          make -j4 V=s > build.log 2>&1 || (tail -n 200 build.log && exit 1)

      - name: 12. 失败时上传日志
        if: failure() && steps.compile.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: build_error_logs
          path: lede/build.log

      - name: 13. 严格检查固件体积
        id: check_size
        if: steps.compile.outcome == 'success'
        run: |
          cd lede/bin/targets/ramips/mt7621
          FIRMWARE=$(ls *sysupgrade.bin | head -n 1)
          SIZE=$(stat -c%s "$FIRMWARE")
          SIZE_MB=$(echo "scale=2; $SIZE / 1024 / 1024" | bc)
          
          echo "📦 固件大小: ${SIZE_MB} MB"
          if [ "$SIZE" -gt "$MAX_FIRMWARE_SIZE" ]; then
            echo "❌ 超限，当前: $SIZE bytes"
            exit 1
          fi
          echo "✅ 大小合规"
          echo "FIRMWARE_PATH=$PWD" >> "$GITHUB_ENV"
          echo "TAG_DATE=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"

      - name: 14. 上传 Artifacts
        uses: actions/upload-artifact@v4
        if: steps.check_size.outcome == 'success'
        with:
          name: LEDE_NewifiD2_OpenClash
          path: ${{ env.FIRMWARE_PATH }}/*sysupgrade.bin

      - name: 15. 发布 Release
        uses: softprops/action-gh-release@v2
        if: steps.check_size.outcome == 'success'
        with:
          tag_name: LEDE-Newifi-D2-OC-${{ env.TAG_DATE }}
          name: LEDE Newifi-D2 OpenClash 纯净版 [${{ env.TAG_DATE }}]
          body: |
            ### 固件特性
            * **代理**: OpenClash (已内置 Mihomo 内核 + 规则库)
            * **存储**: USB 自动挂载 / Samba4 共享 / Aria2 下载
            * **网络**: ZeroTier 组网 / frpc 穿透 / USB 共享 / 无线中继
            * **工具**: 流量监控 / 硬盘休眠 / 释放内存 / 自定义命令
            * **说明**: 强制纯净编译，无任何多余夹带插件。
          files: ${{ env.FIRMWARE_PATH }}/*sysupgrade.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

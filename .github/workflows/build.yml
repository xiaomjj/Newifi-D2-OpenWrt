name: Build ImmortalWrt Newifi-D2

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  CONFIG_FILE: newifi-d2.config
  TZ: Asia/Shanghai
  MAX_FIRMWARE_SIZE: 33030144
  CCACHE_DIR: /workdir/immortalwrt/.ccache

jobs:
  build:
    runs-on: debian-12
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 初始化环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium
          df -h
          sudo apt-get update
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.eu.org/init_build_environment.sh)'
          sudo ln -sf /usr/share/zoneinfo/$TZ /etc/localtime
          sudo mkdir -p /workdir
          sudo chown -R "$USER":"$USER" /workdir

      - name: 3. 克隆 ImmortalWrt 源码
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none immortalwrt
          ln -sf /workdir/immortalwrt $GITHUB_WORKSPACE/immortalwrt

      - name: 4. 覆盖 files/ 并转换换行符
        run: |
          mkdir -p immortalwrt/files
          cp -a files/. immortalwrt/files/ 2>/dev/null || true
          find immortalwrt/files -type f -exec sed -i 's/\r$//' {} + 2>/dev/null || true
          chmod +x immortalwrt/files/etc/hotplug.d/net/20-usbwan immortalwrt/files/etc/uci-defaults/98-usbwan-boot immortalwrt/files/etc/uci-defaults/99-iot-enable 2>/dev/null || true

      - name: 5. 缓存 CCache 与 dl
        uses: actions/cache@v4
        with:
          path: |
            /workdir/immortalwrt/.ccache
            /workdir/immortalwrt/dl
          key: ${{ runner.os }}-imm-d2-${{ hashFiles('newifi-d2.config') }}
          restore-keys: ${{ runner.os }}-imm-d2-

      - name: 6. 更新 Feeds 并引入 Nikki 源
        run: |
          cd immortalwrt
          sed -i '1i src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main' feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          for pkg in passwall ssr-plus openclash turboacc ddns upnp nlbwmon wol ttyd sqm watchcat; do
            sed -i "/luci-app-$pkg/d" feeds/luci/collections/luci/Makefile 2>/dev/null || true
          done

      - name: 7. 加载配置与终极校验
        run: |
          mv "$CONFIG_FILE" immortalwrt/.config
          cd immortalwrt
          grep -q '^CONFIG_CCACHE=y' .config || echo 'CONFIG_CCACHE=y' >> .config
          make defconfig
          sed -i '/^CONFIG_PACKAGE_kmod-/!s/^CONFIG_PACKAGE_\(.*\)=m/# CONFIG_PACKAGE_\1 is not set/g' .config
          make defconfig

          REQUIRED_PKGS=(
            "CONFIG_PACKAGE_luci-app-nikki"
            "CONFIG_PACKAGE_nikki"
            "CONFIG_PACKAGE_mihomo-meta"
            "CONFIG_PACKAGE_kmod-nft-tproxy"
            "CONFIG_PACKAGE_kmod-nft-socket"
            "CONFIG_PACKAGE_kmod-tun"
            "CONFIG_PACKAGE_kmod-inet-diag"
            "CONFIG_PACKAGE_dnsmasq-full"
            "CONFIG_PACKAGE_zram-swap"
            "CONFIG_PACKAGE_block-mount"
            "CONFIG_PACKAGE_relayd"
            "CONFIG_PACKAGE_luci-proto-relay"
            "CONFIG_PACKAGE_kmod-usb-net"
            "CONFIG_PACKAGE_kmod-usb-net-rndis"
            "CONFIG_PACKAGE_kmod-usb-net-cdc-ether"
            "CONFIG_PACKAGE_kmod-usb-net-ipheth"
            "CONFIG_PACKAGE_usbmuxd"
            "CONFIG_PACKAGE_kmod-usb-printer"
            "CONFIG_PACKAGE_p910nd"
            "CONFIG_PACKAGE_luci-app-p910nd"
            "CONFIG_PACKAGE_kmod-fs-ksmbd"
            "CONFIG_PACKAGE_ksmbd-server"
            "CONFIG_PACKAGE_luci-i18n-base-zh-cn"
            "CONFIG_PACKAGE_luci-i18n-firewall-zh-cn"
            "CONFIG_PACKAGE_luci-i18n-nikki-zh-cn"
            "CONFIG_PACKAGE_luci-i18n-p910nd-zh-cn"
          )
          for pkg in "${REQUIRED_PKGS[@]}"; do
            if grep -q "^${pkg}=y" .config; then
              echo "✅ ${pkg}"
            else
              echo "${pkg}=y" >> .config
            fi
          done
          make defconfig

          for pkg in "luci-app-passwall" "luci-app-ssr-plus" "luci-app-openclash" "luci-app-turboacc" "luci-app-ddns" "luci-app-upnp" "luci-app-wol" "luci-app-nlbwmon" "luci-app-ttyd" "luci-app-samba4"; do
            if grep -q "^CONFIG_PACKAGE_${pkg}=y" .config; then
              echo "❌ 致命错误：发现未授权的插件 ${pkg}！"
              exit 1
            fi
          done

      - name: 8. 修改默认 IP 为 192.168.2.1
        run: |
          cd immortalwrt
          sed -i 's/192\.168\.1\.1/192.168.2.1/g' package/base-files/files/bin/config_generate 2>/dev/null || true

      - name: 9. 下载源码包
        run: |
          cd immortalwrt
          export CCACHE_DIR="$CCACHE_DIR"
          ccache -M 5G
          make download -j8 || make download -j1 V=s
          find dl -size -1024c -exec rm -f {} \;

      - name: 10. 预置 Mihomo 规则库（防止首次启动下载延迟）
        run: |
          cd immortalwrt
          mkdir -p files/root/.config/mihomo
          RULES_DIR="files/root/.config/mihomo"
          curl -sL --retry 3 "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat" -o "$RULES_DIR/geoip.dat"
          curl -sL --retry 3 "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat" -o "$RULES_DIR/geosite.dat"
          curl -sL --retry 3 "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country-lite.mmdb" -o "$RULES_DIR/Country.mmdb"
          for f in geoip.dat geosite.dat Country.mmdb; do
            if [ ! -s "$RULES_DIR/$f" ]; then echo "❌ $f 下载失败"; exit 1; fi
            echo "✅ $f: $(ls -lh "$RULES_DIR/$f" | awk '{print $5}')"
          done

      - name: 11. 开始编译
        id: compile
        run: |
          cd immortalwrt
          export CCACHE_DIR="$CCACHE_DIR"
          make -j2 V=s 2>&1 | tee build.log || (tail -n 200 build.log && exit 1)

      - name: 12. 失败时上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build_error_logs
          path: immortalwrt/build.log
          if-no-files-found: warn

      - name: 13. 检查体积并发布
        id: check_size
        if: steps.compile.outcome == 'success'
        run: |
          cd immortalwrt/bin/targets/ramips/mt7621
          FIRMWARE=$(ls *sysupgrade.bin | head -n 1)
          SIZE=$(stat -c%s "$FIRMWARE")
          if [ "$SIZE" -gt "$MAX_FIRMWARE_SIZE" ]; then echo "❌ 超限！"; exit 1; fi
          echo "FIRMWARE_PATH=$PWD" >> "$GITHUB_ENV"
          echo "TAG_DATE=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"

      - name: 14. 上传 Release
        uses: softprops/action-gh-release@v2
        if: steps.check_size.outcome == 'success'
        with:
          tag_name: ImmortalWrt-D2-Nikki-${{ env.TAG_DATE }}
          name: ImmortalWrt Newifi-D2 Nikki 纯净分流版 [${{ env.TAG_DATE }}]
          files: ${{ env.FIRMWARE_PATH }}/*sysupgrade.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

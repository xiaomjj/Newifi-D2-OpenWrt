name: Build OpenWrt for Newifi-D2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.config'

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 1. 检查并检出当前代码仓库
        uses: actions/checkout@v4

      - name: 2. 获取构建时间戳标签
        run: echo "TAG_DATE=$(date +\%Y\%m\%d-\%H\%M)" >> $GITHUB_ENV

      - name: 3. 初始化 Ubuntu 编译依赖环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext \
            git libncurses5-dev libssl-dev python3 python3-distutils rsync unzip zlib1g-dev \
            file wget curl swig time
          sudo timedatectl set-timezone "$TZ"

      - name: 4. 克隆 LEDE 官方源码
        run: |
          git clone --depth 1 https://github.com/coolsnowwolf/lede.git openwrt

      - name: 5. 开启 helloworld (SSR-Plus) 并更新 Feeds
        run: |
          cd openwrt
          
          # 1. 解开 LEDE 自带 helloworld (SSR-Plus) 源
          sed -i 's/^#\(.*helloworld\)/\1/' feeds.conf.default

          # 2. 更新并安装所有 Feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 6. 载入 .config 配置并设定默认 IP (192.168.2.1)
        run: |
          # 确保 .config 拷贝成功
          if [ -f .config ]; then
            cp .config openwrt/.config
          else
            echo "⚠️️ 未发现根目录的 .config 文件，请确保上传了 .config"
          fi
          
          cd openwrt
          sed -i 's/192.168.1.1/192.168.2.1/g' package/base-files/files/bin/config_generate
          make defconfig

      - name: 7. 预下载工具链与依赖包 (make download)
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} +

      - name: 8. 执行多线程编译固件
        run: |
          cd openwrt
          echo -e "$(nproc) 线程并行编译中..."
          # 优先并行编译，失败时自动切换单线程带详细日志 V=s 重新编译
          make -j$(nproc) || make -j1 V=s

      - name: 9. 检查并整理编译产物
        run: |
          cd openwrt
          TARGET_DIR="bin/targets/ramips/mt7621"
          
          if [ ! -d "$TARGET_DIR" ]; then
            echo "❌ 编译未完成：未生成 $TARGET_DIR 目录！请检查 Step 8 编译日志。"
            exit 1
          fi
          
          echo "================ 列出编译出的固件清单 ================"
          ls -lh $TARGET_DIR/
          
          FIRMWARE_PATH="$(pwd)/$TARGET_DIR"
          echo "FIRMWARE_DIR=$FIRMWARE_PATH" >> $GITHUB_ENV

      - name: 10. 自动发布固件到 Releases 页面
        uses: softprops/action-gh-release@v2
        if: env.FIRMWARE_DIR != '' && !cancelled()
        with:
          tag_name: auto-build-${{ env.TAG_DATE }}
          name: Newifi-D2 LEDE 全功能定制固件 [${{ env.TAG_DATE }}]
          body: |
            ### 💡 固件特性清单
            * **设备型号**: Newifi-D2 (MT7621 硬件)
            * **核心功能**: 
              - 🚀 SSR-Plus 科学上网代理 (含 Xray / Sing-Box 等全套核心)
              - 🖨️ USB 网络打印机支持 (P910nd)
              - 💾 USB 存储挂载 (NTFS / exFAT / EXT4)
              - 📶 4G/5G 蜂窝网络 / USB 共享与 WWAN 中继
              - 🛠️ UPnP / DDNS / Samba4 / ZeroTier / 网页终端 TTYD
            * **默认管理 IP**: `192.168.2.1`
          files: |
            ${{ env.FIRMWARE_DIR }}/*.bin
            ${{ env.FIRMWARE_DIR }}/*.manifest

name: Build Newifi-D2 LEDE

on:
  repository_dispatch:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: 检查代码仓库
      uses: actions/checkout@v4

    - name: 初始化并安装编译依赖环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -y update
        sudo -E apt-get -y install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo -E apt-get -y install libelf-dev libssl-dev
        sudo -E apt-get -y autoremove --purge
        sudo -E apt-get clean
        sudo timedatectl set-timezone "Asia/Shanghai"

    - name: 克隆 Lean 大佬的 LEDE 源码
      run: |
        git clone --depth 1 https://github.com/coolsnowwolf/lede openwrt

    - name: 加载自定义的 .config 配置文件与自带 Feeds
      run: |
        cp .config openwrt/.config
        cd openwrt
        # 仅更新与安装源码自带的标准 feeds，彻底规避第三方源网络超时及克隆报错
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        make defconfig

    - name: 下载依赖与软件包 (Download dl)
      run: |
        cd openwrt
        make download -j8

    - name: 开始多线程编译固件
      run: |
        cd openwrt
        echo -e "当前系统可用核心数: $(nproc)"
        # 优先多线程编译；若遇偶发时序报错，自动降级为单线程排查 (V=s)
        make -j$(nproc) || make -j1 V=s

    - name: 收集并整理固件产物路径
      id: organize
      run: |
        cd openwrt/bin/targets/ramips/mt7621/
        echo "FIRMWARE_DIR=$PWD" >> $GITHUB_ENV
        # 使用纯正斜杠和纯数字获取时间戳，杜绝生成非法 Tag 字符
        TAG_TIME=$(date +'%Y%m%d-%H%M')
        echo "TAG_DATE=$TAG_TIME" >> $GITHUB_ENV

    - name: 提取并备份编译产物 (Artifacts - 完整包)
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt-Newifi-D2-LEDE-All
        path: ${{ env.FIRMWARE_DIR }}/

    - name: 自动发布纯净 .bin 固件到 Releases 页面
      uses: softprops/action-gh-release@v2
      with:
        tag_name: auto-build-${{ env.TAG_DATE }}
        name: Newifi-D2 LEDE 纯净稳定固件 [${{ env.TAG_DATE }}]
        body: |
          ### 💡 固件详情
          * **设备型号**: Newifi-D2 (MT7621)
          * **源码来源**: Lean LEDE (官方自带稳定 Feeds，零外部源干扰)
          * **集成功能**: 默认主题、USB 打印机服务、USB 存储挂载、4G/网络共享
          * **默认 IP**: `192.168.2.1`
          * **说明**: 极致稳定、零网络波折的纯净刷机固件。
        files: |
          ${{ env.FIRMWARE_DIR }}/*sysupgrade*.bin

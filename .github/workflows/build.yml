name: Build OpenWrt for Newifi-D2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: newifi-d2.config
  TZ: Asia/Shanghai
  # Newifi-D2 闪存为 32MB，安全上限设为 31.5MB (33030144 bytes) 以防刷入变砖
  MAX_FIRMWARE_SIZE: 33030144

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. 检出源码仓库
        uses: actions/checkout@v4

      - name: 2. 清理磁盘空间并初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 清理不必要的预装软件，释放磁盘空间
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/news /usr/local/doc
          df -h

          sudo apt-get update
          # 安装 OpenWrt 编译依赖
          sudo apt-get -y install \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler dwarves fastjar flex gawk gettext \
            gcc-multilib g++-multilib git git-core help2man intltool lib32gcc-s1 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
            libncursesw5-dev libreadline-dev libssl-dev libtool lld lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full pahole patch pkgconf python3 python3-pip \
            python3-ply python3-docutils qemu-utils rsync scons squashfs-tools subversion swig \
            texinfo u-boot-tools upx-ucl unzip vim wget xmlto xz-utils zlib1g-dev bc gperf \
            python3-distutils python3-setuptools

          sudo apt-get -y autoremove --purge
          sudo apt-get clean

          sudo ln -sf /usr/share/zoneinfo/$TZ /etc/localtime
          echo "$TZ" | sudo tee /etc/timezone > /dev/null

          sudo mkdir -p /workdir
          sudo chown -R "$USER":"$USER" /workdir

      - name: 3. 克隆 OpenWrt 源代码
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 4. 缓存 ccache 和 dl 依赖包 (加速后续编译)
        uses: actions/cache@v4
        with:
          path: |
            /workdir/openwrt/.ccache
            /workdir/openwrt/dl
          key: ${{ runner.os }}-openwrt-${{ hashFiles('newifi-d2.config') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-

      - name: 5. 更新与安装软件源 (Feeds)
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 6. 加载自定义配置文件
        run: |
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "❌ 错误：未找到配置文件 $CONFIG_FILE"
            echo "请确保仓库根目录下存在该文件。"
            exit 1
          fi

          mv "$CONFIG_FILE" openwrt/.config
          cd openwrt
          make defconfig

      - name: 7. 修改默认管理 IP 为 192.168.2.1
        run: |
          cd openwrt
          echo "🔧 正在修改默认管理 IP..."
          
          # 修改核心生成脚本（首次启动时生成 network 配置的源头）
          CONFIG_GEN="package/base-files/files/bin/config_generate"
          if [ -f "$CONFIG_GEN" ]; then
            sed -i 's/192\.168\.1\.1/192.168.2.1/g' "$CONFIG_GEN"
            echo "✅ 已修改 config_generate"
          else
            echo "⚠️ 警告：未找到 config_generate，跳过修改。"
          fi
          
          # 如果存在预置的 network 配置文件，也一并修改（容错处理，防止报错中断）
          NETWORK_CONF="package/base-files/files/etc/config/network"
          if [ -f "$NETWORK_CONF" ]; then
            sed -i 's/192\.168\.1\.1/192.168.2.1/g' "$NETWORK_CONF"
            echo "✅ 已修改预置 network 配置文件"
          else
            echo "ℹ️ 未找到预置 network 文件（这是正常的，系统会动态生成）。"
          fi

      - name: 8. 下载预编译依赖包
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 9. 开始编译固件
        id: compile
        run: |
          cd openwrt
          echo "🚀 开始编译，使用 $(nproc) 线程..."
          
          # 尝试并行编译，失败则使用单线程详细日志重试
          if make -j$(nproc); then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ 并行编译失败，使用单线程详细日志重试..."
            if make -j1 V=s; then
              echo "status=success" >> "$GITHUB_OUTPUT"
            else
              echo "❌ 编译彻底失败，请查看日志排查。"
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi

      - name: 10. 检查固件大小 (32MB 闪存硬限制)
        id: check_size
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          cd openwrt/bin/targets/ramips/mt7621
          
          # 查找 sysupgrade 固件
          FIRMWARE=$(ls *sysupgrade.bin 2>/dev/null | head -n 1)
          
          if [ -z "$FIRMWARE" ]; then
            echo "❌ 错误：未找到 sysupgrade.bin 固件文件！"
            exit 1
          fi
          
          SIZE=$(stat -c%s "$FIRMWARE")
          SIZE_MB=$(echo "scale=2; $SIZE / 1024 / 1024" | bc)
          MAX_MB=$(echo "scale=2; $MAX_FIRMWARE_SIZE / 1024 / 1024" | bc)
          
          echo "📦 固件: $FIRMWARE"
          echo "📊 大小: ${SIZE_MB} MB (最大允许: ${MAX_MB} MB)"
          
          if [ "$SIZE" -gt "$MAX_FIRMWARE_SIZE" ]; then
            echo "❌ 错误：固件超过 32MB，无法刷入 Newifi-D2！请进一步精简配置。"
            echo "建议：移除 luci-app-ssr-plus 或减少内核模块。"
            exit 1
          fi
          echo "✅ 固件大小符合要求。"

      - name: 11. 整理固件产物
        id: organize
        if: steps.check_size.outcome == 'success' && !cancelled()
        run: |
          cd openwrt/bin/targets/ramips/mt7621
          rm -rf packages
          
          echo "FIRMWARE_PATH=$PWD" >> "$GITHUB_ENV"
          
          TAG_DATE=$(date +'%Y.%m.%d-%H%M')
          echo "TAG_DATE=$TAG_DATE" >> "$GITHUB_ENV"
          
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: 12. 上传固件至 Artifacts (临时保存)
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_NewifiD2_Firmware
          path: ${{ env.FIRMWARE_PATH }}/*.bin
          if-no-files-found: error

      - name: 13. 自动创建并发布 GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          tag_name: Newifi-D2-${{ env.TAG_DATE }}
          name: Newifi-D2 LEDE 精简固件 [${{ env.TAG_DATE }}]
          body: |
            ### 💡 固件特性清单
            * **设备型号**: Newifi-D2 (MT7621 硬件)
            * **核心功能**:
              - 🚀 SSR-Plus 科学上网代理 (仅保留 Sing-Box 核心)
              - 💾 USB 存储挂载 (ext4 / vfat / exfat)
              - ⚡ Turbo ACC 网络硬件加速
              - 📶 4G/5G 蜂窝网络 / USB 共享与 WWAN 中继
              - 🛠️ UPnP / 文件传输 / 网页终端 TTYD
            * **默认管理 IP**: `192.168.2.1`
            * **注意**: 已移除 Samba4 与 NTFS 支持，以适配 32MB 闪存。
          files: ${{ env.FIRMWARE_PATH }}/*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

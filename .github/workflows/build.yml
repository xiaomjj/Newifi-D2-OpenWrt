name: Build OpenWrt for Newifi-D2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.config'

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 1. 检查并检出当前代码仓库
        uses: actions/checkout@v4

      - name: 2. 获取构建时间戳标签
        run: echo "TAG_DATE=$(date +\%Y\%m\%d-\%H\%M)" >> $GITHUB_ENV

      - name: 3. 初始化 Ubuntu 编译依赖环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext \
            git libncurses5-dev libssl-dev python3 python3-distutils rsync unzip zlib1g-dev \
            file wget curl swig time
          sudo timedatectl set-timezone "$TZ"

      - name: 4. 克隆 LEDE 官方源码
        run: |
          git clone --depth 1 https://github.com/coolsnowwolf/lede.git openwrt

      - name: 5. 开启 SSR-Plus 并同步最新核心依赖
        run: |
          cd openwrt
          
          # 1. 启用 LEDE 原生 helloworld (SSR-Plus) 源
          sed -i 's/^#\(.*helloworld\)/\1/' feeds.conf.default

          # 2. 更新并安装基础 Feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 3. 拉取官方最新的 passwall-packages 覆盖更新核心依赖 (确保 Xray / Sing-Box 等核心均为最新版)
          git clone --depth 1 https://github.com/xiaorouji/openwrt-passwall-packages.git package/latest_packages
          cp -rf package/latest_packages/* package/
          rm -rf package/latest_packages

      - name: 6. 载入 .config 配置并设定默认 IP (192.168.2.1)
        run: |
          [ -f .config ] && cp .config openwrt/.config
          cd openwrt
          sed -i 's/192.168.1.1/192.168.2.1/g' package/base-files/files/bin/config_generate
          make defconfig

      - name: 7. 预下载工具链与依赖包 (make download)
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} +

      - name: 8. 执行多线程编译固件
        run: |
          cd openwrt
          echo -e "$(nproc) 线程并行编译中..."
          make -j$(nproc) || make -j1 V=s

      - name: 9. 检查并整理编译产物
        run: |
          cd openwrt
          TARGET_DIR="bin/targets/ramips/mt7621"
          
          echo "================ 检查编译生成的固件文件 ================"
          ls -lh $TARGET_DIR/
          
          FIRMWARE_PATH="$(pwd)/$TARGET_DIR"
          echo "FIRMWARE_DIR=$FIRMWARE_PATH" >> $GITHUB_ENV
          
          if [ -z "$(ls -A$FIRMWARE_PATH/*.bin 2>/dev/null)" ]; then
            echo "❌ 错误：未生成任何 .bin 固件！请检查编译日志或 .config 硬件配置。"
            exit 1
          fi

      - name: 10. 自动发布固件到 Releases 页面
        uses: softprops/action-gh-release@v2
        if: env.FIRMWARE_DIR != '' && !cancelled()
        with:
          tag_name: auto-build-${{ env.TAG_DATE }}
          name: Newifi-D2 LEDE 全功能定制固件 [${{ env.TAG_DATE }}]
          body: |
            ### 💡 固件特性清单
            * **设备型号**: Newifi-D2 (MT7621 硬件精准配置)
            * **核心功能**: 
              - 🚀 SSR-Plus 科学上网代理 (整合最新版 Xray-core / Sing-Box / ChinaDNS-NG)
              - 🖨️ USB 网络打印机支持 (P910nd)
              - 💾 USB 存储挂载 (NTFS 3G / exFAT / EXT4)
              - 📶 4G/5G 蜂窝网络 / USB 共享与 WWAN 中继
              - 🛠️ UPnP / DDNS / Samba4 / ZeroTier / 网页终端 TTYD
            * **默认管理 IP**: `192.168.2.1`
          files: |
            ${{ env.FIRMWARE_DIR }}/*.bin
            ${{ env.FIRMWARE_DIR }}/*.manifest

name: Build OpenWrt for Newifi-D2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.config'

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 检查并检出当前仓库
        uses: actions/checkout@v4

      - name: 获取编译时间戳标签
        run: echo "TAG_DATE=$(date +\%Y\%m\%d-\%H\%M)" >> $GITHUB_ENV

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext \
            git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget curl swig time
          sudo timedatectl set-timezone "$TZ"

      - name: 克隆 OpenWrt 源码
        run: |
          git clone --depth 1 -b $REPO_BRANCH$REPO_URL openwrt

      - name: 加载 Feeds 并自动集成本地 PassWall 源码
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          if [ -f "$GITHUB_WORKSPACE/passwall.zip" ]; then
            mkdir -p package/passwall
            unzip -q "$GITHUB_WORKSPACE/passwall.zip" -d /tmp/p1
            cp -rf /tmp/p1/* package/passwall/
          fi
          
          if [ -f "$GITHUB_WORKSPACE/passwall-packages.zip" ]; then
            mkdir -p package/passwall-packages
            unzip -q "$GITHUB_WORKSPACE/passwall-packages.zip" -d /tmp/p2
            cp -rf /tmp/p2/* package/passwall-packages/
          fi

      - name: 应用配置与网段修改
        run: |
          [ -f .config ] && cp .config openwrt/.config
          cd openwrt
          sed -i 's/192.168.1.1/192.168.2.1/g' package/base-files/files/bin/config_generate
          make defconfig

      - name: 预下载依赖包
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} +

      - name: 编译固件
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: 定位编译产物目录
        run: |
          echo "FIRMWARE_DIR=openwrt/bin/targets/ramips/mt7621" >> $GITHUB_ENV

      - name: 自动发布纯净 .bin 固件到 Releases 页面
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-build-${{ env.TAG_DATE }}
          name: Newifi-D2 LEDE 全功能定制固件 [${{ env.TAG_DATE }}]
          body: |
            ### 💡 固件特性清单
            * **设备型号**: Newifi-D2 (MT7621 硬件精准锁定)
            * **源码来源**: Lean LEDE + PassWall (本地集成 sing-box 核心)
            * **核心功能**: 
              - 🌍 PassWall 科学上网代理
              - 🖨️ USB 网络打印机支持 (P910nd)
              - 💾 USB 存储挂载 (NTFS 读写与 FAT32)
              - 📶 4G/5G 蜂窝网络与 USB 共享
            * **默认管理 IP**: `192.168.2.1`
          files: |
            ${{ env.FIRMWARE_DIR }}/*sysupgrade*.bin

name: Build LEDE Newifi-D2 PassWall

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: newifi-d2.config
  TZ: Asia/Shanghai
  MAX_FIRMWARE_SIZE: 33030144 # 31.5 MB
  CCACHE_DIR: /workdir/lede/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. 检出源码仓库
        uses: actions/checkout@v4

      - name: 2. 初始化环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium /usr/local/news /usr/local/doc
          df -h
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.eu.org/init_build_environment.sh)'
          sudo ln -sf /usr/share/zoneinfo/$TZ /etc/localtime
          echo "$TZ" | sudo tee /etc/timezone > /dev/null
          sudo mkdir -p /workdir
          sudo chown -R "$USER":"$USER" /workdir

      - name: 3. 克隆 LEDE 源码
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none lede
          ln -sf /workdir/lede $GITHUB_WORKSPACE/lede

      - name: 4. 缓存 CCache 与 dl
        uses: actions/cache@v4
        with:
          path: |
            /workdir/lede/.ccache
            /workdir/lede/dl
          key: ${{ runner.os }}-lede-final-v3-${{ hashFiles('newifi-d2.config') }}
          restore-keys: |
            ${{ runner.os }}-lede-final-v3-

      - name: 5. 更新 Feeds
        run: |
          cd lede
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 6. 加载配置并强制校验关键依赖
        run: |
          if [ ! -f "$CONFIG_FILE" ]; then echo "❌ 未找到 $CONFIG_FILE"; exit 1; fi
          mv "$CONFIG_FILE" lede/.config
          cd lede
          grep -q '^CONFIG_CCACHE=y' .config || echo 'CONFIG_CCACHE=y' >> .config
          
          # 第一次 defconfig
          make defconfig

          echo "🔍 深度校验 PassWall 及 UPnP 依赖..."
          MISSING=0

          REQUIRED_PKGS=(
            "CONFIG_PACKAGE_luci-app-passwall"
            "CONFIG_PACKAGE_luci-app-passwall_Iptables_Transparent_Proxy"
            "CONFIG_PACKAGE_iptables-mod-socket"
            "CONFIG_PACKAGE_kmod-ipt-socket"
            "CONFIG_PACKAGE_iptables-mod-tproxy"
            "CONFIG_PACKAGE_kmod-ipt-nat"
            "CONFIG_PACKAGE_ipset"
            "CONFIG_PACKAGE_luci-app-upnp"
            "CONFIG_PACKAGE_zram-swap"
          )

          for pkg in "${REQUIRED_PKGS[@]}"; do
            if grep -q "^${pkg}=y" .config; then
              echo "✅ ${pkg} 已成功保留"
            else
              echo "⚠️ ${pkg} 被 defconfig 丢弃，强制补全..."
              echo "${pkg}=y" >> .config
              MISSING=1
            fi
          done

          if [ "$MISSING" -eq 1 ]; then
            echo "🔄 补写完成，重新执行 make defconfig 验证依赖..."
            make defconfig
            for pkg in "${REQUIRED_PKGS[@]}"; do
              grep -q "^${pkg}=y" .config \
                || { echo "❌ 致命错误: ${pkg} 依赖树冲突无法解析，停止编译！"; exit 1; }
            done
          fi

          # 【终极修复】强行注入 miniupnpd 后端，且不再执行 make defconfig 防止死锁
          echo "🔍 补齐 UPnP 后端..."
          if ! grep -q '^CONFIG_PACKAGE_miniupnpd=y' .config; then
            echo "✅ 强制写入 CONFIG_PACKAGE_miniupnpd-iptables=y"
            echo 'CONFIG_PACKAGE_miniupnpd-iptables=y' >> .config
            # 同时确保 miniupnpd 虚拟包被标记为启用
            echo 'CONFIG_PACKAGE_miniupnpd=y' >> .config
          fi

      - name: 7. 修改默认 IP 为 192.168.2.1
        run: |
          cd lede
          OLD_PATH="package/base-files/files/bin/config_generate"
          if [ -f "$OLD_PATH" ]; then
            sed -i 's/192\.168\.1\.1/192.168.2.1/g' "$OLD_PATH"
            echo "✅ 默认 IP 已修改"
          else
            echo "⚠️ 未找到 config_generate，跳过"
          fi

      - name: 8. 配置 CCache 与下载源码
        run: |
          cd lede
          mkdir -p "$CCACHE_DIR"
          export CCACHE_DIR="$CCACHE_DIR"
          ccache -M 2G
          ccache -s
          make download -j8 || (echo "⚠️ 并发下载失败，单线程重试..." && make download -j1 V=s)
          find dl -size -1024c -exec rm -f {} \;

      - name: 9. 开始编译固件 (并行 + 内存保护)
        id: compile
        run: |
          cd lede
          export CCACHE_DIR="$CCACHE_DIR"
          echo "🚀 使用 -j4 并行编译，单进程虚拟内存限制 3GB..."
          if (ulimit -v 3000000; make -j4 V=s > build.log 2>&1); then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "❌ 编译失败！"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            tail -n 200 build.log
            exit 1
          fi

      - name: 9.5 失败时上传日志
        if: failure() && steps.compile.outputs.status == 'failed'
        uses: actions/upload-artifact@v4
        with:
          name: build_error_logs
          path: lede/build.log

      - name: 10. 严格检查固件体积
        id: check_size
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          cd lede/bin/targets/ramips/mt7621
          FIRMWARE=$(ls *sysupgrade.bin 2>/dev/null | head -n 1)
          [ -z "$FIRMWARE" ] && { echo "❌ 未找到 sysupgrade.bin"; exit 1; }
          SIZE=$(stat -c%s "$FIRMWARE")
          SIZE_MB=$(echo "scale=2; $SIZE / 1024 / 1024" | bc)
          MAX_MB=$(echo "scale=2; $MAX_FIRMWARE_SIZE / 1024 / 1024" | bc)
          REMAINING=$(echo "scale=2; ($MAX_FIRMWARE_SIZE - $SIZE) / 1024 / 1024" | bc)

          echo "📦 $FIRMWARE"
          echo "📊 ${SIZE_MB} MB / 上限 ${MAX_MB} MB / 剩余 ${REMAINING} MB"

          if [ "$SIZE" -gt "$MAX_FIRMWARE_SIZE" ]; then
            echo "❌ 超限，刷入会变砖！"
            exit 1
          fi
          echo "✅ 大小合规"
          echo "FIRMWARE_PATH=$PWD" >> "$GITHUB_ENV"
          echo "TAG_DATE=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"

      - name: 11. 上传 Artifacts
        uses: actions/upload-artifact@v4
        if: steps.check_size.outcome == 'success' && !cancelled()
        with:
          name: LEDE_NewifiD2_PassWall
          path: ${{ env.FIRMWARE_PATH }}/*sysupgrade.bin
          if-no-files-found: error

      - name: 12. 发布 Release
        uses: softprops/action-gh-release@v2
        if: steps.check_size.outcome == 'success' && !cancelled()
        with:
          tag_name: LEDE-Newifi-D2-PassWall-${{ env.TAG_DATE }}
          name: LEDE Newifi-D2 PassWall 稳定版 [${{ env.TAG_DATE }}]
          body: |
            ### 固件特性
            * **源码**: coolsnowwolf/lede (`master`)
            * **代理**: PassWall + Xray（**Iptables 透明代理全量驱动硬锁死**）
            * **网络**: WWAN 无线中继 / USB 手机共享 (RNDIS/CDC/iPhone)
            * **工具**: DDNS (DNSPod) / TTYD / 定时重启 / UPnP (自动依赖)
            * **优化**: ZRAM 防 OOM / 默认主题 / 编译配置防丢校验
            * **默认 IP**: `192.168.2.1`
          files: ${{ env.FIRMWARE_PATH }}/*sysupgrade.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build OpenWrt for Newifi-D2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: newifi-d2.config
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. 检出源码仓库
        uses: actions/checkout@v4

      - name: 2. 清理磁盘空间并初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/news /usr/local/doc
          df -h

          sudo apt-get update

          sudo apt-get -y install \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler dwarves fastjar flex gawk gettext \
            gcc-multilib g++-multilib git git-core help2man intltool lib32gcc-s1 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
            libncursesw5-dev libreadline-dev libssl-dev libtool lld lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full pahole patch pkgconf python3 python3-pip \
            python3-ply python3-docutils qemu-utils rsync scons squashfs-tools subversion swig \
            texinfo u-boot-tools upx-ucl unzip vim wget xmlto xz-utils zlib1g-dev bc gperf \
            python3-distutils python3-setuptools

          sudo apt-get -y autoremove --purge
          sudo apt-get clean

          sudo ln -sf /usr/share/zoneinfo/$TZ /etc/localtime
          echo "$TZ" | sudo tee /etc/timezone > /dev/null

          sudo mkdir -p /workdir
          sudo chown -R "$USER":"$USER" /workdir

      - name: 3. 克隆 OpenWrt 源代码
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 4. 更新与安装软件源 (Feeds)
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 5. 加载自定义配置文件
        run: |
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "错误：未找到配置文件 $CONFIG_FILE"
            exit 1
          fi

          mv "$CONFIG_FILE" openwrt/.config
          cd openwrt
          make defconfig

      - name: 6. 修改默认管理 IP 为 192.168.2.1
        run: |
          cd openwrt
          sed -i 's/192\.168\.1\.1/192.168.2.1/g' package/base-files/files/bin/config_generate
          sed -i 's/192\.168\.1\.1/192.168.2.1/g' package/base-files/files/etc/config/network
          echo "默认管理 IP 已改为 192.168.2.1"

      - name: 7. 下载预编译依赖包
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 8. 开始编译固件
        id: compile
        run: |
          cd openwrt
          echo "Starting build with $(nproc) threads..."

          if make -j$(nproc); then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "并行编译失败，使用单线程详细日志重试..."
            make -j1 V=s
            echo "status=success" >> "$GITHUB_OUTPUT"
          fi

      - name: 9. 检查固件大小是否超过 32MB
        id: check_size
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          cd openwrt/bin/targets/ramips/mt7621
          FIRMWARE=$(ls *.bin | head -n 1)
          SIZE=$(stat -c%s "$FIRMWARE")
          MAX_SIZE=$((32 * 1024 * 1024))
          echo "固件 $FIRMWARE 大小: $((SIZE / 1024 / 1024)) MB"
          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "错误：固件超过 32MB，无法刷入 Newifi-D2！请进一步精简配置。"
            exit 1
          fi
          echo "固件大小符合要求。"

      - name: 10. 整理固件产物
        id: organize
        if: steps.check_size.outcome == 'success' && !cancelled()
        run: |
          cd openwrt/bin/targets/ramips/mt7621
          rm -rf packages
          echo "FIRMWARE_PATH=$PWD" >> "$GITHUB_ENV"
          TAG_DATE=$(date +'%Y.%m.%d-%H%M')
          echo "TAG_DATE=$TAG_DATE" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: 11. 上传固件至 Artifacts
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_NewifiD2_Firmware
          path: ${{ env.FIRMWARE_PATH }}
          if-no-files-found: error

      - name: 12. 自动创建并发布 GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          tag_name: Newifi-D2-${{ env.TAG_DATE }}
          name: Newifi-D2 LEDE 精简固件 [${{ env.TAG_DATE }}]
          body: |
            ### 💡 固件特性清单
            * **设备型号**: Newifi-D2 (MT7621 硬件)
            * **核心功能**:
              - 🚀 SSR-Plus 科学上网代理 (仅保留 Sing-Box 核心)
              - 💾 USB 存储挂载 (ext4 / vfat / exfat)
              - ⚡ Turbo ACC 网络硬件加速
              - 📶 4G/5G 蜂窝网络 / USB 共享与 WWAN 中继
              - 🛠️ UPnP / 文件传输 / 网页终端 TTYD
            * **默认管理 IP**: `192.168.2.1`
            * **注意**: 已移除 Samba4 与 NTFS 支持，以适配 32MB 闪存。
          files: ${{ env.FIRMWARE_PATH }}/*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

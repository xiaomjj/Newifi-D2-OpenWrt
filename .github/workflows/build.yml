name: Build Newifi-D2 LEDE Full-Config

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检查代码仓库
      uses: actions/checkout@v3

    - name: 安装编译依赖环境
      run: |
        sudo apt-get update
        sudo apt-get install -y build-out build-essential libncurses5-dev libncursesw5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 python3-pip

    - name: 克隆 LEDE 源码
      run: |
        git clone --depth 1 https://github.com/coolsnowwolf/lede.git openwrt

    - name: 自动下载并解压 PassWall 源码到 package 目录
      run: |
        rm -rf openwrt/package/passwall-packages openwrt/package/passwall
        mkdir -p openwrt/package/passwall-packages openwrt/package/passwall
        
        # 自动下载并解压 PassWall 依赖包
        wget -qO passwall-packages.zip https://github.com/Openwrt-Passwall/openwrt-passwall-packages/archive/refs/heads/main.zip
        unzip -q passwall-packages.zip -d /tmp/
        cp -r /tmp/openwrt-passwall-packages-main/* openwrt/package/passwall-packages/
        
        # 自动下载并解压 PassWall 主程序
        wget -qO passwall.zip https://github.com/Openwrt-Passwall/openwrt-passwall/archive/refs/heads/main.zip
        unzip -q passwall.zip -d /tmp/
        cp -r /tmp/openwrt-passwall-main/* openwrt/package/passwall/

    - name: 注入自定义配置文件 (.config)
      run: |
        [ -f .config ] && cp .config openwrt/.config

    - name: 更新与安装 Feeds 软件包
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 加载配置并生成完整菜单
      working-directory: ./openwrt
      run: |
        make defconfig

    - name: 开始编译固件
      working-directory: ./openwrt
      run: |
        make -j$(nproc) || make -j1 V=s

    - name: 收集并上传编译好的固件
      uses: actions/upload-artifact@v3
      with:
        name: Newifi-D2-Firmware
        path: openwrt/bin/targets/*/*/*.bin

name: Build ImmortalWrt 25.12 Ultimate Stable Loop

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  CONFIG_FILE: newifi-d2.config
  TZ: Asia/Shanghai
  MAX_FIRMWARE_SIZE: 33554432  # 32MB
  CCACHE_DIR: /workdir/immortalwrt/.ccache

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 初始化编译环境与升级高版本 Go (支持最新 Xray 编译)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium
          df -h
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libelf-dev libglib2.0-dev libgmp3-dev liblzo2-dev libncurses5-dev \
            libssl-dev libtool lrzsz mkisofs nano ninja-build p7zip p7zip-full patch pkg-config python3 \
            python3-dev python3-pip python3-setuptools qemu-utils rsync scons squashfs-tools subversion \
            swig texinfo uglifyjs upx-ucl unzip wget xmlto xxd zlib1g-dev
          
          # 强制安装最新 Go (1.23+) 解决 Xray 编译版本过低报错
          sudo rm -rf /usr/local/go
          curl -sL https://go.dev/dl/go1.23.6.linux-amd64.tar.gz | sudo tar -C /usr/local -xz
          echo "/usr/local/go/bin" >> $GITHUB_PATH
          go version

          sudo ln -sf /usr/share/zoneinfo/$TZ /etc/localtime
          echo "$TZ" | sudo tee /etc/timezone > /dev/null
          sudo mkdir -p /workdir
          sudo chown -R "$USER":"$USER" /workdir

      - name: 3. 克隆 ImmortalWrt 25.12 分支源码
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none immortalwrt
          ln -sf /workdir/immortalwrt $GITHUB_WORKSPACE/immortalwrt

      - name: 4. 绝对净化 Feeds 并平级直插 Passwall 与 MosDNS 源码
        run: |
          cd immortalwrt
          rm -f feeds.conf
          
          # 只保留核心的 3 个稳定源，彻底剔除易报错的 telephony 和 video
          cat << 'EOF' > feeds.conf.default
          src-git packages https://github.com/immortalwrt/packages.git;openwrt-25.12
          src-git luci https://github.com/immortalwrt/luci.git;openwrt-25.12
          src-git routing https://github.com/openwrt/routing.git;openwrt-25.12
          EOF
          echo "✅ 精简后的官方 feeds.conf.default 已生成"

          rm -rf package/passwall package/passwall_packages package/mosdns package/luci-app-mosdns package/v2ray-geodata
          git clone --depth=1 https://github.com/xiaorouji/openwrt-passwall.git -b main package/passwall || true
          git clone --depth=1 https://github.com/xiaorouji/openwrt-passwall-packages.git -b main package/passwall_packages || true
          git clone --depth=1 https://github.com/sbwml/luci-app-mosdns.git -v v5 package/luci-app-mosdns || true
          git clone --depth=1 https://github.com/sbwml/v2ray-geodata.git package/v2ray-geodata || true
          echo "✅ 所有扩展源码已完美平级植入 package 目录"

      - name: 5. 配置初始化脚本与系统自动调度优化 (files/)
        run: |
          cd immortalwrt
          mkdir -p files/usr/bin
          mkdir -p files/etc/uci-defaults
          mkdir -p files/etc/hotplug.d/net
          mkdir -p files/etc/config
          mkdir -p files/usr/share/passwall/rules
          mkdir -p files/usr/share/v2ray

          # A. 无线默认开启与抗干扰信道优化 (alon / alon 5G)
          cat << 'EOF' > files/etc/uci-defaults/97-wifi-defaults
          #!/bin/sh
          uci set wireless.radio0.disabled='0'
          uci set wireless.radio1.disabled='0'
          uci set wireless.radio0.channel='11'
          uci set wireless.radio1.channel='36'
          uci set wireless.default_radio0.ssid='alon'
          uci set wireless.default_radio0.encryption='none'
          uci set wireless.default_radio0.disabled='0'
          uci set wireless.default_radio1.ssid='alon 5G'
          uci set wireless.default_radio1.encryption='none'
          uci set wireless.default_radio1.disabled='0'
          uci commit wireless
          exit 0
          EOF

          # B. 统一调度初始化：Turbo ACC、Passwall、MosDNS、USB打印
          cat << 'EOF' > files/etc/uci-defaults/98-optimize-defaults
          #!/bin/sh
          if uci get turboacc.@global[0] >/dev/null 2>&1; then
              uci set turboacc.@global[0].sw_flow='1'
              uci set turboacc.@global[0].hw_flow='1'
              uci set turboacc.@global[0].fullcone_nat='1'
              uci commit turboacc
          fi

          if uci get passwall.@global[0] >/dev/null 2>&1; then
              uci set passwall.@global[0].enabled='1'
              uci set passwall.@global[0].tcp_proxy_mode='gfwlist'
              uci set passwall.@global[0].udp_proxy_mode='gfwlist'
              uci set passwall.@global[0].dns_mode='dnsmasq'
              uci set passwall.@global[0].tcp_fastopen='1'
              uci commit passwall
          fi

          if uci get mosdns.@mosdns[0] >/dev/null 2>&1; then
              uci set mosdns.@mosdns[0].enabled='1'
              uci set mosdns.@mosdns[0].remote_dns_server='1.1.1.1, 8.8.8.8'
              uci commit mosdns
              /etc/init.d/mosdns enable
              /etc/init.d/mosdns start 2>/dev/null
          fi

          /etc/init.d/ksmbd enable
          /etc/init.d/ksmbd start 2>/dev/null
          /etc/init.d/p910nd enable
          /etc/init.d/p910nd start 2>/dev/null
          exit 0
          EOF

          # C. 随身WiFi / USB网卡开机自动拨号绑定 (usbwan)
          cat << 'EOF' > files/etc/uci-defaults/99-usbwan-boot
          #!/bin/sh
          for IFACE in usb0 usb1 eth1 eth2 wwan0; do
            [ -e "/sys/class/net/$IFACE" ] || continue
            if readlink -f "/sys/class/net/$IFACE/device" | grep -q -E "usb|wwan"; then
              if ! uci get network.usbwan >/dev/null 2>&1; then
                uci set network.usbwan=interface
                uci set network.usbwan.proto='dhcp'
                uci set network.usbwan.device="$IFACE"
                uci set network.usbwan.metric='10'
                uci commit network
                WAN_ZONE=$(uci show firewall 2>/dev/null | grep -E "zone\[[0-9]+\]\.name='wan'" | head -1 | sed -n "s/.*zone\[\([0-9]*\)\].*/\1/p")
                [ -n "$WAN_ZONE" ] && uci add_list firewall.@zone[$WAN_ZONE].network='usbwan' 2>/dev/null
                uci commit firewall
                /etc/init.d/network reload
                /etc/init.d/firewall reload
              fi
              break
            fi
          done
          exit 0
          EOF

          # D. 全功能 USB 网卡热插拔动态即插即用脚本
          cat << 'EOF' > files/etc/hotplug.d/net/20-usbwan
          #!/bin/sh
          [ -n "$INTERFACE" ] || exit 0
          case "$INTERFACE" in usb*|eth1|eth2|wwan*) ;; *) exit 0 ;; esac
          is_usb_dev() {
            if [ -e "/sys/class/net/$INTERFACE/device/uevent" ]; then
              grep -q "DEVTYPE=usb_interface" "/sys/class/net/$INTERFACE/device/uevent" 2>/dev/null && return 0
              readlink -f "/sys/class/net/$INTERFACE/device" 2>/dev/null | grep -q -E "usb|wwan" && return 0
            else
              readlink -f "/sys/class/net/$INTERFACE/device" 2>/dev/null | grep -q -E "usb|wwan" && return 0
            fi
            return 1
          }
          find_wan_zone() {
            uci show firewall 2>/dev/null | grep -E "zone\[[0-9]+\]\.name='wan'" | head -1 | sed -n "s/.*zone\[\([0-9]*\)\].*/\1/p"
          }
          case "$ACTION" in
            add)
              is_usb_dev || exit 0
              uci get network.usbwan >/dev/null 2>&1 && exit 0
              uci set network.usbwan=interface
              uci set network.usbwan.proto='dhcp'
              uci set network.usbwan.device="$INTERFACE"
              uci set network.usbwan.metric='10'
              uci commit network
              WAN_ZONE=$(find_wan_zone)
              if [ -n "$WAN_ZONE" ]; then
                uci add_list firewall.@zone[$WAN_ZONE].network='usbwan' 2>/dev/null
                uci commit firewall
              fi
              /etc/init.d/network reload
              /etc/init.d/firewall reload
              ;;
            remove)
              CUR_DEV=$(uci get network.usbwan.device 2>/dev/null)
              [ "$CUR_DEV" = "$INTERFACE" ] || exit 0
              uci delete network.usbwan 2>/dev/null
              uci commit network
              WAN_ZONE=$(find_wan_zone)
              if [ -n "$WAN_ZONE" ]; then
                uci del_list firewall.@zone[$WAN_ZONE].network='usbwan' 2>/dev/null
                uci commit firewall
              fi
              /etc/init.d/network reload
              /etc/init.d/firewall reload
              ;;
          esac
          EOF

          # E. 局域网共享 (Ksmbd) 与 USB 打印服务 (p910nd) 预置配置
          cat << 'EOF' > files/etc/config/ksmbd
          config globals
              option workgroup 'WORKGROUP'
              option description 'Newifi-D2'
          config share
              option name 'usb'
              option path '/mnt'
              option read_only 'no'
              option guest_ok 'yes'
              option create_mask '0666'
              option dir_mask '0777'
          EOF

          cat << 'EOF' > files/etc/config/p910nd
          config p910nd
              option enabled '1'
              option device '/dev/usb/lp0'
              option port '0'
              option bidirectional '0'
          EOF

          # F. 内核网络调优、BBR、内存保护及每日凌晨 4 点自动释放内存缓存
          cat << 'EOF' > files/etc/sysctl.conf
          fs.file-max = 655350
          net.core.somaxconn = 1024
          net.ipv4.tcp_max_syn_backlog = 8192
          net.ipv4.tcp_rmem = 4096 87380 8388608
          net.ipv4.tcp_wmem = 4096 65536 8388608
          net.ipv4.tcp_congestion_control = bbr
          vm.min_free_kbytes = 16384
          vm.swappiness = 10
          EOF

          mkdir -p files/etc/crontabs
          echo "0 4 * * * sync && echo 3 > /proc/sys/vm/drop_caches" > files/etc/crontabs/root

          chmod +x files/etc/hotplug.d/net/20-usbwan files/etc/uci-defaults/* 2>/dev/null || true
          echo "🔧 初始化脚本部署完成。"

      - name: 6. 缓存 CCache 与 dl（升级至 v15）
        uses: actions/cache@v4
        with:
          path: |
            /workdir/immortalwrt/.ccache
            /workdir/immortalwrt/dl
          key: ${{ runner.os }}-immortalwrt-d2-stable-v15-${{ hashFiles('newifi-d2.config') }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-d2-stable-v15-

      - name: 7. 【预编译检查与智能补全循环】更新 Feeds 与自动自愈
        run: |
          cd immortalwrt
          echo "=================================================="
          echo "🔍 【预编译阶段】执行精简稳定的 Feeds 更新..."
          echo "=================================================="
          sed -i '/passwall/d' feeds.conf.default 2>/dev/null || true
          sed -i '/mosdns/d' feeds.conf.default 2>/dev/null || true
          rm -f feeds/*.index
          
          ./scripts/feeds update -a
          ./scripts/feeds install -d default || true

          echo "=================================================="
          echo "📋 应用本地配置并执行依赖健康校验 (defconfig)..."
          echo "=================================================="
          cp $GITHUB_WORKSPACE/$CONFIG_FILE .config
          make defconfig

          echo "=================================================="
          echo "🛡️ 【自动化监查机制】开始全套核心组件状态核对与自愈..."
          echo "=================================================="
          
          MISSING_ITEMS=0
          TARGET_PKGS=(
            "CONFIG_PACKAGE_luci-app-passwall"
            "CONFIG_PACKAGE_xray-core"
            "CONFIG_PACKAGE_luci-app-mosdns"
            "CONFIG_PACKAGE_v2ray-geodata"
            "CONFIG_PACKAGE_luci-app-turboacc"
            "CONFIG_PACKAGE_zram-swap"
            "CONFIG_PACKAGE_kmod-fs-ksmbd"
            "CONFIG_PACKAGE_p910nd"
            "CONFIG_PACKAGE_kmod-usb-net-rndis"
            "CONFIG_PACKAGE_kmod-usb-net-cdc-ncm"
          )

          for PKG in "${TARGET_PKGS[@]}"; do
            if grep -q "$PKG=y" .config; then
              echo "  [✅ 监查正常] $PKG 已就绪"
            else
              echo "  [⚠️ 监查告警] $PKG 未载入，正在触发自愈机制强制补全..."
              echo "$PKG=y" >> .config
              MISSING_ITEMS=$((MISSING_ITEMS + 1))
            fi
          done

          if [ $MISSING_ITEMS -gt 0 ]; then
            echo "🔄 检测到有 $MISSING_ITEMS 项预定组件被补全，正在重新生成配置..."
            make defconfig
          else
            echo "🎉 所有预定组件监查全部通过：零遗漏、完美契合！"
          fi

      - name: 8. 修改 LAN IP 为 192.168.2.1
        run: |
          cd immortalwrt
          sed -i 's/192\.168\.1\.1/192.168.2.1/g' package/base-files/files/bin/config_generate 2>/dev/null || true

      - name: 9. 扩充预置主流分流规则与 GeoIP / GeoSite 地理数据库
        run: |
          cd immortalwrt
          PASSWALL_RULES="files/usr/share/passwall/rules"
          V2RAY_RULES="files/usr/share/v2ray"
          mkdir -p "$PASSWALL_RULES" "$V2RAY_RULES"

          echo "📥 开始预置 Passwall 规则文本..."
          curl -sL --retry 3 "https://fastly.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/gfw.txt" -o "$PASSWALL_RULES/gfwlist" || true
          curl -sL --retry 3 "https://fastly.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/china-list.txt" -o "$PASSWALL_RULES/chnlist" || true

          echo "📥 开始预置最新 GeoIP 与 GeoSite 全球地理数据库..."
          curl -sL --retry 3 "https://fastly.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat" -o "$V2RAY_RULES/geoip.dat" || true
          curl -sL --retry 3 "https://fastly.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat" -o "$V2RAY_RULES/geosite.dat" || true
          echo "✅ 规则库与 GeoData 已全量集成完毕！"

      - name: 10. 【主程序】安全多线程编译固件（含智能容错与单线程降级重试）
        id: compile
        run: |
          cd immortalwrt
          export CCACHE_DIR="$CCACHE_DIR"
          
          echo "=================================================="
          echo "🚀 开始多线程标准编译 (-j$(nproc))..."
          echo "=================================================="
          make -j$(nproc) || {
            echo "⚠️ 检测到多线程并发冲突，正在自动切换为低并发单线程排错重试 (V=s)..."
            make -j1 V=s || {
              echo "❌ 编译彻底失败，正在提取最后 200 行错误日志..."
              tail -n 200 build.log || true
              exit 1
            }
          }

      - name: 11. 编译失败时上传错误日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build_error_logs
          path: immortalwrt/build.log
          if-no-files-found: warn

      - name: 12. 【编译后质量复检与固件体积审计】
        id: check_size
        if: steps.compile.outcome == 'success'
        run: |
          cd immortalwrt/bin/targets/ramips/mt7621
          echo "=================================================="
          echo "🔍 【编译后阶段】开始固件形态与体积合规复检..."
          echo "=================================================="
          
          if ls *sysupgrade.bin 1> /dev/null 2>&1; then
            FIRMWARE=$(ls *sysupgrade.bin | head -n 1)
            SIZE=$(stat -c%s "$FIRMWARE")
            SIZE_MB=$(echo "scale=2; $SIZE / 1024 / 1024" | bc)
            
            echo "📦 检测到固件名称: $FIRMWARE"
            echo "📏 实时测量体积: ${SIZE_MB} MB"
            
            if [ "$SIZE" -eq 0 ]; then
               echo "❌ 复检失败：固件体积为 0 字节，文件损坏！"
               exit 1
            fi
            
            if [ "$SIZE" -gt "$MAX_FIRMWARE_SIZE" ]; then 
              echo "❌ 复检失败：固件体积 ${SIZE_MB} MB 超出 32MB 硬件硬上限限制！"
              exit 1
            fi
            
            echo "✅ 固件体积复检：完全合规（未超限）"
            echo "FIRMWARE_PATH=$PWD" >> "$GITHUB_ENV"
            echo "TAG_DATE=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"
          else
            echo "❌ 复检失败：未在指定目录下捕获到有效的 sysupgrade.bin 固件！"
            exit 1
          fi

      - name: 13. 发布 Release 版本
        uses: softprops/action-gh-release@v2
        if: steps.check_size.outcome == 'success'
        with:
          tag_name: ImmortalWrt-Stable-${{ env.TAG_DATE }}
          name: ImmortalWrt 25.12 稳定全功能版 [${{ env.TAG_DATE }}]
          body: |
            ## 🚀 Newifi-D2 ImmortalWrt 25.12 稳定全功能版

            本版本精简并去除了所有不稳定源，完美集成 **MosDNS + Passwall + 完整 GeoIP/GeoSite 数据库 + 随身WiFi驱动**，并通过 32MB 固件体积严格审计。

            ### 💎 核心功能特性：
            1. **MosDNS + GeoData**：全球 IP/域名地理数据库，去广告与分流精准强悍。
            2. **Passwall + Xray**：成熟科学代理环境（已自动适配高版本 Go 编译链）。
            3. **全系随身 Wi-Fi 兼容**：内置 RNDIS、CDC-NCM、WWAN 等全套 USB 网卡驱动。
            4. **系统与网络加固**：
               - 预置网段 `192.168.2.1`。
               - 默认开启无线并优化信道（`alon` / `alon 5G` 无密码）。
               - 启用 BBR 加速、SWAP 内存保护及每日定时内存清理。
          files: ${{ env.FIRMWARE_PATH }}/*sysupgrade.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build OpenWrt for Newifi-D2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.config'

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 1. 检查并检出当前代码仓库
        uses: actions/checkout@v4

      - name: 2. 获取构建时间戳标签
        run: echo "TAG_DATE=$(date +\%Y\%m\%d-\%H\%M)" >> $GITHUB_ENV

      - name: 3. 初始化 Ubuntu 编译依赖环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext \
            git libncurses5-dev libssl-dev python3 python3-distutils rsync unzip zlib1g-dev \
            file wget curl swig time
          sudo timedatectl set-timezone "$TZ"

      - name: 4. 克隆 LEDE 官方源码
        run: |
          git clone --depth 1 https://github.com/coolsnowwolf/lede.git openwrt

      - name: 5. 更新并安装原厂 Feeds (使用 LEDE 自带 PassWall)
        run: |
          cd openwrt
          
          # 取消 helloworld 订阅源的注释（LEDE自带的科学上网套件源）
          sed -i 's/^#\(.*helloworld\)/\1/' feeds.conf.default

          # 更新并安装所有 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 6. 载入 .config 配置并设定默认 IP (192.168.2.1)
        run: |
          [ -f .config ] && cp .config openwrt/.config
          cd openwrt
          sed -i 's/192.168.1.1/192.168.2.1/g' package/base-files/files/bin/config_generate
          make defconfig

      - name: 7. 预下载工具链与依赖包 (make download)
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} +

      - name: 8. 执行多线程编译固件
        run: |
          cd openwrt
          echo -e "$(nproc) 线程并行编译中..."
          make -j$(nproc) || make -j1 V=s

      - name: 9. 检查并整理编译产物
        run: |
          TARGET_DIR="openwrt/bin/targets/ramips/mt7621"
          echo "FIRMWARE_DIR=$TARGET_DIR" >> $GITHUB_ENV
          echo "================ 编译出的固件清单 ================"
          ls -lh $TARGET_DIR/*.bin || true

      - name: 10. 自动发布固件到 Releases 页面
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-build-${{ env.TAG_DATE }}
          name: Newifi-D2 LEDE 全功能定制固件 [${{ env.TAG_DATE }}]
          body: |
            ### 💡 固件特性清单
            * **设备型号**: Newifi-D2 (MT7621 硬件精准锁定)
            * **源码来源**: Lean LEDE (原生整合 PassWall / SSR-Plus)
            * **核心功能**: 
              - 🌍 PassWall 科学上网代理
              - 🖨️ USB 网络打印机支持 (P910nd)
              - 💾 USB 存储挂载 (NTFS 读写 / exFAT / EXT4)
              - 📶 4G/5G 蜂窝网络 / USB 共享与 WWAN 中继
              - 🛠️ UPnP / DDNS / Samba4 / ZeroTier / 网页终端 TTYD
            * **默认管理 IP**: `192.168.2.1`
          files: |
            ${{ env.FIRMWARE_DIR }}/*.bin
            ${{ env.FIRMWARE_DIR }}/*.manifest

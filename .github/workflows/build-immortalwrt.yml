          cat > files/etc/config/p910nd << 'EOF'
          config p910nd
              option enabled '1'
              option device '/dev/usb/lp0'
              option port '0'
              option bidirectional '0'
          EOF

          # ---------- SQM 预置（默认关闭；刷完跑一次 sqm-setup 即开启）----------
          # 为什么预置而不直接开：整形上限必须按实测带宽定（×0.88），先给 0 = 不整形。
          cat > files/etc/config/sqm << 'EOF'
          config queue 'relay'
              # 带宽不是固定值（换宽带 / 换光猫 / 中继环境变化都会变），所以**不把数字固化进镜像**。
              # 这里保持中性：不启用、0/0 —— 数值由设备上的「校准」实测后写入本文件。
              #   · 面板「运行控制」里的「校准 SQM」：下行当场实测，上行按你填的速率；
              #   · 命令行等价：singbox-ctl sqm-tune <上行Mbit>   （下行自动测）
              # 校准会写 option tuned_at / tuned_down / tuned_up，面板据此显示"上次校准"。
              option enabled '0'
              option interface 'phy1-sta0'
              option debug_logging '0'
              option verbosity '5'
              option qdisc 'cake'
              option script 'piece_of_cake.qos'
              option qdisc_advanced '0'
              option ingress_ecn 'ECN'
              option egress_ecn 'NOECN'
              option linklayer 'ethernet'
              option squash_dscp '0'
              option squash_ingress '0'
              option download '0'
              option upload '0'
          EOF

          # sqm-setup：拿实测带宽自动按 88% 配好，省得手算和设错方向
          cat > files/usr/bin/sqm-setup << 'EOF'
          #!/bin/sh
          # sqm-setup —— 按实测上下行带宽配置 SQM（cake + piece_of_cake）
          # 用法：sqm-setup <下行Mbps> <上行Mbps> [接口，默认 phy1-sta0]
          #   例：sqm-setup 92 40   → 实际整形到 80 / 35 Mbit
          # 为什么 ×0.88：整形器必须略低于线路速率才有排队余量；设满等于没设。
          [ -n "$1" ] && [ -n "$2" ] || { echo "用法: sqm-setup <下行Mbps> <上行Mbps> [接口]"; exit 1; }
          SEC=relay
          IF=${3:-phy1-sta0}
          command -v tc >/dev/null 2>&1 || { echo "缺少 tc（本镜像应已内置；否则 apk add tc-tiny）"; exit 1; }
          modprobe sch_cake 2>/dev/null
          [ -d /sys/module/sch_cake ] || { echo "内核没有 sch_cake（缺 NET_CLS/CAKE），SQM 用不了"; exit 1; }
          # 注意单位：sqm-scripts 的 download/upload 是 **kbit/s**，不是 Mbit。
          # 这里必须 ×1000 再取 88%，否则 30 会被当成 30 Kbit/s —— 整台机当场被限到 30 Kbps（2026-11-23 真机踩到）。
          case "$1$2" in *[!0-9]*) echo "带宽只接受整数（Mbit）"; exit 1 ;; esac
          [ "$1" -ge 1 ] && [ "$2" -ge 1 ] || { echo "带宽必须 >= 1 Mbit"; exit 1; }
          DOWN=$(( $1 * 880 ))
          UP=$(( $2 * 880 ))
          uci -q get sqm.$SEC >/dev/null 2>&1 || uci set sqm.$SEC=queue
          uci set sqm.$SEC.interface="$IF"
          uci set sqm.$SEC.enabled='1'
          uci set sqm.$SEC.download="$DOWN"
          uci set sqm.$SEC.upload="$UP"
          uci set sqm.$SEC.script='piece_of_cake.qos'
          uci set sqm.$SEC.qdisc='cake'
          uci set sqm.$SEC.linklayer='ethernet'
          uci commit sqm
          /etc/init.d/sqm restart >/dev/null 2>&1
          echo "SQM 已启用：下行 $((DOWN / 1000)) Mbit / 上行 $((UP / 1000)) Mbit（实测 ${1}/${2} 的 88%，接口 $IF）"
          echo "查看：tc -s qdisc show dev $IF | head -20"
          echo "关闭：uci set sqm.$SEC.enabled='0'; uci commit sqm; /etc/init.d/sqm restart"
          EOF

          # ---------- F. 内核调优（针对 MT7621 双核 / 512MB 内存）----------
          # ---------- /etc/config/fstab：只为一个原因存在 ----------
          # 没有这个文件时，开机 block 会连打 4 条
          #   "block: unable to load configuration (fstab: Entry not found)"
          # 属于纯噪声（我们不用 fstab 挂载），但会让人以为挂载坏了。给个空配置即可。
          cat > files/etc/config/fstab << 'EOF'
          config 'global'
          	option	anon_mount	0
          	option	auto_swap	1
          	option	auto_mount	1
          	option	delay_root	5
          	option	check_fs	0
          EOF

          cat > files/etc/sysctl.conf << 'EOF'
          # ---- 内核参数。注意：不要在这里写任何"本内核不存在"的键 ----
          # 教训（2026-11-16，真机）：busybox 的 `sysctl -e -p` 遇到**第一个写失败的键就整体中断**，
          # 加 -e 也一样。原来第一行是 `net.core.default_qdisc = fq`，而本内核没编 sch_fq
          # （/lib/modules/*/sch_fq.ko 不存在），写它直接 ENOENT →
          # **整份文件一行都没生效**（实测运行时 rmem_max 还是 180224、fastopen=1、swappiness=60、
          # mtu_probing=0），只有 sysctl.d/12-tcp-bbr.conf 里的 BBR 碰巧生效。
          # 现在：① 不写 default_qdisc（没有 sch_fq，BBR + fq_codel 完全够用）；
          #       ② 另有 /usr/bin/sysctl-apply 逐键兜底（单键失败不影响其余），由 rc.local 调用；
          #       ③ 审计步骤会核对 rmem_max/tcp_fastopen 是否真的生效，不生效就报红。
          net.core.somaxconn = 1024
          net.core.rmem_max = 8388608
          net.core.wmem_max = 8388608
          net.ipv4.tcp_rmem = 4096 87380 8388608
          net.ipv4.tcp_wmem = 4096 65536 8388608
          net.ipv4.tcp_congestion_control = bbr
          net.ipv4.tcp_fastopen = 3
          net.ipv4.tcp_max_syn_backlog = 8192
          net.ipv4.tcp_syncookies = 1
          net.ipv4.tcp_tw_reuse = 1
          # ---- 代理链路最常见的“能连不能传”是路径 MTU 被黑洞：开启 MTU 探测自愈 ----
          net.ipv4.tcp_mtu_probing = 1
          # ---- 空闲后不重置拥塞窗口（BBR 下更平滑，长时间挂着不抖）----
          net.ipv4.tcp_slow_start_after_idle = 0
          # ---- FIN 超时收到 15 秒，端口回收更快（透明代理连接多）----
          net.ipv4.tcp_fin_timeout = 15
          # ---- 内存：小内存机器不要把 16MB 锁死，8MB 足够 ----
          vm.min_free_kbytes = 8192
          vm.swappiness = 10
          # ---- 保留 VFS 缓存：ksmbd/USB 共享读写更稳 ----
          vm.vfs_cache_pressure = 50
          # ---- TPROXY 前置条件：宽松反向路径校验 ----
          # tproxy 的报文从 lo 进入、源地址是客户端，严格 rp_filter 会把它当伪造包丢掉，
          # 表现是"连接建立但没有任何数据"。路由器场景下宽松校验没有安全代价。
          net.ipv4.conf.all.rp_filter = 0
          net.ipv4.conf.default.rp_filter = 0
          # kernel.panic 由 sysctl.d/10-default.conf 定为 3 秒（oops 后尽快切回可用状态），
          # 这里不再覆盖——两份文件里写不同值只会让人困惑。
          EOF

          # ---------- 逐键应用器：绕开 busybox sysctl -p 的"首错全断" ----------
          cat > files/usr/bin/sysctl-apply << 'EOF'
          #!/bin/sh
          # sysctl-apply：逐键应用 /etc/sysctl.conf（单键失败不影响其余）。
          #
          # 为什么需要它：busybox 的 `sysctl -e -p FILE` 在遇到第一个写失败的键时**直接中断**，
          # 后面所有键都不生效（实测：文件第一行 default_qdisc 写失败 → 整份文件白写）。
          # 这个脚本一行一行来，坏键只记一条日志，其余照常写入。
          # 由 /etc/rc.local 在开机末尾调用一次（那时模块与网络都已就绪）。

          CONF="${1:-/etc/sysctl.conf}"
          [ -f "$CONF" ] || exit 0

          _ok=0; _bad=0
          while IFS= read -r _l; do
              case "$_l" in ''|'#'*) continue ;; esac
              _k=${_l%%=*}; _v=${_l#*=}
              _k=$(printf '%s' "$_k" | tr -d ' \t')
              _v=$(printf '%s' "$_v" | sed 's/^[ \t]*//; s/[ \t]*$//')
              [ -n "$_k" ] || continue
              if sysctl -w "${_k}=${_v}" >/dev/null 2>&1; then
                  _ok=$((_ok + 1))
              else
                  _bad=$((_bad + 1))
                  logger -t sysctl-apply "跳过无效项：${_k}=${_v}"
              fi
          done < "$CONF"

          [ -t 0 ] && printf '已应用 %d 项，跳过 %d 项\n' "$_ok" "$_bad"
          exit 0
          EOF

          cat > files/etc/crontabs/root << 'EOF'
          PATH=/usr/sbin:/usr/bin:/sbin:/bin
          # 本固件不自动升级、不自动下载固件与规则包：分流名单（chnroute / proxy-domains）与
          # 广告清单都在构建期写进镜像，运行期没有任何"订阅 / 规则"定时拉取任务。
          # 下面七条全是纯本地动作，一个字节都不出网：
          # （原来还有一条"每天 04:00 drop_caches"，2026-11-16 删掉：页缓存丢了下一次读盘
          #   立刻又长回来，定时清只会让第二天首次访问变慢；真缺内存时 memguard 会处理）
          # 1) 每 10 分钟看一眼可用内存：低于总量 8% 清页缓存，低于 4% 再截断大日志（不动任何进程）
          */10 * * * * /usr/bin/memguard
          # 3) 每 10 分钟确认 MosDNS 还活着：procd 会拉起，这是第二道保险
          */10 * * * * pidof mosdns >/dev/null 2>&1 || /etc/init.d/mosdns restart
          # 2b) 每 2 分钟真的问一次 DNS（pidof 只能发现进程没了，发现不了"活着但卡死"：
          #     2026-11-23 实测 mosdns 卡死后全网 DNS 超时，连 www.baidu.com 都解析不了）
          * * * * * /usr/bin/dns-watchdog
          # 4) 每 2 分钟确认无线还在发信标：mt76 崩了只重启那一个 radio；
          #    中继断了先只重连中继接口，最后才全量 reload（细节见脚本头注释）
          */2 * * * * /usr/bin/wifi-watchdog
          # 5) 每 5 分钟做一次 TCP 连通探测：连续 3 次失败才重连中继 radio（#25305 用）
          */5 * * * * /usr/bin/net-watchdog
          # 6) 每 30 分钟把超过 1MB 的日志裁到最近 200 行；每周日 04:30 再全量扫一次兜底
          */30 * * * * /usr/bin/memguard trim
          30 4 * * 0 /usr/bin/memguard trim
          # 7) 每天 04:00 清空运行日志（/var/log 在 tmpfs 里）。net-watchdog.log 例外：
          #    只保留最近 200 行，因为它记录了漫游后的 TCP 断流证据
          0 4 * * * /usr/bin/memguard purge
          #
          # 8) 每 2 分钟确认 sing-box 还在跑。init.d 的 reload 是 stop+start，中途被打断
          #    会停在"已停 + nft 已撤"且不自愈（2026-11-23 实测踩到，代理整段断掉）。
          #    这条只是最后一道保险：连续两次看不到进程才 start。
          */2 * * * * /usr/bin/singbox-guard
          # 9) 每 8 小时检查一次「实测健康表」：表过期（TTL 12h）会让均衡池退回全量 67 个。
          #    只在新鲜样本不足 pool_cap 时才真测（脚本自己判断），测完池子会收缩回 12。
          20 4,12,20 * * * /usr/bin/sb-bootping 0 noapply
          EOF

          # ---------- F2. 内存看门狗（必要自动化：只清缓存，不动进程）----------
          cat > files/usr/bin/memguard << 'EOF'
          #!/bin/sh
          # 内存看门狗：页缓存把 MemAvailable 压到底时，LuCI 会卡、
          # ksmbd 会拒连、dnsmasq 会被 OOM 牵连。这里只做三件不伤人的事：
          #   1) drop_caches —— 页缓存随时可丢，丢完立刻能长回来（不影响正在跑的程序）
          #   2) 截断超大日志 —— /var/log 在 tmpfs 里，实打实吃内存
          #   3) 记一行日志 —— 回头能对上时间线
          # 绝不 reboot、绝不杀进程、绝不重启服务（那些交给 procd 和用户自己）。
          # 手动清一次：memguard trim
          LOG=/var/log/memguard.log
          AVAIL=$(awk '/^MemAvailable:/ {print int($2/1024)}' /proc/meminfo)
          [ -n "$AVAIL" ] || exit 0

          trim_logs() {
              # 每个日志上限 1MB：超了就只留最近 200 行（保留现场，不要直接清空）
              find /var/log -type f -size +1M 2>/dev/null | while read -r f; do
                  tail -n 200 "$f" > "$f.tmp" 2>/dev/null && mv "$f.tmp" "$f"
                  echo "$(date '+%F %T') 裁剪日志 $f（保留最近 200 行）" >> "$LOG"
              done
          }

          if [ "$1" = "trim" ]; then
              trim_logs
              exit 0
          fi

          purge_logs() {
              # 每天清空运行日志（用户要求"日志每天会清空"）。
              # 唯一的例外：net-watchdog.log 只裁到最近 200 行、不清空 ——
              # 它是漫游/TCP 断流（#25305）的唯一证据，清掉就等于白测。
              for f in /var/log/*.log; do
                  [ -f "$f" ] || continue
                  case "$f" in
                      */net-watchdog.log) tail -n 200 "$f" > "$f.tmp" 2>/dev/null && mv "$f.tmp" "$f" ;;
                      *) : > "$f" ;;
                  esac
              done
              echo "$(date '+%F %T') 已按计划清空 /var/log（net-watchdog.log 保留最近 200 行）" >> "$LOG"
          }

          if [ "$1" = "purge" ]; then
              purge_logs
              exit 0
          fi

          # 阈值按总内存算，不写死 MB：可用内存 < 8% 只清页缓存，< 4% 再加截断日志。
          # 写死 10MB 在大内存机器上等于永不触发，写死 40MB 在小内存机器上等于一直触发。
          TOTAL=$(awk '/^MemTotal:/ {print int($2/1024)}' /proc/meminfo)
          [ -n "$TOTAL" ] || TOTAL=128
          WARN=$((TOTAL * 8 / 100))
          # 单位是 MB（TOTAL 上面已除过 1024）。原来的下限写成了 8192 / 4096 —— 那是 KB 口径的数值，
          # 在 431MB 的机器上等于 WARN=8192MB、DANGER=4096MB，**永远触发**：每 10 分钟清一次页缓存、
          # 还截日志。现场证据：memguard.log 里「危险：可用 300MB / 共 431MB」。改成 MB 口径的下限。
          [ "$WARN" -ge 32 ] || WARN=32
          DANGER=$((TOTAL * 4 / 100))
          [ "$DANGER" -ge 16 ] || DANGER=16

          if [ "$AVAIL" -lt "$DANGER" ]; then
              sync
              echo 3 > /proc/sys/vm/drop_caches 2>/dev/null
              trim_logs
              echo "$(date '+%F %T') 危险：可用 ${AVAIL}MB / 共 ${TOTAL}MB，已清缓存 + 日志" >> "$LOG"
              logger -t memguard "可用内存 ${AVAIL}MB，已清缓存"
          elif [ "$AVAIL" -lt "$WARN" ]; then
              sync
              echo 1 > /proc/sys/vm/drop_caches 2>/dev/null
              echo "$(date '+%F %T') 紧张：可用 ${AVAIL}MB / 共 ${TOTAL}MB，已清页缓存" >> "$LOG"
          fi

          # 自己的日志别无限长（超过 64KB 只留最后 200 行）
          if [ -f "$LOG" ] && [ "$(wc -c < "$LOG")" -gt 65536 ]; then
              tail -n 200 "$LOG" > "$LOG.tmp"
              mv "$LOG.tmp" "$LOG"
          fi
          exit 0
          EOF

          # ---------- G. 开机后调优（必须在模块加载之后，故放在 rc.local）----------
          cat > files/etc/rc.local << 'EOF'
          #!/bin/sh
          # ---- 内核参数逐键兜底应用 ----
          # /etc/init.d/sysctl（S11）用 busybox `sysctl -p` 应用 /etc/sysctl.conf，
          # 而它遇到第一个写失败的键就整体中断（详见 files/etc/sysctl.conf 顶部注释）。
          # 这里再逐键跑一遍：以后谁往那个文件里加了一个本内核不存在的键，也不至于让
          # 其余参数全部失效（代价是一次 fork/键，约 50ms）。
          [ -x /usr/bin/sysctl-apply ] && /usr/bin/sysctl-apply >/dev/null 2>&1

          # conntrack 上限：32K 是性价比最高的档位（默认 16K，P2P + 多设备会把表打满）
          if [ -e /proc/sys/net/netfilter/nf_conntrack_max ]; then
              echo 32768 > /proc/sys/net/netfilter/nf_conntrack_max
              echo 3600  > /proc/sys/net/netfilter/nf_conntrack_tcp_timeout_established
          fi

          # CPU 调频：MT7621 有 cpufreq 就锁 performance，软路由不需要省电
          for g in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
              [ -e "$g" ] && echo performance > "$g"
          done

          # ---- 自愈看门狗（后台，20 秒后检查一次）----
          # 1) LAN 段不完整 → 自动补齐并重载网络（这是"全家断网"的兜底）
          # 2) dnsmasq 没跑 → 重启一次；还起不来只记日志（53 由 dnsmasq 持有，它起不来就等于全断）
          (
              sleep 20
              _dirty=0
              if ! uci -q get network.lan.proto >/dev/null 2>&1; then
                  logger -t netguard "LAN 段缺少 proto，自动修复"
                  uci set network.lan='interface'
                  [ -n "$(uci -q get network.lan.device)" ] || uci set network.lan.device='br-lan'
                  uci set network.lan.proto='static'
                  uci set network.lan.ipaddr='192.168.2.1'
                  uci set network.lan.netmask='255.255.255.0'
                  _dirty=1
              fi
              if ! uci -q get network.lan.device >/dev/null 2>&1; then
                  uci set network.lan.device='br-lan'
                  _dirty=1
              fi
              if [ "$_dirty" = "1" ]; then
                  uci commit network
                  logger -t netguard "网络配置已修复，重载中"
                  /etc/init.d/network reload
                  sleep 5
              fi

              if ! pidof dnsmasq >/dev/null 2>&1; then
                  logger -t netguard "dnsmasq 未运行，尝试重启"
                  /etc/init.d/dnsmasq restart
                  sleep 3
                  if ! pidof dnsmasq >/dev/null 2>&1; then
                      # 53 只由 dnsmasq 持有，这里不要动 dnsmasq 的 server/noresolv
                      logger -t netguard "dnsmasq 仍起不来，检查 /tmp/resolv.conf.d 与 WAN 上游"
                  fi
              fi
          ) &

          # ---- MosDNS：等 WAN 起来、NTP 校时完成后再重启一次 ----
          # DoH 要校验证书，开机头几十秒时钟还是 1970 年，握手必失败（此时走明文兜底）；
          # 重启一次让它切回加密上游。
          ( sleep 25; /etc/init.d/mosdns restart ) &

          exit 0
          EOF

          # ---------- H. 规则手动刷新工具（固件不会自动调用它）----------
          # 手动刷新「走代理的域名」清单：写 /etc/singbox/proxy-domains.txt 并重启 sing-box。
          # 运行时不联网更新，这个工具是「想刷才刷」，默认没有任何 cron 会碰它。
          # 根文件系统是 overlayfs，写 /etc/singbox 会 copy-up 到 overlay，不动 squashfs 本体。
          # 下载或重启失败自动回滚。
          cat > files/usr/bin/rule-refresh << 'EOF'
          #!/bin/sh
          # 手动刷新"走代理的域名"清单：写 /etc/singbox/proxy-domains.txt 并重启 sing-box。
          # 只在手动执行时跑，固件不会自动调用它（不联网自更新）。
          LOG=/var/log/rule-refresh.log
          TARGET=/etc/singbox/proxy-domains.txt
          TMP=/tmp/rules.$$
          log() { echo "$(date '+%F %T') $*" >> "$LOG"; logger -t rule-refresh "$*"; }

          [ -d /etc/singbox ] || { log "跳过：没有 /etc/singbox"; exit 0; }
          mkdir -p "$TMP" || exit 1
          # 中断/超时也要清掉下载残留（tmpfs 是 RAM，反复中断会一直占着）
          trap 'rm -rf "$TMP"' EXIT INT TERM

          # 空间预检：清单约 200KB，留 2MB 余量，不够就安静跳过
          FREE=$(df -Pk /overlay 2>/dev/null | awk 'NR==2{print int($4/1024)}')
          if [ -n "$FREE" ] && [ "$FREE" -lt 2 ]; then
              log "跳过：overlay 仅剩 ${FREE}MB"
              rm -rf "$TMP"; exit 0
          fi

          fetch() {
              _url="$1"; _out="$2"; _min="${3:-1000}"
              if command -v curl >/dev/null 2>&1; then
                  curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 15 -m 300 \
                       "$_url" -o "$TMP/$_out" || { log "失败：$_out 下载出错"; return 1; }
              elif command -v uclient-fetch >/dev/null 2>&1; then
                  uclient-fetch -q -O "$TMP/$_out" "$_url" || { log "失败：$_out 下载出错"; return 1; }
              elif command -v wget >/dev/null 2>&1; then
                  wget -q -O "$TMP/$_out" "$_url" || { log "失败：$_out 下载出错"; return 1; }
              else
                  log "失败：系统里没有 curl / uclient-fetch / wget，无法下载"; return 1
              fi
              _n=$(wc -l < "$TMP/$_out" | tr -d ' ')
              [ "$_n" -ge "$_min" ] || { log "失败：$_out 行数异常($_n)"; return 1; }
              log "完成：$_out 下载($_n 行)"
          }

          # gfw.txt：纯域名清单（Loyalsoldier 维护，和机场用的 gfwlist 同源）
          fetch "https://fastly.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/gfw.txt" gfw.raw 1000 \
              || fetch "https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/gfw.txt" gfw.raw 1000 \
              || { rm -rf "$TMP"; exit 0; }
          if grep -qE '^(domain|full|regexp|keyword|include):' "$TMP/gfw.raw"; then
              log "失败：gfw.txt 是 v2ray 规则格式，不能直接当域名清单"; rm -rf "$TMP"; exit 0
          fi

          # 归一化：去注释与空行、去掉 *./. /http:// 前缀、只留合法域名、转小写、去重
          tr -d '\r' < "$TMP/gfw.raw" | awk '{
                gsub(/^[ \t]+/, ""); gsub(/[ \t]+$/, "")
                if ($0 == "" || substr($0, 1, 1) == "#") next
                sub(/^\*\./, ""); sub(/^\./, "")
                sub(/^https?:\/\/[^\/]*/, ""); sub(/\/.*$/, "")
                if ($0 ~ /^[A-Za-z0-9._-]+$/ && index($0, ".") > 0) print tolower($0)
              }' | sort -u > "$TMP/domains.new"
          _n=$(wc -l < "$TMP/domains.new" | tr -d ' ')
          [ -n "$_n" ] || _n=0
          [ "$_n" -ge 1000 ] || { log "失败：清洗后只剩 $_n 条，保持原规则"; rm -rf "$TMP"; exit 0; }

          cp -f "$TARGET" "$TMP/domains.bak" 2>/dev/null || true
          mv -f "$TMP/domains.new" "$TARGET"

          # 让新规则生效：重新生成配置并重启（未启用时只重生成，不动进程）
          if [ "$(uci -q get singbox-lite.main.enabled)" = "1" ]; then
              if /etc/init.d/singbox-lite restart >/dev/null 2>&1; then
                  log "生效：代理域名 $_n 条 → $TARGET（sing-box 已重启）"
                  # MosDNS 的 domain_set 是启动时一次性读入的，而且读的是 /tmp/mosdns 那份：
                  # 不同步 + 不重启，刷新的墙外域名仍按"国内"解析（拿到投毒 IP），等于白刷。
                  if cp -f "$TARGET" /tmp/mosdns/proxy-domains.txt 2>/dev/null; then
                      /etc/init.d/mosdns restart >/dev/null 2>&1
                      log "MosDNS 已同步新清单并重启"
                  fi
              else
                  log "回滚：sing-box 重启失败，恢复旧清单"
                  if [ -f "$TMP/domains.bak" ]; then cp -f "$TMP/domains.bak" "$TARGET"; else rm -f "$TARGET"; fi
                  /etc/init.d/singbox-lite restart >/dev/null 2>&1
              fi
          else
              /usr/libexec/singbox-ctl render >/dev/null 2>&1 || true
              log "已更新：代理域名 $_n 条 → $TARGET（代理未启用，只重生成配置）"
          fi
          rm -rf "$TMP"
          exit 0
          EOF

          # ---------- I. 固件自检脚本（刷机后 SSH 执行 fw-selftest）----------
          mkdir -p files/usr/bin
          cat > files/usr/bin/fw-selftest << 'EOF'
          #!/bin/sh
          # 固件自检：一条命令看全系统状态
          P=0; F=0; W=0
          ok() { printf '  \033[32m✅\033[0m %s\n' "$1"; P=$((P + 1)); }
          warn() { printf '  \033[33m⚠️\033[0m %s\n' "$1"; W=$((W + 1)); }
          ng() { printf '  \033[31m❌\033[0m %s\n' "$1"; F=$((F + 1)); }
          t()  { d="$1"; shift; if "$@" >/dev/null 2>&1; then ok "$d"; else ng "$d"; fi; }

          echo "===== Newifi-D2 固件自检 ====="
          t "sing-box 可执行"    sing-box version
          t "dnsmasq 运行中"     pidof dnsmasq
          t "DNS 解析正常"       nslookup www.baidu.com 127.0.0.1
          t "NAT 转发开启"       test -e /proc/sys/net/ipv4/ip_forward

          [ "$(cat /proc/sys/net/ipv4/ip_forward 2>/dev/null)" = "1" ] && ok "ip_forward=1" || ng "ip_forward≠1"
          t "MosDNS 运行中"       pidof mosdns
          # 5335 = 0x14D7：直接读 /proc/net/udp{,6}，不依赖 busybox 是否编了 netstat
          _p5335=0
          for _pf in /proc/net/udp /proc/net/udp6; do
              [ -r "$_pf" ] || continue
              awk 'NR>1 && $2 ~ /:14D7$/ {f=1} END{exit !f}' "$_pf" && _p5335=1
          done
          if [ "$_p5335" = "0" ] && command -v netstat >/dev/null 2>&1; then
              netstat -lnu 2>/dev/null | grep -q ":5335" && _p5335=1
          fi
          [ "$_p5335" = "1" ] && ok "MosDNS 监听 5335/UDP" || ng "5335 没有监听"
          AD_N=$(wc -l < /tmp/mosdns/adblock.txt 2>/dev/null | tr -d " ")
          [ -n "$AD_N" ] || AD_N=0
          [ "$AD_N" -ge 50000 ] && ok "广告域名 $AD_N 条" || ng "广告域名清单异常（$AD_N 条）"
          [ -x /usr/libexec/mosdns-ctl ] && ok "MosDNS 管理脚本已装（LuCI 页面同一入口）" || ng "mosdns-ctl 缺失"
          [ -f /www/luci-static/resources/view/mosdns/overview.js ] && ok "MosDNS 管理页面已装" || ng "MosDNS 管理页面缺失"
          if grep -qE "rule_update|subscribe\.lua|singbox-ctl[[:space:]]+sub-import|rule-refresh" /etc/crontabs/root 2>/dev/null; then
              ng "crontab 里仍有自动下载任务"
          else
              ok "无自动下载任务"
          fi
          [ -x /usr/bin/memguard ] && ok "内存看门狗已装（每 10 分钟）" || ng "memguard 缺失"
          if grep -q 'memguard' /etc/crontabs/root 2>/dev/null; then
            ok "crontab 里有本地清理任务（不联网）"
          else
            ng "crontab 里没有本地清理任务"
          fi
          [ -x /usr/bin/wifi-watchdog ] && ok "无线看门狗已装（每 2 分钟，按 radio 分级恢复）" || ng "wifi-watchdog 缺失"
          grep -q 'wifi-watchdog' /etc/crontabs/root 2>/dev/null && ok "crontab 里有无线看门狗" || ng "crontab 里没有无线看门狗"
          [ "$(uci -q get wireless.radio0.txpower)" = "20" ] \
            && ok "2.4G 发射功率钉在 20dBm（不吃法规上限 30dBm）" \
            || ng "2.4G 发射功率没钉住：hostapd 会按法规上限 30dBm 喂前端"
          _hw=$(dmesg 2>/dev/null | grep -ciE 'hardware restart|firmware crash' | tr -d ' ')
          [ -n "$_hw" ] || _hw=0
          if [ "$_hw" -eq 0 ]; then
            ok "本次开机内没有 mt76 硬件重启 / 固件崩溃"
          else
            printf '  ⚠️  本次开机内出现 %s 次 mt76 硬件重启 / 固件崩溃（mt76 已知问题，细节跑 wifi-doctor）\n' "$_hw"
          fi
          _av=$(awk '/^MemAvailable:/ {print int($2/1024)}' /proc/meminfo 2>/dev/null)
          [ -n "$_av" ] && printf '  · 可用内存 %sMB（低于总量 8%% 时 memguard 会自动清缓存）\n' "$_av"
          [ "$(uci -q get dhcp.@dnsmasq[0].cachesize)" = "2000" ] \
              && ok "dnsmasq 缓存 2000 条" || ng "dnsmasq 缓存未调到 2000"
          if [ "$(uci -q get dhcp.@dnsmasq[0].noresolv)" = "1" ]; then
              ok "dnsmasq 只走 MosDNS（noresolv=1）"
          else
              ng "dnsmasq 没锁定上游（noresolv 不是 1）"
          fi
          if uci -q show dhcp.@dnsmasq[0] | grep -q "127.0.0.1#5335"; then
              ok "dnsmasq 上游=127.0.0.1#5335"
          elif [ -f /tmp/dns-fallback.on ]; then
              # 兜底是 dns-watchdog 主动做的降级：DNS 可用，只是去广告/分流暂时失效，
              # 所以这里用 ⚠️ 而不是 ❌（红叉会让人以为系统坏了）。
              warn "DNS 兜底中：dnsmasq 走公网明文上游（mosdns 未恢复，去广告/分流已暂停）"
          else
              ng "dnsmasq 上游没指向 MosDNS（执行 dns-recover 可修）"
          fi
          [ "$(cat /proc/sys/net/ipv4/tcp_congestion_control 2>/dev/null)" = "bbr" ] && ok "BBR 生效" || ng "BBR 未生效"
          [ "$(cat /proc/sys/net/netfilter/nf_conntrack_max 2>/dev/null)" = "32768" ] && ok "conntrack=32768" || ng "conntrack 未调优"
          # 没插 U 盘是正常状态（固件里 ksmbd 由 usb-service 按需起），不该拉低信噪比

          # ---------- LuCI 监听（首刷踩过：LAN IP 是 CIDR 时 uhttpd 绑不上，80 全关）----------
          if netstat -lnt 2>/dev/null | grep -qE ':80[[:space:]]'; then
              ok "LuCI 正在监听 :80（listen_http=$(uci -q get uhttpd.main.listen_http)）"
          else
              ng "uhttpd 没监听 80：listen_http 必须是 裸IP:80，不能带 /24（改完 /etc/init.d/uhttpd restart）"
          fi

          # ---------- 透明代理（自研 singbox-lite）----------
          if [ -x /usr/libexec/singbox-ctl ]; then
              _xs=$(/usr/libexec/singbox-ctl status 2>/dev/null)
              case "$_xs" in
                  *'"running":true'*) ok "sing-box 运行中（$(/usr/libexec/singbox-ctl version 2>/dev/null | head -1)）" ;;
                  *)
                      if [ "$(uci -q get singbox-lite.main.enabled)" = "1" ]; then
                          ng "singbox-lite 已启用但没在跑（查 logread -e singbox / singbox-ctl render）"
                      else
                          printf '  · singbox-lite 未启用（服务 → sing-box 里加节点后启用）\n'
                      fi ;;
              esac
              if nft list table inet singbox >/dev/null 2>&1; then
                  ok "透明代理 nft 规则已下发（table inet singbox）"
              else
                  printf '  · nft 规则未下发（未启用/未启动时属于正常）\n'
              fi
              for _p in /usr/libexec/singbox-ctl /usr/libexec/singbox-sub-clash.awk; do
                  [ -f "$_p" ] || ng "缺少 $_p（订阅导入会失败）"
              done
              if command -v jsonfilter >/dev/null 2>&1; then
                  ok "jsonfilter 已装（sing-box / Xray JSON 订阅可解析）"
              else
                  printf '  · 没有 jsonfilter：JSON 订阅将无法解析\n'
              fi
              if [ -x /usr/bin/sing-box ]; then
                  _sv=$(/usr/bin/sing-box version 2>/dev/null | head -1)
                  case "$_sv" in
                      "sing-box "*) ok "内核：$_sv" ;;
                      *) ng "sing-box 无法执行（架构或依赖不对）" ;;
                  esac
                  # 优先问二进制自己（version 输出带 Tags: 行），strings 不是每个 busybox 镜像都编了
                  if /usr/bin/sing-box version 2>/dev/null | grep -q 'with_quic'; then
                      ok "含 with_quic（hysteria2 可用）"
                  elif command -v strings >/dev/null 2>&1 && strings /usr/bin/sing-box 2>/dev/null | grep -q 'with_quic'; then
                      ok "含 with_quic（hysteria2 可用）"
                  else
                      ng "缺 with_quic：hysteria2 节点会用不了"
                  fi
              else
                  ng "缺 /usr/bin/sing-box（面板没有内核）"
              fi
              if [ -s /etc/singbox/chnroute.txt ]; then
                  _cnn=$(wc -l < /etc/singbox/chnroute.txt | tr -d ' ')
                  if [ "${_cnn:-0}" -ge 3000 ]; then ok "国内 IP 段 $_cnn 条"; else ng "chnroute 只有 ${_cnn:-0} 条"; fi
              else
                  ng "缺 /etc/singbox/chnroute.txt（rule 模式国内直连失效）"
              fi
              if [ -s /etc/singbox/proxy-domains.txt ]; then
                  _gfn=$(grep -vc '^#' /etc/singbox/proxy-domains.txt | tr -d ' ')
                  if [ "${_gfn:-0}" -ge 1000 ]; then ok "代理域名 $_gfn 条"; else ng "代理域名只有 ${_gfn:-0} 条"; fi
              else
                  ng "缺 /etc/singbox/proxy-domains.txt"
              fi
          fi

          # ---------- 整形能力 / SQM / TCP 看门狗（升级内核后第一件要看的事）----------
          if command -v tc >/dev/null 2>&1; then
              ok "tc 已安装"
              modprobe sch_cake 2>/dev/null
              if [ -d /sys/module/sch_cake ]; then
                  ok "sch_cake 可加载（cake / 双向整形可用）"
              else
                  ng "sch_cake 加载失败（内核缺 NET_CLS / NET_SCH_CAKE → SQM 用不了）"
              fi
          else
              ng "缺少 tc（SQM 装不上）"
          fi
          if [ "$(uci -q get sqm.relay.enabled 2>/dev/null)" = "1" ]; then
              ok "SQM 已启用（下行 $(uci -q get sqm.relay.download)/上行 $(uci -q get sqm.relay.upload) kbit）"
          else
              printf '  · SQM 未启用：测速后执行 sqm-setup <下行Mbps> <上行Mbps>\n'
          fi
          if grep -q 'net-watchdog' /etc/crontabs/root 2>/dev/null; then
              ok "net-watchdog 已排程（每 5 分钟探测 TCP）"
          else
              ng "net-watchdog 未排程（#25305 的断流将无法自动留证）"
          fi
          if [ -f /var/log/net-watchdog.log ]; then
              _nw=$(wc -l < /var/log/net-watchdog.log 2>/dev/null | tr -d ' ')
              printf '  · net-watchdog 日志 %s 行（/var/log/net-watchdog.log）\n' "${_nw:-0}"
          else
              # 文件可能还不存在（从没触发过重连）。不能直接 wc -l < 一个不存在的文件，
              # 那样重定向在调用前就失败，会甩一行 "can't open ... no such file" 的噪音。
              printf '  · net-watchdog 日志 0 行（尚未触发过重连，日志会写到 /var/log/net-watchdog.log）\n'
          fi
          [ -d /mnt/sda1 ] && ok "U 盘已挂载 /mnt/sda1" || printf '  · 未插 U 盘（需要共享时插上即可，ksmbd 会自动起）\n'

          echo
          printf '通过 %d 项，失败 %d 项\n' "$P" "$F"
          if [ "$F" -eq 0 ]; then echo "🎉 一切正常"; else echo "⚠️  有失败项，按上面 ❌ 对应功能排查"; fi
          # 有失败项就返回非 0（原来恒定 exit 0，脚本化判读永远通过，自检形同虚设）
          [ "$F" -eq 0 ] || exit 1
          exit 0
          EOF

          # ---------- I1. 一键体检（刷机后 SSH 执行 quick-check）----------
          cat > files/usr/bin/quick-check << 'QUICKCHECK'
          #!/bin/sh
          # ---------------------------------------------------------------
          # quick-check：刷机后一条命令看全机状态（只读，不改配置、不联网）
          #   用法：SSH 登录后执行  quick-check
          #   判读：✅ 正常 / ⚠️ 能用但有隐患 / ❌ 这项没起来（照提示修）
          #   它只体检，修交给各自的工具：
          #     DNS 全挂   → dns-recover
          #     无线异常   → wifi-doctor
          #     逐项细节   → fw-selftest
          #     代理问题   → 服务 → sing-box（节点 / 日志），或 /etc/init.d/singbox-lite restart
          # ---------------------------------------------------------------
          OK=0; WARN=0; BAD=0
          ok()   { OK=$((OK+1));     printf "  ✅ %s\n" "$*"; }
          warn() { WARN=$((WARN+1)); printf "  ⚠️  %s\n" "$*"; }
          bad()  { BAD=$((BAD+1));   printf "  ❌ %s\n" "$*"; }
          sec()  { printf "\n== %s ==\n" "$*"; }

          # ---------- 1. 设备与固件 ----------
          sec "1. 设备与固件"
          [ -f /etc/openwrt_release ] && . /etc/openwrt_release
          _model=$(ubus call system board 2>/dev/null | sed -n 's/.*"model": *"\([^"]*\)".*/\1/p' | head -n1)
          printf "  型号 : %s\n" "${_model:-未知}"
          printf "  系统 : %s %s (%s)\n" "$DISTRIB_ID" "$DISTRIB_RELEASE" "$DISTRIB_REVISION"
          printf "  内核 : %s\n" "$(uname -r)"
          printf "  运行 : %s\n" "$(uptime | sed 's/^ *//')"
          case "$DISTRIB_RELEASE" in
           24.10*) ok "系统分支 24.10（内核 6.6，2.4G AP 经验证正常）" ;;
            25.12*) warn "系统分支 25.12：mt7603 的 2.4G AP 在 6.12 上可能不发信标（已知问题）" ;;
            *)      warn "系统分支是 $DISTRIB_RELEASE，不是预期的 24.10" ;;
          esac

          # ---------- 2. 闪存与内存 ----------
          sec "2. 闪存与内存"
          _ovsize=0; _ovused=0; _ovfree=0; _ovpct=0
          # 不能用 set -- $(df ...)：那会把脚本自己的位置参数覆盖掉，且 df 换行时取值错位
          read _ovsize _ovused _ovfree _ovpct <<EOF
          $(df -k /overlay 2>/dev/null | awk 'NR==2{print $2, $3, $4, $5}')
          EOF
          if [ -n "$_ovfree" ]; then
            printf "  overlay : 共 %s MB，已用 %s (%s)，剩 %s MB\n" "$((_ovsize / 1024))" "$_ovused" "$_ovpct" "$((_ovfree / 1024))"
            if [ "$_ovfree" -lt 2048 ]; then
              warn "overlay 剩余不足 2MB：装不下新插件，rule-refresh 会自动跳过（不影响代理本身）"
            else
              ok "overlay 余量 $((_ovfree / 1024)) MB"
            fi
          else
            warn "读不到 /overlay 使用率"
          fi
          _mt=$(sed -n 's/^MemTotal: *\([0-9]*\) kB.*/\1/p' /proc/meminfo)
          _ma=$(sed -n 's/^MemAvailable: *\([0-9]*\) kB.*/\1/p' /proc/meminfo)
          [ -n "$_mt" ] || _mt=0
          [ -n "$_ma" ] || _ma=0
          _mt=$((_mt / 1024)); _ma=$((_ma / 1024))
          if [ "$_mt" -gt 0 ]; then
            printf "  内存   : 总 %s MB，可用 %s MB\n" "$_mt" "$_ma"
            _pct=$((_ma * 100 / _mt))
            if [ "$_pct" -lt 8 ]; then
              bad "可用内存只剩 ${_pct}%：先停掉不用的服务，或把屏蔽列表降到 5 万条重新构建"
            elif [ "$_pct" -lt 15 ]; then
              warn "可用内存 ${_pct}%，偏紧（memguard 会自己清缓存，不重启任何服务）"
            else
              ok "可用内存 ${_pct}%"
            fi
          fi
          if grep -q zram /proc/swaps 2>/dev/null; then
            ok "zram 交换分区在工作：$(grep zram /proc/swaps | sed 's/.*\///')"
          else
            warn "没看到 zram 交换分区（内存紧时更容易被 OOM 杀掉进程）"
          fi
          # ---------- 3. 外网与 DNS 链路 ----------
          sec "3. 外网与 DNS 链路"
          if ifstatus wan 2>/dev/null | grep -q '"up": true'; then
            ok "WAN 已拨通：$(ifstatus wan 2>/dev/null | sed -n 's/.*"address": *"\([0-9.]*\)".*/\1/p' | head -n1)"
          else
            # 中继（无线上行）场景下 wan 本来就是 down，真正的上行是 wwan/wan6。
            # 2026-11-15 现场：wan down、wwan up（能上网），旧逻辑误报"WAN 未起来"。
            _up=""
            for _i in wan wwan wan6; do
              ifstatus "$_i" 2>/dev/null | grep -q '"up": true' && _up="$_up $_i"
            done
            if [ -n "$_up" ]; then
              ok "上行已通（$_up ，其中 wan 未接线属正常）"
            else
              warn "没有任何上行（wan/wwan/wan6 全 down）：先解决上网，再看代理与去广告"
            fi
          fi
          # 内核参数是否真的生效：busybox `sysctl -p` 遇到第一个坏键会整体中断，
          # 曾经整份 /etc/sysctl.conf 白写（rmem_max 还是 180224）。这里只挑两个最能说明问题的键。
          _rm=$(cat /proc/sys/net/core/rmem_max 2>/dev/null)
          if [ "${_rm:-0}" -ge 8388608 ]; then
            ok "内核缓冲上限已生效（rmem_max=$_rm）"
          else
            bad "rmem_max=$_rm（应为 8388608）：/etc/sysctl.conf 没生效，执行 sysctl-apply 看哪个键写失败"
          fi
          _fo=$(cat /proc/sys/net/ipv4/tcp_fastopen 2>/dev/null)
          [ "${_fo:-0}" -eq 3 ] && ok "TCP Fast Open 已开（client+server）" || warn "tcp_fastopen=$_fo（应为 3）"

          pidof dnsmasq >/dev/null 2>&1 && ok "dnsmasq 运行中" || bad "dnsmasq 没跑：执行 /etc/init.d/dnsmasq restart"
          _up=$(uci -q get dhcp.@dnsmasq[0].server)
          case "$_up" in
            *127.0.0.1#5335*) ok "dnsmasq 上游 = MosDNS(5335)" ;;
            *) bad "dnsmasq 上游没指向 MosDNS（当前：${_up:-空}）：执行 dns-recover 可修" ;;
          esac
          pidof mosdns >/dev/null 2>&1 && ok "MosDNS 运行中（PID $(pidof mosdns)）" || bad "MosDNS 没跑：执行 /etc/init.d/mosdns restart，看 logread -e mosdns"
          if grep -qi ":14D7" /proc/net/udp /proc/net/udp6 2>/dev/null; then
            ok "5335 端口在监听（0x14D7）"
          else
            bad "5335 没有监听：MosDNS 没起来或配置被改坏"
          fi
          _adn=0
          [ -s /tmp/mosdns/adblock.txt ] && _adn=$(wc -l < /tmp/mosdns/adblock.txt | tr -d " ")
          # 三源（anti-AD + oisd small + AdGuard DNS）合并后正常约 22.7 万条；
          # 低于 15 万说明构建时有源没拉全，但不影响已经生效的那部分
          if [ "${_adn:-0}" -ge 150000 ]; then
            ok "去广告清单 $_adn 条"
          elif [ "${_adn:-0}" -ge 50000 ]; then
            warn "去广告清单只有 $_adn 条（预期约 22.7 万：构建时可能只有一个源成功）"
          elif [ "${_adn:-0}" -gt 0 ]; then
            warn "去广告清单只有 $_adn 条（构建时上游基本没拉到，功能偏弱）"
          else
            bad "去广告清单是空的：重新构建，或看构建日志 K 节哪个源失败"
          fi
          if nslookup www.baidu.com 127.0.0.1 >/dev/null 2>&1; then
            ok "域名解析正常（www.baidu.com 走完整链路）"
          else
            bad "解析失败：优先执行 dns-recover 恢复直连，再排查 MosDNS"
          fi
          _adt=$(head -n1 /tmp/mosdns/adblock.txt 2>/dev/null)
          if [ -n "$_adt" ]; then
            # 必须直接问 MosDNS(5335)：走 53 全链路时，被分到"境外"的域名根本不会经过 MosDNS，
            # 于是"清单里有这个域名却解析出真 IP"——那是分流正常，不是拦截失效（曾误报）。
            if nslookup -port=5335 "$_adt" 127.0.0.1 2>/dev/null | grep -q "0.0.0.0"; then
              ok "广告拦截生效（$_adt → 0.0.0.0）"
            else
              if nslookup "$_adt" 127.0.0.1 2>/dev/null | grep -q "0.0.0.0"; then
                ok "广告拦截生效（$_adt → 0.0.0.0，经 53 全链路）"
              else
                warn "MosDNS 没拦住 $_adt（清单可能刚改过：/etc/init.d/mosdns restart 后重试；或该域名被分流到境外解析）"
              fi
            fi
          fi

          # ---------- 4. 代理（sing-box） ----------
          sec "4. 代理（sing-box）"
          if command -v sing-box >/dev/null 2>&1; then
            ok "$(sing-box version 2>/dev/null | head -n1 | cut -c1-60)"
          else
            bad "sing-box 二进制缺失：这个固件不完整，重新刷入"
          fi
          if [ "$(uci -q get singbox-lite.main.enabled)" = "1" ]; then
            ok "透明代理已启用（singbox-lite.main.enabled=1）"
          else
            warn "透明代理关闭（服务 → sing-box 里导入订阅后启用）"
          fi
          _nodes=$(uci -q show singbox-lite 2>/dev/null | grep -c "=node$")
          [ -n "$_nodes" ] || _nodes=0
          if [ "$_nodes" -le 0 ]; then
            warn "还没有节点：当前全部直连，导入订阅后立即生效"
          else
            ok "节点数 $_nodes"
          fi
          pidof sing-box >/dev/null 2>&1 && ok "sing-box 进程在跑（PID $(pidof sing-box)）" \
            || warn "sing-box 没在跑：没节点/未启用时正常，否则看 logread -e sing-box"
          # 配置合法性必须单独查：进程能起来不代表下次 restart 还能起来
          if [ -s /var/etc/singbox/config.json ] && [ -x /usr/bin/sing-box ]; then
            if /usr/bin/sing-box check -c /var/etc/singbox/config.json >/dev/null 2>&1; then
              ok "sing-box 配置合法（check 通过）"
            else
              bad "sing-box 配置非法：restart 会失败（/var/etc/singbox/config.json）"
            fi
          fi
          if nft list table inet singbox >/dev/null 2>&1; then
            ok "nftables 规则表 inet singbox 已装载"
          else
            warn "没有 inet singbox 表：未启用时正常（规则只在启用后下发）"
          fi
          _ph=0
          [ -s /etc/singbox/proxy-domains.txt ] && _ph=$(grep -vc '^#' /etc/singbox/proxy-domains.txt | tr -d " ")
          if [ "${_ph:-0}" -ge 1000 ]; then
            ok "代理域名清单 $_ph 条"
          else
            warn "proxy-domains.txt 只有 ${_ph:-0} 条（出厂应 >=1000）"
          fi
          _cn=0
          [ -s /etc/singbox/chnroute.txt ] && _cn=$(wc -l < /etc/singbox/chnroute.txt | tr -d " ")
          if [ "${_cn:-0}" -ge 3000 ]; then
            ok "国内 CIDR $_cn 条"
          else
            warn "chnroute.txt 不全（${_cn:-0} 行），重新刷入整包"
          fi
          # ---------- 5. 本机服务 ----------
          sec "5. 本机服务"
          # 本固件把 ksmbd/p910nd/usbmuxd/usbmode/wsdd2 交给 usb-service 按需起停，
          # "开机自启"本来就不该有（S 链接为空才是正确状态）。这里只在 usb-service 缺失时才告警。
          if [ -x /usr/bin/usb-service ]; then
            ok "Ksmbd 由 usb-service 按需管理（插 U 盘才起，不占开机时间）"
          else
            ls /etc/rc.d/S*ksmbd >/dev/null 2>&1 && ok "Ksmbd 开机自启" || warn "Ksmbd 未设自启且没有 usb-service（/etc/init.d/ksmbd enable）"
          fi
          if [ -x /usr/bin/usb-service ]; then
            ok "p910nd 由 usb-service 按需管理（插打印机才起）"
          else
            ls /etc/rc.d/S*p910nd >/dev/null 2>&1 && ok "p910nd 开机自启" || warn "p910nd 未设自启且没有 usb-service（/etc/init.d/p910nd enable）"
          fi
          [ -x /usr/bin/memguard ] && ok "内存看门狗 memguard 已装（每 10 分钟）" || warn "memguard 缺失"
          _cn2=$(grep -c "" /etc/crontabs/root 2>/dev/null)
          [ -n "$_cn2" ] || _cn2=0
          if [ "$_cn2" -ge 4 ]; then
            ok "crontab $_cn2 条（清缓存 / memguard / MosDNS 守护 / 日志截断）"
          else
            warn "crontab 只有 $_cn2 条，必要维护任务可能没装上"
          fi
          if grep -qE "rule_update|subscribe\.lua" /etc/crontabs/root 2>/dev/null; then
            warn "crontab 里有联网更新任务（本固件设计为全本地、不自动联网），确认是你要的"
          else
            ok "没有任何自动联网任务（规则与订阅都要手动触发）"
          fi

          # ---------- 6. 无线 ----------
          sec "6. 无线"
          # 中继口（mode=sta）单独看链路质量：AP 还在发信标 != 上游连得上
          _sta=0
          for _v in $(uci -q show wireless 2>/dev/null | sed -n 's/^wireless\.\([^.]*\)=wifi-iface$/\1/p'); do
            [ "$(uci -q get wireless.$_v.mode)" = "sta" ] || continue
            _sta=1
            _sn=$(uci -q get wireless.$_v.ssid)
            _net=$(uci -q get wireless.$_v.network)
            _sif=$(for _x in $(iw dev 2>/dev/null | awk '$1=="Interface"{print $2}'); do
                     _t=$(iw dev "$_x" info 2>/dev/null | sed -n 's/.*type //p' | head -n 1)
                     [ "$_t" = "managed" ] && { echo "$_x"; break; }
                   done)
            if [ -z "$_sif" ]; then
              warn "中继接口没起来（ssid=${_sn:-?}）：ifdown ${_net:-wwan}; ifup ${_net:-wwan} 后看 logread -e wpa_supplicant"
              continue
            fi
            _sig=$(iw dev "$_sif" link 2>/dev/null | sed -n 's/.*signal: *\(-*[0-9][0-9]*\) dBm.*/\1/p' | head -n 1)
            _rate=$(iw dev "$_sif" link 2>/dev/null | sed -n 's/.*bitrate: *\([0-9.]*\) *MBit\/s.*/\1/p' | head -n 1)
            _ch=$(iw dev "$_sif" link 2>/dev/null | sed -n 's/.*channel: *\([0-9][0-9]*\).*/\1/p' | head -n 1)
            [ -n "$_rate" ] && _rate=" / ${_rate} Mbit/s"
            [ -n "$_ch" ] && _rate="$_rate / 信道 ${_ch}"
            if [ -z "$_sig" ]; then
              warn "中继 $_sif 未连上上游（ssid=${_sn:-?}）"
            elif [ "$_sig" -ge -67 ]; then
              ok "中继 $_sif → ${_sn:-?}  ${_sig} dBm${_rate}"
            elif [ "$_sig" -ge -72 ]; then
              warn "中继 $_sif → ${_sn:-?}  ${_sig} dBm 偏弱：把上游 AP 挪近，或让上游 5G 改到 149-165（法规多给 10dB）"
              printf '      注意：在 STA（中继）侧改 htmode 降宽无效，mt76 会跟随上游宽度（见 wifi-doctor 第 5 节）\n'
            else
              warn "中继 $_sif → ${_sn:-?}  ${_sig} dBm 太弱：先调位置/朝向"
            fi
            # DFS 信道：雷达检测会让整段 5G 静默 60 秒，中继连带全断。
            # 这不是固件能绕过去的（法规要求），只能让上游把信道钉到 149-165。
            case "$_ch" in
              52|56|60|64|100|104|108|112|116|120|124|128|132|136|140|144)
                warn "上游 5G 在 DFS 信道 ${_ch}：遇到雷达/军警设备会静默 60s，中继整段断（让上游改 149-165）" ;;
            esac
          done
          if [ "$_sta" = "1" ]; then
            # 两层判读：配置位 vs 实际生效。2026-11-15 现场出现过 uci=1 但
            # nft 里既没有 flowtable 也没有 "flow offload" 规则（内核没编 NF_FLOW_TABLE 支持），
            # 那种"开着但不生效"不该报故障，只提示清理配置以免误导排查。
            _fo_cfg=$(uci -q get firewall.@defaults[0].flow_offloading)
            _fo_nft=$(nft list ruleset 2>/dev/null | grep -c 'flow offload')
            _fo_tbl=$(nft list flowtable inet fw4 2>/dev/null | grep -c 'flowtable')
            if [ "$_fo_cfg" = "1" ] && [ "$(( ${_fo_nft:-0} + ${_fo_tbl:-0} ))" -gt 0 ]; then
              warn "flow offload 真的在跑：中继场景建议关（uci set firewall.@defaults[0].flow_offloading=0 后 /etc/init.d/firewall restart）"
            elif [ "$_fo_cfg" = "1" ]; then
              ok "flow offload 配置位=1 但内核没有 flowtable（实际不生效，可以不管）"
            else
              ok "flow offload 已关（中继场景下，桥接无线少一层 offload 路径）"
            fi
            if [ -x /usr/bin/relay-tune ]; then
              ok "中继收敛器 relay-tune 在（开机先起 AP，再等中继，日志 /var/log/relay-tune.log）"
            else
              warn "relay-tune 缺失：开机会先等中继关联，2.4G SSID 出得慢"
            fi
          fi
          [ "$_sta" = "1" ] || ok "没配无线中继（5G 是本地 AP）"
          for _r in radio0 radio1; do
            uci -q get wireless.$_r >/dev/null 2>&1 || continue
            _dis=$(uci -q get wireless.$_r.disabled)
            _cc=$(uci -q get wireless.$_r.country)
            _ch=$(uci -q get wireless.$_r.channel)
            _hm=$(uci -q get wireless.$_r.htmode)
            _ns=$(uci -q get wireless.$_r.noscan)
            if [ "$_dis" = "1" ]; then
              warn "$_r 被禁用"
              continue
            fi
            if [ "$_cc" = "CN" ]; then
              printf "  ✅ %-7s 法规域 CN · 信道 %s · %s%s\n" "$_r" "${_ch:-auto}" "${_hm:-HT20}" "$([ "$_ns" = "1" ] && echo " · noscan")"
            else
              warn "$_r 法规域是 ${_cc:-未设}（不是 CN）：功率被压、5G 部分信道不可用"
            fi
          done
          _bad_ack=0
          for _i in $(uci -q show wireless 2>/dev/null | sed -n 's/^\(wireless\.[^.]*\)\.disassoc_low_ack=.*/\1/p'); do
            [ "$(uci -q get $_i.disassoc_low_ack)" = "0" ] || _bad_ack=$((_bad_ack+1))
          done
          [ "$_bad_ack" -eq 0 ] && ok "全部无线接口 disassoc_low_ack=0（弱信号不轻易踢）" || warn "$_bad_ack 个无线接口还开着 disassoc_low_ack（弱处容易掉线）"
          wifi status >/dev/null 2>&1 && ok "无线已启动（细节跑 wifi-doctor）" || warn "无线没起来：wifi up 后看 logread -e hostapd"
          _hw=$(dmesg 2>/dev/null | grep -ciE 'hardware restart|firmware crash' | tr -d ' ')
          [ -n "$_hw" ] || _hw=0
          if [ "$_hw" -eq 0 ]; then
            ok "内核暂无 mt76 硬件重启 / 固件崩溃"
          else
            warn "内核已出现 $_hw 次 mt76 硬件重启 / 固件崩溃（看 wifi-doctor 第 6 节）"
          fi
          [ -x /usr/bin/wifi-watchdog ] && ok "无线看门狗在（每 2 分钟，AP 只重启本 radio / 中继先只重连接口）" || warn "wifi-watchdog 缺失"

          # ---------- 7. 结论 ----------
          sec "7. 结论"
          printf "  ✅ %s 项   ⚠️  %s 项   ❌ %s 项\n" "$OK" "$WARN" "$BAD"
          if [ "$BAD" -gt 0 ]; then
            echo "  有 ❌：DNS 全挂先跑 dns-recover；其余按上面每条的提示走，细节看 fw-selftest"
          elif [ "$WARN" -gt 0 ]; then
            echo "  没有 ❌，⚠️ 只是隐患不是故障；逐条处理即可（没加节点导致的 ⚠️ 属正常出厂状态）"
          else
            echo "  全绿：DNS / 去广告 / 代理 / 共享 / USB 打印 / 内存守护 / 无线都在位"
          fi
          echo
          echo "  相关命令：fw-selftest（逐项细节）  wifi-doctor（无线）  dns-recover（DNS 兜底）"
          echo "            rule-refresh（手动刷分流名单）  /etc/init.d/singbox-lite restart"
          [ "$BAD" -eq 0 ] || exit 1
          exit 0
          QUICKCHECK

          # ---------- I2. 无线诊断（刷机后 SSH 执行 wifi-doctor）----------
          # 这类小机器上“信号弱 / 时有时无”最常见的原因不是硬件，而是：信道被邻居占满、
          # 法规域把功率压低、内存被吃光（OOM 杀 hostapd）、驱动/firmware 报错。
          # 这个脚本只读，不碰任何配置，把判断依据一次全打印出来。
          cat > files/usr/bin/wifi-doctor << 'EOF'
          #!/bin/sh
          # wifi-doctor：判断“信号弱 / 时有时无”到底是信道拥挤、法规限功率、内存被吃光，
          # 还是驱动报错。只读脚本，不改任何配置。用法：SSH 登录后执行  wifi-doctor

          command -v iw >/dev/null 2>&1 || { echo '缺少 iw（apk add iw 后重试）'; exit 1; }
          printf '\n===== Newifi-D2 无线诊断 =====\n\n'

          echo '--- 1. 法规域（决定允许的最大发射功率）---'
          if iw reg get 2>/dev/null | grep -q 'country 00'; then
              echo '  ✗ country 00：法规域没设置，驱动会把功率压到最低档'
          else
              iw reg get 2>/dev/null | sed -n '1,4p' | sed 's/^/  /'
          fi

          IFACES=$(iw dev 2>/dev/null | awk '$1=="Interface"{print $2}')

          echo
          echo '--- 2. 网卡 / 信道 / 带宽 / 发射功率 ---'
          if [ -z "$IFACES" ]; then
              echo '  ✗ 没有无线接口：无线被禁用或驱动没加载（看第 5 节 dmesg）'
          else
              for d in $IFACES; do
                  iw dev "$d" info 2>/dev/null | awk -v D="$d" '
                      /ssid/ { s=$2 }
                      /channel/ { c=$2; for (i=1;i<=NF;i++) if ($i ~ /^width:/) w=$(i+1) }
                      /txpower/ { p=$2 }
                      END {
                          if (!p) p="驱动未上报"; else p=p" dBm"
                          printf "  %-6s ssid=%-18s 信道=%-4s 宽=%s 功率=%s\n", D, (s?s:"未启用/未关联"), (c?c:"?"), (w?w"MHz":"?"), p
                          if (p+0 > 0 && p+0 < 15) print "        ✗ 功率低于 15dBm，属于被法规/驱动压过"
                      }'
              done
          fi

          echo
          echo '  生效功率（iwinfo txpowerlist 里带 * 的那一档才是真的）：'
          for d in $IFACES; do
              _tp=$(iwinfo "$d" txpowerlist 2>/dev/null | sed -n 's/^[*] *\([0-9][0-9]*\) dBm.*/\1/p' | head -n 1)
              # 有些驱动（本机中继 STA 口实测）txpowerlist 一个 * 都不打，下面就会误报"读不到"。
              # 这时退回 iw 报的当前值（iw dev info 里的 txpower 是单值，可靠）。
              [ -n "$_tp" ] || _tp=$(iw dev "$d" info 2>/dev/null | sed -n 's/.*txpower *\([0-9][0-9.]*\) *dBm.*/\1/p' | head -n 1 | cut -d. -f1)
              if [ -z "$_tp" ]; then
                  echo "    $d  读不到（接口未启用或 iwinfo 不支持）"
              else
                  echo "    $d  ${_tp} dBm"
                  if [ "$_tp" -ge 27 ]; then
                      echo '        ⚠️ 法规上限直接喂到前端：MT7603E/MT76x2 这类芯片按 30dBm 输出会过驱动'
                      echo '           （EVM 变差、发热、偶发不稳）。建议 uci set wireless.radio0.txpower=20 后 wifi reload'
                  fi
              fi
          done
          echo '  法规域（第三个数字是该频段的 max EIRP）：'
          iw reg get 2>/dev/null | grep -m 1 '2400' | sed 's/^/    /'

          echo '--- 3. 信道占用率（按频点累计，* = 当前信道；>60% 才真挤）---'
          #   mt76 的 survey 是“按频点累计”的：待在某个信道上的时间会一直累加，切走以后
          #   那一行的 active 时间不再增长但也不会消失。于是这里能一次列出机器待过的所有信道，
          #   直接横向比较 1/6/11；旧的“只认当前信道”反而把有用的历史丢掉了。
          for d in $IFACES; do
              _fr=$(iw dev "$d" info 2>/dev/null | sed -n 's/.*channel [0-9][0-9]* (\([0-9][0-9]*\) MHz).*/\1/p' | head -n 1)
              iw dev "$d" survey dump 2>/dev/null | awk -v D="$d" -v F="$_fr" '
                  /frequency:/ { f=$2 }
                  /channel active time:/ { a[f]=$4 }
                  /channel busy time:/ { b[f]=$4 }
                  END {
                      for (k in a) if (a[k] >= 60000) {
                          p = int(b[k]*100/a[k])
                          mark = (k == F) ? "*" : " "
                          printf "%d\t  %s %s %s MHz 占用 %d%%  (累计停留 %d 秒)\n", k, D, mark, k, p, int(a[k]/1000)
                      }
                  }' | sort -n | cut -f2-
          done
          echo '  * 是当前信道；只有一行说明这台机器还没在其他信道待够 1 分钟。'

          echo
          echo '--- 4. 已连客户端信号（低于 -70dBm 就是弱，-80 以下基本不可用）---'
          for d in $IFACES; do
              iw dev "$d" station dump 2>/dev/null | awk -v D="$d" '
                  /^Station/ { m=$2 }
                  /signal:/ { printf "  %s %s %s dBm\n", D, m, $2 }'
          done

          echo
          echo
          echo '--- 5. 5G 中继链路（Mode: Client 的接口才是中继；-67 以上算好，-72 以下不稳）---'
          _saw5=0
          for d in $IFACES; do
              _md=$(iwinfo "$d" info 2>/dev/null | sed -n 's/^ *Mode: *//p' | head -n 1)
              case "$_md" in
                  *Client*) ;;
                  *) continue ;;
              esac
              _saw5=1
              echo "  $d"
              iw dev "$d" link 2>/dev/null | grep -E 'SSID:|freq:|signal:|bitrate:' | sed 's/^[[:space:]]*/    /'
              _sig=$(iw dev "$d" link 2>/dev/null | sed -n 's/.*signal: *\(-*[0-9][0-9]*\) dBm.*/\1/p' | head -n 1)
              _wth=$(iwinfo "$d" info 2>/dev/null | sed -n 's/.*HT Mode: *//p' | head -n 1)
              [ -n "$_wth" ] && echo "    带宽模式：$_wth"
              # 上游 5G 落在 DFS 信道时，雷达检测会让整段静默 60 秒，中继必然全断。
              # 这不是本机能绕过的（法规要求），只能让上游把信道钉到 149-165。
              _fq=$(iw dev "$d" link 2>/dev/null | sed -n 's/.*freq: *\([0-9][0-9]*\).*/\1/p' | head -n 1)
              if [ -n "$_fq" ]; then
                  _chh=$(( (_fq - 5000) / 5 ))
                  case "$_chh" in
                      52|56|60|64|100|104|108|112|116|120|124|128|132|136|140|144)
                          echo "    ⚠️ 上游 5G 在 DFS 信道 ${_chh}：遇到雷达/军警设备会静默 60s，中继整段断"
                          echo "       （只能在上游路由器把 5G 钉到 149-165）" ;;
                  esac
              fi
              if [ -z "$_sig" ]; then
                  echo '    ⚠️ 读不到信号强度：可能刚断开，或驱动没上报'
              elif [ "$_sig" -ge -67 ]; then
                  echo '    ✅ 链路够好，VHT80 的每子载波 SNR 撑得住'
              elif [ "$_sig" -ge -72 ]; then
                  echo '    ⚠️ 链路偏弱：先把上游 AP 挪近/改到 149-165（法规多给 10dB）；'
                  echo '       ⚠️ 注意：在 STA（中继）侧改 htmode 降宽**没用**，mt76 会跟随上游 AP 的宽度（实测见第 8 节）'
              else
                  echo '    ❌ 链路太弱（-72 以下）：先调中继位置/朝向；真要降宽得上游 AP 改宽度，'
                  echo '       本机改 wireless.radioX.htmode 不会缩小 STA 侧的信道宽度'
              fi
          done
          [ "$_saw5" = "1" ] || echo '  （没有 Client 模式的接口：这台机器没在做无线中继）'
          echo
          echo '--- 6. 内存 / 驱动 ---'
          if [ -r /proc/meminfo ]; then
              awk '/MemTotal/{t=int($2/1024)} /MemAvailable/{a=int($2/1024)} END{printf "  可用内存：%d MB / %d MB\n", a, t}' /proc/meminfo
          else
              echo '  读不到 /proc/meminfo'
          fi
          OOM=$(dmesg 2>/dev/null | grep -ciE "out of memory|killed process")
          if [ "${OOM:-0}" -gt 0 ]; then
              echo "  ✗ 内核出现过 ${OOM} 次 OOM：内存被吃光时 mt76/hostapd 会被杀，无线会凭空消失几秒"
          fi
          dmesg 2>/dev/null | grep -iE 'mt76|ieee80211|hostapd|firmware' | tail -n 10 | sed 's/^/  /'

          echo
          echo
          echo '--- 7. mt76 驱动稳定性（“信号忽高忽低”的头号嫌疑）---'
          _hw=$(dmesg 2>/dev/null | grep -ciE 'hardware restart|firmware crash|mcu message' | tr -d ' ')
          [ -n "$_hw" ] || _hw=0
          if [ "$_hw" -eq 0 ]; then
              echo '  ✅ 本次开机内没有 mt76 硬件重启 / 固件崩溃'
          else
              echo "  ✗ 本次开机内出现 ${_hw} 次 mt76 硬件重启 / 固件崩溃："
              echo '    这是 mt76 的已知问题（大流量、弱信号时最容易被触发），'
              echo '    现象就是信号忽高忽低、SSID 时有时无、客户端显示连着却没流量。'
              dmesg 2>/dev/null | grep -iE 'hardware restart|firmware crash|mcu message' | tail -n 3 | sed 's/^/     /'
          fi
          for d in $IFACES; do
              # 这里必须用 iw 的单值：iwinfo <dev> txpower 打印的是整张功率档位表（27 行），
              # 直接 echo 出去会把第 7 节淹掉（本机实测踩过：输出里冒出 0~30 dBm 全表）。
              _tp=$(iw dev "$d" info 2>/dev/null | sed -n 's/.*txpower *\([0-9][0-9.]*\) *dBm.*/\1/p' | head -n 1)
              [ -n "$_tp" ] && echo "  ${d} 当前发射功率：${_tp} dBm"
              _phy=$(cat "/sys/class/net/$d/phy80211/name" 2>/dev/null)
              if [ -n "$_phy" ] && [ -r "/sys/kernel/debug/ieee80211/$_phy/mt76/rate_txpower" ]; then
                  echo "  ${d}(${_phy}) 每速率发射功率（全是 0 = EEPROM 里没有有效功率校准）："
                  head -n 6 "/sys/kernel/debug/ieee80211/$_phy/mt76/rate_txpower" 2>/dev/null | sed 's/^/     /'
              fi
          done
          echo '--- 8. 怎么办 ---'
          echo '  信号虚高但慢 → 第 2 节「生效功率」≥27 dBm 就是过驱动（法规 30 dBm 顶格吃满），2.4G 降到 20：'
          echo '                uci set wireless.radio0.txpower=20；uci commit wireless；wifi reload'
          echo '  功率低      → wireless.radio0/1.country 必须是 CN（第 1 节看法规域）'
          echo '  信道挤      → 第 3 节占用率 >60% 才真挤；1/6/11 里挑最低的：uci set wireless.radio0.channel=1（或 6/11）；wifi reload'
          echo '  弱处掉线    → uci set wireless.default_radio0.disassoc_low_ack=0；wifi reload'
          echo '  覆盖不够    → 加天线/挪位置；上游 AP 的 5G 换到 149-165（国内 5.8G 的 EIRP 上限比 5.2G 高 10 dB）'
          echo '  内存不足    → 少装插件，或把屏蔽列表从 22.7 万条降到 10 万条后重新构建（K 节改源）'
          echo '  驱动崩过    → 看 /var/log/wifi-watchdog.log（几点自动 wifi up/reload 的时间线）；'
          echo '                注意：STA（中继）侧改 htmode 降宽没用，mt76 会跟随上游 AP 的宽度（实测见 README）'
          echo '  中继一断全断 → 中继抖动时别用 wifi reload（它会把 2.4G AP 一起拆掉）。只重连中继接口：'
          echo '                ifdown wwan; ifup wwan     —— 或直接等 wifi-watchdog（每 2 分钟，先 ifup 再 reconf）'
          echo '  2.4G 不稳   → MT7603E 出厂 EEPROM 的功率校准偏差大（刷机改不了它），先换 1 或 11 试；'
          echo '                仍不行只能刷改过的 EEPROM（会动 MAC/校准区，有变砖风险，不建议随手做）'
          echo '  无线时断/连不上 → 中继场景先确认 flow offload 已关（第 7 节）：'
          echo '                uci set firewall.@defaults[0].flow_offloading=0'
          echo '                uci commit firewall; /etc/init.d/firewall restart'
          echo '  开机很久才有网 → cat /var/log/relay-tune.log（能看到"AP 第几秒就绪、中继第几秒连上"）'
          echo
          exit 0
          EOF

          # ---------- I3. 无线看门狗（mt76 崩溃后自动恢复，不改任何配置）----------
          cat > files/usr/bin/dns-watchdog << 'EOF'
          #!/bin/sh
          # dns-watchdog：mosdns 是全网 DNS 的唯一上游，这里专门盯它。
          #   · 进程活着但卡死（真实事故 2026-11-23：5335 不应答 → 全网 DNS 超时）
          #   · 进程没了 / 彻底起不来（配置坏了、被误停）
          #
          # 处理顺序（尽量把"局域网没有 DNS"的窗口压到最小）：
          #   L0 探针用**随机子域名**，穿透 dnsmasq 缓存，否则 mosdns 死了也看不出来
          #   L1 进程不在 → 一击就重启（不用等第二次探测）；进程在但不应答 → 连续 2 次再重启
          #   L2 mosdns 进程在、但解析仍失败 → 重启 dnsmasq
          #      （mosdns 根本没起来时跳过这步：重启 dnsmasq 救不了它）
          #   L3 仍然不行 → 先确认 WAN 通，才把 dnsmasq 临时指向公网明文 DNS（保住能上网）；
          #      WAN 自身不通就别来回改上游，只记日志。之后每 10 分钟试一次切回 MosDNS。
          #
          # 关于"兜底期间没有去广告"：这是硬件层面的取舍 —— 广告清单 22.8 万条，
          # 换成 dnsmasq 的 address=/hosts 规则要 ~5MB 配置和 20MB 内存，且每次重启都要解析，
          # 在 MT7621 上不可接受。所以兜底只保证"能解析、能上网"，并靠 10 分钟回切尽快结束。
          #
          # 用法：dns-watchdog（静默，给 cron 用）   dns-watchdog status（看状态）
          #       WAN_PROBE=192.0.2.1 dns-watchdog  （用于自测/WAN 不可达场景）
          F=/tmp/dns-watchdog.fail
          FB=/tmp/dns-fallback.on
          LOG=/var/log/dns-watchdog.log
          PROBE_BASE=${DNS_WATCHDOG_PROBE:-baidu.com}
          PUBLIC_DNS="223.5.5.5 119.29.29.29"
          WAN_PROBE=${WAN_PROBE:-"223.5.5.5 119.29.29.29"}

          probe_name() { printf 'p%s%d.%s' "$(date +%s)" "$$" "$PROBE_BASE"; }

          # 「上游活着」= 有应答；随机子域名必然是 NXDOMAIN，这也算有应答
          q() {
              _o=$(nslookup "$(probe_name)" 127.0.0.1 2>&1)
              case "$_o" in
                  *"can't find"*|*NXDOMAIN*) return 0 ;;
                  *"Address: "[0-9]*)        return 0 ;;
                  *)                         return 1 ;;
              esac
          }

          # WAN 是否真的通（默认路由 + 网关 ping + 公网 IP ping，全程不依赖 DNS）
          wan_up() {
              _gw=$(ip route 2>/dev/null | awk '/^default/{print $3; exit}')
              [ -n "$_gw" ] || return 1
              ping -c1 -W2 "$_gw" >/dev/null 2>&1 || return 1
              for _wp in $WAN_PROBE; do
                  ping -c1 -W3 "$_wp" >/dev/null 2>&1 && return 0
              done
              return 1
          }

          set_upstream() {
              uci -q delete dhcp.@dnsmasq[0].server
              for _u in "$@"; do
                  uci -q add_list dhcp.@dnsmasq[0].server="$_u"
              done
              uci -q set dhcp.@dnsmasq[0].noresolv="1"
              uci -q commit dhcp
              /etc/init.d/dnsmasq restart >/dev/null 2>&1
          }

          if [ "${1:-}" = status ]; then
              echo "探针域名   : p<epoch><pid>.$PROBE_BASE（随机，穿透缓存）"
              echo "失败计数   : $(cat "$F" 2>/dev/null || echo 0)"
              echo "兜底模式   : $([ -f "$FB" ] && echo "开（dnsmasq 走公网明文 DNS，去广告失效）" || echo 关)"
              echo "dnsmasq上游: $(uci -q get dhcp.@dnsmasq[0].server 2>/dev/null)"
              echo "mosdns     : $(pidof mosdns 2>/dev/null || echo 未运行)"
              echo "dnsmasq    : $(pidof dnsmasq 2>/dev/null | tr '\n' ' ')"
              echo "WAN        : $(wan_up && echo 通 || echo 不通)"
              q && echo "解析测试   : OK" || echo "解析测试   : 失败"
              echo "--- 最近日志 ---"
              tail -n 12 "$LOG" 2>/dev/null || echo "(还没有日志)"
              exit 0
          fi

          # 单实例锁：cron 每分钟一次，撞车会互相翻 dnsmasq 上游（实测抖过）
          LOCK=/tmp/dns-watchdog.lock
          if ! mkdir "$LOCK" 2>/dev/null; then
              _lp=$(cat "$LOCK/pid" 2>/dev/null)
              if [ -n "$_lp" ] && kill -0 "$_lp" 2>/dev/null; then
                  exit 0
              fi
              rm -rf "$LOCK"
              mkdir "$LOCK" 2>/dev/null || exit 0
          fi
          echo $$ > "$LOCK/pid" 2>/dev/null
          trap 'rm -rf "$LOCK"' EXIT INT TERM

          # ---------- 兜底模式维护 ----------
          if [ -f "$FB" ]; then
              # 用户显式停用了 mosdns：别跟人较劲，只保证 dnsmasq 有可用上游
              if ! /etc/init.d/mosdns enabled >/dev/null 2>&1; then
                  q || set_upstream $PUBLIC_DNS
                  exit 0
              fi
              # 限频：每 10 分钟才尝试切回一次，否则每分钟重启一遍会拖垮路由器
              _t0=$(cat "$FB" 2>/dev/null)
              case "$_t0" in ''|*[!0-9]*) _t0=0 ;; esac
              _now=$(date +%s 2>/dev/null || echo 0)
              if [ "$_t0" -gt 0 ] && [ $(( _now - _t0 )) -lt 600 ]; then
                  q || set_upstream $PUBLIC_DNS
                  exit 0
              fi
              pidof mosdns >/dev/null 2>&1 || /etc/init.d/mosdns start >/dev/null 2>&1
              sleep 3
              set_upstream "127.0.0.1#5335"
              sleep 3
              if q; then
                  rm -f "$FB" "$F"
                  echo "$(date '+%F %T') mosdns 已恢复 → DNS 切回 MosDNS（兜底期间的明文上游已撤销）" >> "$LOG"
                  logger -t dns-watchdog "mosdns 已恢复，DNS 切回 MosDNS"
                  exit 0
              fi
              set_upstream $PUBLIC_DNS
              date +%s > "$FB" 2>/dev/null
              exit 0
          fi

          # ---------- 正常模式 ----------
          q && { rm -f "$F"; exit 0; }

          _miss=0
          pidof mosdns >/dev/null 2>&1 || _miss=1

          _n=$(cat "$F" 2>/dev/null)
          case "$_n" in ''|*[!0-9]*) _n=0 ;; esac
          _n=$((_n + 1))
          echo "$_n" > "$F"

          # 进程都不在了：不用等第二次探测，直接救
          if [ "$_n" -lt 2 ] && [ "$_miss" = "0" ]; then
              exit 0
          fi

          if [ "$_miss" = "1" ]; then _mst="未运行"; else _mst="在跑"; fi
          logger -t dns-watchdog "DNS 解析失败（第 $_n 次，mosdns $_mst），重启 mosdns"
          echo "$(date '+%F %T') 第 $_n 次失败（mosdns $_mst）→ 重启 mosdns" >> "$LOG"
          /etc/init.d/mosdns restart >/dev/null 2>&1

          _w=0
          while [ "$_w" -lt 10 ]; do
              sleep 1
              q && break
              _w=$((_w + 1))
          done
          if q; then
              echo "$(date '+%F %T') mosdns 重启后恢复（用时 ${_w}s）" >> "$LOG"
              rm -f "$F"
              exit 0
          fi

          if pidof mosdns >/dev/null 2>&1; then
              # 进程在但不应答 → 可能是 dnsmasq 侧的问题，重启它试试
              logger -t dns-watchdog "mosdns 重启无效，继续重启 dnsmasq"
              echo "$(date '+%F %T') mosdns 重启无效 → 重启 dnsmasq" >> "$LOG"
              /etc/init.d/dnsmasq restart >/dev/null 2>&1
              sleep 4
              if q; then
                  echo "$(date '+%F %T') dnsmasq 重启后恢复" >> "$LOG"
                  rm -f "$F"
                  exit 0
              fi
          else
              # 根本起不来 → 重启 dnsmasq 无意义，直接进 L3
              echo "$(date '+%F %T') mosdns 起不来 → 跳过重开 dnsmasq，直接兜底" >> "$LOG"
          fi

          # L3：先确认 WAN 通，才动 DNS 配置；WAN 都不通就别来回改上游
          if ! wan_up; then
              logger -t dns-watchdog "WAN 不通，暂不改 DNS 配置（避免来回切上游）"
              echo "$(date '+%F %T') WAN 不通 → 保持现状，不改 dnsmasq 上游" >> "$LOG"
              exit 0
          fi

          logger -t dns-watchdog "mosdns 无法恢复，临时改用公网明文 DNS（去广告暂失效）"
          echo "$(date '+%F %T') 进入兜底模式（公网明文 DNS；去广告暂失效）" >> "$LOG"
          set_upstream $PUBLIC_DNS
          sleep 3
          if q; then
              date +%s > "$FB" 2>/dev/null
              echo "$(date '+%F %T') 兜底成功：DNS 可用（每 10 分钟尝试切回 MosDNS）" >> "$LOG"
          else
              echo "$(date '+%F %T') 兜底也失败：WAN 通但公网 DNS 不可用，请检查上游/光猫" >> "$LOG"
              logger -t dns-watchdog "兜底也失败：公网 DNS 不可用"
              rm -f "$FB"
          fi
          exit 0
          EOF

          cat > files/usr/bin/wifi-watchdog << 'EOF'
          #!/bin/sh
          # wifi-watchdog：mt76 在 6.6/6.12 内核上都会偶发 Hardware restart was requested / 固件崩溃，
          # 表现就是 2.4G 信号忽高忽低、SSID 时有时无、手机还显示连着但上不了网。
          # 本脚本只做恢复与记录，绝不改配置、绝不重启整机：
          #   1) 每 2 分钟确认 AP 接口还在发信标（iwinfo 能报出 ESSID）
          #   2) AP 掉两轮 -> 只重启它所在的 radio（wifi down/up radioX），不再全量
          #   3) 中继断了 -> 先只重连中继接口（ifdown/ifup wwan），再 reconf 中继那个 radio，
          #      第 4 次才全量 wifi reload —— 全量重建会把 2.4G AP 一起拆掉，这是最后手段
          #   4) 每小时最多恢复 5 次，超过只记日志（防止抖动把无线反复重启）
          #   5) 内核新增无线驱动报错时记一行，方便把“几点开始变差”对上时间线
          # 为什么按 radio 做：中继抖动时若用 wifi up / wifi reload（都是全量的），
          # 2.4G AP 会在同一秒被拆掉重建 —— 手机当场搜不到 SSID，重连还要等 DHCP，
          # 表现就是"5G 中继一抖，2.4G 跟着断好几分钟"。
          # 用法：wifi-watchdog（静默，给 cron 用）  wifi-watchdog status（看当前状态）

          LOG=/var/log/wifi-watchdog.log
          TMP=/tmp
          HW_FILE=$TMP/wifi-watchdog.hw
          CNT_FILE=$TMP/wifi-watchdog.cnt
          MAXH=5

          log() {
              printf '%s %s\n' "$(date '+%Y-%m-%d %H:%M:%S')" "$*" >> "$LOG"
              _sz=$(wc -c < "$LOG" 2>/dev/null | tr -d " ")
              [ -n "$_sz" ] || _sz=0
              if [ "$_sz" -gt 65536 ]; then
                  tail -n 200 "$LOG" > "$LOG.tmp" 2>/dev/null && mv "$LOG.tmp" "$LOG"
              fi
          }

          # 驱动报错计数：mt76 崩溃一定会在这里留痕
          hw_count() {
              dmesg 2>/dev/null | grep -ciE 'hardware restart|firmware crash|mcu message' | tr -d ' '
          }

          # 接口/radio 查询（同名函数在 relay-tune 里，但这个脚本是独立进程，必须自带）
          live_ifaces() { iw dev 2>/dev/null | awk '$1=="Interface"{print $2}'; }
          iface_type() { iw dev "$1" info 2>/dev/null | sed -n 's/.*type //p' | head -n 1; }

          # ---- 判活：三通道，任一成立即算"在发信标" ----
          # 血泪教训（2026-11-14 现场）：旧写法是 grep -q 'ESSID: "."'，
          # 那个模式只匹配「引号里恰好一个字符」的 ESSID —— SSID 叫 alon（4 个字符）时
          # 永远匹配不上，于是 watchdog 每 6 分钟把正常的 AP 判成掉线、执行 wifi up，
          # 而 wifi up 是全量的：2.4G 的 AP 与 5G 的中继一起被拆了重建。
          # 现场证据：hostapd 进程 8 小时没重启过、iwinfo 连续 20 次都能读到
          # ESSID: "alon"，但日志里 44 次 "第 N 次恢复：wifi up"，每 6 分钟一次。
          # 正确模式是 'ESSID: "'（引号后还有内容），而 ESSID: unknown 判死（对）。
          # 再加两条兜底通道，避免单点误判：任一为真就不许动无线。
          alive() {
              _i="$1"
              if command -v iwinfo >/dev/null 2>&1; then
                  iwinfo "$_i" info 2>/dev/null | grep -q 'ESSID: "' && return 0
              fi
              if command -v iw >/dev/null 2>&1; then
                  iw dev "$_i" info 2>/dev/null | grep -q '^[[:space:]]*ssid ' && return 0
              fi
              # 接口只在 hostapd 持有时才存在：存在且 operstate 正常也算活
              [ -d "/sys/class/net/$_i" ] || return 1
              case "$(cat "/sys/class/net/$_i/operstate" 2>/dev/null)" in
                  up|dormant|unknown) return 0 ;;
              esac
              return 1
          }

          # 中继（STA）是否真的连上：iw 的 link 里没有 Connected to 就是断了
          sta_link() {
              iw dev "$1" link 2>/dev/null | grep -q 'Connected to'
          }

          # ---- 接口 → radio 段名 ----
          # 恢复动作必须落到「那一个 radio」上。wifi up / wifi reload 都是全量的：
          # 5G 中继抖一下、2.4G 的 AP 也一起被拆掉重建，手机当场就搜不到 SSID，
          # 重连 DHCP 再等一轮 —— 这是"中继模式下一断就是一片"的直接来源。
          # /sbin/wifi 支持带设备名：wifi down radioX / up radioX / reconf radioX
          # （内部就是 ubus call network.wireless down|up|reconf '{"device":"radioX"}'）。
          # 定位不到 radio 才退化到全量，并在日志里写明代价。
          radio_of_iface() {
              _if="$1"
              _hit=""
              for _r in $(uci -q show wireless 2>/dev/null | sed -n 's/^wireless\.\(radio[0-9][0-9]*\)=wifi-device$/\1/p'); do
                  _ifs=$(ubus call network.wireless status 2>/dev/null | jsonfilter -e "@.$_r.interfaces[*].ifname" 2>/dev/null)
                  case " $_ifs " in *" $_if "*) _hit="$_r" ;; esac
              done
              printf '%s' "$_hit"
          }

          # 这颗 radio 上有没有 managed（中继）接口。有就绝对不能 wifi down —— 会把上行一起拆掉，
          # 中继一断又触发 hotplug / 看门狗，mt76 在反复 down-up 里卡死时 procd 的硬件看门狗会复位整机。
          radio_has_sta() {
              _rhs_r="$1"
              [ -n "$_rhs_r" ] || return 1
              _rhs_ifs=$(ubus call network.wireless status 2>/dev/null | jsonfilter -e "@.$_rhs_r.interfaces[*].ifname" 2>/dev/null)
              for _rhs_x in $_rhs_ifs; do
                  [ "$(iw dev "$_rhs_x" info 2>/dev/null | sed -n "s/.*type //p" | head -n 1)" = "managed" ] && return 0
              done
              return 1
          }

          # AP 不发信标：只重启它所在的 radio（2.4G 掉就只动 2.4G，5G 中继不受影响）
          recover_ap() {
              if [ "$CN" -ge "$MAXH" ]; then
                  log "本小时已恢复 ${CN} 次，达到上限，本轮只记录不动作（AP $*）"
                  return 0
              fi
              CN=$((CN + 1))
              printf '%s %s\n' "$HOUR" "$CN" > "$CNT_FILE"
              _fallback=0
              for _if in "$@"; do
                  _r=$(radio_of_iface "$_if")
                  if [ -z "$_r" ]; then
                      _fallback=1
                      continue
                  fi
                  if radio_has_sta "$_r"; then
                      log "第 ${CN} 次恢复：$_if 不发信标，但 $_r 同时承载中继，不 down（避免拆掉上行），只补 wifi up"
                      /sbin/wifi up "$_r" >/dev/null 2>&1
                      continue
                  fi
                  log "第 ${CN} 次恢复：只重启 $_r（$_if 不发信标），其他 radio 不动"
                  /sbin/wifi down "$_r" >/dev/null 2>&1
                  sleep 2
                  /sbin/wifi up "$_r" >/dev/null 2>&1
              done
              if [ "$_fallback" -eq 1 ]; then
                  # 全量 wifi reload 会把中继一起拆掉；有中继时宁可只做 wifi up（幂等、不拆接口），
                  # 拆分用户的 AP 换一次"可能修好"，在这里不值得。
                  if [ -n "$(for _d in $(live_ifaces); do [ "$(iface_type "$_d")" = managed ] && echo x; done)" ]; then
                      log "定位不到 radio，且本机有中继：只做 wifi up（不做全量 reload，避免拆掉上行）"
                      /sbin/wifi up >/dev/null 2>&1
                  else
                      log "定位不到掉线接口所属 radio，退化到 wifi reload（整机无线重建）"
                      /sbin/wifi reload >/dev/null 2>&1
                  fi
              fi
          }

          # 刚开机那两分钟无线还没起完，别把它当故障。
          # 开机阶段的收敛交给 relay-tune（先拉 AP、再等中继，日志里有"第几秒连上"）；
          # 这里只让出 100 秒，避免开机时两边抢着动无线。
          UP=$(awk '{print int($1)}' /proc/uptime 2>/dev/null)
          if [ -z "$1" ] && [ -n "$UP" ] && [ "$UP" -lt 100 ]; then
              exit 0
          fi

          HOUR=$(date '+%Y%m%d%H')
          CN=0
          if [ -r "$CNT_FILE" ]; then
              read -r _h _c < "$CNT_FILE" 2>/dev/null
              [ "$_h" = "$HOUR" ] && CN=${_c:-0}
          fi

          # 按内核真实存在的接口枚举：uci 里的 section 名（default_radio0 / wwan）不是网卡名，
          # 网卡名是 phy0-ap0 / phy1-sta0 这种。原来的写法拿 section 名去 iwinfo，永远读不到，
          # 会把“正常”误判成“掉线”，每 6 分钟 wifi 重启一次。
          AP_IFS=""
          STA_IFS=""
          _IFLIST=$(iw dev 2>/dev/null | awk '$1=="Interface"{print $2}')
          if [ -z "$_IFLIST" ]; then
              _IFLIST=$(ls /sys/class/net 2>/dev/null | grep -E '^phy[0-9]+-(ap|sta)[0-9]+$')
          fi
          for _d in $_IFLIST; do
              _t=$(iw dev "$_d" info 2>/dev/null | sed -n 's/.*type //p' | head -n 1)
              [ -n "$_t" ] || case "$_d" in *-ap*) _t=AP ;; *-sta*) _t=managed ;; esac
              case "$_t" in
                  AP) AP_IFS="$AP_IFS $_d" ;;
                  managed) STA_IFS="$STA_IFS $_d" ;;
              esac
          done
          # 中继是否纳入监控：没有 iw 就没法判断“连没连上”，宁可不看也不误判
          command -v iw >/dev/null 2>&1 || STA_IFS=""

          DEAD_LIST=""
          for _if in $AP_IFS; do
              _f=$TMP/wifi-watchdog.fail.$_if
              if alive "$_if"; then
                  rm -f "$_f"
                  [ "$1" = "status" ] && printf '  ✅ %-9s 在发信标\n' "$_if"
                  continue
              fi
              _n=0
              [ -r "$_f" ] && _n=$(cat "$_f" 2>/dev/null)
              _n=$((_n + 1))
              printf '%s\n' "$_n" > "$_f"
              if [ "$_n" -lt 2 ]; then
                  log "$_if 探测不到信标（第 ${_n} 次），下一轮再确认"
                  [ "$1" = "status" ] && printf '  ⚠️  %-9s 探测不到信标（第 %s 次）\n' "$_if" "$_n"
                  continue
              fi
              DEAD_LIST="$DEAD_LIST $_if"
              [ "$1" = "status" ] && printf '  ❌ %-9s 已掉（连续 %s 次探测不到）\n' "$_if" "$_n"
          done

          if [ -n "$DEAD_LIST" ] && [ -z "$1" ]; then
              recover_ap $DEAD_LIST
              for _if in $DEAD_LIST; do rm -f "$TMP/wifi-watchdog.fail.$_if"; done
          fi

          # 中继口单独判：AP 还在发信标，不代表上游连得上。
          # 恢复顺序（代价从小到大，每级都能单独观察效果）：
          #   1-2 次：只重连中继接口（ifdown/ifup <net>）—— 完全不碰 AP
          #   3 次  ：reconf 中继所在的 radio（只重建 5G，2.4G AP 仍在发信标）
          #   4 次  ：全量 wifi reload（会把 2.4G AP 一起重建，日志里标明代价）
          #   5 次起：停手只记日志（等人工介入）
          # 两道保险，避免"没配上游"或"上游彻底关机"时没完没了地动无线：
          #   seen   —— 本次开机连上过上游才管；从没连上过说明是中继没配好，不该动它
          #   gaveup —— 连续 5 次都救不回来，就停手只记日志
          STA_NETS=""
          for _s in $(uci -q show wireless 2>/dev/null | sed -n 's/^wireless\.\([^.]*\)=wifi-iface$/\1/p'); do
              [ "$(uci -q get wireless.$_s.mode)" = "sta" ] || continue
              _n=$(uci -q get wireless.$_s.network)
              [ -n "$_n" ] && STA_NETS="$STA_NETS $_n"
          done
          SEEN=$TMP/wifi-watchdog.sta.seen
          GIVE=$TMP/wifi-watchdog.sta.gaveup
          TRIES=$TMP/wifi-watchdog.sta.tries
          STA_DEAD=""
          for _if in $STA_IFS; do
              _f=$TMP/wifi-watchdog.sta.$_if
              if sta_link "$_if"; then
                  rm -f "$_f" "$GIVE" "$TRIES"
                  : > "$SEEN"
                  [ "$1" = "status" ] && printf '  ✅ %-9s 中继已连上\n' "$_if"
                  continue
              fi
              _n=0
              [ -r "$_f" ] && _n=$(cat "$_f" 2>/dev/null)
              _n=$((_n + 1))
              printf '%s\n' "$_n" > "$_f"
              if [ "$_n" -lt 3 ]; then
                  [ "$1" = "status" ] && printf '  ⚠️  %-9s 中继未连上（第 %s 次）\n' "$_if" "$_n"
                  continue
              fi
              if [ ! -f "$SEEN" ]; then
                  [ "$1" = "status" ] && printf '  ⚠️  %-9s 中继从没连上过（没用起来？）\n' "$_if"
                  continue
              fi
              if [ -f "$GIVE" ]; then
                  log "中继 $_if 已连续 5 次救不回来，暂停自动恢复（等人工处理）"
                  [ "$1" = "status" ] && printf '  ❌ %-9s 已放弃自动恢复（救 5 次无效）\n' "$_if"
                  continue
              fi
              STA_DEAD="$STA_DEAD $_if"
              [ "$1" = "status" ] && printf '  ❌ %-9s 中继已断（连续 %s 次）\n' "$_if" "$_n"
          done

          if [ -n "$STA_DEAD" ] && [ -z "$1" ]; then
              if [ "$CN" -ge "$MAXH" ]; then
                  log "本小时已恢复 ${CN} 次，达到上限，中继断线只记录不动作（$STA_DEAD）"
              else
                  CN=$((CN + 1))
                  printf '%s %s\n' "$HOUR" "$CN" > "$CNT_FILE"
                  _tr=0
                  [ -r "$TRIES" ] && _tr=$(cat "$TRIES" 2>/dev/null)
                  _tr=$((_tr + 1))
                  printf '%s\n' "$_tr" > "$TRIES"
                  if [ "$_tr" -le 2 ]; then
                      log "中继链路断开（$STA_DEAD），第 ${CN} 次恢复（累计第 ${_tr} 次重建）：只重连中继接口 ifdown/ifup ${STA_NETS:-（找不到 network 名）}，AP 不动"
                      for _n in $STA_NETS; do
                          ifdown "$_n" >/dev/null 2>&1
                          sleep 1
                          ifup "$_n" >/dev/null 2>&1
                      done
                  elif [ "$_tr" -eq 3 ]; then
                      _rs=""
                      for _if in $STA_DEAD; do
                          _r=$(radio_of_iface "$_if")
                          [ -n "$_r" ] && _rs="$_rs $_r"
                      done
                      if [ -n "$_rs" ]; then
                          log "中继仍未连上，第 ${CN} 次恢复（累计第 ${_tr} 次）：reconf 中继所在 radio$_rs（只重建中继那一路，AP 继续发信标）"
                          for _r in $_rs; do wifi reconf "$_r" >/dev/null 2>&1; done
                      else
                          log "中继仍未连上，且定位不到所属 radio：退化到 wifi reload（整机无线重建）"
                          /sbin/wifi reload >/dev/null 2>&1
                      fi
                  elif [ "$_tr" -eq 4 ]; then
                      log "中继仍未连上，第 ${CN} 次恢复（累计第 ${_tr} 次）：wifi reload 全量重建（代价：2.4G AP 会一起断十几秒）"
                      /sbin/wifi reload >/dev/null 2>&1
                  fi
                  if [ "$_tr" -ge 5 ]; then
                      : > "$GIVE"
                      log "中继已重建 ${_tr} 次仍连不上，暂停自动恢复（查上游路由器 / 中继位置 / 上游是否改了信道）"
                  fi
              fi
              for _if in $STA_DEAD; do rm -f "$TMP/wifi-watchdog.sta.$_if"; done
          fi

          HW=$(hw_count)
          [ -n "$HW" ] || HW=0
          PREV=0
          [ -r "$HW_FILE" ] && PREV=$(cat "$HW_FILE" 2>/dev/null)
          [ -n "$PREV" ] || PREV=0
          if [ "$HW" -gt "$PREV" ]; then
              _last=$(dmesg 2>/dev/null | grep -iE 'hardware restart|firmware crash|mcu message' | tail -n 1)
              log "内核新增 $((HW - PREV)) 条无线驱动报错（累计 ${HW}）：$_last"
          fi
          printf '%s\n' "$HW" > "$HW_FILE"

          # ---- 自检：判活逻辑的回归保护 ----
          # 这个脚本最贵的一次教训不是驱动崩，而是判活的正则写错（'ESSID: "."' 只匹配
          # 单字符 SSID），结果把正常的 AP 永久判死、每小时 wifi up 5 次。
          # 这类错误语法检查抓不到、日志看着也"正常"，所以给出一条能一键跑的确定性测试：
          # 真实 AP 接口必须判活，一个绝不存在的接口名必须判死。
          selftest() {
              _bad=0
              _ifs=$(iw dev 2>/dev/null | awk '$1=="Interface"{print $2}')
              _ap=""
              for _d in $_ifs; do
                  _t=$(iw dev "$_d" info 2>/dev/null | sed -n 's/.*type //p' | head -n 1)
                  [ "$_t" = "AP" ] && _ap="$_ap $_d"
              done
              for _d in $_ap; do
                  if alive "$_d"; then
                      printf '  ✅ alive(%s) = 活（iwinfo 首行：%s）\n' "$_d" "$(iwinfo "$_d" info 2>/dev/null | head -n 1)"
                  else
                      printf '  ❌ alive(%s) = 死，但 iwinfo 实际输出：%s\n' "$_d" "$(iwinfo "$_d" info 2>/dev/null | head -n 1)"
                      _bad=1
                  fi
              done
              [ -n "$_ap" ] || printf '  （没有 AP 接口，跳过正向测试）\n'
              if alive "phy99-ap99"; then
                  printf '  ❌ alive(不存在的接口) = 活，判死通道失效\n'
                  _bad=1
              else
                  printf '  ✅ alive(不存在的接口) = 死\n'
              fi
              if [ "$_bad" -eq 0 ]; then
                  printf '  判活逻辑正常\n'
              else
                  printf '  判活逻辑有问题：先比对 iwinfo 第一行与 grep 模式（应为 ESSID: "）\n'
              fi
              return $_bad
          }

          if [ "$1" = "selftest" ]; then
              selftest
              exit $?
          fi

          if [ "$1" = "status" ]; then
              printf '\n无线看门狗状态\n'
              printf '  AP 接口：%s\n' "${AP_IFS:-（无）}"
              printf '  中继接口：%s\n' "${STA_IFS:-（无）}"
              printf '  本小时已恢复 %s 次（上限 %s）\n' "$CN" "$MAXH"
              printf '  内核无线驱动报错累计 %s 条\n' "$HW"
              if [ -s "$LOG" ]; then
                  printf '  最近 5 条日志：\n'
                  tail -n 5 "$LOG" | sed 's/^/    /'
              fi
              printf '\n'
          fi
          exit 0
          EOF

          # ---------- F3. TCP 断流检测（openwrt#25305 专用）----------
          # 25.12（内核 6.12）在 mt7621 上有 MT7530 FDB 失步回归：漫游后 ICMP 正常、TCP 卡死。
          # 人工盯不住，所以每 5 分钟做一次真实 HTTP 探测，连续 3 次失败才动手（只重连中继 radio）。
          cat > files/usr/bin/net-watchdog << 'EOF'
          #!/bin/sh
          # net-watchdog —— "ICMP 通、TCP 卡死" 检测器（openwrt#25305 的典型症状）
          #
          # 判定与动作（宁可少动，不要乱动）：
          #   1) 单次失败不动手（可能是对端抖动，或客户端正在漫游）
          #   2) 连续 3 次失败（约 15 分钟）→ 记一份现场快照，再只重连中继那个 radio
          #   3) 绝不 wifi reload：那会把 2.4G/5G 的 AP 一起拆掉，反而制造二次中断
          #   4) 快照写进日志，事后能判断到底是不是 #25305
          #
          # 日志：/var/log/net-watchdog.log（>1MB 时由 memguard trim 裁到最近 200 行）
          LOG=/var/log/net-watchdog.log
          ST=/tmp/net-watchdog.fail
          URL204='http://connect.rom.miui.com/generate_204'
          URL2='https://mirrors.aliyun.com/ubuntu/ls-lR.gz'

          log() { echo "$(date '+%F %T') $*" >> "$LOG"; }

          probe() {
              _c=$(curl -s -o /dev/null -m 8 -w '%{http_code}' "$URL204" 2>/dev/null)
              case "$_c" in 200|204) return 0 ;; esac
              curl -s -o /dev/null -m 10 -r 0-1023 "$URL2" 2>/dev/null && return 0
              return 1
          }

          snapshot() {
              log "---- 快照 ----"
              log "  uptime : $(uptime | sed 's/^ *//')"
              log "  wan-ip : $(ip -4 addr show phy1-sta0 2>/dev/null | sed -n 's/.*inet \([0-9.]*\).*/\1/p')"
              log "  sta    : $(iw dev phy1-sta0 link 2>/dev/null | tr '\n' ' ' | cut -c1-160)"
              log "  fdb    : $(bridge fdb show br br-lan 2>/dev/null | wc -l) 条"
              log "  connt  : $(cat /proc/sys/net/netfilter/nf_conntrack_count 2>/dev/null)/$(cat /proc/sys/net/netfilter/nf_conntrack_max 2>/dev/null)"
              for _a in phy0-ap0 phy1-ap0; do
                  [ -e "/sys/class/net/$_a" ] || continue
                  log "  $_a : tx $(cat /sys/class/net/$_a/statistics/tx_packets 2>/dev/null) / rx $(cat /sys/class/net/$_a/statistics/rx_packets 2>/dev/null)"
              done
          }

          if probe; then
              _old=$(cat "$ST" 2>/dev/null || echo 0)
              [ "$_old" -gt 0 ] 2>/dev/null && log "TCP 恢复（此前连续失败 $_old 次），计数清零"
              rm -f "$ST"
              exit 0
          fi

          _n=$(cat "$ST" 2>/dev/null || echo 0)
          _n=$((_n + 1))
          echo "$_n" > "$ST"
          log "TCP 探测失败（连续第 $_n 次）"

          [ "$_n" -ge 3 ] || exit 0

          # 动作前排掉两件"不是 #25305"的情况，避免上游真的断了却反复重启无线：
          #   1) STA 没关联上游 → 那是 relay-tune / wifi-watchdog 的活，这里不动手
          #   2) 30 分钟冷却，同一时段不重复重启
          if ! iw dev phy1-sta0 link 2>/dev/null | grep -q 'Connected to'; then
              log "STA 未关联上游：交给 relay-tune / wifi-watchdog，本次不动手"
              rm -f "$ST"
              exit 0
          fi
          _last=$(cat /tmp/net-watchdog.last 2>/dev/null || echo 0)
          _now=$(date +%s)
          if [ "$((_now - _last))" -lt 1800 ] 2>/dev/null; then
              log "距上次恢复不足 30 分钟（$(((_now - _last) / 60)) 分钟），只记录不动手"
              # 计数必须清零：否则冷却一过，下一次失败(第 4 次)立刻又触发重建
              rm -f "$ST"
              exit 0
          fi
          date +%s > /tmp/net-watchdog.last
          log "连续 3 次 TCP 不通且 STA 仍关联 → 记快照，然后只重连中继 radio1"
          snapshot
          rm -f "$ST"
          /sbin/wifi up radio1 >/dev/null 2>&1 || log "wifi up radio1 返回失败"
          log "已执行 wifi up radio1（若仍不通，看 wifi-doctor 第 5 节）"
          exit 0
          EOF

          # ---------- I4. 中继收敛器（开机先起 AP，再等中继；顺带关掉 wireless 上的 flow offload）----------
          # 5G 当无线中继（sta）时，2.4G AP 与它是两颗 phy，但共用一个 wpad、一条启动流程：
          #   · 开机时 sta 要扫描上游（全信道），AP 起得比它晚 → 手机迟迟搜不到 SSID；
          #   · 中继抖动时若全量 wifi up/reload，2.4G AP 被一起拆掉重建 → "断、连不上、搜不到"；
          #   · flow offload 把 br-lan 上的无线转发也接管过去（见下面 offload_off 的说明）。
          # 这个脚本把"开机"这一段接管掉，运行期交给 wifi-watchdog（按 radio 分级处理）。
          # 手动跑一次：relay-tune once     看状态：relay-tune status
          cat > files/usr/bin/relay-tune << 'EOF'
          #!/bin/sh
          # relay-tune：中继 + 本地 AP 共存时的开机收敛器。只做三件事，全部可逆、全部写日志：
          #   1) 检测到中继（有 sta 接口）就关掉 flow offload
          #   2) 先确保本地 AP 在发信标（最多 90 秒），手机能尽快看到 SSID
          #   3) 再按 5/10/15…30 秒递增重试 ifup 中继接口，日志留下"开机第几秒连上"
          # 为什么不把这三件事塞进 wifi-watchdog：watchdog 是运行期的巡线员（每 2 分钟），
          # 开机那几分钟由专门的一段逻辑处理，职责分开，出事看日志能一眼分清是哪一段。

          LOG=/var/log/relay-tune.log

          log() {
              printf '%s %s\n' "$(date '+%F %T')" "$*" >> "$LOG"
              _sz=$(wc -c < "$LOG" 2>/dev/null | tr -d ' ')
              [ -n "$_sz" ] || _sz=0
              [ "$_sz" -gt 65536 ] && { tail -n 200 "$LOG" > "$LOG.t" 2>/dev/null && mv "$LOG.t" "$LOG"; }
          }

          uptime_sec() { awk '{print int($1)}' /proc/uptime 2>/dev/null; }
          uci_secs() { uci -q show "$1" 2>/dev/null | sed -n "s/^$1\.\([^.]*\)=$2\$/\1/p"; }
          radio_list() { uci_secs wireless wifi-device; }

          sta_secs() {
              for _s in $(uci_secs wireless wifi-iface); do
                  [ "$(uci -q get wireless.$_s.mode)" = "sta" ] && echo "$_s"
              done
          }
          sta_nets() {
              for _s in $(sta_secs); do
                  _n=$(uci -q get wireless.$_s.network)
                  [ -n "$_n" ] && echo "$_n"
              done
          }

          live_ifaces() { iw dev 2>/dev/null | awk '$1=="Interface"{print $2}'; }
          iface_type() { iw dev "$1" info 2>/dev/null | sed -n 's/.*type //p' | head -n 1; }
          ap_ifaces() { for _d in $(live_ifaces); do [ "$(iface_type "$_d")" = AP ] && echo "$_d"; done; }
          sta_ifaces() { for _d in $(live_ifaces); do [ "$(iface_type "$_d")" = managed ] && echo "$_d"; done; }
          # 判活同 wifi-watchdog：模式必须是 'ESSID: "'（旧写法 'ESSID: "."' 只匹配单字符 SSID，
          # 会把叫 alon 的 AP 永久判死）。这里只用前两条通道，够用且不误杀。
          ap_alive() {
              iwinfo "$1" info 2>/dev/null | grep -q 'ESSID: "' || return 1
              # 只有 ESSID 不够：mt76 在「hostapd 先于 STA 起」时会留下 state DOWN + channel unknown
              # 的残状态，此时 iwinfo 照样报 ESSID，会把哑巴 AP 判成健康（2026-11-23 踩到：
              # relay-tune 记「AP 就绪」，5G 实际一直没发信标，PC 扫不到）。
              ip link show "$1" 2>/dev/null | grep -q 'state UP' || return 1
              iwinfo "$1" info 2>/dev/null | grep -q 'Channel: unknown' && return 1
              return 0
          }
          sta_linked() { iw dev "$1" link 2>/dev/null | grep -q 'Connected to'; }

          # 接口 → radio 段名（wifi down/up 支持带设备名，只影响那一个 phy）
          radio_of_iface() {
              _if="$1"
              _hit=""
              for _r in $(radio_list); do
                  _ifs=$(ubus call network.wireless status 2>/dev/null | jsonfilter -e "@.$_r.interfaces[*].ifname" 2>/dev/null)
                  case " $_ifs " in *" $_if "*) _hit="$_r" ;; esac
              done
              printf '%s' "$_hit"
          }

          # 这颗 radio 上有没有 managed（中继）接口。有就绝对不能 wifi down —— 会把上行一起拆掉，
          # 中继一断又触发 hotplug / 看门狗，mt76 在反复 down-up 里卡死时 procd 的硬件看门狗会复位整机。
          radio_has_sta() {
              _rhs_r="$1"
              [ -n "$_rhs_r" ] || return 1
              _rhs_ifs=$(ubus call network.wireless status 2>/dev/null | jsonfilter -e "@.$_rhs_r.interfaces[*].ifname" 2>/dev/null)
              for _rhs_x in $_rhs_ifs; do
                  [ "$(iw dev "$_rhs_x" info 2>/dev/null | sed -n "s/.*type //p" | head -n 1)" = "managed" ] && return 0
              done
              return 1
          }

          # ---- 关 flow offload（只在中继模式下）----
          # TurboACC 的 sw_flow/hw_flow 最终写的是 firewall.@defaults[0].flow_offloading(_hw)；
          # fw4 的 resolve_offload_devices() 会把各 zone 的物理设备递归展开到 bridge 的
          # lower_* 成员（br-lan 的成员就是 eth* 与 wlan*），据此建 flowtable 并加
          # "meta l4proto { tcp, udp } flow offload @ft" —— 无线客户端的转发也被接管。
          # mt7621 主线没有可用的 flowtable 硬件 offload：fw4 探测失败会自己打一行
          # "Hardware flow offloading unavailable, falling back to software offloading"
          # 并降级成软件 offload —— 所以 hw_flow=1 在这台机器上等于软件 offload。
          # 桥接 + 无线 + 软件 offload 这个组合在 mt76 上就是"连着但上不去网 / 时断时续"。
          # 中继场景下先把这一层拿掉，排查面立刻少一层。
          # 想保留：touch /etc/relay-keep-offload（文件开关，不依赖任何软件包）
          offload_off() {
              if [ -f /etc/relay-keep-offload ]; then
                  log "存在 /etc/relay-keep-offload：保留 flow offload（若仍断流，删掉它再重启）"
                  return 0
              fi
              _fw=$(uci -q get firewall.@defaults[0].flow_offloading)
              _fwh=$(uci -q get firewall.@defaults[0].flow_offloading_hw)
              [ "$_fw" = "1" ] || [ "$_fwh" = "1" ] || return 0
              if uci -q get firewall.@defaults[0] >/dev/null 2>&1; then
                  uci -q set firewall.@defaults[0].flow_offloading='0'
                  uci -q set firewall.@defaults[0].flow_offloading_hw='0'
                  uci -q commit firewall
                  /etc/init.d/firewall restart >/dev/null 2>&1
              fi
              log "中继模式：已关 flow offload（firewall $_fw/$_fwh → 0）"
          }

          # 中继 + 本地 AP 同 phy 时，AP 卡在 DOWN（不发信标）怎么救：
          #   · 只 `wifi up` 没用 —— 实测 2026-11-23：radio1 的 AP 从开机起就是 DOWN、TX packets=0、
          #     iwinfo channel=unknown，补 wifi up 完全没反应；
          #   · 手动 `wifi reload` 一次，hostapd 立刻 AP-ENABLED，PC 马上扫到 SSID；
          #   · 注意这**不是**信道写错：实测把 radio1.channel 故意改成 ch44，AP 照样跟着 STA 跑 149
          #     并正常发信标（同一 phy 只能有一个信道，运行时由驱动强制跟随）。
          # 所以这里做一次整条 radio 的 reload，顺手把信道钉到上游实际信道（auto 时 hostapd
          # 可能选到别的信道，钉住能让下次开机少一次折腾）。每开机最多 2 次，避免反复拆上行。
          relay_ap_kick() {
              _k_r="${1:-}"
              [ -n "$_k_r" ] || return 1
              _k_n=$(cat /tmp/relay-apkick.cnt 2>/dev/null || echo 0)
              [ "${_k_n:-0}" -lt 2 ] || return 1
              # 上游必须在线上：reload 会把它一起拆掉，得保证 wpa_supplicant 能立刻连回来
              _k_sta=""
              for _k_d in $(sta_ifaces); do
                  [ "$(radio_of_iface "$_k_d")" = "$_k_r" ] || continue
                  if sta_linked "$_k_d"; then _k_sta="$_k_d"; break; fi
              done
              [ -n "$_k_sta" ] || return 1
              _k_freq=$(iw dev "$_k_sta" link 2>/dev/null | sed -n 's/.*freq:[[:space:]]*\([0-9]*\).*/\1/p' | head -n 1)
              _k_ch=$(awk -v f="$_k_freq" 'BEGIN{ if (f>2400 && f<2500) printf "%d", (f-2407)/5; else if (f>4900) printf "%d", (f-5000)/5 }')
              _k_cur=$(uci -q get "wireless.$_k_r.channel")
              if [ -n "$_k_ch" ] && [ "$_k_cur" != "$_k_ch" ]; then
                  uci set "wireless.$_k_r.channel=$_k_ch" 2>/dev/null && uci commit wireless 2>/dev/null
                  log "AP 没发信标：把 $_k_r 信道从 '${_k_cur:-未设}' 钉到 ch${_k_ch}（上游 ${_k_sta} ${_k_freq}MHz）"
              fi
              printf '%s\n' "$((_k_n + 1))" > /tmp/relay-apkick.cnt
              log "AP 没发信标：reload 整条 $_k_r（第 $((_k_n + 1)) 次，上游 ${_k_sta}）"
              ( sleep 1; wifi reload >/dev/null 2>&1 ) >/dev/null 2>&1 &
              return 0
          }
          once() {
              _t0=$(uptime_sec); _t0=${_t0:-0}
              [ -n "$(sta_secs)" ] || { log "没有 sta（中继）接口：纯 AP 模式，不做处理"; return 0; }
              # 幂等锁：hotplug 钩子在中继 ifup 时会补跑一次 once，而 once 自己也会 ifdown/ifup 中继，
              # 不加锁就会自激（ifup → hotplug → once → ifup → …）。现场有一次改信道后 3 秒内跑了 4 遍。
              # 60 秒内的重复调用直接跳过：真正的收敛由第一次跑完负责。
              _lk=/tmp/relay-tune.lock
              # 原子锁：目录名自带时间戳，不再往文件里写 —— 本固件的 busybox 没有 stat，
              # 读不到目录 mtime；用 lock.<秒> 的命名就不需要任何额外命令。
              _cur=$(ls -d "$_lk".* 2>/dev/null | head -1)
              if [ -n "$_cur" ]; then
                  _age=$(( _t0 - ${_cur##*.} ))
                  if [ "$_age" -ge 0 ] && [ "$_age" -lt 60 ]; then
                      log "已有一次在收敛（锁 ${_age}s），本次跳过"; return 0
                  fi
                  # 陈旧锁（上一轮被 kill -9）：接管，避免永久卡死
                  rm -rf "$_cur"
              fi
              mkdir "$_lk.$_t0" 2>/dev/null || { log "另一实例刚拿到锁，本次跳过"; return 0; }
              trap 'rm -rf /tmp/relay-tune.lock.*' EXIT INT TERM
              log "开始收敛（开机第 ${_t0}s，中继段：$(sta_secs | tr '\n' ' ')）"
              offload_off

              # 阶段 1：AP 先起来（最多 90 秒；第 20s / 60s 各纠一次，只重启 AP 所在的 radio）
              _i=0
              while [ "$_i" -lt 9 ]; do
                  _i=$((_i + 1))
                  _bad=""
                  for _d in $(ap_ifaces); do ap_alive "$_d" || _bad="$_bad $_d"; done
                  # 没有 AP 接口（纯中继 / 2.4G AP 被关）时不要空转 9 轮 × 10 秒：直接进阶段 2 等中继
                  [ -n "$(ap_ifaces)" ] || { log "没有 AP 接口：跳过阶段 1，直接等中继"; break; }
                  if [ -z "$_bad" ]; then
                      log "AP 就绪（用时 $(( $(uptime_sec) - _t0 ))s，此刻开机第 $(uptime_sec)s）"
                      break
                  fi
                  if [ "$_i" -eq 2 ] || [ "$_i" -eq 6 ]; then
                      for _d in $_bad; do
                          _r=$(radio_of_iface "$_d")
                          [ -n "$_r" ] || continue
                          # 这颗 radio 同时挂着中继（managed）接口时绝不能 down：
                          # wifi down radioX 会把中继一起拆掉，中继一断又触发 hotplug/看门狗，
                          # 现场表现是 mt76 在反复 down/up 里卡死，procd 的硬件看门狗（30s）直接复位整机。
                          # 这种情况只做 wifi up（幂等），交给 wpa_supplicant 自己恢复。
                          if radio_has_sta "$_r"; then
                              # 同一个 phy 上 AP + STA 时，AP 可能在开机那一刻卡在 DOWN（不发信标）：
                              # 实测 2026-11-23：iwinfo 里 channel=unknown、TX packets=0，补 wifi up 无效；
                              # 手动 wifi reload 一次立刻 AP-ENABLED，PC 马上能扫到 SSID。
                              # 所以这里做一次整条 radio 的 reload（每开机最多 2 次，且只在 STA 已上线时做）。
                              if relay_ap_kick "$_r"; then
                                  log "AP $_d 没发信标：已 reload $_r 尝试恢复"
                              else
                                  log "AP $_d 没发信标，但 $_r 同时承载中继：不动它（避免拆掉上行），只补一次 wifi up"
                                  wifi up "$_r" >/dev/null 2>&1
                              fi
                              continue
                          fi
                          log "AP $_d 还没发信标（第 ${_i} 次检查），只重启 $_r"
                          wifi down "$_r" >/dev/null 2>&1
                          sleep 2
                          wifi up "$_r" >/dev/null 2>&1
                      done
                  fi
                  sleep 10
              done

              # 阶段 2：等中继连上（最多 5 分钟，间隔 5→30 秒递进；只动中继接口，不碰 AP）
              # 先给 wpa_supplicant 30 秒自己关联的时间（正常 10 秒内就上），
              # 太早 ifdown/ifup 会打断正在进行的扫描/关联，反而更慢。
              if [ -z "$(for _d in $(sta_ifaces); do sta_linked "$_d" && echo x; done)" ]; then
                  sleep 20
              fi
              _tries=0
              _delay=5
              while : ; do
                  _ok=""
                  for _d in $(sta_ifaces); do sta_linked "$_d" && _ok=1; done
                  if [ -n "$_ok" ]; then
                      log "中继已连上（用时 $(( $(uptime_sec) - _t0 ))s，此刻开机第 $(uptime_sec)s，重试 ${_tries} 次）"
                      return 0
                  fi
                  _el=$(( $(uptime_sec) - _t0 ))
                  if [ "$_el" -gt 300 ]; then
                      log "中继等满 ${_el}s 仍未连上：交给 wifi-watchdog 分级处理（它只在连上过上游后才动作）"
                      return 0
                  fi
                  _tries=$((_tries + 1))
                  # 重连退避：每次 ifdown/ifup 都会触发 hotplug，而 15 秒内反复拆接口只会让
                  # wpa_supplicant 每次都在扫描中途被打断、越重连越慢。这里限制最短间隔 15 秒。
                  _now=$(uptime_sec)
                  _prev=$(sed -n '1p' /tmp/relay-tune.lastifup 2>/dev/null || echo 0)
                  [ -n "$_prev" ] || _prev=0
                  if [ $((_now - _prev)) -lt 15 ]; then
                      log "第 ${_tries} 次：距上次重连 $((_now - _prev))s（不足 15s），先等一轮不拆接口"
                      sleep "$_delay"
                      [ "$_delay" -lt 30 ] && _delay=$((_delay + 5))
                      continue
                  fi
                  printf '%s\n' "$_now" > /tmp/relay-tune.lastifup
                  for _n in $(sta_nets); do
                      log "第 ${_tries} 次重连中继接口 ${_n}（开机第 ${_el}s）"
                      ifdown "$_n" >/dev/null 2>&1
                      sleep 1
                      ifup "$_n" >/dev/null 2>&1
                  done
                  sleep "$_delay"
                  [ "$_delay" -lt 30 ] && _delay=$((_delay + 5))
              done
          }

          status() {
              printf '中继收敛器状态（开机 %ss）\n' "$(uptime_sec)"
              printf '  AP 接口：%s\n' "$(ap_ifaces | tr '\n' ' ')"
              for _d in $(ap_ifaces); do
                  printf '    %-10s %s\n' "$_d" "$(iwinfo "$_d" info 2>/dev/null | sed -n 's/.*ESSID: *//p' | head -n 1)"
              done
              printf '  中继接口：%s\n' "$(sta_ifaces | tr '\n' ' ')"
              for _d in $(sta_ifaces); do
                  printf '    %-10s %s\n' "$_d" "$(iw dev "$_d" link 2>/dev/null | sed -n 's/^ *Connected to *//p' | head -n 1)"
              done
              printf '  flow offload(firewall)：%s(hw %s)  fullcone：%s\n' \
                  "$(uci -q get firewall.@defaults[0].flow_offloading)" \
                  "$(uci -q get firewall.@defaults[0].flow_offloading_hw)" \
                  "$(uci -q get firewall.@defaults[0].fullcone)"
              if [ -s "$LOG" ]; then
                  printf '  最近 8 条日志：\n'
                  tail -n 8 "$LOG" | sed 's/^/    /'
              fi
          }

          case "$1" in
              status) status ;;
              *) once ;;
          esac
          exit 0
          EOF

          cat > files/etc/init.d/relay-tune << 'EOF'
          #!/bin/sh /etc/rc.common
          # 开机跑一次（不常驻、不 respawn）：network 起来（START=20）之后、日志进 logread
          USE_PROCD=1
          START=99
          STOP=10

          start_service() {
              procd_open_instance
              procd_set_param command /usr/bin/relay-tune once
              procd_set_param stdout 1
              procd_set_param stderr 1
              procd_close_instance
          }
          EOF

          cat > files/etc/uci-defaults/95-relay << 'EOF'
          #!/bin/sh
          # 中继收敛器开机自启。
          # 无脑 enable 掉不设备：纯 AP 模式下 relay-tune 第一件事就是发现"没有 sta 接口"
          # 然后立刻退出（只在 /var/log/relay-tune.log 留一行），代价是一次 awk。
          # 这样也不用区分"先刷机后配中继"还是"刷机前就配好"两种顺序。
          /etc/init.d/relay-tune enable 2>/dev/null
          exit 0
          EOF

          # ---------- 97-ipv6：IPv6 用"中继"而不是"前缀委派" ----------
          # 2026-11-14 在真机上把两条路都试了一遍，结论写在 README 里，这里只留配置：
          #   · 前缀委派（PD）：CPE 确实给了 2409:8a0c:8e32:5111::/64，但它**不往这个前缀回程**，
          #     客户端拿到地址后一个包都出不去（用 5110::/64 的源就能出去，正是这个差别暴露了问题）。
          #   · 中继（RA/NDP relay）：客户端直接拿 CPE 那个 /64 的地址，路由做 NDP 代理 → 实测通。
          #     证据：ping6 -S <5110 地址> 2400:3200::1 → 3/3，30ms；https://www.baidu.com → 200。
          # 所以固件里固定用 relay；若将来换成有线回程、上游也支持 PD，把 dhcp.lan.ra 改回 server
          # 并给 network.lan 加 ip6assign=60 即可（README 有命令）。
          cat > files/etc/uci-defaults/97-ipv6 << 'EOF'
          #!/bin/sh
          # IPv6：上游给 RA/DHCPv6（无线中继 → CPE），本机做 RA + NDP 中继给 LAN。
          [ -f /etc/config/network ] || exit 0

          # 1) 上游 IPv6 接口：只要地址，不要前缀（PD 在这台 CPE 上不通，见 README）
          uci -q delete network.wwan6
          uci set network.wwan6=interface
          uci set network.wwan6.proto='dhcpv6'
          uci set network.wwan6.device='@wwan'
          uci set network.wwan6.reqaddress='try'
          uci set network.wwan6.reqprefix='no'

          # 2) LAN 不再自己分配前缀，改成中继上游的 RA/DHCPv6/NDP
          uci -q delete network.lan.ip6assign
          uci -q delete network.globals.ula_prefix    # 关掉 ULA：三套地址只会让客户端选错源

          # 3) odhcpd：上游是 master，LAN 是 relay
          uci -q delete dhcp.wwan6
          uci set dhcp.wwan6=dhcp
          uci set dhcp.wwan6.interface='wwan6'
          uci set dhcp.wwan6.master='1'
          uci set dhcp.wwan6.ra='relay'
          uci set dhcp.wwan6.dhcpv6='relay'
          uci set dhcp.wwan6.ndp='relay'
          uci set dhcp.wwan6.ignore='0'

          uci set dhcp.lan.ra='relay'
          uci set dhcp.lan.dhcpv6='relay'
          uci set dhcp.lan.ndp='relay'
          uci -q delete dhcp.lan.ra_slaac
          uci -q delete dhcp.lan.ra_default

          # 4) sing-box：被墙域名按域名规则走代理（等价于旧 PassWall 的 filter_proxy_ipv6），
          #    国内域名保留 AAAA 直连 v6；不为 v6 单独开一套 tproxy 规则（这台机器不值当）。

          uci commit network
          uci commit dhcp
          exit 0
          EOF

          # ---------- 中继接口起来就收敛一次（覆盖"刷机后才配中继"的场景）----------
          # 2026-11-15 现场发现的真实缺陷：开机时若还没有 sta 段（用户还没配中继，或刚刷完机），
          # relay-tune 在 S99 只跑一次、判成"纯 AP 模式"就退出；用户随后在 LuCI 里配好中继，
          # 结果 flow offload 一直开着、"先起 AP 再等中继"的逻辑也没生效（日志里只有一行
          # "没有 sta（中继）接口：纯 AP 模式，不做处理"）。
          # 这个 hotplug 让中继接口一 up 就补跑一次，之后的重连由 wifi-watchdog 接管。
          cat > files/etc/hotplug.d/iface/90-relay-tune << 'EOF'
          #!/bin/sh
          # 中继（managed）接口 ifup 时补跑一次 relay-tune：关 flow offload + 记录收敛时间线。
          [ "$ACTION" = "ifup" ] || exit 0
          [ -x /usr/bin/relay-tune ] || exit 0
          # 收敛进行中就别再插一脚：relay-tune 自己 ifup 中继时也会触发这个钩子，
          # 没有这道门就会自激（3 秒内跑 4 遍）。锁由 relay-tune 自己创建/删除。
          [ -n "$(ls -d /tmp/relay-tune.lock.* 2>/dev/null | head -1)" ] && exit 0
          case "$INTERFACE" in
              wwan|wwan6) ;;
              *)
                  # 网络名不是 wwan 时按设备类型兜底判断（用户可能自己改名）
                  [ -n "$DEVICE" ] || exit 0
                  iw dev "$DEVICE" info 2>/dev/null | grep -q 'type managed' || exit 0
                  ;;
          esac
          /usr/bin/relay-tune once >/dev/null 2>&1 &
          exit 0
          EOF

          cat > files/usr/bin/usb-service << 'EOF'
          #!/bin/sh
          # usb-service：USB 即插即用 —— 相关服务平时关闭，插上设备才启动，拔掉就停。
          #
          # 为什么这么做：ksmbd / p910nd / usbmuxd / usbmode / wsdd2 加起来常驻要几十 MB 虚拟内存
          # 与几秒启动时间，而它们绝大多数时间没有设备可用（没插 U 盘、没接打印机、没有 iPhone）。
          # 让它们跟着设备走，既省资源又不牺牲功能。
          #
          # 对应关系：
          #   U 盘/移动硬盘（已挂载到 /mnt/*） → ksmbd（SMB 共享）+ wsdd2（Windows 网络发现）
          #   USB 打印机（/dev/usb/lp*）        → p910nd（RAW 9100 打印）
          #   iPhone/iPad（Apple VID 05ac）     → usbmuxd
          #   其它 USB 设备（上网卡等）         → usbmode（模式切换，放进来的可能是存储模式的棒子）
          #
          # 触发点：/etc/hotplug.d/usb/50-usb-services、/etc/hotplug.d/block/50-usb-services 每次插拔调用；
          #         开机由 /etc/init.d/usb-service 调一次；手动重扫就再跑一次本脚本。
          # 幂等：只认"该不该在跑"，不记录历史，任何时刻跑都收敛到正确状态。
          #
          # 用法：
          #   usb-service            静默（hotplug 用）
          #   usb-service status     看当前判断与状态
          #   usb-service --dry-run  只打印判断，不启停任何服务

          LOG=/var/log/usb-service.log
          ST=/tmp/usb-service
          DRY=0
          [ "$1" = "--dry-run" ] && DRY=1
          [ "$1" = "status" ] && DRY=2

          log() {
              [ "$DRY" = "0" ] || return 0
              printf '%s %s\n' "$(date '+%F %T')" "$*" >> "$LOG"
              _sz=$(wc -c < "$LOG" 2>/dev/null | tr -d ' ')
              [ -n "$_sz" ] || _sz=0
              if [ "$_sz" -gt 65536 ]; then
                  tail -n 200 "$LOG" > "$LOG.t" 2>/dev/null && mv "$LOG.t" "$LOG"
              fi
          }

          say() { [ "$DRY" = "0" ] || printf '%s\n' "$*"; }

          # 有没有指定厂商的 USB 设备（跳过 root hub：它们 idVendor=1d6b）
          usb_has_vid() {
              for _d in /sys/bus/usb/devices/*/idVendor; do
                  [ -f "$_d" ] || continue
                  [ "$(cat "$_d" 2>/dev/null)" = "$1" ] && return 0
              done
              return 1
          }

          # 除 hub 以外还有没有任何 USB 设备在（hub 的 bDeviceClass=09）
          usb_any_device() {
              for _d in /sys/bus/usb/devices/*; do
                  [ -f "$_d/bDeviceClass" ] || continue
                  [ "$(cat "$_d/bDeviceClass" 2>/dev/null)" = "09" ] && continue
                  [ -f "$_d/idVendor" ] || continue
                  return 0
              done
              return 1
          }

          # 已挂载的 U 盘/移动硬盘挂载点（取第一个）
          storage_mount() {
              # 测试钩子：没有真 U 盘时也能验证 SMB 分支（USB_SERVICE_TEST_MOUNT=/mnt/sda1 usb-service）
              [ -n "$USB_SERVICE_TEST_MOUNT" ] && { echo "$USB_SERVICE_TEST_MOUNT"; return 0; }
              /sbin/block info 2>/dev/null \
                | sed -n 's|^/dev/sd[a-z][0-9]*: .*MOUNT="\(/mnt[^"]*\)".*|\1|p' \
                | head -n 1
          }

          have_state() { [ -f "$ST.$1" ]; }

          # apply <服务名> <要不要 1/0>
          apply() {
              _svc="$1"
              _want="$2"
              if [ "$_want" = "1" ]; then
                  if have_state "$_svc"; then
                      say "  $_svc：需要（在跑）"
                  else
                      say "  $_svc：需要 -> 启动"
                      if [ "$DRY" = "0" ]; then
                          /etc/init.d/"$_svc" start >/dev/null 2>&1
                          : > "$ST.$_svc"
                          log "启动 $_svc"
                      fi
                  fi
              else
                  if have_state "$_svc"; then
                      say "  $_svc：不需要 -> 停止"
                      if [ "$DRY" = "0" ]; then
                          /etc/init.d/"$_svc" stop >/dev/null 2>&1
                          rm -f "$ST.$_svc"
                          log "停止 $_svc"
                      fi
                  else
                      say "  $_svc：不需要（本来就没跑）"
                  fi
              fi
          }

          main() {
              _mp=$(storage_mount)
              _printer=0
              ls /dev/usb/lp* >/dev/null 2>&1 && _printer=1
              _apple=0
              usb_has_vid 05ac && _apple=1
              _anyusb=0
              usb_any_device && _anyusb=1

              if [ "$DRY" != "0" ]; then
                  printf 'USB 设备：'
                  [ "$_anyusb" = "1" ] && printf '有 ' || printf '无 '
                  [ "$_apple" = "1" ] && printf '(含 Apple) ' || :
                  [ "$_printer" = "1" ] && printf '(含打印机) ' || :
                  [ -n "$_mp" ] && printf '(存储挂载在 %s) ' "$_mp" || printf '(无存储) '
                  printf '\n'
              fi

              # SMB 共享的路径跟着实际挂载点走（不然 U 盘挂到 sdb1 就共享了个空目录）
              if [ -n "$_mp" ] && [ "$DRY" = "0" ]; then
                  _cur=$(uci -q get ksmbd.@share[0].path)
                  if [ "$_cur" != "$_mp" ]; then
                      if uci -q set ksmbd.@share[0].path="$_mp" && uci -q commit ksmbd; then
                          log "共享路径 -> $_mp"
                          # ksmbd 已经在跑时不会自己重读配置，不 reload 就还共享着旧（多半已空的）目录
                          /etc/init.d/ksmbd reload >/dev/null 2>&1
                      fi
                  fi
              fi

              # 有存储才起 SMB；停的时候先停 wsdd2 再停 ksmbd（顺序反了 discovery 会空跑一会儿）
              if [ -n "$_mp" ]; then
                  apply ksmbd 1
                  apply wsdd2 1
              else
                  apply wsdd2 0
                  apply ksmbd 0
              fi
              apply p910nd "$_printer"
              apply usbmuxd "$_apple"
              apply usbmode "$_anyusb"
          }

          main
          EOF

          cat > files/etc/hotplug.d/usb/50-usb-services << 'EOF'
          #!/bin/sh
          # hotplug：USB 设备插拔 -> 重新对账（服务跟着设备起停）
          # 必须后台跑：ksmbd 启动约 1 秒、wsdd2 启动里有 sleep 5，同步跑会卡住整条 hotplug 队列。
          [ -x /usr/bin/usb-service ] || exit 0
          /usr/bin/usb-service >/dev/null 2>&1 &
          exit 0
          EOF

          cat > files/etc/hotplug.d/block/50-usb-services << 'EOF'
          #!/bin/sh
          # hotplug：USB 设备插拔 -> 重新对账（服务跟着设备起停）
          # 必须后台跑：ksmbd 启动约 1 秒、wsdd2 启动里有 sleep 5，同步跑会卡住整条 hotplug 队列。
          [ -x /usr/bin/usb-service ] || exit 0
          /usr/bin/usb-service >/dev/null 2>&1 &
          exit 0
          EOF

          cat > files/etc/init.d/usb-service << 'EOF'
          #!/bin/sh /etc/rc.common
          # 开机对账一次：把"该在跑的服务"和"实际在跑的"对齐。
          # 平时什么设备都不插时，这里什么都不启动（都判成"不需要"），
          # 只在开机时插着 U 盘/打印机/上网卡的情况下才把对应服务拉起来。
          START=99
          STOP=01
          USE_PROCD=0

          start() {
          	[ -x /usr/bin/usb-service ] && /usr/bin/usb-service
          }

          stop() {
          	:
          }
          EOF
          cat > files/etc/uci-defaults/96-usb-service << 'EOF'
          #!/bin/sh
          # USB 外设相关服务改成"跟着设备走"：开机不自启，插上由 usb-service 拉起，拔掉就停。
          # 只动这五个（它们都只在插着设备时才有意义）；代理/DNS 那些与设备无关的服务不碰。
          #   ksmbd   U 盘共享        p910nd  USB 打印
          #   usbmuxd iPhone 同步     usbmode 上网卡模式切换
          #   wsdd2   Windows 网络发现（没有 ksmbd 时可访问性为零）
          for s in ksmbd p910nd usbmuxd usbmode wsdd2; do
          	/etc/init.d/$s disable 2>/dev/null
          done
          /etc/init.d/usb-service enable 2>/dev/null
          # 首启就对账一次：刷机前就插着 U 盘/打印机时，这里直接把服务拉起来
          /usr/bin/usb-service 2>/dev/null
          exit 0
          EOF
          # ---------- K. 去广告：多源合并成 MosDNS 的域名集合 ----------
          # 为什么不用 chinadns-ng 那套"屏蔽列表"：只有它会把清单编译成 null 组，
          # 而 chinadns-ng 会把 MosDNS 返回的 0.0.0.0 换成代理侧的真实应答（见 C 节说明）。
          # 现在统一由 MosDNS 的 domain_set 吃纯域名清单：命中直接返回 0.0.0.0，
          # 进程内哈希匹配，运行时不联网、不写闪存。
          #
          # 2026-11-16 改成"多源合并"：单一 anti-AD 只覆盖国内移动端广告，
          # 加了两个互补源（实测两两重叠率：anti-AD ∩ AdGuard 69% 是子集关系，
          # oisd ∩ 其它都是 0%，1Hosts Lite 与 AdGuard 重叠仅 20%）：
          #   · anti-AD      11.0 万条，国内广告/统计（含 App 内嵌 SDK）
          #   · oisd small    6.3 万条，官方标语 "Block. Don't break."，最保守、误伤最低
          #   · AdGuard DNS  19.0 万条，全球广告/跟踪器，覆盖面最广
          # 合并去重后 22.8 万条 / 4.5 MB（文本），squashfs 压缩后约 +1.5 MB，
          # MosDNS 常驻内存估算 +7 MB（431MB 的机器没有压力）。
          # 故意不加 1Hosts Lite / StevenBlack：前者过于激进（易误伤 App 内正常接口），
          # 后者 93% 与上面三个重合，只换来体积。
          mkdir -p files/etc/mosdns /tmp/adlist
          BLOCK=files/etc/mosdns/adblock.txt
          LIST=/tmp/adlist/all.raw
          : > "$LIST"

          # fetch <名字> <镜像1> [镜像2 ...]：逐个镜像试，第一个成功的并入 LIST
          fetch() {
              _name="$1"; shift
              for _u in "$@"; do
                  if curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 15 -m 300 "$_u" -o "/tmp/adlist/$_name.raw" \
                     && [ "$(wc -c < "/tmp/adlist/$_name.raw")" -gt 20000 ]; then
                      _b=$(wc -c < "/tmp/adlist/$_name.raw")
                      _l=$(wc -l < "/tmp/adlist/$_name.raw")
                      echo "  ✓ $_name  $_b 字节 / $_l 行  ←  $_u"
                      cat "/tmp/adlist/$_name.raw" >> "$LIST"
                      return 0
                  fi
                  echo "  ✗ $_name 这个镜像不可用：$_u"
              done
              echo "::warning::$_name 所有镜像都失败，本次缺这一源（其余源仍然生效）"
              return 1
          }

          fetch anti-ad \
            "https://fastly.jsdelivr.net/gh/privacy-protection-tools/anti-AD@master/anti-ad-domains.txt" \
            "https://cdn.jsdelivr.net/gh/privacy-protection-tools/anti-AD@master/anti-ad-domains.txt" \
            "https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-domains.txt" \
            "https://gitee.com/privacy-protection-tools/anti-AD/raw/master/anti-ad-domains.txt"
          fetch oisd \
            "https://small.oisd.nl/domainswild" \
            "https://hosts.oisd.nl/domainswild"
          fetch adguard \
            "https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt" \
            "https://raw.githubusercontent.com/AdguardTeam/AdGuardSDNSFilter/master/Filters/filter.txt" \
            "https://filters.adtidy.org/extension/ublock/filters/2_without_easylist.txt"


          # ---------- K1. 手工补充清单（三门源常漏的广告/追踪域名）----------
          # 2026-11-22 用 70 条 benchmark 实测：三门源合并后命中 61/70，缺的 9 条在这里补齐。
          # 其中 simba.taobao.com / ads.iqiyi.com / stat.youku.com 是被"保护名单"连带删掉的
          # （guard 只删主域那一行，所以广告子域必须显式加回来）。
          # 想再补：直接往这个文件里加纯域名（每行一个，# 开头是注释），下次构建自动并入。
          # 这个文件也会随镜像发布，刷机后可直接改，然后重编。
          cat > files/etc/mosdns/adblock-extra.txt << 'EXTRA'
          # ===== 国内：广告投放 / 埋点 / 归因 =====
          # 阿里妈妈 TanX 展示广告
          tanx.com
          # 淘宝客推广追踪（taobao.com 在保护名单里，这里只补广告子域）
          simba.taobao.com
          # 爱奇艺贴片广告（同理只补子域）
          ads.iqiyi.com
          # 优酷播放统计
          stat.youku.com
          iostat.youku.com
          # 新浪埋点
          log.sina.com.cn
          # 汇量科技移动广告 SDK
          mobvista.com
          # 常见国内埋点/归因
          sensorsdata.cn
          growingio.com
          domob.cn
          youmi.net
          adsmogo.com
          adview.cn
          # ===== 海外（故意不拦 graph.facebook.com：那是 FB App 登录必需）=====
          # 字节系海外广告（2026-11-22 实测：三门源都漏了 ads.tiktok.com）
          ads.tiktok.com
          ads.facebook.com
          analytics.facebook.com
          an.facebook.com
          appsflyer.com
          adjust.com
          branch.io
          kochava.com
          singular.net
          gumgum.com
          33across.com
          sharethrough.com
          teads.tv
          spotxchange.com
          springserve.com
          innovid.com
          undertone.com
          tremorhub.com
          EXTRA
          cat files/etc/mosdns/adblock-extra.txt >> "$LIST"
          echo "  手工补充清单已并入待归一化：$(grep -v '^#' files/etc/mosdns/adblock-extra.txt | grep -c '[a-z]' | tr -d ' ') 条"
          # 归一化：去 CR、去注释/空行、拆 hosts 前缀（0.0.0.0 x / 127.0.0.1 x）、
          # 拆 ABP 的 ||x^、去 *. 与前导点、小写、只留合法域名、去重排序
          if [ -s "$LIST" ]; then
              sed -e 's/\r$//' "$LIST" \
                | awk '
                    {
                      gsub(/^[ \t]+|[ \t]+$/, "")
                      if ($0 == "" || substr($0,1,1) == "#" || substr($0,1,1) == "!") next
                      if ($0 ~ /^0\.0\.0\.0[ \t]+/ || $0 ~ /^127\.0\.0\.1[ \t]+/) { sub(/^[^ \t]+[ \t]+/, "") }
                      else if (substr($0,1,2) == "||") { sub(/^\|\|/, ""); sub(/\^.*$/, "") }
                      else if ($0 ~ /^[|\/]/) next
                      if ($0 ~ /[ \t]/) next
                      while (substr($0,1,2) == "*.") sub(/^\*\./, "", $0)
                      while (substr($0,1,1) == ".")  sub(/^\./, "", $0)
                      sub(/\.+$/, "")
                      # 纯 IP（A/AAAA 字面量）对 qname 匹配没有意义，白占体积，直接丢
                      if ($0 ~ /^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$/) next
                      if ($0 ~ /:/) next
                      print tolower($0)
                    }' \
                | grep -E '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$' \
                | grep -Ev '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' \
                | LC_ALL=C sort -u > "$BLOCK"
          else
              echo "::error::三个广告源全部下载失败，本次构建没有去广告规则"
              exit 1
          fi

          # ---- 保护名单：这些域名（及其子域）绝不能被拦 ----
          # 只做"精确行删除"：只要 qq.com 这一行不在，qq.com 的所有子域也就不会被后缀匹配到。
          cat > /tmp/adlist/guard.txt << 'GUARD'
          qq.com
          weixin.qq.com
          wechat.com
          tencent.com
          myapp.com
          taobao.com
          tmall.com
          alipay.com
          alipayobjects.com
          alicdn.com
          aliyuncs.com
          baidu.com
          bdstatic.com
          bilibili.com
          hdslb.com
          iqiyi.com
          youku.com
          jd.com
          360buyimg.com
          pinduoduo.com
          meituan.com
          didiglobal.com
          bytedance.com
          douyin.com
          byteimg.com
          xiaomi.com
          mi.com
          huawei.com
          hicloud.com
          apple.com
          icloud.com
          mzstatic.com
          microsoft.com
          windowsupdate.com
          msftconnecttest.com
          msftncsi.com
          live.com
          office.com
          googleapis.com
          gstatic.com
          github.com
          githubusercontent.com
          cloudflare.com
          10086.cn
          chinamobile.com
          steampowered.com
          steamcommunity.com
          epicgames.com
          GUARD
          _before=$(wc -l < "$BLOCK" | tr -d " ")
          grep -Fvx -f /tmp/adlist/guard.txt "$BLOCK" > "$BLOCK.tmp" || true
          mv "$BLOCK.tmp" "$BLOCK"
          _after=$(wc -l < "$BLOCK" | tr -d " ")
          _drop=$((_before - _after))
          [ "$_drop" -gt 0 ] && echo "::warning::保护名单从清单里删掉了 $_drop 条（原本会误拦关键服务）"

          BLOCK_N=$(wc -l < "$BLOCK" | tr -d " ")
          BLOCK_B=$(wc -c < "$BLOCK" | tr -d " ")
          [ -n "$BLOCK_N" ] || BLOCK_N=0
          [ -n "$BLOCK_B" ] || BLOCK_B=0
          echo "广告域名清单: $BLOCK_N 条 / $BLOCK_B 字节（squashfs 压缩后约 +$((BLOCK_B / 3 / 1024)) KB）"
          for _f in anti-ad oisd adguard; do
            [ -s "/tmp/adlist/$_f.raw" ] && echo "  源 $_f：$(wc -l < "/tmp/adlist/$_f.raw" | tr -d " ") 行"
          done
          # 下限：三源合并后正常在 20 万条以上；低于 15 万说明有源挂了或格式变了
          if [ "$BLOCK_N" -lt 150000 ]; then
            echo "::warning::广告清单只有 $BLOCK_N 条（三源正常 >=200000）：看上面哪个源的下载/解析出了问题"
          fi

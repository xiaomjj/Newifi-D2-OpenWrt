            refresh: function () {
              var self = this;
              var tries = 0;

              function paint(d) {
                var old = document.querySelector('#maincontent .sb, #maincontent .xl');
                var node = self.render(d);
                if (old && old.parentNode) {
                  old.parentNode.replaceChild(node, old);

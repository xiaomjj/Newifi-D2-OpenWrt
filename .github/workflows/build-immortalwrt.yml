          cat > files/etc/uci-defaults/94-sqm-menu << 'SQMMENU_DEFAULTS_EOF'
          #!/bin/sh
          # 只保留自研 SQM 页面（admin/network/sqm → view sqm/overview）。
          #
          # 为什么按「内容」找而不是只按文件名覆盖：
          #   上游哪天把 SQM 菜单挪进别的包、或改了文件名，只覆盖 luci-app-sqm.json 就会
          #   静默失效 —— 原厂菜单重新冒出来、还和我们的节点抢同一个 key，而构建不报错。
          #   这里首次启动扫一遍，凡是又定义 admin/network/sqm 的菜单文件一律置空。
          #
          # 幂等：原厂文件已经是 {} 时 grep 不中，直接跳过；重复执行无副作用。

          for _f in /usr/share/luci/menu.d/*.json; do
              [ -f "$_f" ] || continue
              case "$_f" in
                  */luci-app-sqm-lite.json) continue ;;
              esac
              grep -q 'admin/network/sqm' "$_f" 2>/dev/null || continue
              printf '{}\n' > "$_f"
              logger -t sqm-menu "菜单已接管：$(basename "$_f") 置空（SQM 用自研页面）"
          done

          # 菜单树在浏览器 sessionStorage 里还有一份缓存，但那只对当前会话有效；
          # 这里清的是服务端 dispatch 缓存，保证新会话立刻拿到干净的菜单。
          rm -f /tmp/luci-indexcache* 2>/dev/null

          exit 0
          SQMMENU_DEFAULTS_EOF

          cat > files/usr/bin/sb-bootping << 'SBBOOTPING_EOF'
          #!/bin/sh
          # 补一次快速测速：开机后（默认延迟 90 秒）以及 cron 每 8 小时各跑一次。
          # 带参数 0 表示不延迟（给 cron 用），不带参数默认 90 秒（给开机用）。
          #
          # 为什么需要：
          #   均衡池靠 /etc/singbox/health 的实测排名取前 pool_cap 个（默认 12）。
          #   表缺失或全部过期时，render 会兜底成"全量池"（67 个节点），urltest 每轮要给
          #   67 个节点做 TLS 探测，在 MT7621 上很贵。断电放久一点再开机就会落到这个状态。
          #
          # 两道闸，缺一不可：
          #   1) 健康样本已经够（>= pool_cap）就什么都不做 —— 正常重启不会有任何额外开销；
          #   2) 必须先确认网络真的通了再测 —— 测早了会把 67 个节点全写成"不通"，
          #      池子反而退化成全量，而且得等 12h TTL 自然过期才恢复。

          DELAY="${1:-90}"
          # 第二个参数决定测完要不要换进程（换进程会让代理断 ~15 秒，实测）：
          #   开机：apply   —— 此时本来就没流量，健康表是空的，池子要从 67 收缩到 12
          #   周期：noapply —— 只刷新排名，等下一次自然 render 再生效，零中断
          APPLY="${2:-apply}"
          CAP=$(uci -q get singbox-lite.main.pool_cap 2>/dev/null)
          case "$CAP" in ''|*[!0-9]*) CAP=12 ;; esac
          [ "$CAP" -ge 2 ] || CAP=12

          sleep "$DELAY"

          # 用户在面板上显式「停止」过，别去打扰
          [ -f /tmp/sbguard.off ] && exit 0
          [ "$(uci -q get singbox-lite.main.enabled 2>/dev/null)" = "1" ] || exit 0
          # 没开负载均衡就用不到池子的排名
          [ "$(uci -q get singbox-lite.main.balance 2>/dev/null)" = "1" ] || exit 0
          # 正在测速（面板手动点过）就别重复起
          [ -f /tmp/sbping.pid ] && exit 0

          # 等网络就绪：默认路由 + 网关 ping + 公网 IP ping（全程不依赖 DNS ——
          # 开机时 mosdns 可能还没起来，用域名探测会误判成"网络没通"，白白跳过补测）。
          # 最多等 180 秒，够 5G 中继重新关联。
          _gw=$(ip route 2>/dev/null | awk '/^default/{print $3; exit}')
          _i=0
          while [ "$_i" -lt 36 ]; do
              if [ -n "$_gw" ] &&
                 ping -c1 -W3 "$_gw" >/dev/null 2>&1 &&
                 { ping -c1 -W3 223.5.5.5 >/dev/null 2>&1 || ping -c1 -W3 119.29.29.29 >/dev/null 2>&1; }; then
                  break
              fi
              _i=$(( _i + 1 ))
              sleep 5
              _gw=$(ip route 2>/dev/null | awk '/^default/{print $3; exit}')
          done
          if [ "$_i" -ge 36 ]; then
              logger -t sb-bootping "网络未就绪（网关 ${_gw:-none}），跳过开机测速"
              exit 0
          fi

          # 先按当前节点集合清一次表：订阅更新后节点名会整批换掉，不清的话旧条目会让
          # 下面的计数虚高（明明没有可用样本却以为够了），开机补测就被冤枉地跳过。
          /usr/libexec/singbox-ctl health-sync >/dev/null 2>&1

          # 新鲜可用的样本够不够
          _now=$(date +%s 2>/dev/null || echo 0)
          _good=$(awk -v now="$_now" -v ttl=43200 '$2 != "-" && (now - $3) < ttl' \
                  /etc/singbox/health 2>/dev/null | wc -l)
          case "$_good" in ''|*[!0-9]*) _good=0 ;; esac

          if [ "$_good" -ge "$CAP" ]; then
              # 这行日志是开机钩子唯一的可观测点：每次开机一行，便于确认它真的跑过
              logger -t sb-bootping "样本 ${_good}/${CAP} 充足，跳过开机测速"
              exit 0
          fi

          logger -t sb-bootping "样本 ${_good}/${CAP} 不足，开始后台快速测速"
          if [ "$APPLY" = "noapply" ]; then
              SB_PING_NOAPPLY=1 /usr/libexec/singbox-ctl ping-start quick >/dev/null 2>&1
          else
              /usr/libexec/singbox-ctl ping-start quick >/dev/null 2>&1
          fi
          exit 0
          SBBOOTPING_EOF

          cat > files/usr/share/rpcd/acl.d/luci-app-sqm-lite.json << 'SQMENU_EOF'
          {
            "luci-app-sqm-lite": {
              "description": "SQM 限速（lite）：查看整形状态、启停、实测校准与手动设置上下行",
              "read": {
                "file": {
                  "/usr/libexec/singbox-ctl": [ "exec" ],
                  "/etc/config/sqm": [ "read" ]
                }
              },
              "write": {
                "file": {
                  "/usr/libexec/singbox-ctl": [ "exec" ],
                  "/etc/config/sqm": [ "write" ]
                }
              }
            }
          }
          SQMENU_EOF

          # ---- sing-box 内核：优先用官方 Go 交叉编译最新版，失败自动回退 OpenWrt tiny ----
          # 结论修正（2026-11-23 实机验证）：
          #   · 官方 release 的 linux-mipsle 是 **hardfloat**，而本机 OpenWrt 用 **softfloat**
          #     → 直接 Illegal instruction。这是 ABI 不匹配，不是"CPU 不支持"。
          #   · 用官方 Go 交叉编译并显式 GOMIPS=softfloat，编出的 42.7MB 二进制能正常跑：
          #     实测 version / check（1.12 生成的配置直接兼容）/ TCP 代理出网 全部 OK。
          #   · 体积代价实测（xz -9 ≈ squashfs）：1.14.4 raw 41728KB → 7954KB；tiny 1.12.22 raw
          #     31145KB → 6162KB —— 只差 1.8MB（此前按 gzip 比例估成"多 3MB"，是高估）。
          #     参照：25.12 实机镜像 squashfs 24.8MB/可用约 29MB，删掉 xray-core(33.5MB raw)
          #     换 sing-box(42.7MB raw) 净多约 1.3MB，余量约 3MB，装得下。
          #   · 构建多 5-8 分钟（下 Go + 依赖 + 编译）；任何一步失败都会回退 tiny。
          # ★ UDP 走 tproxy 不通与版本无关（1.12 与 1.14 都是 origdst 丢地址 → 目标变成 LAN IP），
          #   要代理 UDP 只能用 TUN 模式，别把锅算到版本头上。
          mkdir -p files/usr/bin files/etc/singbox-lite files/etc/singbox
          SB_VER="v1.14.4"
          GO_VER="1.26.11"
          SB_TAGS="with_quic,with_utls"     # hysteria2/tuic 要 with_quic；Reality 要 with_utls
          _sok=0
          # ---- 路线 A：官方 Go 交叉编译（mipsle/softfloat，CGO 关掉=纯静态，不依赖 musl）----
          if curl -fsSL -m 600 "https://mirrors.ustc.edu.cn/golang/go${GO_VER}.linux-amd64.tar.gz" -o /tmp/go.tgz 2>/dev/null; then
            rm -rf /tmp/gotk && mkdir -p /tmp/gotk
            if tar -xzf /tmp/go.tgz -C /tmp/gotk --strip-components=1 2>/dev/null; then
              if ( export PATH=/tmp/gotk/bin:$PATH GOPATH=/tmp/gopath \
                        GOPROXY=https://proxy.golang.org,https://goproxy.cn,direct \
                        GOSUMDB=off GOTOOLCHAIN=local \
                        GOOS=linux GOARCH=mipsle GOMIPS=softfloat CGO_ENABLED=0
                   go install -trimpath -tags "$SB_TAGS" \
                     -ldflags "-s -w -buildid= -X github.com/sagernet/sing-box/constant.Version=$SB_VER" \
                     "github.com/sagernet/sing-box/cmd/sing-box@$SB_VER" ); then
                _cand=/tmp/gopath/bin/linux_mipsle/sing-box
                if [ -s "$_cand" ] && [ "$(wc -c < "$_cand")" -le 45000000 ]; then
                  cp -f "$_cand" files/usr/bin/sing-box
                  echo "sing-box $SB_VER (self-compiled go$GO_VER, mipsle softfloat)" > files/etc/singbox-lite/version
                  _sok=1
                  echo "  ✓ sing-box $SB_VER 自编译成功 ← go$GO_VER ($(wc -c < files/usr/bin/sing-box) 字节)"
                else
                  echo "::warning::自编译产物缺失或超过 45MB，回退 tiny"
                fi
              else
                echo "::warning::go install 失败（源码/依赖下载问题），回退 tiny"
              fi
            fi
          else
            echo "::warning::Go $GO_VER 下载失败，回退 tiny"
          fi
          # ---- 路线 B：回退 OpenWrt 24.10 的 sing-box-tiny 1.12.22（31.9MB，已验证可跑）----
          if [ "$_sok" = "0" ]; then
            SB_PKG="sing-box-tiny_1.12.22-r1_mipsel_24kc.ipk"
            rm -f /tmp/sb.ipk
            _pkgok=0
            for _u in "https://downloads.openwrt.org/releases/24.10.4/packages/mipsel_24kc/packages" \
                      "https://mirrors.tuna.tsinghua.edu.cn/openwrt/releases/24.10.4/packages/mipsel_24kc/packages" \
                      "https://mirrors.ustc.edu.cn/openwrt/releases/24.10.4/packages/mipsel_24kc/packages"; do
              if curl -fsSL -m 300 "$_u/$SB_PKG" -o /tmp/sb.ipk 2>/dev/null; then
                _pkgok=1; echo "  ✓ sing-box 包 ← $_u"; break
              fi
            done
            [ "$_pkgok" = "1" ] || { echo "::error::sing-box 内核下载失败（自编译与 tiny 都失败）"; exit 1; }
            rm -rf /tmp/sbx && mkdir -p /tmp/sbx
            if tar -xzf /tmp/sb.ipk -C /tmp/sbx 2>/dev/null && [ -f /tmp/sbx/data.tar.gz ]; then
              tar -xzf /tmp/sbx/data.tar.gz -C /tmp/sbx
            elif ar x /tmp/sb.ipk --output=/tmp/sbx 2>/dev/null || (cd /tmp/sbx && ar x /tmp/sb.ipk 2>/dev/null); then
              tar -xzf /tmp/sbx/data.tar.gz -C /tmp/sbx
            fi
            [ -s /tmp/sbx/usr/bin/sing-box ] || { echo "::error::sing-box 二进制解包失败"; exit 1; }
            cp -f /tmp/sbx/usr/bin/sing-box files/usr/bin/sing-box
            echo "sing-box 1.12.22 (openwrt tiny)" > files/etc/singbox-lite/version
            echo "  ✓ sing-box 1.12.22 tiny ($(wc -c < files/usr/bin/sing-box) 字节)"
          fi
          chmod +x files/usr/bin/sing-box
          # 记录编译特性：with_quic 缺失则 hysteria2 用不了
          strings files/usr/bin/sing-box 2>/dev/null | grep -m1 'with_quic' >/dev/null \
            && echo "  ✓ with_quic 在（hysteria2/tuic 可用）" \
            || echo "::warning::这个 sing-box 可能不含 with_quic，hysteria2 会不可用"

          # ---- 国内 CIDR（rule 模式"国内直连"用；不依赖 geoip.dat）----
          _cok=0
          for _u in "https://ispip.clang.cn/all_cn.txt" \
                    "https://raw.githubusercontent.com/17mon/china_ip_list/master/china_ip_list.txt" \
                    "https://cdn.jsdelivr.net/gh/17mon/china_ip_list@master/china_ip_list.txt"; do
            if curl -fsSL -m 90 "$_u" -o /tmp/chn.txt 2>/dev/null && [ "$(wc -l < /tmp/chn.txt)" -gt 1000 ]; then
              grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/[0-9]+' /tmp/chn.txt | tr -d ' \r' | sort -u > files/etc/singbox/chnroute.txt
              [ "$(wc -l < files/etc/singbox/chnroute.txt)" -gt 1000 ] && { _cok=1; echo "  ✓ chnroute $(wc -l < files/etc/singbox/chnroute.txt) 条 ← $_u"; break; }
            fi
          done
          [ "$_cok" = "1" ] || echo "::warning::chnroute 下载失败：rule 模式会退化成全局代理（功能仍可用）"

          # ---- 域名分流名单（不依赖 geosite/geoip）----
          # gfwlist → proxy-domains.txt（rule 模式下命中即走代理）
          _pok=0
          for _gu in "https://raw.githubusercontent.com/gfwlist/gfwlist/master/gfwlist.txt" \
                     "https://cdn.jsdelivr.net/gh/gfwlist/gfwlist@master/gfwlist.txt"; do
            if curl -fsSL -m 90 "$_gu" -o /tmp/gfw.txt 2>/dev/null && [ -s /tmp/gfw.txt ]; then
              base64 -d /tmp/gfw.txt 2>/dev/null > /tmp/gfw.d || cp /tmp/gfw.txt /tmp/gfw.d
              grep -oE '\|\|[a-zA-Z0-9._-]+' /tmp/gfw.d | sed 's/^||//' | tr 'A-Z' 'a-z' | sort -u > files/etc/singbox/proxy-domains.txt
              if [ "$(wc -l < files/etc/singbox/proxy-domains.txt)" -gt 500 ]; then
                _pok=1; echo "  ✓ proxy-domains $(wc -l < files/etc/singbox/proxy-domains.txt) 条 ← $_gu"; break
              fi
            fi
          done
          [ "$_pok" = "1" ] || echo "::warning::gfwlist 下载失败：域名分流不可用（仍可按 IP 分流）"

          # 强制直连名单（避免 CDN/支付/银行被代理绕路）
          cat > files/etc/singbox/direct-domains.txt << 'DDOM_EOF'
          # 每行一个域名（子域自动命中）；# 开头是注释
          qq.com
          weixin.qq.com
          tencent.com
          taobao.com
          tmall.com
          alipay.com
          aliyun.com
          aliyuncs.com
          jd.com
          baidu.com
          bilibili.com
          iqiyi.com
          youku.com
          meituan.com
          pinduoduo.com
          didiglobal.com
          12306.cn
          gov.cn
          DDOM_EOF
          echo "  ✓ direct-domains $(grep -vc '^#' files/etc/singbox/direct-domains.txt | tr -d ' ') 条"
          cat > files/etc/hotplug.d/net/20-usbwan << 'EOF'
          #!/bin/sh
          [ -n "$INTERFACE" ] || exit 0
          case "$INTERFACE" in usb*|wwan*|eth1|eth2) ;; *) exit 0 ;; esac

          is_usb() {
              _d=$(readlink -f "/sys/class/net/$INTERFACE/device" 2>/dev/null)
              case "$_d" in */usb*) return 0 ;; esac
              [ -f "/sys/class/net/$INTERFACE/device/uevent" ] && \
                  grep -q 'DEVTYPE=usb_interface' "/sys/class/net/$INTERFACE/device/uevent"
          }

          wan_zone() {
              uci show firewall 2>/dev/null \
                  | sed -n "s/^firewall\.\(@zone\[[0-9]*\]\)\.name='wan'$/\1/p" \
                  | head -n1
          }

          case "$ACTION" in
            add)
              is_usb || exit 0
              [ "$(uci -q get network.usbwan.device)" = "$INTERFACE" ] && exit 0
              uci set network.usbwan=interface
              uci set network.usbwan.proto='dhcp'
              uci set network.usbwan.device="$INTERFACE"
              uci set network.usbwan.metric='10'
              uci commit network
              _z=$(wan_zone)
              if [ -n "$_z" ]; then
                  uci -q del_list "firewall.$_z.network=usbwan"
                  uci add_list "firewall.$_z.network=usbwan"
                  uci commit firewall
                  /etc/init.d/firewall reload
              fi
              /etc/init.d/network reload
              logger -t usbwan "已绑定 $INTERFACE -> usbwan"
              ;;
            remove)
              [ "$(uci -q get network.usbwan.device)" = "$INTERFACE" ] || exit 0
              uci -q delete network.usbwan
              uci commit network
              _z=$(wan_zone)
              if [ -n "$_z" ]; then
                  uci -q del_list "firewall.$_z.network=usbwan"
                  uci commit firewall
                  /etc/init.d/firewall reload
              fi
              /etc/init.d/network reload
              logger -t usbwan "$INTERFACE 已移除，清理 usbwan"
              ;;
          esac
          exit 0
          EOF

          # ---------- E. ksmbd / p910nd ----------
          cat > files/etc/config/ksmbd << 'EOF'
          config globals
              option workgroup 'WORKGROUP'
              option description 'Newifi-D2'

          config share
              option name 'usb'
              option path '/mnt/sda1'
              option read_only 'no'
              option guest_ok 'yes'
              option create_mask '0666'
              option dir_mask '0777'

# ============================================================
#  ImmortalWrt 24.10 (openwrt-24.10) — newifi-d2 构建（仅手动触发）
#  设计原则：
#   1. 依赖一律走官方 feeds，不再手工克隆任何代理面板（避免同名包重复定义）
#   2. 第三方源码只保留 TurboACC（不编 geo 数据；代理 = PassWall + Xray，DNS = MosDNS 去广告/DoH）
#   3. defconfig 之后做"硬校验"，缺包直接失败，拒绝产出残缺固件
#   4. 代理面就是 PassWall 自己的 LuCI 页面（服务 → PassWall），不再自研前端
#   5. 全流程日志落盘 build.log，失败必留日志
# ============================================================
name: Build ImmortalWrt 24.10 for Newifi-D2

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: "丢弃 ccache / dl 缓存（改依赖后建议勾选）"
        type: boolean
        default: false
      go_version:
        description: "Go 工具链版本（auto = 跟随 feeds 默认；24.10 的 golang 是单包、无 GO_DEFAULT_VERSION，此项会被忽略并告警）"
        type: choice
        options:
          - auto
          - "1.26"
          - "1.27"
        default: auto
      with_turboacc:
        description: "是否编入 TurboACC（若它编译失败，设为 false 重跑即可；加速不依赖它）"
        type: boolean
        default: true

  # ---- 只保留手动触发：已按要求关闭每周六定时构建 ----
  # 想出新固件：Actions → 本工作流 → Run workflow（改过依赖就勾 clean_build）。
  # 刷进路由器之后，固件不会联网自动下载/自动升级任何东西（规则与广告清单都在构建期写入镜像）。

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  # 24.10 是 LTS 维护分支（内核 6.6），不是"旧版"：它是目前 mt7621 上最稳的线。
  # 为何不用 25.12：ramips/mt7621 有 MT7530 FDB 失步回归（openwrt#25305），
  # Wi-Fi 漫游后 DNS/ping 正常但 TCP 断流；24.10 无此问题。
  REPO_BRANCH: openwrt-24.10
  CONFIG_FILE: newifi-d2.config
  TZ: Asia/Shanghai
  # d-team_newifi-d2 的 firmware 分区 = 0x1FB0000 = 33226752 字节
  MAX_FIRMWARE_SIZE: 33226752
  CCACHE_DIR: /workdir/immortalwrt/.ccache
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 420

    steps:
      # ---------------------------------------------------------------
      - name: 1. 检出本仓库
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      - name: 2. 准备编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 释放 runner 空间（immortalwrt 全量构建约需 15~20GB）
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/powershell /usr/local/share/chromium \
                      /usr/share/swift /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          echo "---- 清理后磁盘 ----"
          df -h /
          AVAIL_GB=$(df -Pk / | awk 'NR==2{printf "%d", $4/1048576}')
          echo "可用空间: ${AVAIL_GB} GB"
          if [ "$AVAIL_GB" -lt 15 ]; then
            echo "::warning::可用空间仅 ${AVAIL_GB}GB，可能不足；如失败请改用 larger runner"
          fi
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache cmake cpio curl \
            device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libelf-dev libglib2.0-dev libgmp3-dev \
            liblzo2-dev libncurses5-dev libssl-dev libtool lrzsz mkisofs nano \
            ninja-build p7zip-full patch pkg-config python3 python3-dev python3-pip \
            python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip wget xmlto xxd zlib1g-dev

          sudo ln -sf /usr/share/zoneinfo/$TZ /etc/localtime
          echo "$TZ" | sudo tee /etc/timezone > /dev/null
          sudo timedatectl set-ntp true || true

          sudo mkdir -p /workdir
          sudo chown -R "$USER":"$USER" /workdir

          ccache --version | head -n1
          df -h / /workdir

      # ---------------------------------------------------------------
      - name: 3. 克隆 ImmortalWrt 24.10
        working-directory: /workdir
        run: |
          git clone --depth=1 -b "$REPO_BRANCH" "$REPO_URL" immortalwrt
          ln -sfn /workdir/immortalwrt "$GITHUB_WORKSPACE/immortalwrt"
          cd immortalwrt
          git log -1 --format='分支 %D | %h %s'

      # ---------------------------------------------------------------
      - name: 4. 安装官方 feeds 并植入第三方源码（TurboACC / PassWall）
        run: |
          cd immortalwrt

          # --- 官方 feeds（luci-app-passwall / xray-core / MosDNS / dnsmasq 全部由 feeds 提供）---
          cat > feeds.conf.default << 'EOF'
          src-git packages https://github.com/immortalwrt/packages.git;openwrt-24.10
          src-git luci https://github.com/immortalwrt/luci.git;openwrt-24.10
          src-git routing https://github.com/openwrt/routing.git;openwrt-24.10
          EOF

          ./scripts/feeds update -a
          # 关键：必须是 -a。原脚本的 "-d default" 什么都没装
          ./scripts/feeds install -a

          # 规避 Kconfig 递归依赖（weechat 三件套互相 select，defconfig 会报
          # recursive dependency detected）。这两个包我们永远不用，直接摘掉。
          rm -rf package/feeds/packages/weechat package/feeds/luci/luci-app-weechat
          # 同理，gst1-plugins-base 的 3 个可选依赖在 24.10 里也不存在，只是噪声
          echo "已摘要无关包：weechat / luci-app-weechat"

          # 规避 Kconfig 递归依赖（第 2 类）：dnsdist / snort3 / knot-resolver 这些包
          # 共同点是 DEPENDS 里带 "@HAS_LUAJIT_ARCH +luajit"。上游 luajit 相关的
          # provides 一变，它们就退化成"自依赖"（symbol PACKAGE_dnsdist depends on
          # PACKAGE_dnsdist），make defconfig 会刷一屏 error（upstream issue 已复现多次）。
          # 本固件一个都用不到，直接摘掉，从根上消掉这些 .config-package.in 条目。
          for p in dnsdist snort snort3 knot-resolver openappid; do
            if [ -e "package/feeds/packages/$p" ]; then
              rm -rf "package/feeds/packages/$p"
              echo "  已摘除（luajit 递归依赖受害包）：$p"
            fi
          done

          # --- 代理栈依赖预检（1 分钟内就能知道缺不缺，不用等编译）---
          echo "---- PassWall / Xray 依赖预检 ----"
          DEP_MISS=0
          # luci-app-passwall 25.12 的 LUCI_DEPENDS：curl + chinadns-ng + dns2socks + ip-full +
          # lua + luci-compat + luci-lib-jsonc + microsocks + resolveip + tcping + coreutils*
          for p in luci-app-passwall xray-core chinadns-ng dns2socks microsocks \
                   luci-compat luci-lib-jsonc mosdns \
                   nftables kmod-nft-tproxy kmod-nft-socket kmod-nft-nat; do
            if [ -d "package/feeds/packages/$p" ] || [ -d "package/feeds/luci/$p" ] \
               || [ -d "package/$p" ] || [ -d "package/feeds/base/$p" ]; then
              printf '  ✅ %s\n' "$p"
            else
              printf '::warning::依赖缺失 %s\n' "$p"
              DEP_MISS=$((DEP_MISS + 1))
            fi
          done
          if [ "$DEP_MISS" -gt 0 ]; then
            echo "::warning::有 $DEP_MISS 个依赖不在 feeds 中，第 7 步会再确认一次"
          fi

          # --- 第三方源码 ---
          rm -rf package/luci-app-mosdns package/geo2txt package/turboacc

          # MosDNS：用官方 feeds 里的 mosdns 二进制（5.3.x），**不装** luci-app-mosdns。
          #   luci-app-mosdns 的 LUCI_DEPENDS 里硬写了 +v2ray-geoip +v2ray-geosite
          #   +geo2txt，一装就会把 10.9MB 的 geosite.dat 拉回镜像；而我们只要
          #   "域名集合 + DoH 上游"两件事，自己写 /etc/mosdns/config.yaml 就够。
          #   服务脚本与配置由第 5 步的 files/ 覆盖层提供（C3 节）。

          # GeoData：本固件【也不包含】。不克隆 sbwml/v2ray-geodata，也就不产
          # v2ray-geoip(135KB) / v2ray-geosite(10.9MB)；分流转而只靠第 9 步的文本规则。

          # TurboACC：24.10 的 luci feed 同样没有 luci-app-turboacc，只能从上游克隆。
          # 它是纯 LuCI + 脚本（不依赖内核补丁），lua / luci-compat 由 luci feed 带入。
          # 克隆失败不终止构建：打标记，第 7 步自动跳过这个包（加速不依赖它）。
          git clone --depth=1 https://github.com/chenmozhijin/turboacc.git package/turboacc || true
          if [ ! -f package/turboacc/luci-app-turboacc/Makefile ]; then
            echo "::warning::TurboACC 源码不可用，本次构建跳过它（offload/BBR 不受影响）"
            touch /workdir/no-turboacc-src
          fi

          # --- 代理核心版本确认（都由 feeds 提供，不做替换、不克隆第三方源）---
          # 选型理由：luci-app-passwall 25.12.x + xray-core 25.x 是 24.10 官方源里成对发布的组合。
          # 上游新组织（Openwrt-Passwall/openwrt-passwall main，26.11.11）的 xray-core 26.11.9
          # 要求 golang >= 1.27，而 24.10 的 feeds 只有 1.23.12，直接编不出来 —— 所以固定用官方源这一对。
          PV=$(sed -n 's/^PKG_VERSION:=//p' package/feeds/luci/luci-app-passwall/Makefile 2>/dev/null)
          XV=$(sed -n 's/^PKG_VERSION:=//p' package/feeds/packages/xray-core/Makefile 2>/dev/null)
          if [ -z "$PV" ]; then
            echo "::error::feeds 里找不到 luci-app-passwall 源码，构建中止"
            exit 1
          fi
          if [ -z "$XV" ]; then
            echo "::error::feeds 里找不到 xray-core 源码，构建中止"
            exit 1
          fi
          echo "  · luci-app-passwall : $PV"
          echo "  · xray-core         : $XV（geoip/geosite 不装，普通节点不需要）"

          # --- 同名包去重：一律以本地源码为准 ---
          rm -rf package/feeds/luci/luci-app-turboacc
          # geo 数据的源码也一起摘掉：就算哪天 .config 里冒出 =y，也拉不进镜像
          rm -rf package/feeds/packages/v2ray-geoip \
                 package/feeds/packages/v2ray-geosite
          # luci-app-mosdns 要摘掉（它的 LUCI_DEPENDS 会拉 geoip/geosite/geo2txt），
          # 但 mosdns 二进制本身必须留着 —— 去广告和上游加密都靠它
          rm -rf package/feeds/luci/luci-app-mosdns \
                 package/feeds/packages/geo2txt

          # --- 源码完整性硬校验（MosDNS / PassWall / Xray 绝不放过）---
          MISSING_SRC=0
          for m in package/feeds/packages/mosdns package/feeds/luci/luci-app-passwall \
                   package/feeds/packages/xray-core; do
            if [ -f "$m/Makefile" ]; then
              echo "  ✅ $m"
            else
              echo "::error::源码缺失：$m"
              MISSING_SRC=1
            fi
          done
          # TurboACC 是可选件：源码缺失只告警，第 7 步会自动跳过它
          if [ -f package/turboacc/luci-app-turboacc/Makefile ]; then
            echo "  ✅ package/turboacc/luci-app-turboacc"
          else
            echo "::warning::TurboACC 源码缺失，本次构建不含它（offload/BBR 不受影响）"
            touch /workdir/no-turboacc-src
          fi
          [ "$MISSING_SRC" -eq 0 ] || exit 1
          echo "✅ feeds 与第三方源码全部就绪"

      # ---------------------------------------------------------------
      - name: 5. 生成预置配置 (files/)
        run: |
          cd immortalwrt
          mkdir -p files/etc/uci-defaults files/etc/hotplug.d/net \
                   files/etc/config files/etc/crontabs files/usr/bin

          # ---------- A. 系统 / LuCI 默认语言 / 主机名 / NTP ----------
          # ⚠️ 铁律：首次启动脚本【只改已存在的配置段】，绝不新建
          #    新建空的 network/system 段会让 config_generate 认为配置已存在而跳过，
          #    结果是 LAN 没有 proto/device → br-lan 建不出来 → 全屋拿不到 IP。
          cat > files/etc/uci-defaults/90-luci << 'EOF'
          #!/bin/sh

          # 系统信息：段存在才改
          if uci -q get system.@system[0] >/dev/null 2>&1; then
              uci set system.@system[0].hostname='Newifi-D2'
              uci set system.@system[0].timezone='CST-8'
              uci set system.@system[0].zonename='Asia/Shanghai'
              if uci -q get system.ntp >/dev/null 2>&1; then
                  uci -q delete system.ntp.server
                  uci add_list system.ntp.server='ntp.aliyun.com'
                  uci add_list system.ntp.server='cn.pool.ntp.org'
                  uci add_list system.ntp.server='time.cloudflare.com'
              fi
              uci commit system
          fi

          # 默认中文：段存在才改
          if uci -q get luci.main >/dev/null 2>&1; then
              uci set luci.main.lang='zh_cn'
              uci commit luci
          fi

          # LAN 地址：这里【不写】。由构建时对 config_generate 的 sed 决定（与原配置同一做法），
          # 避免在配置尚未生成时创建残段。万一仍然异常，由 /etc/rc.local 的自愈逻辑兜底修复。
          exit 0
          EOF

          # ---------- B. 无线：双频开启 + 中国区 + WPA2 ----------
          # 铁律：无线配置不存在就完全不碰，交给系统自己生成
          # 这里的参数全都可以在路由器上用 uci set 改掉，不用重新刷机
          cat > files/etc/uci-defaults/91-wireless << 'EOF'
          #!/bin/sh
          # 无线参数：只改“怎么用”，不改“能不能用”——每一行都能单独 uci set 覆写
          #   为什么信道不再写死：固定 2.4G=11 / 5G=36 时，只要邻居也占这两个信道，
          #   协商速率就会反复跌落，体感就是“时强时弱、时有时无”。
          # 首次开机时 /etc/config/wireless 可能还没被探测出来：先让系统探测一次，
          # 否则下面这些设置会整段跳过（用户拿到的是默认 SSID/无密码，等于没开箱即用）。
          # 探测失败就退出，绝不手写无线配置（写错会直接没信号）。
          if [ ! -f /etc/config/wireless ]; then
              /sbin/wifi config >/dev/null 2>&1
          fi
          [ -f /etc/config/wireless ] || exit 0
          uci -q get wireless.radio0 >/dev/null 2>&1 || exit 0

          # ---- 2.4G：交给 ACS 在 1/6/11 里挑最空的；noscan 关掉后台扫信道造成的周期性断流 ----
          uci set wireless.radio0.disabled='0'
          uci set wireless.radio0.country='CN'
          uci set wireless.radio0.channel='auto'
          uci set wireless.radio0.htmode='HT20'
          uci set wireless.radio0.noscan='1'

          # ---- 5G：默认落在 149 段（5.8G）。两个理由：
          #   1) CN 法规里 5.8G 的允许 EIRP 比 5.1G(36-48) 高，同样的机器穿墙更好；
          #   2) 149-165 不是 DFS 信道，不会被雷达检测强制静默 60 秒（“突然没信号”的常见元凶）。
          #   个别老设备不认 5.8G 的话，把下面两行改成 channel='36' 即可。
          uci set wireless.radio1.disabled='0'
          uci set wireless.radio1.country='CN'
          uci set wireless.radio1.channel='149'
          uci set wireless.radio1.htmode='VHT80'
          uci set wireless.radio1.noscan='1'

          # ---- SSID / 密码保持原样 ----
          uci set wireless.default_radio0.ssid='alon'
          uci set wireless.default_radio0.encryption='psk2'
          uci set wireless.default_radio0.key='alon12345678'
          uci set wireless.default_radio0.disabled='0'
          # 弱信号时不要因为连续 ack 失败就踢客户端（默认会踢，表现是“时不时掉线又自己回来”）
          uci set wireless.default_radio0.disassoc_low_ack='0'
          uci set wireless.default_radio1.ssid='alon-5G'
          uci set wireless.default_radio1.encryption='psk2'
          uci set wireless.default_radio1.key='alon12345678'
          uci set wireless.default_radio1.disabled='0'
          uci set wireless.default_radio1.disassoc_low_ack='0'

          uci commit wireless
          exit 0
          EOF

          # ---------- C. PassWall 默认参数（DNS = MosDNS，代理 = PassWall + Xray TProxy）----------
          cat > files/etc/uci-defaults/92-services << "EOF"
          #!/bin/sh
          # ---- DNS 架构（两段，各管一件事，别再混）----
          #   客户端 :53 → 系统 dnsmasq → 127.0.0.1#5335 MosDNS
          #   路由器自身 :53 → 系统 dnsmasq → 127.0.0.1#5335 MosDNS
          #   MosDNS(5335)：命中广告集合 → 0.0.0.0 / ::；未命中 → DoH 上游（阿里/腾讯）+ 进程内缓存
          # ---- 为什么 dns_redirect 必须是 0 ----
          #   dns_redirect=1 时 PassWall 会在 11400 起一份副本 dnsmasq，并把客户端 53 端口
          #   劫持过去 —— 那条路完全绕开 MosDNS，去广告立刻失效。设 0 后它只用系统 dnsmasq
          #   的 conf-dir 追加自己那几条按域名分流的 server= 规则，不改我们的上游。
          # ---- 代理模式：绕过大陆 ----
          #   tcp_proxy_mode=proxy + chn_list=direct + use_gfw_list=1：命中 chnroute 的 IP 在
          #   nftset @passwall_chn 上直接 return（直连），其余走 Xray。
          #   udp_proxy_mode=disable：UDP 不代理；配合 global_forwarding 默认的
          #   udp_proxy_drop_ports='443' 禁掉 QUIC，浏览器自动回落 TCP，少一层 NAT 和回环。
          # ---- 规则文件：随包自带，不需要 geoip.dat ----
          #   /usr/share/passwall/rules/{chnroute,chnlist,gfwlist,...} 约 1.5MB，安装即生效。
          #   global_rules 里那四个 *_update 全关：开着会在启动时联网拉规则，
          #   而本固件不出网自更新（规则随固件发布）。
          # ---- 配置骨架：包里的 0_default_config 是首启模板，先落一份 ----
          if [ ! -f /etc/config/passwall ] && [ -f /usr/share/passwall/0_default_config ]; then
            cp -f /usr/share/passwall/0_default_config /etc/config/passwall
          fi
          if uci -q get passwall.@global[0] >/dev/null 2>&1; then
            uci set passwall.@global[0].enabled='1'
            uci set passwall.@global[0].tcp_proxy_mode='proxy'
            uci set passwall.@global[0].udp_proxy_mode='disable'
            uci set passwall.@global[0].chn_list='direct'
            uci set passwall.@global[0].use_gfw_list='1'
            uci set passwall.@global[0].dns_shunt='chinadns-ng'
            uci set passwall.@global[0].dns_mode='tcp'
            uci set passwall.@global[0].remote_dns='1.1.1.1'
            uci set passwall.@global[0].dns_redirect='0'
            uci set passwall.@global[0].use_block_list='0'
            uci set passwall.@global[0].localhost_proxy='1'
            uci set passwall.@global[0].client_proxy='1'
            # tcp_proxy_way 与 use_nft 属于 global_forwarding 段（app.sh:2207/2075 从这里读），
            # 写到 global[0] 上等于没写：不存在的选项不报错也不生效，查都查不出来。
            uci -q set passwall.@global_forwarding[0].tcp_proxy_way='redirect'
            # use_nft=1 直接走 nftables；=0 时它先试 iptables+ipset（本固件没有 ipset），
            # 每次启动都会先打一行「无法使用iptables+ipset」再自动切 nftables。
            uci -q set passwall.@global_forwarding[0].use_nft='1'
            for _r in chnlist_update chnroute_update chnroute6_update gfwlist_update; do
              uci -q set "passwall.@global_rules[0].$_r=0"
            done
            uci -q set passwall.@global_rules[0].geoip_update='0'
            uci -q set passwall.@global_rules[0].geosite_update='0'
            uci commit passwall
          fi
          # 防火墙 include：PassWall 的 nft 规则由 /var/etc/passwall.include 注入 fw4。
          # uci-defaults 原脚本会补，但补之前若已经 restart 过防火墙就会丢规则，这里提前写好。
          if ! uci -q get firewall.passwall >/dev/null 2>&1; then uci set firewall.passwall='include'; fi
          uci set firewall.passwall.type='script'
          uci set firewall.passwall.path='/var/etc/passwall.include'
          uci set firewall.passwall.reload='1'
          uci commit firewall
          # dnsmasq 允许外部 include：PassWall 靠它追加按域名分流的 server= 规则
          if uci -q get dhcp.@dnsmasq[0] >/dev/null 2>&1; then
            uci -q set dhcp.@dnsmasq[0].localuse='1'
            uci -q commit dhcp
          fi

          # ---- TurboACC ----
          if uci -q get turboacc.@turboacc[0] >/dev/null 2>&1; then
              uci set turboacc.@turboacc[0].sw_flow='1'
              uci set turboacc.@turboacc[0].hw_flow='1'
              uci set turboacc.@turboacc[0].bbr_cca='1'
              # 全锥 NAT 默认关：需要 kmod-nft-fullcone，当前镜像未编入。
              # 想开：先确认 feeds 有该 kmod（.config 里 INCLUDE_NFT_FULLCONE 改 y），再把这里改 1
              uci set turboacc.@turboacc[0].fullcone_nat='0'
              uci commit turboacc
          fi

          # 与透明代理的兼容性（别轻易关掉，也理解它为什么不会打断代理）：
          #   直连流量走 forward → 进 flowtable 分载，提速；
          #   被代理的流量在 prerouting 就被 redirect/tproxy 抓成本地连接，根本走不到
          #   forward，所以分载和透明代理不冲突。真遇到"代理通、网页卡"再依次关
          #   hw_flow → sw_flow 排查。
          # ---- 防火墙流量分载：不依赖 TurboACC，装了/没装都生效 ----
          # TurboACC 只是 UI + 额外选项；核心加速走 firewall4 原生 offload。
          if uci -q get firewall.@defaults[0] >/dev/null 2>&1; then
              uci set firewall.@defaults[0].flow_offloading='1'
              uci commit firewall
          fi

          # ---- 系统 dnsmasq：上游固定指向 MosDNS ----
          #   只留一条 server=：全机唯一的解析路径就是 dnsmasq → MosDNS#5335，
          #   客户端查询与路由器自身查询都走它。PassWall 不抢 53（dns_redirect=0，只做 TPROXY）。
          if uci -q get dhcp.@dnsmasq[0] >/dev/null 2>&1; then
              uci -q delete dhcp.@dnsmasq[0].server
              uci -q add_list dhcp.@dnsmasq[0].server="127.0.0.1#5335"
              uci -q set dhcp.@dnsmasq[0].noresolv="1"
              # 0.0.0.0 这类应答会被 rebind 保护拦掉，去广告就失效了
              uci -q set dhcp.@dnsmasq[0].rebind_protection="0"
              uci -q set dhcp.@dnsmasq[0].cachesize="1000"
              uci -q commit dhcp
          fi

          # ---- 只 enable，不在这里 start（此时网络还没起来）----
          # 按 settings.conf / upstreams.conf 重新生成 MosDNS 配置（与 LuCI 页面同一套渲染逻辑）
          if [ -x /usr/libexec/mosdns-ctl ]; then
              /usr/libexec/mosdns-ctl render >/dev/null 2>&1 || true
          fi
          
          for s in ksmbd p910nd zram cron mosdns passwall; do
              [ -x "/etc/init.d/$s" ] && /etc/init.d/$s enable
          done
          exit 0
          EOF

          # ---------- C2. DNS 应急回滚：一条命令把 DNS 拉回可用状态 ----------
          # 网页打不开但能 ping 通 IP 时，SSH 执行 dns-recover
          cat > files/usr/bin/dns-recover << "EOF"
          #!/bin/sh
          # 应急回滚：三步，任何一步失败都继续往下退，绝不断网
          #   1) 停 PassWall：撤掉 TPROXY 规则并断开本地代理端口
          #   2) 确认 MosDNS 在跑（它挂了 dnsmasq 就没有上游可用）
          #   3) dnsmasq 上游指回 MosDNS，并摘掉 PassWall 塞进去的 addnmount；
          #      MosDNS 也起不来就退回 WAN 明文上游

          echo "== 1/3 停用 PassWall（撤掉 TPROXY 规则）=="
          /etc/init.d/passwall stop 2>/dev/null || true
          # 兜底：残留的 nft 链靠重启一次防火墙清干净
          /etc/init.d/firewall restart 2>/dev/null

          echo "== 2/3 确认 MosDNS =="
          if pidof mosdns >/dev/null 2>&1; then
              echo "   MosDNS 运行中"
          else
              echo "   MosDNS 未运行，尝试启动"
              /etc/init.d/mosdns restart 2>/dev/null
              sleep 3
          fi

          echo "== 3/3 让 dnsmasq 指向 MosDNS =="
          uci -q delete dhcp.@dnsmasq[0].server
          uci -q add_list dhcp.@dnsmasq[0].server="127.0.0.1#5335"
          uci -q set dhcp.@dnsmasq[0].noresolv="1"
          uci -q set dhcp.@dnsmasq[0].rebind_protection="0"
          uci -q set dhcp.@dnsmasq[0].cachesize="1000"
          # PassWall 用 addnmount 把 /tmp/etc/passwall/acl/default/dnsmasq.d 挂进 dnsmasq
          # 的 conf-dir 来做分流。它异常退出时这条会残留，目录已删 → dnsmasq 起不来。
          # 所以这里把带 passwall 字样的挂载点全摘掉（它启动时会自己重新加）。
          for _m in $(uci -q get dhcp.@dnsmasq[0].addnmount 2>/dev/null); do
            case "$_m" in
              *passwall*) uci -q del_list dhcp.@dnsmasq[0].addnmount="$_m" ;;
            esac
          done
          uci -q commit dhcp
          /etc/init.d/dnsmasq restart
          sleep 2

          if nslookup www.baidu.com 127.0.0.1 >/dev/null 2>&1; then
              echo "✅ DNS 可用（PassWall 已停用，dnsmasq → MosDNS）"
              echo "   想恢复代理：/etc/init.d/passwall start"
              exit 0
          fi

          echo "   MosDNS 这条路也不通，退回 WAN 明文上游"
          uci -q delete dhcp.@dnsmasq[0].server
          uci -q set dhcp.@dnsmasq[0].noresolv="0"
          uci -q commit dhcp
          /etc/init.d/dnsmasq restart
          sleep 2
          if nslookup www.baidu.com 127.0.0.1 >/dev/null 2>&1; then
              echo "✅ DNS 已恢复（明文上游）。MosDNS 的问题看 logread | grep mosdns"
          else
              echo "⚠️ 仍无法解析，多半是 WAN 断线。执行 logread | tail -n 50 看日志"
          fi
          exit 0
          EOF

          # ---------- C3. MosDNS：去广告 + 上游加密（本固件唯一的 DNS 增强组件）----------
          # 只装 feeds 里的 mosdns 二进制，不装 luci-app-mosdns（它会把 10.9MB 的
          # geosite.dat 拉回来）。服务脚本和配置都由这里覆盖进镜像：
          #   /etc/init.d/mosdns       —— 覆盖软件包自带的那份（绝对路径 + procd 守护）
          #   /etc/mosdns/config.yaml  —— 去广告 + DoH
          #   /etc/mosdns/adblock.txt  —— 构建期下载的广告域名（见 K 节）
          mkdir -p files/etc/mosdns files/etc/init.d
          cat > files/etc/init.d/mosdns << "EOF"
          #!/bin/sh /etc/rc.common
          # MosDNS 服务脚本（覆盖 mosdns 软件包自带的那份）
          #   自带脚本写的是 -c ./config.yaml，靠 mosdns 自己先 chdir 才找得到配置；
          #   这里全用绝对路径。它不做 nft 劫持（本机 53 只由 dnsmasq 持有）、也不改 dnsmasq
          #   （上游由 92-services 固定写好），职责单一，出问题好排查。
          START=18
          USE_PROCD=1
          PROG=/usr/bin/mosdns
          CONF=/etc/mosdns/config.yaml
          DIR=/etc/mosdns

          start_service() {
              [ -x "$PROG" ] || { logger -t mosdns "找不到 $PROG"; return 1; }
              [ -f "$CONF" ] || { logger -t mosdns "找不到 $CONF"; return 1; }
              procd_open_instance mosdns
              procd_set_param command "$PROG" start -c "$CONF" -d "$DIR"
              procd_set_param env QUIC_GO_DISABLE_RECEIVE_BUFFER_WARNING=true
              procd_set_param stdout 1
              procd_set_param stderr 1
              procd_set_param respawn 3600 5 0
              procd_close_instance
          }

          reload_service() {
              stop
              sleep 1
              start
          }
          EOF

          cat > files/etc/mosdns/config.yaml << "EOF"
          # MosDNS 5.x 配置 —— 只干两件事：去广告、把上游换成 DoH（加密）
          # 链路：客户端 / 系统 dnsmasq → 127.0.0.1:5335
          #         广告域名 → 返回 0.0.0.0（集合来自 /etc/mosdns/adblock.txt）
          #         其他     → DoH（阿里 / 腾讯）+ 进程内缓存
          # 只监听回环地址：局域网和外网都碰不到它，53 由系统 dnsmasq 持有并转发到这里。
          log:
            level: error

          plugins:
            - tag: ad_domains
              type: domain_set
              args:
                files:
                  - /etc/mosdns/adblock.txt

            # 缓存只放内存（不写 dump 文件）：32MB 闪存经不起频繁写
            - tag: cache
              type: cache
              args:
                size: 8192

            # 加密上游：DoH。地址用 IP 而不是域名 —— 免得"解析自己"打死自己
            # （223.5.5.5 是阿里 DoH，1.12.12.12 是腾讯 DoH，证书都含 IP SAN）
            - tag: forward_doh
              type: forward
              args:
                concurrent: 2
                upstreams:
                  - addr: "https://223.5.5.5/dns-query"
                  - addr: "https://1.12.12.12/dns-query"

            # 明文兜底：只在 DoH 完全没应答时用（典型场景：刚开机还没校时，
            # TLS 证书校验必失败）。宁可这一次明文，也不要整个局域网 DNS 停摆。
            - tag: forward_plain
              type: forward
              args:
                concurrent: 2
                upstreams:
                  - addr: "223.5.5.5"
                  - addr: "119.29.29.29"

            - tag: main
              type: sequence
              args:
                - matches: "qname $ad_domains"
                  exec: "black_hole 0.0.0.0 ::"
                - exec: $cache
                - matches: has_resp
                  exec: accept
                - exec: $forward_doh
                - matches: has_resp
                  exec: accept
                - exec: $forward_plain

            - tag: udp_server
              type: udp_server
              args:
                entry: main
                listen: "127.0.0.1:5335"
            - tag: tcp_server
              type: tcp_server
              args:
                entry: main
                listen: "127.0.0.1:5335"
          EOF
          # ---------- C3. MosDNS 管理入口：mosdns-ctl + LuCI 页面（轻量，不装官方 luci-app-mosdns） ----------
          mkdir -p files/usr/libexec files/www/luci-static/resources/view/mosdns files/usr/share/luci/menu.d files/usr/share/rpcd/acl.d
          cat > files/etc/mosdns/settings.conf << "MOSDNS_SET_EOF"
          # MosDNS 运行参数（由 LuCI 服务 -> MosDNS 修改，也可手工改后执行 mosdns-ctl apply）
          # log_level: error | warn | info | debug
          log_level=error
          cache_size=8192
          concurrent=2
          adblock=1
          MOSDNS_SET_EOF
          
          cat > files/etc/mosdns/upstreams.conf << "MOSDNS_UP_EOF"
          # MosDNS 上游清单：一行一条，# 开头为注释。
          # 带 https:// tls:// quic:// 的走加密通道（forward_doh），其余走明文（forward_plain）。
          # 修改后在 LuCI 服务 -> MosDNS -> 上游 点保存，或命令行执行 mosdns-ctl apply。
          https://223.5.5.5/dns-query
          https://1.12.12.12/dns-query
          223.5.5.5
          119.29.29.29
          MOSDNS_UP_EOF
          
          cat > files/etc/mosdns/custom_blacklist.txt << "MOSDNS_BL_EOF"
          ad-test.invalid
          MOSDNS_BL_EOF
          
          cat > files/etc/mosdns/custom_whitelist.txt << "MOSDNS_WL_EOF"
          localhost
          MOSDNS_WL_EOF
          
          cat > files/usr/libexec/mosdns-ctl << "MOSDNS_CTL_EOF"
          #!/bin/sh
          # mosdns-ctl -- MosDNS 的唯一管理入口（LuCI 页面与命令行共用）
          # 只做三件事：渲染配置、启停服务、自检报告；全程不联网。
          # 用法：mosdns-ctl status|render|apply|restart|start|stop|set <k> <v>|logtail [n]|query <域名>|chain|version

          BASE=/etc/mosdns
          CFG=$BASE/config.yaml
          BAK=$BASE/config.yaml.bak
          UP=$BASE/upstreams.conf
          SET=$BASE/settings.conf
          BL=$BASE/custom_blacklist.txt
          WL=$BASE/custom_whitelist.txt
          AD=$BASE/adblock.txt
          INIT=/etc/init.d/mosdns
          DPORT=5335

          get_set() {
            _v=$(awk -F= -v k="$1" '$1==k{sub(/^[^=]*=/,"");print;exit}' "$SET" 2>/dev/null)
            [ -n "$_v" ] || _v="$2"
            printf '%s' "$_v"
          }

          set_set() {
            _k="$1"; _n="$2"
            [ -f "$SET" ] || : > "$SET"
            if grep -q "^$_k=" "$SET" 2>/dev/null; then
              awk -F= -v k="$_k" -v v="$_n" 'BEGIN{OFS="="} $1==k{$0=k"="v} {print}' "$SET" > "$SET.new" \
                && mv "$SET.new" "$SET"
            else
              printf '%s=%s\n' "$_k" "$_n" >> "$SET"
            fi
          }

          render_to() {
            [ -f "$UP" ] || : > "$UP"
            [ -f "$BL" ] || : > "$BL"
            [ -f "$WL" ] || : > "$WL"
            _out="$1"
            _level=$(get_set log_level error)
            _cache=$(get_set cache_size 8192)
            _conc=$(get_set concurrent 2)
            _ad=$(get_set adblock 1)

            {
              printf '# 本文件由 /usr/libexec/mosdns-ctl 自动生成，请勿手工修改。\n'
              printf '# 改上游：/etc/mosdns/upstreams.conf  改开关：/etc/mosdns/settings.conf  然后 mosdns-ctl apply\n'
              printf '# 或者直接用 LuCI 服务 -> MosDNS。\n'
              printf 'log:\n  level: %s\n\n' "$_level"
              printf 'plugins:\n'
              printf '  - tag: ad_domains\n    type: domain_set\n    args:\n      files:\n'
              printf '        - %s\n        - %s\n\n' "$AD" "$BL"
              printf '  - tag: allow_domains\n    type: domain_set\n    args:\n      files:\n'
              printf '        - %s\n\n' "$WL"
              printf '  - tag: cache\n    type: cache\n    args:\n      size: %s\n\n' "$_cache"

              printf '  - tag: forward_doh\n    type: forward\n    args:\n      concurrent: %s\n      upstreams:\n' "$_conc"
              _n=0
              while IFS= read -r _l; do
                _l=$(printf '%s' "$_l" | tr -d '\r')
                case "$_l" in ''|\#*) continue ;; esac
                case "$_l" in
                  https://*|tls://*|quic://*)
                    printf '        - addr: "%s"\n' "$_l"; _n=$((_n+1)) ;;
                esac
              done < "$UP"
              [ "$_n" -gt 0 ] || printf '        - addr: "https://223.5.5.5/dns-query"\n'
              printf '\n'

              printf '  - tag: forward_plain\n    type: forward\n    args:\n      concurrent: %s\n      upstreams:\n' "$_conc"
              _n=0
              while IFS= read -r _l; do
                _l=$(printf '%s' "$_l" | tr -d '\r')
                case "$_l" in ''|\#*|https://*|tls://*|quic://*) continue ;; esac
                printf '        - addr: "%s"\n' "$_l"; _n=$((_n+1))
              done < "$UP"
              [ "$_n" -gt 0 ] || printf '        - addr: "223.5.5.5"\n'
              printf '\n'

              printf '  - tag: main\n    type: sequence\n    args:\n'
              printf '      - matches: "qname $allow_domains"\n        exec: $forward_doh\n'
              printf '      - matches: "qname $allow_domains"\n        exec: accept\n'
              if [ "$_ad" = "1" ]; then
                printf '      - matches: "qname $ad_domains"\n        exec: "black_hole 0.0.0.0 ::"\n'
              fi
              printf '      - exec: $cache\n'
              printf '      - matches: has_resp\n        exec: accept\n'
              printf '      - exec: $forward_doh\n'
              printf '      - matches: has_resp\n        exec: accept\n'
              printf '      - exec: $forward_plain\n\n'

              printf '  - tag: udp_server\n    type: udp_server\n    args:\n      entry: main\n      listen: "127.0.0.1:%s"\n' "$DPORT"
            } > "$_out"
          }

          lint_file() {
            _src="$1"
            _tmp=/tmp/mosdns-lint.yaml
            _log=/tmp/mosdns-lint.log
            sed 's/127\.0\.0\.1:5335/127.0.0.1:5399/' "$_src" > "$_tmp"
            rm -f "$_log"
            mosdns start -c "$_tmp" > "$_log" 2>&1 &
            _pid=$!
            sleep 1
            if kill -0 "$_pid" 2>/dev/null; then
              kill "$_pid" 2>/dev/null
              wait "$_pid" 2>/dev/null
              return 0
            fi
            printf '配置校验失败，日志：'
            sed -n '1,20p' "$_log" 2>/dev/null | tr '\n' ' '
            printf '\n'
            return 1
          }

          pid_of() {
            pidof mosdns 2>/dev/null | awk '{print $1}'
          }

          is_listen() {
            grep -qi ':14D7' /proc/net/udp /proc/net/udp6 2>/dev/null
          }

          svc_restart() {
            [ -x "$INIT" ] || return 1
            "$INIT" restart >/dev/null 2>&1
            sleep 1
          }

          do_status() {
            _pid=$(pid_of)
            _run=0; _up=0; _rss=0
            if [ -n "$_pid" ] && [ -d "/proc/$_pid" ]; then
              _run=1
              _nowt=$(awk 'NR==1{print $1}' /proc/uptime 2>/dev/null)
              _st=$(awk '{print $22}' "/proc/$_pid/stat" 2>/dev/null)
              if [ -n "$_st" ] && [ -n "$_nowt" ]; then
                _up=$(awk -v a="$_nowt" -v b="$_st" 'BEGIN{printf "%d", a-b}')
              fi
              _rss=$(awk '/VmRSS/{print $2}' "/proc/$_pid/status" 2>/dev/null)
            else
              _pid=0
            fi
            [ -n "$_up" ] || _up=0
            [ -n "$_rss" ] || _rss=0
            _lsn=0; is_listen && _lsn=1

            _cfgok=0
            if [ -s "$CFG" ] && grep -q 'type: sequence' "$CFG" 2>/dev/null; then _cfgok=1; fi

            _ac=0; _ab=0; _amt="-"
            if [ -f "$AD" ]; then
              _ac=$(wc -l < "$AD" 2>/dev/null | tr -d ' ')
              _ab=$(wc -c < "$AD" 2>/dev/null | tr -d ' ')
              _amt=$(date -r "$AD" '+%Y-%m-%d %H:%M' 2>/dev/null)
            fi
            [ -n "$_ac" ] || _ac=0
            [ -n "$_ab" ] || _ab=0
            [ -n "$_amt" ] || _amt="-"

            _bc=$(wc -l < "$BL" 2>/dev/null | tr -d ' '); [ -n "$_bc" ] || _bc=0
            _wc=$(wc -l < "$WL" 2>/dev/null | tr -d ' '); [ -n "$_wc" ] || _wc=0

            _ver=$(mosdns version 2>/dev/null | awk 'NR==1{print $NF}')
            [ -n "$_ver" ] || _ver="unknown"
            _ver=$(printf '%s' "$_ver" | sed 's/["]/ /g')

            _ups=""
            if [ -f "$UP" ]; then
              while IFS= read -r _l; do
                _l=$(printf '%s' "$_l" | tr -d '\r')
                case "$_l" in ''|\#*) continue ;; esac
                _l=$(printf '%s' "$_l" | sed 's/["]/ /g')
                if [ -z "$_ups" ]; then _ups="\"$_l\""; else _ups="$_ups,\"$_l\""; fi
              done < "$UP"
            fi

            printf '{"ok":1,"running":%d,"pid":%s,"uptime_s":%s,"rss_kb":%s,"listen":%d,"version":"%s",' \
              "$_run" "$_pid" "$_up" "$_rss" "$_lsn" "$_ver"
            printf '"ad_count":%s,"ad_bytes":%s,"ad_mtime":"%s","bl_count":%s,"wl_count":%s,' \
              "$_ac" "$_ab" "$_amt" "$_bc" "$_wc"
            printf '"log_level":"%s","cache_size":"%s","concurrent":"%s","adblock":"%s",' \
              "$(get_set log_level error)" "$(get_set cache_size 8192)" "$(get_set concurrent 2)" "$(get_set adblock 1)"
            printf '"config_ok":%d,"upstreams":[%s]}\n' "$_cfgok" "$_ups"
          }

          do_apply() {
            [ -f "$UP" ] || printf 'https://223.5.5.5/dns-query\nhttps://1.12.12.12/dns-query\n223.5.5.5\n' > "$UP"
            render_to /tmp/mosdns-new.yaml || { printf '{"ok":0,"message":"渲染失败"}\n'; return 1; }
            if ! lint_file /tmp/mosdns-new.yaml >/tmp/mosdns-lint.txt 2>&1; then
              printf '{"ok":0,"message":"新配置未通过校验，已保留旧配置"}\n'
              return 1
            fi
            if [ -f "$CFG" ]; then cp -f "$CFG" "$BAK"; fi
            cp -f /tmp/mosdns-new.yaml "$CFG"
            svc_restart
            _pid=$(pid_of)
            if [ -z "$_pid" ]; then
              if [ -f "$BAK" ]; then cp -f "$BAK" "$CFG"; fi
              svc_restart
              printf '{"ok":0,"message":"重启后进程未起来，已回滚上一份配置"}\n'
              return 1
            fi
            printf '{"ok":1,"message":"已应用并重启","pid":%s}\n' "$_pid"
          }

          do_render() {
            render_to /tmp/mosdns-new.yaml || { printf '渲染失败\n'; return 1; }
            if lint_file /tmp/mosdns-new.yaml >/tmp/mosdns-lint.txt 2>&1; then
              if [ -f "$CFG" ]; then cp -f "$CFG" "$BAK"; fi
              cp -f /tmp/mosdns-new.yaml "$CFG"
              printf '已重新生成 /etc/mosdns/config.yaml 并通过校验\n'
              return 0
            fi
            printf '生成的配置未通过校验，已放弃写入\n'
            return 1
          }

          do_query() {
            _d="$1"
            [ -n "$_d" ] || { printf '{"ok":0,"message":"缺少域名"}\n'; return 1; }
            _t0=$(date +%s%3N 2>/dev/null)
            case "$_t0" in *N*|"") _t0=$(( $(date +%s) * 1000 )) ;; esac
            _out=$(nslookup "$_d" 127.0.0.1 2>&1)
            _rc=$?
            _t1=$(date +%s%3N 2>/dev/null)
            case "$_t1" in *N*|"") _t1=$(( $(date +%s) * 1000 )) ;; esac
            _ms=$(( _t1 - _t0 ))
            [ "$_ms" -ge 0 ] || _ms=0
            _esc=$(printf '%s' "$_out" | sed 's/[\]/ /g; s/["]/ /g' | awk '{printf "%s\\n", $0}')
            printf '{"ok":%d,"ms":%s,"output":"%s"}\n' "$_rc" "$_ms" "$_esc"
          }

          do_chain() {
            _srv=$(uci -q get dhcp.@dnsmasq[0].server 2>/dev/null | tr ' ' '|')
            _nr=$(uci -q get dhcp.@dnsmasq[0].noresolv 2>/dev/null)
            # 代理侧状态：PassWall 是否在跑、配了几个节点（没节点=全部直连，属正常）
            _se=0; pidof xray >/dev/null 2>&1 && _se=1
            _sc=$(uci -q show passwall 2>/dev/null | grep -c "=node$")
            [ -n "$_sc" ] || _sc=0
            _lsn=0; is_listen && _lsn=1
            printf '{"ok":1,"dnsmasq_server":"%s","noresolv":"%s","passwall_running":%s,"passwall_nodes":%s,"mosdns_listen":%d}\n' \
              "$_srv" "$_nr" "$_se" "$_sc" "$_lsn"
          }

          case "$1" in
            status)  do_status ;;
            render)  do_render ;;
            apply)   do_apply ;;
            restart) svc_restart; if [ -n "$(pid_of)" ]; then printf '已重启\n'; else printf '重启失败\n'; exit 1; fi ;;
            start)   [ -x "$INIT" ] && "$INIT" start >/dev/null 2>&1; sleep 1; if [ -n "$(pid_of)" ]; then printf '已启动\n'; else printf '启动失败\n'; exit 1; fi ;;
            stop)    [ -x "$INIT" ] && "$INIT" stop >/dev/null 2>&1; sleep 1; if [ -z "$(pid_of)" ]; then printf '已停止\n'; else printf '停止失败\n'; exit 1; fi ;;
            set)
              [ -n "$2" ] || { printf '用法：mosdns-ctl set <键> <值>\n' >&2; exit 1; }
              case "$2" in
                log_level|cache_size|concurrent|adblock) set_set "$2" "$3"; printf '已设置 %s=%s\n' "$2" "$3" ;;
                *) printf '不支持的键：%s\n' "$2" >&2; exit 1 ;;
              esac ;;
            logtail)
              _ln="$2"; [ -n "$_ln" ] || _ln=200
              logread -e mosdns 2>/dev/null | tail -n "$_ln" ;;
            query)   do_query "$2" ;;
            chain)   do_chain ;;
            version) printf 'mosdns-ctl 1.0\n'; mosdns version 2>/dev/null | awk 'NR==1{print}' ;;
            *)
              printf '用法：mosdns-ctl status|render|apply|restart|start|stop|set <k> <v>|logtail [n]|query <域名>|chain|version\n' >&2
              exit 1 ;;
          esac
          MOSDNS_CTL_EOF
          
          cat > files/www/luci-static/resources/view/mosdns/overview.js << "MOSDNS_UI_EOF"
          'use strict';
          'require view';
          'require fs';
          'require ui';

          var CTL = '/usr/libexec/mosdns-ctl';
          var P_UP = '/etc/mosdns/upstreams.conf';
          var P_BL = '/etc/mosdns/custom_blacklist.txt';
          var P_WL = '/etc/mosdns/custom_whitelist.txt';

          function ctl(args) {
            return fs.exec(CTL, args || []).then(function (r) {
              return { code: r.code || 0, out: r.stdout || '', err: r.stderr || '' };
            }).catch(function (e) {
              return { code: -1, out: '', err: String(e) };
            });
          }

          function parseJs(res) {
            try { return JSON.parse(res.out); } catch (e) { return null; }
          }

          function rd(p) {
            return fs.read(p).catch(function () { return ''; });
          }

          function note(kind, title, text) {
            ui.addNotification(title, E('p', {}, text || ''), kind);
          }

          function fmtUptime(s) {
            s = parseInt(s, 10) || 0;
            var d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600),
                m = Math.floor(s % 3600 / 60), x = s % 60, o = [];
            if (d) o.push(d + ' 天');
            if (d || h) o.push(h + ' 小时');
            if (d || h || m) o.push(m + ' 分');
            o.push(x + ' 秒');
            return o.join(' ');
          }

          function kb(n) {
            n = parseInt(n, 10) || 0;
            if (n >= 1024) return (n / 1024).toFixed(1) + ' MiB';
            return n + ' KiB';
          }

          var row = function (k, v) {
            return E('tr', { 'class': 'tr' }, [
              E('td', { 'class': 'td', 'style': 'width:30%;white-space:nowrap' }, k),
              E('td', { 'class': 'td' }, v)
            ]);
          };

          var btn = function (label, cls, fn) {
            return E('button', {
              'class': 'btn cbi-button ' + cls,
              'click': ui.createHandlerFn(this, fn)
            }, label);
          };

          var TAB_NAMES = ['概览', '上游', '去广告', '日志', '诊断'];

          return view.extend({
            load: function () {
              return Promise.all([
                ctl(['status']),
                rd(P_UP), rd(P_BL), rd(P_WL)
              ]);
            },

            render: function (data) {
              var status = parseJs(data[0]) || {};
              var self = this;
              var panels = [];
              var tabbar = E('div', { 'style': 'display:flex;gap:6px;margin:0 0 12px 0;flex-wrap:wrap' });

              function showTab(idx) {
                panels.forEach(function (p, i) {
                  p.style.display = (i === idx) ? '' : 'none';
                });
                Array.prototype.forEach.call(tabbar.childNodes, function (b, i) {
                  b.className = (i === idx)
                    ? 'btn cbi-button cbi-button-apply'
                    : 'btn cbi-button cbi-button-neutral';
                });
              }

              TAB_NAMES.forEach(function (n, i) {
                var b = E('button', { 'class': 'btn cbi-button cbi-button-neutral' }, n);
                b.addEventListener('click', function () { showTab(i); });
                tabbar.appendChild(b);
              });

              /* ---------------- 1 概览 ---------------- */
              var running = status.running === 1;
              var adv = E('div', { 'class': 'cbi-section' }, [
                E('h3', {}, '运行状态'),
                E('table', { 'class': 'table' }, [
                  row('进程', running
                    ? E('span', { 'style': 'color:#1a7f37;font-weight:bold' }, '运行中（PID ' + status.pid + '）')
                    : E('span', { 'style': 'color:#cf222e;font-weight:bold' }, '未运行')),
                  row('运行时长', running ? fmtUptime(status.uptime_s) : '-'),
                  row('内存占用', running ? kb(status.rss_kb) : '-'),
                  row('监听 127.0.0.1:5335', status.listen === 1 ? '是' : '否'),
                  row('版本', status.version || '未知'),
                  row('配置状态', status.config_ok === 1 ? '已生成（含 sequence 主流程）' : '未生成或异常'),
                  row('当前上游', (status.upstreams || []).length
                    ? (status.upstreams || []).join('  /  ') : '尚未配置'),
                  row('去广告', status.adblock === '1'
                    ? ('已启用（清单 ' + (status.ad_count || 0) + ' 条，' + kb(status.ad_bytes) + '，更新于 ' + (status.ad_mtime || '-') + '）')
                    : '已停用'),
                  row('自定义名单', '黑名单 ' + (status.bl_count || 0) + ' 条 / 白名单 ' + (status.wl_count || 0) + ' 条'),
                  row('日志级别', status.log_level || 'error')
                ]),
                E('div', { 'style': 'margin-top:12px;display:flex;gap:8px;flex-wrap:wrap' }, [
                  E('button', {
                    'class': 'btn cbi-button cbi-button-apply',
                    'click': ui.createHandlerFn(this, function () {
                      return ctl(['restart']).then(function (r) {
                        if (r.code === 0) { note('info', 'MosDNS', '已重启'); window.location.reload(); }
                        else note('danger', '重启失败', r.err || r.out);
                      });
                    })
                  }, '重启 MosDNS'),
                  E('button', {
                    'class': 'btn cbi-button cbi-button-reset',
                    'click': ui.createHandlerFn(this, function () {
                      return ctl(['stop']).then(function (r) {
                        if (r.code === 0) { note('info', 'MosDNS', '已停止'); window.location.reload(); }
                        else note('danger', '停止失败', r.err || r.out);
                      });
                    })
                  }, '停止'),
                  E('button', {
                    'class': 'btn cbi-button cbi-button-action',
                    'click': ui.createHandlerFn(this, function () {
                      return ctl(['start']).then(function (r) {
                        if (r.code === 0) { note('info', 'MosDNS', '已启动'); window.location.reload(); }
                        else note('danger', '启动失败', r.err || r.out);
                      });
                    })
                  }, '启动'),
                  E('button', {
                    'class': 'btn cbi-button cbi-button-neutral',
                    'click': function () { window.location.reload(); }
                  }, '刷新')
                ])
              ]);

              /* ---------------- 2 上游 ---------------- */
              var taUp = E('textarea', {
                'rows': 10, 'spellcheck': 'false',
                'style': 'width:100%;font-family:monospace;font-size:12px'
              }, data[1] || '');
              var advUp = E('div', { 'class': 'cbi-section' }, [
                E('h3', {}, 'DNS 上游'),
                E('p', { 'class': 'cbi-section-descr' },
                  '一行一个。https:// tls:// quic:// 开头的走加密通道（优先使用），其余按明文使用。' +
                  '建议保留至少一个加密上游；改完点“保存并应用”，系统会先校验新配置，校验不通过自动保留原配置。'),
                taUp,
                E('div', { 'style': 'margin-top:10px' }, [
                  E('button', {
                    'class': 'btn cbi-button cbi-button-apply',
                    'click': ui.createHandlerFn(this, function () {
                      return fs.write(P_UP, taUp.value).then(function () {
                        return ctl(['apply']);
                      }).then(function (r) {
                        var j = parseJs(r);
                        if (j && j.ok === 1) { note('info', '已应用', 'MosDNS 已按新上游重启'); window.location.reload(); }
                        else note('danger', '应用失败', (j && j.message) || r.err || r.out);
                      }).catch(function (e) { note('danger', '保存失败', String(e)); });
                    })
                  }, '保存并应用')
                ])
              ]);

              /* ---------------- 3 去广告 ---------------- */
              var cbAd = E('input', { 'type': 'checkbox' });
              cbAd.checked = status.adblock === '1';
              var taBl = E('textarea', {
                'rows': 6, 'spellcheck': 'false',
                'style': 'width:100%;font-family:monospace;font-size:12px'
              }, data[2] || '');
              var taWl = E('textarea', {
                'rows': 6, 'spellcheck': 'false',
                'style': 'width:100%;font-family:monospace;font-size:12px'
              }, data[3] || '');
              var advAd = E('div', { 'class': 'cbi-section' }, [
                E('h3', {}, '去广告'),
                E('p', { 'class': 'cbi-section-descr' },
                  '内置清单 ' + (status.ad_count || 0) + ' 条（' + kb(status.ad_bytes) + '，生成于 ' + (status.ad_mtime || '-') + '）。' +
                  '命中黑名单直接返回 0.0.0.0，不产生外网查询，也不占用代理流量。'),
                E('label', { 'style': 'display:flex;align-items:center;gap:8px;margin:8px 0' }, [
                  cbAd, E('span', {}, '启用去广告（关闭后不再匹配黑名单，自定义名单原样保留）')
                ]),
                E('h4', {}, '自定义黑名单（追加拦截）'),
                E('p', { 'class': 'cbi-section-descr' }, '一行一个域名，纯域名即可（不要写 http:// 前缀，也不用写注释）。' + '首次生成的占位域名可直接删掉。'),
                taBl,
                E('h4', { 'style': 'margin-top:12px' }, '自定义白名单（优先于黑名单，直接走加密上游）'),
                E('p', { 'class': 'cbi-section-descr' }, '一行一个域名，纯域名即可（不要写 http:// 前缀，也不用写注释）。' + '首次生成的占位域名可直接删掉。'),
                taWl,
                E('div', { 'style': 'margin-top:10px' }, [
                  E('button', {
                    'class': 'btn cbi-button cbi-button-apply',
                    'click': ui.createHandlerFn(this, function () {
                      return Promise.all([
                        fs.write(P_BL, taBl.value),
                        fs.write(P_WL, taWl.value)
                      ]).then(function () {
                        return ctl(['set', 'adblock', cbAd.checked ? '1' : '0']);
                      }).then(function () {
                        return ctl(['apply']);
                      }).then(function (r) {
                        var j = parseJs(r);
                        if (j && j.ok === 1) { note('info', '已应用', '名单与开关已生效'); window.location.reload(); }
                        else note('danger', '应用失败', (j && j.message) || r.err || r.out);
                      }).catch(function (e) { note('danger', '保存失败', String(e)); });
                    })
                  }, '保存并应用')
                ])
              ]);

              /* ---------------- 4 日志 ---------------- */
              var selLv = E('select', { 'class': 'cbi-input-select' }, [
                E('option', { 'value': 'error' }, 'error（只记错误，最省心）'),
                E('option', { 'value': 'warn' }, 'warn'),
                E('option', { 'value': 'info' }, 'info'),
                E('option', { 'value': 'debug' }, 'debug（排查用，日志量最大）')
              ]);
              selLv.value = status.log_level || 'error';
              var preLog = E('pre', {
                'style': 'max-height:380px;overflow:auto;background:#f5f5f5;padding:8px;font-size:11px;white-space:pre-wrap'
              }, '（点“查看日志”加载）');
              var advLog = E('div', { 'class': 'cbi-section' }, [
                E('h3', {}, '日志'),
                E('div', { 'style': 'display:flex;gap:8px;align-items:center;flex-wrap:wrap' }, [
                  E('span', {}, '日志级别'), selLv,
                  E('button', {
                    'class': 'btn cbi-button cbi-button-apply',
                    'click': ui.createHandlerFn(this, function () {
                      return ctl(['set', 'log_level', selLv.value]).then(function () {
                        return ctl(['apply']);
                      }).then(function (r) {
                        var j = parseJs(r);
                        if (j && j.ok === 1) note('info', '已应用', '日志级别已改为 ' + selLv.value);
                        else note('danger', '失败', (j && j.message) || r.out);
                      });
                    })
                  }, '应用级别'),
                  E('button', {
                    'class': 'btn cbi-button cbi-button-neutral',
                    'click': ui.createHandlerFn(this, function () {
                      return ctl(['logtail', '200']).then(function (r) {
                        preLog.textContent = (r.out || '').trim() || '（没有日志；日志级别为 error 时正常业务不会有输出）';
                      });
                    })
                  }, '查看日志')
                ]),
                E('div', { 'style': 'margin-top:10px' }, preLog)
              ]);

              /* ---------------- 5 诊断 ---------------- */
              var inpD = E('input', { 'type': 'text', 'class': 'cbi-input-text', 'placeholder': '例如 www.qq.com', 'style': 'width:240px' });
              var preD = E('pre', {
                'style': 'max-height:300px;overflow:auto;background:#f5f5f5;padding:8px;font-size:11px;white-space:pre-wrap'
              }, '');
              var preC = E('pre', {
                'style': 'max-height:200px;overflow:auto;background:#f5f5f5;padding:8px;font-size:11px;white-space:pre-wrap'
              }, '');
              var advDiag = E('div', { 'class': 'cbi-section' }, [
                E('h3', {}, '诊断'),
                E('p', { 'class': 'cbi-section-descr' },
                  '查询走本机 127.0.0.1:53（dnsmasq → MosDNS 的完整链路），能同时验证 dnsmasq 与 MosDNS 两段。'),
                E('div', { 'style': 'display:flex;gap:8px;align-items:center;flex-wrap:wrap' }, [
                  inpD,
                  E('button', {
                    'class': 'btn cbi-button cbi-button-action',
                    'click': ui.createHandlerFn(this, function () {
                      var d = (inpD.value || '').trim();
                      if (!d) { note('warning', '提示', '请先填域名'); return; }
                      return ctl(['query', d]).then(function (r) {
                        var j = parseJs(r);
                        if (!j) { preD.textContent = r.out || r.err; return; }
                        preD.textContent = '耗时 ' + j.ms + ' ms\n\n' + (j.output || '');
                      });
                    })
                  }, '查询'),
                  E('button', {
                    'class': 'btn cbi-button cbi-button-neutral',
                    'click': ui.createHandlerFn(this, function () {
                      return ctl(['chain']).then(function (r) {
                        var j = parseJs(r);
                        if (!j) { preC.textContent = r.out || r.err; return; }
                        var lines = [
                          'dnsmasq 上游 server = ' + (j.dnsmasq_server || '（空）'),
                          'dnsmasq noresolv    = ' + (j.noresolv || '0'),
                          'MosDNS 监听 5335    = ' + (j.mosdns_listen === 1 ? '是' : '否'),
                          'PassWall 运行中     = ' + (j.passwall_running === 1 ? '是' : '否（当前全部直连）'),
                          'PassWall 节点数     = ' + (j.passwall_nodes != null ? j.passwall_nodes + ' 个' : '未知')
                        ];
                        preC.textContent = lines.join('\n');
                      });
                    })
                  }, '检查解析链路'),
                  E('button', {
                    'class': 'btn cbi-button cbi-button-reset',
                    'click': ui.createHandlerFn(this, function () {
                      if (!confirm('将停用 MosDNS 与 PassWall（撤掉 TPROXY 规则），并把 dnsmasq 上游改回运营商，使全屋 DNS 恢复直连。确定吗？')) return;
                      return fs.exec('/usr/bin/dns-recover', []).then(function (r) {
                        note('info', 'dns-recover', (r.stdout || r.stderr || '已执行'));
                      });
                    })
                  }, '一键恢复 DNS（dns-recover）')
                ]),
                E('div', { 'style': 'margin-top:10px' }, preD),
                E('div', { 'style': 'margin-top:10px' }, preC)
              ]);

              panels = [adv, advUp, advAd, advLog, advDiag];

              var body = E('div', {}, [tabbar].concat(panels));
              showTab(0);

              return E('div', { 'class': 'cbi-map' }, [
                E('h2', {}, 'MosDNS'),
                E('div', { 'class': 'cbi-map-descr' },
                  '本机 DNS 分流引擎：127.0.0.1:5335，由 dnsmasq 转发上来，负责加密上游（DoH）与广告域名拦截。' +
                  '所有改动都会先校验配置再重启，校验失败自动保留原配置。'),
                body
              ]);
            },

            handleSave: null,
            handleSaveApply: null,
            handleReset: null
          });
          MOSDNS_UI_EOF
          
          cat > files/usr/share/luci/menu.d/luci-app-mosdns-lite.json << "MOSDNS_MENU_EOF"
          {
            "admin/services/mosdns": {
              "title": "MosDNS",
              "order": 60,
              "action": {
                "type": "view",
                "path": "mosdns/overview"
              },
              "depends": {
                "acl": [
                  "luci-app-mosdns-lite"
                ]
              }
            }
          }
          MOSDNS_MENU_EOF
          
          cat > files/usr/share/rpcd/acl.d/luci-app-mosdns-lite.json << "MOSDNS_ACL_EOF"
          {
            "luci-app-mosdns-lite": {
              "description": "MosDNS 管理：状态、上游、去广告名单、日志与诊断",
              "read": {
                "file": {
                  "/usr/libexec/mosdns-ctl": [
                    "exec"
                  ],
                  "/usr/bin/dns-recover": [
                    "exec"
                  ],
                  "/etc/mosdns/upstreams.conf": [
                    "read"
                  ],
                  "/etc/mosdns/custom_blacklist.txt": [
                    "read"
                  ],
                  "/etc/mosdns/custom_whitelist.txt": [
                    "read"
                  ]
                }
              },
              "write": {
                "file": {
                  "/usr/libexec/mosdns-ctl": [
                    "exec"
                  ],
                  "/etc/mosdns/upstreams.conf": [
                    "write"
                  ],
                  "/etc/mosdns/custom_blacklist.txt": [
                    "write"
                  ],
                  "/etc/mosdns/custom_whitelist.txt": [
                    "write"
                  ]
                }
              }
            }
          }
          MOSDNS_ACL_EOF
          

          # ---------- D. USB 网卡 / 随身 WiFi 热插拔自动挂 WAN ----------
          cat > files/etc/hotplug.d/net/20-usbwan << 'EOF'
          #!/bin/sh
          [ -n "$INTERFACE" ] || exit 0
          case "$INTERFACE" in usb*|wwan*|eth1|eth2) ;; *) exit 0 ;; esac

          is_usb() {
              _d=$(readlink -f "/sys/class/net/$INTERFACE/device" 2>/dev/null)
              case "$_d" in */usb*) return 0 ;; esac
              [ -f "/sys/class/net/$INTERFACE/device/uevent" ] && \
                  grep -q 'DEVTYPE=usb_interface' "/sys/class/net/$INTERFACE/device/uevent"
          }

          wan_zone() {
              uci show firewall 2>/dev/null \
                  | sed -n "s/^firewall\.\(@zone\[[0-9]*\]\)\.name='wan'$/\1/p" \
                  | head -n1
          }

          case "$ACTION" in
            add)
              is_usb || exit 0
              [ "$(uci -q get network.usbwan.device)" = "$INTERFACE" ] && exit 0
              uci set network.usbwan=interface
              uci set network.usbwan.proto='dhcp'
              uci set network.usbwan.device="$INTERFACE"
              uci set network.usbwan.metric='10'
              uci commit network
              _z=$(wan_zone)
              if [ -n "$_z" ]; then
                  uci -q del_list "firewall.$_z.network=usbwan"
                  uci add_list "firewall.$_z.network=usbwan"
                  uci commit firewall
                  /etc/init.d/firewall reload
              fi
              /etc/init.d/network reload
              logger -t usbwan "已绑定 $INTERFACE -> usbwan"
              ;;
            remove)
              [ "$(uci -q get network.usbwan.device)" = "$INTERFACE" ] || exit 0
              uci -q delete network.usbwan
              uci commit network
              _z=$(wan_zone)
              if [ -n "$_z" ]; then
                  uci -q del_list "firewall.$_z.network=usbwan"
                  uci commit firewall
                  /etc/init.d/firewall reload
              fi
              /etc/init.d/network reload
              logger -t usbwan "$INTERFACE 已移除，清理 usbwan"
              ;;
          esac
          exit 0
          EOF

          # ---------- E. ksmbd / p910nd ----------
          cat > files/etc/config/ksmbd << 'EOF'
          config globals
              option workgroup 'WORKGROUP'
              option description 'Newifi-D2'

          config share
              option name 'usb'
              option path '/mnt/sda1'
              option read_only 'no'
              option guest_ok 'yes'
              option create_mask '0666'
              option dir_mask '0777'
          EOF

          cat > files/etc/config/p910nd << 'EOF'
          config p910nd
              option enabled '1'
              option device '/dev/usb/lp0'
              option port '0'
              option bidirectional '0'
          EOF

          # ---------- F. 内核调优（针对 MT7621 双核 / 512MB 内存）----------
          cat > files/etc/sysctl.conf << 'EOF'
          # ---- 缓冲与队列：BBR 需要 fq，rmem/wmem 上限要放开否则 tcp_rmem 白设 ----
          net.core.default_qdisc = fq
          net.core.somaxconn = 1024
          net.core.rmem_max = 8388608
          net.core.wmem_max = 8388608
          net.ipv4.tcp_rmem = 4096 87380 8388608
          net.ipv4.tcp_wmem = 4096 65536 8388608
          net.ipv4.tcp_congestion_control = bbr
          net.ipv4.tcp_fastopen = 3
          net.ipv4.tcp_max_syn_backlog = 8192
          net.ipv4.tcp_syncookies = 1
          net.ipv4.tcp_tw_reuse = 1
          # ---- 代理链路最常见的“能连不能传”是路径 MTU 被黑洞：开启 MTU 探测自愈 ----
          net.ipv4.tcp_mtu_probing = 1
          # ---- 空闲后不重置拥塞窗口（BBR 下更平滑，长时间挂着不抖）----
          net.ipv4.tcp_slow_start_after_idle = 0
          # ---- FIN 超时收到 15 秒，端口回收更快（透明代理连接多）----
          net.ipv4.tcp_fin_timeout = 15
          # ---- 内存：小内存机器不要把 16MB 锁死，8MB 足够 ----
          vm.min_free_kbytes = 8192
          vm.swappiness = 10
          # ---- 保留 VFS 缓存：ksmbd/USB 共享读写更稳 ----
          vm.vfs_cache_pressure = 50
          # ---- TPROXY 前置条件：宽松反向路径校验 ----
          # tproxy 的报文从 lo 进入、源地址是客户端，严格 rp_filter 会把它当伪造包丢掉，
          # 表现是"连接建立但没有任何数据"。路由器场景下宽松校验没有安全代价。
          net.ipv4.conf.all.rp_filter = 0
          net.ipv4.conf.default.rp_filter = 0
          # ---- 内核 panic 后 10 秒自动重启，避免软路由挂着 ----
          kernel.panic = 10
          EOF

          cat > files/etc/crontabs/root << 'EOF'
          # 本固件不自动升级、不自动下载固件与规则包：分流规则随 PassWall 包发布，
          # 广告清单在构建期写进镜像；PassWall 自己的规则/订阅定时任务默认也不启用
          # （tasks.sh 只在 uci 里配了 update_week_mode 时才动作，出厂没有该选项）。
          # 下面四条全是纯本地动作，一个字节都不出网：
          # 1) 每日 04:00 释放页缓存（P2P、LuCI 页面缓存都能把页缓存吃满）
          0 4 * * * sync; echo 3 > /proc/sys/vm/drop_caches
          # 2) 每 10 分钟看一眼可用内存：低于总量 8% 清页缓存，低于 4% 再截断大日志（不动任何进程）
          */10 * * * * /usr/bin/memguard
          # 3) 每 10 分钟确认 MosDNS 还活着：procd 会拉起，这是第二道保险
          */10 * * * * pidof mosdns >/dev/null 2>&1 || /etc/init.d/mosdns restart
          # 4) 每周日 04:30 截断超过 512KB 的运行日志（/var/log 在 tmpfs 里，实打实吃内存）
          30 4 * * 0 /usr/bin/memguard trim
          EOF

          # ---------- F2. 内存看门狗（必要自动化：只清缓存，不动进程）----------
          cat > files/usr/bin/memguard << 'EOF'
          #!/bin/sh
          # 内存看门狗：页缓存把 MemAvailable 压到底时，LuCI 会卡、
          # ksmbd 会拒连、dnsmasq 会被 OOM 牵连。这里只做三件不伤人的事：
          #   1) drop_caches —— 页缓存随时可丢，丢完立刻能长回来（不影响正在跑的程序）
          #   2) 截断超大日志 —— /var/log 在 tmpfs 里，实打实吃内存
          #   3) 记一行日志 —— 回头能对上时间线
          # 绝不 reboot、绝不杀进程、绝不重启服务（那些交给 procd 和用户自己）。
          # 手动清一次：memguard trim
          LOG=/var/log/memguard.log
          AVAIL=$(awk '/^MemAvailable:/ {print int($2/1024)}' /proc/meminfo)
          [ -n "$AVAIL" ] || exit 0

          trim_logs() {
              find /var/log -type f -size +512k 2>/dev/null | while read -r f; do
                  : > "$f"
                  echo "$(date '+%F %T') 截断日志 $f" >> "$LOG"
              done
          }

          if [ "$1" = "trim" ]; then
              trim_logs
              exit 0
          fi

          # 阈值按总内存算，不写死 MB：可用内存 < 8% 只清页缓存，< 4% 再加截断日志。
          # 写死 10MB 在大内存机器上等于永不触发，写死 40MB 在小内存机器上等于一直触发。
          TOTAL=$(awk '/^MemTotal:/ {print int($2/1024)}' /proc/meminfo)
          [ -n "$TOTAL" ] || TOTAL=128
          WARN=$((TOTAL * 8 / 100))
          [ "$WARN" -ge 8192 ] || WARN=8192
          DANGER=$((TOTAL * 4 / 100))
          [ "$DANGER" -ge 4096 ] || DANGER=4096

          if [ "$AVAIL" -lt "$DANGER" ]; then
              sync
              echo 3 > /proc/sys/vm/drop_caches 2>/dev/null
              trim_logs
              echo "$(date '+%F %T') 危险：可用 ${AVAIL}MB / 共 ${TOTAL}MB，已清缓存 + 日志" >> "$LOG"
              logger -t memguard "可用内存 ${AVAIL}MB，已清缓存"
          elif [ "$AVAIL" -lt "$WARN" ]; then
              sync
              echo 1 > /proc/sys/vm/drop_caches 2>/dev/null
              echo "$(date '+%F %T') 紧张：可用 ${AVAIL}MB / 共 ${TOTAL}MB，已清页缓存" >> "$LOG"
          fi

          # 自己的日志别无限长（超过 64KB 只留最后 200 行）
          if [ -f "$LOG" ] && [ "$(wc -c < "$LOG")" -gt 65536 ]; then
              tail -n 200 "$LOG" > "$LOG.tmp"
              mv "$LOG.tmp" "$LOG"
          fi
          exit 0
          EOF

          # ---------- G. 开机后调优（必须在模块加载之后，故放在 rc.local）----------
          cat > files/etc/rc.local << 'EOF'
          #!/bin/sh
          # conntrack 上限：32K 是性价比最高的档位（默认 16K，P2P + 多设备会把表打满）
          if [ -e /proc/sys/net/netfilter/nf_conntrack_max ]; then
              echo 32768 > /proc/sys/net/netfilter/nf_conntrack_max
              echo 3600  > /proc/sys/net/netfilter/nf_conntrack_tcp_timeout_established
          fi

          # CPU 调频：MT7621 有 cpufreq 就锁 performance，软路由不需要省电
          for g in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
              [ -e "$g" ] && echo performance > "$g"
          done

          # ---- 自愈看门狗（后台，20 秒后检查一次）----
          # 1) LAN 段不完整 → 自动补齐并重载网络（这是"全家断网"的兜底）
          # 2) dnsmasq 没跑 → 重启一次；还起不来只记日志（53 由 dnsmasq 持有，它起不来就等于全断）
          (
              sleep 20
              _dirty=0
              if ! uci -q get network.lan.proto >/dev/null 2>&1; then
                  logger -t netguard "LAN 段缺少 proto，自动修复"
                  uci set network.lan='interface'
                  [ -n "$(uci -q get network.lan.device)" ] || uci set network.lan.device='br-lan'
                  uci set network.lan.proto='static'
                  uci set network.lan.ipaddr='192.168.2.1'
                  uci set network.lan.netmask='255.255.255.0'
                  _dirty=1
              fi
              if ! uci -q get network.lan.device >/dev/null 2>&1; then
                  uci set network.lan.device='br-lan'
                  _dirty=1
              fi
              if [ "$_dirty" = "1" ]; then
                  uci commit network
                  logger -t netguard "网络配置已修复，重载中"
                  /etc/init.d/network reload
                  sleep 5
              fi

              if ! pidof dnsmasq >/dev/null 2>&1; then
                  logger -t netguard "dnsmasq 未运行，尝试重启"
                  /etc/init.d/dnsmasq restart
                  sleep 3
                  if ! pidof dnsmasq >/dev/null 2>&1; then
                      # 53 只由 dnsmasq 持有，这里不要动 dnsmasq 的 server/noresolv
                      logger -t netguard "dnsmasq 仍起不来，检查 /tmp/resolv.conf.d 与 WAN 上游"
                  fi
              fi
          ) &

          # ---- MosDNS：等 WAN 起来、NTP 校时完成后再重启一次 ----
          # DoH 要校验证书，开机头几十秒时钟还是 1970 年，握手必失败（此时走明文兜底）；
          # 重启一次让它切回加密上游。
          ( sleep 25; /etc/init.d/mosdns restart ) &

          exit 0
          EOF

          # ---------- H. 规则手动刷新工具（固件不会自动调用它）----------
          # PassWall 自带 /usr/share/passwall/rules/{gfwlist,chnroute}（随包发布，约 130KB），
          # 运行时不联网更新；这个工具是「想刷才刷」，默认没有任何 cron 会碰它。
          # 它只写 proxy_host 这一份清单：PassWall 的 helper_dnsmasq.lua / helper_chinadns_add.lua
          # 只读 /usr/share/passwall/rules/ 下的文件，全仓库没有一处读 /etc/passwall/rules；
          # 根文件系统是 overlayfs，写 /usr/share 会 copy-up 到 overlay，不动 squashfs 本体。
          # 下载或重启失败自动回滚。
          cat > files/usr/bin/rule-refresh << 'EOF'
          #!/bin/sh
          # 注意：本脚本会联网下载，只在手动执行时才会跑；固件不会自动调用它。
          LOG=/var/log/rule-refresh.log
          RULES=/usr/share/passwall/rules
          TARGET=$RULES/proxy_host
          TMP=/tmp/rules.$$
          log() { echo "$(date '+%F %T') $*" >> "$LOG"; logger -t rule-refresh "$*"; }
          
          [ -d /usr/share/passwall/rules ] || { log "跳过：没有安装 PassWall"; exit 0; }
          mkdir -p "$TMP" || exit 1
          
          # 空间预检：清单约 200KB，留 2MB 余量，不够就安静跳过
          FREE=$(df -Pk /overlay 2>/dev/null | awk 'NR==2{print int($4/1024)}')
          if [ -n "$FREE" ] && [ "$FREE" -lt 2 ]; then
              log "跳过：overlay 仅剩 ${FREE}MB"
              rm -rf "$TMP"; exit 0
          fi
          
          fetch() {
              _url="$1"; _out="$2"; _min="${3:-1000}"
              if command -v curl >/dev/null 2>&1; then
                  curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 15 -m 300 \
                       "$_url" -o "$TMP/$_out" || { log "失败：$_out 下载出错"; return 1; }
              elif command -v uclient-fetch >/dev/null 2>&1; then
                  uclient-fetch -q -O "$TMP/$_out" "$_url" || { log "失败：$_out 下载出错"; return 1; }
              elif command -v wget >/dev/null 2>&1; then
                  wget -q -O "$TMP/$_out" "$_url" || { log "失败：$_out 下载出错"; return 1; }
              else
                  log "失败：系统里没有 curl / uclient-fetch / wget，无法下载"; return 1
              fi
              _n=$(wc -l < "$TMP/$_out" | tr -d ' ')
              [ "$_n" -ge "$_min" ] || { log "失败：$_out 行数异常($_n)"; return 1; }
              log "完成：$_out 下载($_n 行)"
          }
          
          # gfw.txt：纯域名清单，和 PassWall 自带 gfwlist 是同一份数据
          fetch "https://fastly.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/gfw.txt" gfw.raw 1000 \
              || { rm -rf "$TMP"; exit 0; }
          if grep -qE '^(domain|full|regexp|keyword|include):' "$TMP/gfw.raw"; then
              log "失败：gfw.txt 是 v2ray 规则格式，不能直接当域名清单"; rm -rf "$TMP"; exit 0
          fi
          
          # 归一化：去注释与空行、去掉 *./. /http:// 前缀、只留合法域名、转小写、去重
          tr -d '\r' < "$TMP/gfw.raw" | awk '{
                gsub(/^[ \t]+/, ""); gsub(/[ \t]+$/, "")
                if ($0 == "" || substr($0, 1, 1) == "#") next
                sub(/^\*\./, ""); sub(/^\./, "")
                sub(/^https?:\/\/[^\/]*/, ""); sub(/\/.*$/, "")
                if ($0 ~ /^[A-Za-z0-9._-]+$/ && index($0, ".") > 0) print tolower($0)
              }' | sort -u > "$TMP/proxy_host.new"
          _n=$(wc -l < "$TMP/proxy_host.new" | tr -d ' ')
          [ -n "$_n" ] || _n=0
          [ "$_n" -ge 1000 ] || { log "失败：清洗后只剩 $_n 条，保持原规则"; rm -rf "$TMP"; exit 0; }
          
          cp -f "$TARGET" "$TMP/proxy_host.bak" 2>/dev/null || true
          mv -f "$TMP/proxy_host.new" "$TARGET"
          
          # 让规则生效：PassWall 启动时会把 proxy_host 并进它的域名表
          if /etc/init.d/passwall restart >/dev/null 2>&1; then
              log "生效：用户级代理域名 $_n 条 → $TARGET"
          else
              log "回滚：PassWall 重启失败，恢复旧清单"
              if [ -f "$TMP/proxy_host.bak" ]; then cp -f "$TMP/proxy_host.bak" "$TARGET"; else rm -f "$TARGET"; fi
              /etc/init.d/passwall restart >/dev/null 2>&1
          fi
          rm -rf "$TMP"
          exit 0
          EOF

          # ---------- I. 固件自检脚本（刷机后 SSH 执行 fw-selftest）----------
          mkdir -p files/usr/bin
          cat > files/usr/bin/fw-selftest << 'EOF'
          #!/bin/sh
          # 固件自检：一条命令看全系统状态
          P=0; F=0
          ok() { printf '  \033[32m✅\033[0m %s\n' "$1"; P=$((P + 1)); }
          ng() { printf '  \033[31m❌\033[0m %s\n' "$1"; F=$((F + 1)); }
          t()  { d="$1"; shift; if "$@" >/dev/null 2>&1; then ok "$d"; else ng "$d"; fi; }

          echo "===== Newifi-D2 固件自检 ====="
          t "xray 可执行"        xray version
          t "dnsmasq 运行中"     pidof dnsmasq
          t "DNS 解析正常"       nslookup www.baidu.com 127.0.0.1
          t "NAT 转发开启"       test -e /proc/sys/net/ipv4/ip_forward

          [ "$(cat /proc/sys/net/ipv4/ip_forward 2>/dev/null)" = "1" ] && ok "ip_forward=1" || ng "ip_forward≠1"
          # PassWall：只看配置里的硬证据。没配节点时 xray 本来就不启动，
          # 所以不拿 pidof 当失败判据（否则开箱必报红）。
          [ -f /usr/share/passwall/app.sh ] && ok "PassWall 主程序已装（app.sh）" \
            || ng "缺 app.sh：LuCI 能点，但分流逻辑不在"
          [ "$(uci -q get passwall.@global[0].enabled)" = "1" ] && ok "PassWall 已启用（enabled=1）" \
            || ng "PassWall 未启用（/etc/config/passwall）"
          [ "$(uci -q get passwall.@global[0].tcp_proxy_mode)" = "proxy" ] && ok "TCP 代理模式=proxy（绕过大陆）" \
            || ng "TCP 代理模式不是 proxy（分流不会按预期走）"
          [ "$(uci -q get passwall.@global[0].udp_proxy_mode)" = "disable" ] && ok "UDP 不代理（udp_proxy_mode=disable）" \
            || ng "UDP 代理没关（QUIC/UDP 容易出回环）"
          # dns_redirect=1 会让 PassWall 抢 53 并绕开 MosDNS，去广告随即失效——这条必须查
          [ "$(uci -q get passwall.@global[0].dns_redirect)" = "0" ] && ok "PassWall 不抢 53（dns_redirect=0，DNS 仍归 MosDNS）" \
            || ng "dns_redirect≠0：PassWall 会劫持 53，绕开 MosDNS"
          [ "$(uci -q get passwall.@global[0].use_block_list)" = "0" ] && ok "PassWall 屏蔽列表已关（去广告由 MosDNS 负责）" \
            || ng "use_block_list=1：会和 MosDNS 抢同一件事"
          # DNS 分流：dns_shunt=chinadns-ng 时被代理域名走 chinadns-ng（→ 隧道），
          # 它不在就没法给被墙域名拿到干净 IP，表现是「能连、解析到假地址」。
          if command -v chinadns-ng >/dev/null 2>&1; then ok "chinadns-ng 已装"; else ng "缺 chinadns-ng（DNS 分流失效）"; fi
          [ "$(uci -q get passwall.@global[0].dns_shunt)" = "chinadns-ng" ] && ok "DNS 分流=chinadns-ng" \
            || ng "dns_shunt 不是 chinadns-ng（被墙域名可能解析到污染地址）"
          if nft list table inet passwall >/dev/null 2>&1; then
            ok "nft 规则表已装载（table inet passwall）"
          else
            printf '  · nft 表 inet passwall 未装载（没配节点时正常；配了节点仍无则看 logread -e passwall）\n'
          fi
          _nc=$(uci -q show passwall 2>/dev/null | grep -c "=node$")
          printf '  ·· 代理节点 %s 个（0 个时全部流量直连，属正常）\n' "${_nc:-0}"
          t "MosDNS 运行中"       pidof mosdns
          # 5335 = 0x14D7：直接读 /proc/net/udp{,6}，不依赖 busybox 是否编了 netstat
          _p5335=0
          for _pf in /proc/net/udp /proc/net/udp6; do
              [ -r "$_pf" ] || continue
              awk 'NR>1 && $2 ~ /:14D7$/ {f=1} END{exit !f}' "$_pf" && _p5335=1
          done
          if [ "$_p5335" = "0" ] && command -v netstat >/dev/null 2>&1; then
              netstat -lnu 2>/dev/null | grep -q ":5335" && _p5335=1
          fi
          [ "$_p5335" = "1" ] && ok "MosDNS 监听 5335/UDP" || ng "5335 没有监听"
          AD_N=$(wc -l < /etc/mosdns/adblock.txt 2>/dev/null | tr -d " ")
          [ -n "$AD_N" ] || AD_N=0
          [ "$AD_N" -ge 50000 ] && ok "广告域名 $AD_N 条" || ng "广告域名清单异常（$AD_N 条）"
          [ -x /usr/libexec/mosdns-ctl ] && ok "MosDNS 管理脚本已装（LuCI 页面同一入口）" || ng "mosdns-ctl 缺失"
          [ -f /www/luci-static/resources/view/mosdns/overview.js ] && ok "MosDNS 管理页面已装" || ng "MosDNS 管理页面缺失"
          # 规则文件必须齐：gfwlist / chnroute 随 luci-app-passwall 发布，运行时不自动更新
          for _f in gfwlist chnroute; do
              if [ -s "/usr/share/passwall/rules/$_f" ]; then ok "规则 $_f 已内置"; else ng "规则 $_f 缺失（分流会失效）"; fi
          done
          _gfn=$(wc -l < /usr/share/passwall/rules/gfwlist 2>/dev/null | tr -d " ")
          [ -n "$_gfn" ] || _gfn=0
          [ "$_gfn" -ge 3000 ] && ok "代理域名(gfwlist) $_gfn 条" || ng "gfwlist 条数异常（$_gfn 条）"
          _cnn=$(wc -l < /usr/share/passwall/rules/chnroute 2>/dev/null | tr -d " ")
          [ -n "$_cnn" ] || _cnn=0
          [ "$_cnn" -ge 3000 ] && ok "国内 IP 段(chnroute) $_cnn 条" || ng "chnroute 条数异常（$_cnn 条）"
          _phn=$(wc -l < /usr/share/passwall/rules/proxy_host 2>/dev/null | tr -d " ")
          [ -n "$_phn" ] || _phn=0
          [ "$_phn" -ge 1000 ] && ok "代理域名(proxy_host) $_phn 条" || ng "proxy_host 只有 $_phn 条（覆盖层没盖过包内那份）"
          if grep -qE "rule_update|subscribe\.lua|singbox-ctl sub-auto" /etc/crontabs/root 2>/dev/null; then
              ng "crontab 里仍有自动下载任务"
          else
              ok "无自动下载任务"
          fi
          [ -x /usr/bin/memguard ] && ok "内存看门狗已装（每 10 分钟）" || ng "memguard 缺失"
          if grep -q 'memguard' /etc/crontabs/root 2>/dev/null; then
            ok "crontab 里有本地清理任务（不联网）"
          else
            ng "crontab 里没有本地清理任务"
          fi
          _av=$(awk '/^MemAvailable:/ {print int($2/1024)}' /proc/meminfo 2>/dev/null)
          [ -n "$_av" ] && printf '  · 可用内存 %sMB（低于总量 8%% 时 memguard 会自动清缓存）\n' "$_av"
          [ "$(uci -q get dhcp.@dnsmasq[0].cachesize)" = "1000" ] \
              && ok "dnsmasq 缓存 1000 条" || ng "dnsmasq 缓存未调到 1000"
          if [ "$(uci -q get dhcp.@dnsmasq[0].noresolv)" = "1" ]; then
              ok "dnsmasq 只走 MosDNS（noresolv=1）"
          else
              ng "dnsmasq 没锁定上游（noresolv 不是 1）"
          fi
          if uci -q show dhcp.@dnsmasq[0] | grep -q "127.0.0.1#5335"; then
              ok "dnsmasq 上游=127.0.0.1#5335"
          else
              ng "dnsmasq 上游没指向 MosDNS（执行 dns-recover 可修）"
          fi
          [ "$(cat /proc/sys/net/ipv4/tcp_congestion_control 2>/dev/null)" = "bbr" ] && ok "BBR 生效" || ng "BBR 未生效"
          [ "$(cat /proc/sys/net/netfilter/nf_conntrack_max 2>/dev/null)" = "32768" ] && ok "conntrack=32768" || ng "conntrack 未调优"
          [ -d /mnt/sda1 ] && ok "U 盘已挂载 /mnt/sda1" || ng "未检测到 U 盘（未插可忽略）"

          echo
          printf '通过 %d 项，失败 %d 项\n' "$P" "$F"
          if [ "$F" -eq 0 ]; then echo "🎉 一切正常"; else echo "⚠️  有失败项，按上面 ❌ 对应功能排查"; fi
          exit 0
          EOF

          # ---------- I1. 一键体检（刷机后 SSH 执行 quick-check）----------
          cat > files/usr/bin/quick-check << 'QUICKCHECK'
          #!/bin/sh
          # ---------------------------------------------------------------
          # quick-check：刷机后一条命令看全机状态（只读，不改配置、不联网）
          #   用法：SSH 登录后执行  quick-check
          #   判读：✅ 正常 / ⚠️ 能用但有隐患 / ❌ 这项没起来（照提示修）
          #   它只体检，修交给各自的工具：
          #     DNS 全挂   → dns-recover
          #     无线异常   → wifi-doctor
          #     逐项细节   → fw-selftest
          #     代理问题   → 服务 → PassWall（节点 / 日志），或 /etc/init.d/passwall restart
          # ---------------------------------------------------------------
          OK=0; WARN=0; BAD=0
          ok()   { OK=$((OK+1));     printf "  ✅ %s\n" "$*"; }
          warn() { WARN=$((WARN+1)); printf "  ⚠️  %s\n" "$*"; }
          bad()  { BAD=$((BAD+1));   printf "  ❌ %s\n" "$*"; }
          sec()  { printf "\n== %s ==\n" "$*"; }

          # ---------- 1. 设备与固件 ----------
          sec "1. 设备与固件"
          [ -f /etc/openwrt_release ] && . /etc/openwrt_release
          _model=$(ubus call system board 2>/dev/null | sed -n 's/.*"model": *"\([^"]*\)".*/\1/p' | head -n1)
          printf "  型号 : %s\n" "${_model:-未知}"
          printf "  系统 : %s %s (%s)\n" "$DISTRIB_ID" "$DISTRIB_RELEASE" "$DISTRIB_REVISION"
          printf "  内核 : %s\n" "$(uname -r)"
          printf "  运行 : %s\n" "$(uptime | sed 's/^ *//')"
          case "$DISTRIB_RELEASE" in
            24.10*) ok "系统分支 24.10（PassWall + Xray 主线，内核 6.6）" ;;
            *)      warn "系统分支是 $DISTRIB_RELEASE，不是预期的 24.10" ;;
          esac

          # ---------- 2. 闪存与内存 ----------
          sec "2. 闪存与内存"
          set -- $(df -k /overlay 2>/dev/null | tail -n1)
          _ovsize=$2; _ovused=$3; _ovfree=$4; _ovpct=$5
          if [ -n "$_ovfree" ]; then
            printf "  overlay : 共 %s MB，已用 %s (%s)，剩 %s MB\n" "$((_ovsize / 1024))" "$_ovused" "$_ovpct" "$((_ovfree / 1024))"
            if [ "$_ovfree" -lt 2048 ]; then
              warn "overlay 剩余不足 2MB：装不下新插件，rule-refresh 会自动跳过（不影响代理本身）"
            else
              ok "overlay 余量 $((_ovfree / 1024)) MB"
            fi
          else
            warn "读不到 /overlay 使用率"
          fi
          _mt=$(sed -n 's/^MemTotal: *\([0-9]*\) kB.*/\1/p' /proc/meminfo)
          _ma=$(sed -n 's/^MemAvailable: *\([0-9]*\) kB.*/\1/p' /proc/meminfo)
          [ -n "$_mt" ] || _mt=0
          [ -n "$_ma" ] || _ma=0
          _mt=$((_mt / 1024)); _ma=$((_ma / 1024))
          if [ "$_mt" -gt 0 ]; then
            printf "  内存   : 总 %s MB，可用 %s MB\n" "$_mt" "$_ma"
            _pct=$((_ma * 100 / _mt))
            if [ "$_pct" -lt 8 ]; then
              bad "可用内存只剩 ${_pct}%：先停掉不用的服务，或把屏蔽列表降到 5 万条重新构建"
            elif [ "$_pct" -lt 15 ]; then
              warn "可用内存 ${_pct}%，偏紧（memguard 会自己清缓存，不重启任何服务）"
            else
              ok "可用内存 ${_pct}%"
            fi
          fi
          if grep -q zram /proc/swaps 2>/dev/null; then
            ok "zram 交换分区在工作：$(grep zram /proc/swaps | sed 's/.*\///')"
          else
            warn "没看到 zram 交换分区（内存紧时更容易被 OOM 杀掉进程）"
          fi
          # ---------- 3. 外网与 DNS 链路 ----------
          sec "3. 外网与 DNS 链路"
          if ifstatus wan 2>/dev/null | grep -q '"up": true'; then
            ok "WAN 已拨通：$(ifstatus wan 2>/dev/null | sed -n 's/.*"address": *"\([0-9.]*\)".*/\1/p' | head -n1)"
          else
            warn "WAN 未起来（先解决拨号，再判断代理与去广告）"
          fi
          pidof dnsmasq >/dev/null 2>&1 && ok "dnsmasq 运行中" || bad "dnsmasq 没跑：执行 /etc/init.d/dnsmasq restart"
          _up=$(uci -q get dhcp.@dnsmasq[0].server)
          case "$_up" in
            *127.0.0.1#5335*) ok "dnsmasq 上游 = MosDNS(5335)" ;;
            *) bad "dnsmasq 上游没指向 MosDNS（当前：${_up:-空}）：执行 dns-recover 可修" ;;
          esac
          pidof mosdns >/dev/null 2>&1 && ok "MosDNS 运行中（PID $(pidof mosdns)）" || bad "MosDNS 没跑：执行 /etc/init.d/mosdns restart，看 logread -e mosdns"
          if grep -qi ":14D7" /proc/net/udp /proc/net/udp6 2>/dev/null; then
            ok "5335 端口在监听（0x14D7）"
          else
            bad "5335 没有监听：MosDNS 没起来或配置被改坏"
          fi
          _adn=0
          [ -s /etc/mosdns/adblock.txt ] && _adn=$(wc -l < /etc/mosdns/adblock.txt | tr -d " ")
          if [ "${_adn:-0}" -ge 50000 ]; then
            ok "去广告清单 $_adn 条"
          elif [ "${_adn:-0}" -gt 0 ]; then
            warn "去广告清单只有 $_adn 条（构建时上游没拉到，功能偏弱）"
          else
            bad "去广告清单是空的：本次构建没拉到 anti-AD，重新构建即可"
          fi
          if nslookup www.baidu.com 127.0.0.1 >/dev/null 2>&1; then
            ok "域名解析正常（www.baidu.com 走完整链路）"
          else
            bad "解析失败：优先执行 dns-recover 恢复直连，再排查 MosDNS"
          fi
          _adt=$(head -n1 /etc/mosdns/adblock.txt 2>/dev/null)
          if [ -n "$_adt" ]; then
            if nslookup "$_adt" 127.0.0.1 2>/dev/null | grep -q "0.0.0.0"; then
              ok "广告拦截生效（$_adt → 0.0.0.0）"
            else
              warn "广告域名 $_adt 没被拦（清单可能刚改过，/etc/init.d/mosdns restart 后重试）"
            fi
          fi

          # ---------- 4. 代理（PassWall + Xray） ----------
          sec "4. 代理（PassWall + Xray）"
          if command -v xray >/dev/null 2>&1; then
            ok "$(xray version 2>/dev/null | head -n1 | cut -c1-60)"
          else
            bad "xray 二进制缺失：这个固件不完整，重新刷入"
          fi
          _pe=$(uci -q get passwall.@global[0].enabled)
          [ "$_pe" = "1" ] && ok "PassWall 已启用" || warn "PassWall 处于关闭状态（服务 → PassWall 打开）"
          _nodes=$(uci -q show passwall 2>/dev/null | grep -c "=node$")
          [ -n "$_nodes" ] || _nodes=0
          if [ "$_nodes" -le 1 ]; then
            warn "还没添加自己的节点（列表里那个是内置的分流示例节点）：当前全部直连，加节点后立即生效"
          else
            ok "节点数 $_nodes（含 1 个内置分流示例）"
          fi
          pidof xray >/dev/null 2>&1 && ok "Xray 进程在跑（PID $(pidof xray)）" || warn "Xray 没在跑：没选节点时正常，选了节点还这样就看 PassWall → 日志"
          if nft list table inet passwall >/dev/null 2>&1; then
            ok "nftables 规则表 inet passwall 已装载"
          else
            warn "没有 inet passwall 表：没选节点时正常（规则只在有节点时下发）"
          fi
          _dr=$(uci -q get passwall.@global[0].dns_redirect)
          [ "$_dr" = "0" ] && ok "dns_redirect=0（PassWall 不抢 53，去广告不会被绕开）" || bad "dns_redirect=$_dr：PassWall 会劫持 53 并绕开 MosDNS，改回 0"
          _bl=$(uci -q get passwall.@global[0].use_block_list)
          [ "$_bl" = "0" ] && ok "PassWall 自带去广告已关（统一由 MosDNS 拦）" || warn "use_block_list=$_bl：会和 MosDNS 重复拦截，建议设 0"
          _um=$(uci -q get passwall.@global[0].udp_proxy_mode)
          [ "$_um" = "disable" ] && ok "UDP 不代理（省 CPU，QUIC 自动回落 TCP）" || warn "udp_proxy_mode=$_um：UDP 走代理在 mipsel 上很吃 CPU"
          _ph=0
          [ -s /usr/share/passwall/rules/proxy_host ] && _ph=$(wc -l < /usr/share/passwall/rules/proxy_host | tr -d " ")
          if [ "$_ph" -ge 1000 ]; then
            ok "代理域名清单(proxy_host) $_ph 条"
          else
            warn "proxy_host 只有 $_ph 条（出厂应 >=1000）：覆盖层没生效？"
          fi
          _gf=0; _cn=0
          [ -s /usr/share/passwall/rules/gfwlist ] && _gf=$(wc -l < /usr/share/passwall/rules/gfwlist | tr -d " ")
          [ -s /usr/share/passwall/rules/chnroute ] && _cn=$(wc -l < /usr/share/passwall/rules/chnroute | tr -d " ")
          if [ "$_gf" -ge 1000 ] && [ "$_cn" -ge 1000 ]; then
            ok "包自带规则：gfwlist $_gf 行 / chnroute $_cn 行"
          else
            warn "包自带规则不全（gfwlist $_gf / chnroute $_cn 行），重新刷入整包"
          fi
          # ---------- 5. 本机服务 ----------
          sec "5. 本机服务"
          ls /etc/rc.d/S*ksmbd >/dev/null 2>&1 && ok "Ksmbd 开机自启（共享目录 /mnt/sda1）" || warn "Ksmbd 未设自启（/etc/init.d/ksmbd enable）"
          ls /etc/rc.d/S*p910nd >/dev/null 2>&1 && ok "p910nd 开机自启（USB 打印机 /dev/usb/lp0）" || warn "p910nd 未设自启（/etc/init.d/p910nd enable）"
          [ -x /usr/bin/memguard ] && ok "内存看门狗 memguard 已装（每 10 分钟）" || warn "memguard 缺失"
          _cn2=$(grep -c "" /etc/crontabs/root 2>/dev/null)
          [ -n "$_cn2" ] || _cn2=0
          if [ "$_cn2" -ge 4 ]; then
            ok "crontab $_cn2 条（清缓存 / memguard / MosDNS 守护 / 日志截断）"
          else
            warn "crontab 只有 $_cn2 条，必要维护任务可能没装上"
          fi
          if grep -qE "rule_update|subscribe\.lua" /etc/crontabs/root 2>/dev/null; then
            warn "crontab 里有联网更新任务（本固件设计为全本地、不自动联网），确认是你要的"
          else
            ok "没有任何自动联网任务（规则与订阅都要手动触发）"
          fi

          # ---------- 6. 无线 ----------
          sec "6. 无线"
          for _r in radio0 radio1; do
            uci -q get wireless.$_r >/dev/null 2>&1 || continue
            _dis=$(uci -q get wireless.$_r.disabled)
            _cc=$(uci -q get wireless.$_r.country)
            _ch=$(uci -q get wireless.$_r.channel)
            _hm=$(uci -q get wireless.$_r.htmode)
            _ns=$(uci -q get wireless.$_r.noscan)
            if [ "$_dis" = "1" ]; then
              warn "$_r 被禁用"
              continue
            fi
            if [ "$_cc" = "CN" ]; then
              printf "  ✅ %-7s 法规域 CN · 信道 %s · %s%s\n" "$_r" "${_ch:-auto}" "${_hm:-HT20}" "$([ "$_ns" = "1" ] && echo " · noscan")"
            else
              warn "$_r 法规域是 ${_cc:-未设}（不是 CN）：功率被压、5G 部分信道不可用"
            fi
          done
          _bad_ack=0
          for _i in $(uci -q show wireless 2>/dev/null | sed -n 's/^\(wireless\.[^.]*\)\.disassoc_low_ack=.*/\1/p'); do
            [ "$(uci -q get $_i.disassoc_low_ack)" = "0" ] || _bad_ack=$((_bad_ack+1))
          done
          [ "$_bad_ack" -eq 0 ] && ok "全部无线接口 disassoc_low_ack=0（弱信号不轻易踢）" || warn "$_bad_ack 个无线接口还开着 disassoc_low_ack（弱处容易掉线）"
          wifi status >/dev/null 2>&1 && ok "无线已启动（细节跑 wifi-doctor）" || warn "无线没起来：wifi up 后看 logread -e hostapd"

          # ---------- 7. 结论 ----------
          sec "7. 结论"
          printf "  ✅ %s 项   ⚠️  %s 项   ❌ %s 项\n" "$OK" "$WARN" "$BAD"
          if [ "$BAD" -gt 0 ]; then
            echo "  有 ❌：DNS 全挂先跑 dns-recover；其余按上面每条的提示走，细节看 fw-selftest"
          elif [ "$WARN" -gt 0 ]; then
            echo "  没有 ❌，⚠️ 只是隐患不是故障；逐条处理即可（没加节点导致的 ⚠️ 属正常出厂状态）"
          else
            echo "  全绿：DNS / 去广告 / 代理 / 共享 / USB 打印 / 内存守护 / 无线都在位"
          fi
          echo
          echo "  相关命令：fw-selftest（逐项细节）  wifi-doctor（无线）  dns-recover（DNS 兜底）"
          echo "            rule-refresh（手动刷分流名单）  /etc/init.d/passwall restart"
          exit 0
          QUICKCHECK

          # ---------- I2. 无线诊断（刷机后 SSH 执行 wifi-doctor）----------
          # 这类小机器上“信号弱 / 时有时无”最常见的原因不是硬件，而是：信道被邻居占满、
          # 法规域把功率压低、内存被吃光（OOM 杀 hostapd）、驱动/firmware 报错。
          # 这个脚本只读，不碰任何配置，把判断依据一次全打印出来。
          cat > files/usr/bin/wifi-doctor << 'EOF'
          #!/bin/sh
          # wifi-doctor：判断“信号弱 / 时有时无”到底是信道拥挤、法规限功率、内存被吃光，
          # 还是驱动报错。只读脚本，不改任何配置。用法：SSH 登录后执行  wifi-doctor

          command -v iw >/dev/null 2>&1 || { echo '缺少 iw（opkg install iw 后重试）'; exit 1; }
          printf '\n===== Newifi-D2 无线诊断 =====\n\n'

          echo '--- 1. 法规域（决定允许的最大发射功率）---'
          if iw reg get 2>/dev/null | grep -q 'country 00'; then
              echo '  ✗ country 00：法规域没设置，驱动会把功率压到最低档'
          else
              iw reg get 2>/dev/null | sed -n '1,4p' | sed 's/^/  /'
          fi

          IFACES=$(iw dev 2>/dev/null | awk '$1=="Interface"{print $2}')

          echo
          echo '--- 2. 网卡 / 信道 / 带宽 / 发射功率 ---'
          if [ -z "$IFACES" ]; then
              echo '  ✗ 没有无线接口：无线被禁用或驱动没加载（看第 5 节 dmesg）'
          else
              for d in $IFACES; do
                  iw dev "$d" info 2>/dev/null | awk -v D="$d" '
                      /ssid/ { s=$2 }
                      /channel/ { c=$2; for (i=1;i<=NF;i++) if ($i ~ /^width:/) w=$(i+1) }
                      /txpower/ { p=$2 }
                      END {
                          if (!p) p="驱动未上报"; else p=p" dBm"
                          printf "  %-6s ssid=%-18s 信道=%-4s 宽=%s 功率=%s\n", D, (s?s:"未启用/未关联"), (c?c:"?"), (w?w"MHz":"?"), p
                          if (p+0 > 0 && p+0 < 15) print "        ✗ 功率低于 15dBm，属于被法规/驱动压过"
                      }'
              done
          fi

          echo
          echo '--- 3. 信道占用率（只看 >=30% 的，>60% 就是“信号满格也卡”）---'
          for d in $IFACES; do
              iw dev "$d" survey dump 2>/dev/null | awk -v D="$d" '
                  /frequency:/ { f=$2 }
                  /channel active time:/ { a[f]=$4 }
                  /channel busy time:/ { b[f]=$4 }
                  END {
                      for (k in a) if (a[k] > 0) {
                          p = int(b[k]*100/a[k])
                          if (p >= 60) printf "  %s %s MHz 占用 %d%%  <== 太挤，换信道\n", D, k, p
                          else if (p >= 30) printf "  %s %s MHz 占用 %d%%\n", D, k, p
                      }
                  }'
          done

          echo
          echo '--- 4. 已连客户端信号（低于 -70dBm 就是弱，-80 以下基本不可用）---'
          for d in $IFACES; do
              iw dev "$d" station dump 2>/dev/null | awk -v D="$d" '
                  /^Station/ { m=$2 }
                  /signal:/ { printf "  %s %s %s dBm\n", D, m, $2 }'
          done

          echo
          echo '--- 5. 内存 / 驱动 ---'
          if [ -r /proc/meminfo ]; then
              awk '/MemTotal/{t=int($2/1024)} /MemAvailable/{a=int($2/1024)} END{printf "  可用内存：%d MB / %d MB\n", a, t}' /proc/meminfo
          else
              echo '  读不到 /proc/meminfo'
          fi
          OOM=$(dmesg 2>/dev/null | grep -ciE "out of memory|killed process")
          if [ "${OOM:-0}" -gt 0 ]; then
              echo "  ✗ 内核出现过 ${OOM} 次 OOM：内存被吃光时 mt76/hostapd 会被杀，无线会凭空消失几秒"
          fi
          dmesg 2>/dev/null | grep -iE 'mt76|ieee80211|hostapd|firmware' | tail -n 10 | sed 's/^/  /'

          echo
          echo '--- 6. 怎么办 ---'
          echo '  功率低      → wireless.radio0/1.country 必须是 CN（第 1 节看法规域）'
          echo '  信道挤      → uci set wireless.radio0.channel=1（或 6/11）；wifi reload'
          echo '  弱处掉线    → uci set wireless.default_radio0.disassoc_low_ack=0；wifi reload'
          echo '  覆盖不够    → uci set wireless.radio1.htmode=VHT40；wifi reload'
          echo '  内存不足    → 少装插件，或把屏蔽列表从 11 万条降到 5 万条后重新构建'
          echo
          exit 0
          EOF

          # ---------- K. 去广告：把 anti-AD 编译成 MosDNS 的域名集合 ----------
          # 为什么不用 chinadns-ng 那套"屏蔽列表"：只有它会把清单编译成 null 组，
          # 而 chinadns-ng 会把 MosDNS 返回的 0.0.0.0 换成代理侧的真实应答（见 C 节说明）。
          # 现在统一由 MosDNS 的 domain_set 吃纯域名清单：命中直接返回 0.0.0.0，
          # 进程内哈希匹配，运行时不联网、不写闪存。
          mkdir -p files/etc/mosdns
          BLOCK=files/etc/mosdns/adblock.txt
          RAW=/tmp/ad-raw.txt
          : > "$RAW"
          for u in \
            "https://fastly.jsdelivr.net/gh/privacy-protection-tools/anti-AD@master/anti-ad-domains.txt" \
            "https://cdn.jsdelivr.net/gh/privacy-protection-tools/anti-AD@master/anti-ad-domains.txt" \
            "https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-domains.txt" \
            "https://gitee.com/privacy-protection-tools/anti-AD/raw/master/anti-ad-domains.txt" \
            "https://small.oisd.nl/domainswild"; do
            echo "下载广告域名清单: $u"
            if curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 15 -m 240 "$u" -o "$RAW"; then
              [ "$(wc -c < "$RAW")" -gt 400000 ] && break
              echo "::warning::内容过小，换下一个源"
            fi
            : > "$RAW"
          done

          if [ -s "$RAW" ]; then
            # 只保留合法域名：去 CR/空白、去注释与空行、去 *. 前缀、统一小写、去重排序
            sed -e 's/\r$//' "$RAW" \
              | awk '{ gsub(/^[ \t]+|[ \t]+$/, ""); if ($0 ~ /^#/ || length($0) == 0) next; sub(/^\*\./, ""); sub(/^\./, ""); print tolower($0) }' \
              | grep -E '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$' \
              | LC_ALL=C sort -u > "$BLOCK" || true
          else
            echo "::warning::所有广告清单源都下载失败，本次固件不含去广告规则"
            : > "$BLOCK"
          fi

          BLOCK_N=$(wc -l < "$BLOCK" | tr -d " ")
          BLOCK_B=$(wc -c < "$BLOCK" | tr -d " ")
          [ -n "$BLOCK_N" ] || BLOCK_N=0
          [ -n "$BLOCK_B" ] || BLOCK_B=0
          echo "广告域名清单: $BLOCK_N 条 / $BLOCK_B 字节（squashfs 压缩后约 +$((BLOCK_B / 3 / 1024)) KB）"
          if [ "$BLOCK_N" -lt 50000 ]; then
            echo "::warning::广告清单只有 $BLOCK_N 条（预期 >=50000），去广告效果会很差；上游格式可能变了"
          fi
          if [ "$BLOCK_N" -gt 250000 ] || [ "$BLOCK_B" -gt 5000000 ]; then
            echo "::error::广告清单异常膨胀（$BLOCK_N 条 / $BLOCK_B 字节），拒绝塞爆 32MB 闪存"
            exit 1
          fi
          chmod +x files/usr/bin/dns-recover files/usr/bin/fw-selftest files/usr/bin/rule-refresh files/usr/bin/wifi-doctor files/usr/bin/memguard files/usr/bin/quick-check \
                   files/etc/init.d/mosdns \
                   files/etc/hotplug.d/net/20-usbwan files/etc/uci-defaults/* files/etc/rc.local
          # ---- 生成物语法自检：构建机是 dash，bashism 会在这里被抓出来 ----
          for f in files/usr/bin/* files/etc/uci-defaults/* files/etc/hotplug.d/net/* files/etc/init.d/* files/etc/rc.local; do
            [ -f "$f" ] || continue
            sh -n "$f" || { echo "::error::脚本语法错误：$f"; exit 1; }
          done
          chmod +x files/usr/libexec/mosdns-ctl
          sh -n files/usr/libexec/mosdns-ctl || { echo "::error::脚本语法错误：files/usr/libexec/mosdns-ctl"; exit 1; }
          # LuCI 页面是 JS：只做最基本的括号/引号配平检查（没有 node 也能跑）
          for f in files/www/luci-static/resources/view/mosdns/overview.js; do
            awk 'BEGIN{d=0}{for(i=1;i<=length($0);i++){c=substr($0,i,1); if(c=="{")d++; else if(c=="}")d--}}END{if(d!=0){print "unbalanced braces: " FILENAME; exit 1}}' "$f" \
              || { echo "::error::JS 括号不平衡：$f"; exit 1; }
          done
          echo "🔧 files/ 预置完成："
          find files -type f | sort

          # 打包覆盖层快照：第 12 步"缺失补齐"时可一键还原，不用重跑整个 step
          tar -C . -czf /workdir/files-overlay.tgz files
          echo "覆盖层快照: $(du -h /workdir/files-overlay.tgz | cut -f1)"

      # ---------------------------------------------------------------
      - name: 6. 缓存 ccache 与 dl
        if: inputs.clean_build != true
        uses: actions/cache@v4
        with:
          path: |
            /workdir/immortalwrt/.ccache
            /workdir/immortalwrt/dl
          key: ${{ runner.os }}-d2-v17-${{ hashFiles('newifi-d2.config', '.github/workflows/build-immortalwrt.yml') }}
          restore-keys: |
            ${{ runner.os }}-d2-v17-

      # ---------------------------------------------------------------
      - name: 7. 应用 .config 并做依赖硬校验
        run: |
          cd immortalwrt

          # ---------- Go 工具链版本 ----------
          # feeds 的 GO_DEFAULT_VERSION 决定 Go 组件用哪个 Go 编译。
          # 24.10 的 xray-core 是预编译二进制包（不需要 Go），MosDNS 用 feeds 默认 Go 即可。
          # 若日志出现 "go.mod requires go >= 1.XX"，把 go_version 输入改成 1.XX 重跑
          # （24.10 的 golang 是单包、没有 GO_DEFAULT_VERSION，此时该输入会被忽略并告警）。
          GO_VER="${{ inputs.go_version }}"
          if [ -n "$GO_VER" ] && [ "$GO_VER" != "auto" ]; then
            if grep -q '^GO_DEFAULT_VERSION' feeds/packages/lang/golang/golang-values.mk; then
              sed -i "s/^GO_DEFAULT_VERSION:=.*/GO_DEFAULT_VERSION:=$GO_VER/" \
                feeds/packages/lang/golang/golang-values.mk
              echo "🔧 已强制 Go 版本为 $GO_VER"
            else
              echo "::warning::本分支 golang 没有 GO_DEFAULT_VERSION，忽略 go_version=$GO_VER（用 feeds 默认）"
            fi
          fi
          echo "---- 当前 Go 工具链 ----"
          grep -n '^GO_DEFAULT_VERSION' feeds/packages/lang/golang/golang-values.mk \
            || echo "  （本分支无 GO_DEFAULT_VERSION，使用 golang 包自带版本）"
          ls -d feeds/packages/lang/golang/golang[0-9]* 2>/dev/null | sed 's/^/  可用版本: /' || true
          echo "xray-core 版本: $(sed -n 's/^PKG_VERSION:=//p' package/feeds/packages/xray-core/Makefile 2>/dev/null)"
          echo "passwall 版本 : $(sed -n 's/^PKG_VERSION:=//p' package/feeds/luci/luci-app-passwall/Makefile 2>/dev/null)"
          echo "mosdns 版本   : $(sed -n 's/^PKG_VERSION:=//p' package/feeds/packages/mosdns/Makefile 2>/dev/null)"

          # ---------- Go 模块缓存移出 dl（关键）----------
          # dl/ 会被 actions/cache 缓存。之前构建中断时把"残缺的模块目录"也存进了缓存，
          # 下次恢复后 Go 把残缺副本当完整用，于是出现一堆
          #   "no required module provides package X/internal/y"
          #   "build constraints exclude all Go files"
          # 把 GOMODCACHE 指到不进缓存的目录，从根上消除这个隐患（代价：每次多下 1~2 分钟）
          sed -i 's#^GO_MOD_CACHE_DIR:=.*#GO_MOD_CACHE_DIR:=/workdir/gomod#' \
            feeds/packages/lang/golang/golang-values.mk
          mkdir -p /workdir/gomod
          grep -n '^GO_MOD_CACHE_DIR' feeds/packages/lang/golang/golang-values.mk
          # 清掉旧缓存里可能残缺的那份
          rm -rf dl/go-mod-cache

          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config

          # ---------- 可选：关闭 TurboACC ----------
          # 它是第三方 v1.4；万一与 24.10 的 LuCI 不兼容导致编译失败，
          # 用 with_turboacc=false 重跑即可，加速能力不受影响
          #（flow offload 走 firewall4，BBR 走 sysctl + kmod-tcp-bbr）
          EFF_TURBO="true"
          # inputs.* 在触发时可能全是空串，这里统一回落到默认值 true，
          # 免得把 TurboACC 当成“用户要求关闭”而悄悄漏掉。
          TURBO="${{ inputs.with_turboacc }}"
          [ -z "$TURBO" ] && TURBO="true"
          # 第 4 步若没拿到 TurboACC 源码（克隆失败/上游改结构），这里自动降级，
          # 否则下面的 check CONFIG_PACKAGE_luci-app-turboacc 会误报缺失并中断构建。
          if [ -e /workdir/no-turboacc-src ]; then
            TURBO="false"
            echo "⏭  第 4 步未取得 TurboACC 源码，本次构建跳过它"
          fi
          if [ "$TURBO" != "true" ]; then
            sed -i -E 's/^(CONFIG_PACKAGE_luci-app-turboacc.*)$/# \1/' .config
            EFF_TURBO="false"
            echo "⏭  已按输入关闭 TurboACC"
          fi
          # 记录"实际生效状态"：第 11 步可能自动降级把它关掉，第 12 步审计要读这个文件
          echo "$EFF_TURBO" > /workdir/state-turboacc

          # GitHub 的默认 shell 带 -e -o pipefail：make defconfig 只要因上游 Kconfig
          # 递归依赖返回非 0，这一步就会在这里直接退出（日志里只剩 Kconfig 报错，看不到
          # 下面任何诊断），表现就是"莫名其妙 exit 1"。这里显式吞掉退出码，最终是否放行
          # 交给下方的 .config 头校验判定——那才是"配置真的生成了没有"的唯一证据。
          set +e
          make defconfig 2>&1 | tee defconfig.log
          DEFCONF_RC=$?
          set -e
          echo "defconfig 退出码: $DEFCONF_RC（非 0 多为上游 Kconfig 噪声，关键包由下方 check 兜底）"

          # Kconfig 的递归依赖报错属于"上游噪声"：dnsdist / snort3 / knot-resolver 这类
          # 带 +luajit 的包，上游 luajit provides 一改动就会自依赖（见 upstream issue）。
          # 它们本固件不用，第 4 步已摘除；这里只告警不阻断——真正决定"固件是否残缺"的
          # 是下面那张 check 列表：任何一个必需的包没生效都会 ::error:: 并退出。
          if grep -q 'recursive dependency detected' defconfig.log; then
            echo "::warning::Kconfig 报递归依赖（无关包噪声，已忽略；关键包由下方 check 兜底）"
            grep -A1 'recursive dependency detected' defconfig.log | grep 'symbol' | sed 's/^ */  /' | head -n 20
          fi

          if grep -qi 'warning' defconfig.log; then
            echo "::warning::defconfig 存在告警，以下符号可能被丢弃："
            grep -i 'warning' defconfig.log | head -n 50
          fi

          # 兜底：.config 是我们自己 cp 进来的，所以"文件非空"证明不了 defconfig 跑成功。
          # kconfig 真正写回过的话，头几行一定有 "Automatically generated file"；
          # 没有就说明它在递归依赖上报错退出了，别拿一份没解析过的配置去编译。
          if ! head -n 3 .config | grep -q 'Automatically generated file'; then
            echo "::error::defconfig 未真正生成配置（Kconfig 致命错误，见 defconfig.log）"
            tail -n 30 defconfig.log
            exit 1
          fi

          echo "======== 关键组件校验 ========"
          MISSING=0
          check() {
            if grep -qx "$1=y" .config; then
              printf '  ✅ %s\n' "$1"
            else
              printf '::error::未生效：%s（包不存在或依赖不满足）\n' "$1"
              MISSING=1
            fi
          }
          check CONFIG_PACKAGE_dnsmasq-full
          if grep -qx 'CONFIG_PACKAGE_ca-bundle=y' .config; then
            echo "  ✅ ca-bundle 已编入（MosDNS 的 DoH 要校验证书）"
          else
            echo "::error::缺 ca-bundle：MosDNS 的 DoH 会一直校验证书失败，只能退明文"
            MISSING=1
          fi
          check CONFIG_PACKAGE_mosdns
          check CONFIG_PACKAGE_luci-app-passwall
          # 25.12.16 没有 Nftables/Iptables_Transparent_Proxy 开关（自己按 fw4+nftset 判断），
          # 也必须有中文翻译包，否则页面是英文
          check CONFIG_PACKAGE_luci-i18n-passwall-zh-cn
          check CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray
          check CONFIG_PACKAGE_xray-core
          check CONFIG_PACKAGE_chinadns-ng
          check CONFIG_PACKAGE_dns2socks
          # sing-box / SSR-Plus 已整体移除：一旦被别的依赖偷偷拉回来，镜像会白占约 40MB，
          # 而且两套透明代理同时挂 nft 规则必然打架，所以这里反向硬拦。
          for bad in CONFIG_PACKAGE_sing-box CONFIG_PACKAGE_sing-box-tiny \
                     CONFIG_PACKAGE_luci-app-ssr-plus; do
            if grep -qx "$bad=y" .config; then
              echo "::error::$bad 又被拉进 .config 了（本固件用 PassWall + Xray，不能再有第二套透明代理）"
              MISSING=1
            fi
          done
          # 无线法规库/工具：缺 wireless-regdb 时 country=CN 会设置失败，2.4G 功率
          # 退回 world 域（信号弱），5G 部分信道不可用（时有时无）；缺 iw 则
          # wifi-doctor 与手动切信道都用不了。只警告，不阻断构建。
          for s in CONFIG_PACKAGE_wireless-regdb CONFIG_PACKAGE_iw; do
            if grep -qx "$s=y" .config; then
              printf '  ✅ %s\n' "$s"
            else
              printf '::warning::未生效：%s（不影响构建，但会削弱无线能力）\n' "$s"
            fi
          done
          # geo 数据不编入，反过来确认它没被别的依赖偷偷拉回来（省约 3MB 闪存）
          if grep -q '^CONFIG_PACKAGE_v2ray-geosite=y' .config; then
            echo "::error::geosite 又被拉进镜像了（INCLUDE_V2ray_Geodata 应为 n），白占约 3MB"
            MISSING=1
          else
            echo "  ✅ geo 数据未编入（省约 3MB 闪存）"
          fi
          if [ "$TURBO" = "true" ]; then
            check CONFIG_PACKAGE_luci-app-turboacc
          else
            echo "  ⏭  TurboACC 按要求跳过（不影响 offload / BBR）"
          fi
          check CONFIG_PACKAGE_zram-swap
          check CONFIG_PACKAGE_luci-app-ksmbd
          check CONFIG_PACKAGE_ksmbd-server
          check CONFIG_PACKAGE_kmod-fs-ksmbd
          check CONFIG_PACKAGE_luci-app-p910nd
          check CONFIG_PACKAGE_p910nd
          check CONFIG_PACKAGE_kmod-usb-net-rndis
          check CONFIG_PACKAGE_kmod-usb-net-cdc-ncm

          if [ "$MISSING" -ne 0 ]; then
            echo "::error::存在未生效的组件，拒绝继续构建（否则会产出残缺固件）"
            echo "---- feeds 里这些包是否存在（1=有，0=没有）----"
          for p in luci-app-passwall xray-core chinadns-ng dns2socks mosdns luci-compat luci-lib-jsonc nftables \
                       kmod-nft-tproxy kmod-nft-socket kmod-nft-nat luci-app-turboacc; do
                printf '  %-24s %s\n' "$p" "$(./scripts/feeds list -n 2>/dev/null | grep -cx "$p")"
              done
            echo "排查建议："
            echo "  1) 缺哪个包，就把对应源码加进第 4 步（或改成 feeds 里已有的等价包）"
            echo "  2) 看本步骤上方 make defconfig 的告警，通常会点出缺失的依赖"
            echo "  3) 若是编译期报 'go.mod requires go >= 1.XX'，把 go_version 输入改成 1.XX 重跑"
            exit 1
          fi
          echo "🎉 全部组件校验通过"

          {
            echo "### 📦 参与构建的关键包"
            echo ""
            echo '```'
          grep -E '^CONFIG_PACKAGE_(luci-app-passwall|luci-app-passwall_INCLUDE_Xray|xray-core|chinadns-ng|dns2socks|mosdns|luci-app-turboacc|dnsmasq-full|luci-app-ksmbd|zram-swap)=' .config | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------
      - name: 8. LAN 网段改为 192.168.2.1
        run: |
          cd immortalwrt
          GEN="package/base-files/files/bin/config_generate"
          if [ -f "$GEN" ]; then
            sed -i 's/192\.168\.1\.1/192.168.2.1/g' "$GEN"
            grep -q '192.168.2.1' "$GEN" \
              || { echo "::error::LAN IP 注入失败"; exit 1; }
            echo "✅ config_generate 已改为 192.168.2.1"
          else
            echo "::warning::$GEN 不存在，跳过（首启仍由 uci-defaults/90-luci 设置）"
          fi

      # ---------------------------------------------------------------
      - name: 9. 预置 PassWall 分流名单（出厂即生效，不依赖运行时联网）
        run: |
          cd immortalwrt
          # PassWall 包自带四份规则（chnroute / chnroute6 / gfwlist / chnlist），装好就在
          # /usr/share/passwall/rules/，官方清单已经很全，所以这里不重复下载 CIDR。
          # 只做一件事：把"上游清单常常滞后"的高频域名并进 proxy_host。
          # 关键：PassWall 的 helper_dnsmasq.lua（411/433 行）与 helper_chinadns_add.lua（31/244 行）
          # 只读 /usr/share/passwall/rules/ 下的 proxy_host，全仓库没有一处读 /etc/passwall/rules，
          # 所以这里必须写 files/usr/share/passwall/rules/proxy_host。files/ 覆盖层在 opkg 装包之后
          # 才拷进 rootfs，能盖掉包自带的 14 行 proxy_host；squashfs 是只读的，只有这样做才生效。
          RULES="files/usr/share/passwall/rules"
          mkdir -p "$RULES"
          TMP=$(mktemp -d)

          # 先把 Loyalsoldier 的 gfw.txt 拉下来当主力（v2ray 格式，需归一化成纯域名）
          _have=0
          if curl -fsSL --retry 3 --retry-delay 2 \
          "https://fastly.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/gfw.txt" \
          -o "$TMP/gfw.raw"; then
          tr -d '\r' < "$TMP/gfw.raw" | awk '{
          sub(/^(domain|full):/, "")
          gsub(/^[ \t]+/, ""); gsub(/[ \t]+$/, "")
          if ($0 == "" || substr($0, 1, 1) == "#") next
          if ($0 ~ /^(regexp|keyword|include):/) next
          sub(/^\*\./, ""); sub(/^\./, "")
          sub(/^https?:\/\/[^\/]*/, ""); sub(/\/.*$/, "")
          if ($0 ~ /^[A-Za-z0-9._-]+$/ && index($0, ".") > 0) print tolower($0)
          }' | sort -u > "$TMP/gfw.dom"
          _have=$(wc -l < "$TMP/gfw.dom" | tr -d " ")
          if [ "$_have" -lt 1000 ]; then
          echo "::warning::gfw.txt 归一化后只有 $_have 条（预期 >=1000），改用人工清单兜底"
          : > "$TMP/gfw.dom"; _have=0
          else
          echo "✅ 上游 gfw.txt：$_have 个域名"
          fi
          else
          echo "::warning::gfw.txt 下载失败，只用人工清单（PassWall 自带的 gfwlist 仍然生效）"
          : > "$TMP/gfw.dom"
          fi

          # 离线兜底：构建树里本来就有 PassWall 自带的 gfwlist（约 5900 条纯域名），
          # 上游拉不动时用它，避免 proxy_host 只剩几十条人工名单这种半成品。
          if [ "$_have" -eq 0 ]; then
            _pkg_gfw=package/feeds/luci/luci-app-passwall/root/usr/share/passwall/rules/gfwlist
            if [ -s "$_pkg_gfw" ]; then
              grep -vE '^[[:space:]]*(#|$)' "$_pkg_gfw" | tr -d '\r' | sort -u > "$TMP/gfw.dom"
              _have=$(wc -l < "$TMP/gfw.dom" | tr -d " ")
              echo "✅ 离线兜底：用包自带 gfwlist，$_have 条"
            fi
          fi

          # 人工补充清单：只加真正需要走代理的，国内能直连的一个都不加（多走一跳只会更慢）。
          # 纯域名、一行一个，apex 就覆盖全部子域，所以只写主域名、不堆子域。
          cat > "$TMP/extra" << 'EXTRA'
          openai.com
          chatgpt.com
          oaistatic.com
          oaiusercontent.com
          anthropic.com
          claude.ai
          gemini.google.com
          ai.google.dev
          generativelanguage.googleapis.com
          aistudio.google.com
          copilot.microsoft.com
          perplexity.ai
          poe.com
          grok.com
          x.ai
          mistral.ai
          huggingface.co
          hf.co
          midjourney.com
          openrouter.ai
          together.ai
          replicate.com
          netflix.com
          nflxvideo.net
          nflximg.net
          disneyplus.com
          hbomax.com
          max.com
          primevideo.com
          spotify.com
          scdn.co
          soundcloud.com
          twitch.tv
          hulu.com
          vimeo.com
          twitter.com
          x.com
          t.co
          facebook.com
          instagram.com
          threads.net
          whatsapp.com
          telegram.org
          telegram.me
          t.me
          telegra.ph
          discord.com
          discordapp.com
          reddit.com
          signal.org
          github.com
          githubusercontent.com
          githubassets.com
          gitlab.com
          docker.com
          docker.io
          npmjs.com
          pypi.org
          stackoverflow.com
          medium.com
          substack.com
          notion.so
          figma.com
          slack.com
          zoom.us
          trello.com
          atlassian.com
          1password.com
          bitwarden.com
          protonmail.com
          proton.me
          tutanota.com
          wikipedia.org
          wikimedia.org
          quora.com
          bbc.com
          nytimes.com
          reuters.com
          bloomberg.com
          economist.com
          EXTRA

          # 合并去重：PassWall 读 proxy_host 时一行一条，不接受注释与空行
          cat "$TMP/gfw.dom" "$TMP/extra" | sort -u > "$RULES/proxy_host"
          _total=$(wc -l < "$RULES/proxy_host" | tr -d " ")
          _bad=$(grep -cvE '^[a-z0-9._-]+$' "$RULES/proxy_host" || true)
          echo "分流名单: $_total 条（人工 $(wc -l < "$TMP/extra" | tr -d " ") 条，上游 $_have 条）"
          if [ "$_bad" -ne 0 ]; then
          echo "::error::proxy_host 里有 $_bad 行不是纯域名，PassWall 会解析失败"
          grep -nvE '^[a-z0-9._-]+$' "$RULES/proxy_host" | head -n 10
          exit 1
          fi
          if [ "$_total" -lt 100 ]; then
          echo "::error::proxy_host 只有 $_total 行，明显不对劲，拒绝产出半成品名单"
          exit 1
          fi
          rm -rf "$TMP"

          echo "ℹ️  不编入 GeoIP / GeoSite：v2ray-geoip(23MB) 与 v2ray-geosite(2.3MB) 都不装，
          国内 IP 直连靠 PassWall 自带的 chnroute，省下约 25MB 闪存。"

          # 覆盖层快照必须包含这份名单：第 12 步"缺件补齐"会用它还原 files/，
          # 快照若停在生成之前，一旦触发补齐就等于把名单删了，而补齐逻辑只会重装包、
          # 不会重新生成名单 → 审计永远补不回来，白跑 3 轮后失败。
          tar -C . -czf /workdir/files-overlay.tgz files
          echo "覆盖层快照已更新（含分流名单）: $(du -h /workdir/files-overlay.tgz | cut -f1)"

      # ---------------------------------------------------------------
      - name: 10. 下载源码包（失败重试；无进展立即中断并诊断）
        run: |
          cd immortalwrt
          # 只下载 .config 已选中的包所需源码：make download 按依赖图遍历，未选中的包不会下载
          export GIT_HTTP_LOW_SPEED_LIMIT=1000
          export GIT_HTTP_LOW_SPEED_TIME=60

          diag_download() {
            echo "::group::📋 下载失败诊断"
            echo "--- 残缺/异常文件（<1KB）---"
            find dl -type f -size -1024c -exec ls -l {} \; 2>/dev/null || echo "  （无）"
            echo "--- 日志里的失败线索 ---"
            grep -hE "Download failed|Hash mismatch|404 Not Found|404:|ERROR|Connection (timed out|refused|reset)|Temporary failure|Could not resolve|unable to|No space left" /tmp/dl-*.log 2>/dev/null | sort -u | head -n 25 || echo "  （未匹配到关键字）"
            echo "--- 涉及的源码包 ---"
            grep -hoE "dl/[A-Za-z0-9._+@-]+\.(tar\.gz|tar\.xz|tar\.bz2|zip|tgz|git)" /tmp/dl-*.log 2>/dev/null | sort -u | tail -n 30 || true
            echo "--- 磁盘 ---"
            df -h . | tail -n1
            echo "::endgroup::"
            echo "处理建议：① 直接重跑（dl 缓存复用，只补缺的）"
            echo "          ② 勾选 clean_build 清空 dl 重下"
            echo "          ③ 日志为 404/哈希不符 → 该包源地址或版本在 feeds 里已失效，需要改版本"
            echo "          ④ 大量 403/404 且集中在 GitHub → 限流，隔几分钟重跑"
          }

          DL_OK=0
          PREV_FILES=-1
          PREV_BAD=-1
          for i in 1 2 3 4 5; do
            JOBS=8
            if [ "$i" -gt 1 ]; then JOBS=4; fi
            echo "================ 下载第 $i 轮（-j${JOBS}）================"

            RC=0
            make download -j"$JOBS" V=s 2>&1 | tee "/tmp/dl-$i.log" || RC=$?

            FILES=$(find dl -type f 2>/dev/null | wc -l)
            BAD=$(find dl -type f -size -1024c 2>/dev/null | wc -l)

            if [ "$RC" -eq 0 ] && [ "$BAD" -eq 0 ]; then
              echo "✅ 下载完整：${FILES} 个文件，共 $(du -sh dl | cut -f1)"
              DL_OK=1
              break
            fi

            echo "⚠️  第 $i 轮结果：退出码=${RC}，残缺=${BAD}，总文件=${FILES}"

            if [ "$i" -gt 1 ] && [ "$FILES" -le "$PREV_FILES" ] && [ "$BAD" -ge "$PREV_BAD" ]; then
              echo "::error::下载连续两轮零进展（文件数 ${PREV_FILES}→${FILES}，残缺 ${PREV_BAD}→${BAD}），提前中断，不再空跑"
              diag_download
              exit 1
            fi
            PREV_FILES=$FILES
            PREV_BAD=$BAD

            find dl -type f -size -1024c -print -delete 2>/dev/null || true
            if [ "$i" -lt 5 ]; then sleep 10; fi
          done

          if [ "$DL_OK" -ne 1 ]; then
            echo "::error::5 轮下载仍未完成，已中断构建（不进入编译，避免浪费 2 小时）"
            diag_download
            exit 1
          fi

      # ---------------------------------------------------------------
      - name: 11. 编译固件
        id: build
        run: |
          cd immortalwrt
          export CCACHE_DIR="$CCACHE_DIR"
          export CCACHE_MAXSIZE="$CCACHE_MAXSIZE"
          set -o pipefail

          : > build.log
          {
            echo "==== 构建环境 ===="
            echo "Go: $(sed -n 's/^GO_DEFAULT_VERSION:=//p' feeds/packages/lang/golang/golang-values.mk)"
            echo "xray      : $(sed -n 's/^PKG_VERSION:=//p' package/feeds/packages/xray-core/Makefile)"
            echo "mosdns   : $(sed -n 's/^PKG_VERSION:=//p' package/feeds/packages/mosdns/Makefile)"
            echo "===================="
          } >> build.log

          # ---- 阶段 0：先装 host 工具与交叉工具链（必须！）----
          # 关键教训：`make package/xxx/compile` 这类单包目标【不会】自动构建 tools/ 和
          # toolchain/。在干净工作区里直接跑，会因 staging_dir/host/bin/sed 不存在而报
          #   bash: .../staging_dir/host/bin/sed: No such file or directory
          #   ERROR: package/utils/lua [host] failed to build.
          # 于是把本该在整机编译里做的事，提前到这里做完。
          echo "🏗  阶段0：构建 host 工具 + 交叉工具链（约 20~30 分钟）..."
          if ! make -j"$(nproc)" prereq tools/install toolchain/install 2>&1 | tee -a build.log; then
            echo "::error::host 工具 / 工具链构建失败"
            echo "::group::📋 失败详情"
            tail -n 80 build.log
            echo "::endgroup::"
            exit 1
          fi
          echo "✅ host 工具与工具链就绪（$(ls staging_dir/host/bin/sed 2>/dev/null || echo '无 sed')）"

          # ---- 阶段 1：单独预编 2 个代理侧组件（-j1 V=s）----
          # 单包预编的价值：整机 -j 编译时 make 会把真实报错淹没，早失败几分钟就能定位。
          # 这两个包都不依赖内核模块，所以不需要先编 target/linux。
          GOVER=$(sed -n 's/^GO_DEFAULT_VERSION:=//p' feeds/packages/lang/golang/golang-values.mk)
          echo "🔧 预编译代理侧组件（Go ${GOVER:-feeds 默认} + mosdns / xray-core）..."

          try_build() {
          make -j1 V=s "$1" 2>&1 | tee -a build.log
          }

          # Go 构建统一入口：遇到"模块缓存残缺"类错误，自动清空 GOMODCACHE 重试一次
          # 典型报错：build constraints exclude all Go files / no required module provides package
          go_build() {
          _t="$1"; _n="$2"
          try_build "$_t" && return 0
          if grep -qE "build constraints exclude all Go files|no required module provides package" build.log; then
          echo "::warning::${_n} 报 Go 模块缓存残缺，清空 /workdir/gomod 后重试一次"
          rm -rf /workdir/gomod
          mkdir -p /workdir/gomod
          make "${_t%/compile}/clean" >/dev/null 2>&1 || true
          try_build "$_t" && return 0
          fi
          return 1
          }

          die_with_log() {
          echo "::error::$1 预编译失败（真实错误见下）"
          echo "::group::📋 失败详情"
          tail -n 80 build.log
          echo "::endgroup::"
          exit 1
          }

          # ① host Go 工具链（mosdns 从源码编译，必须有它）
          GT="package/feeds/packages/golang${GOVER}/host/compile"
          if [ -d "$(dirname "${GT%/compile}")" ]; then
          echo "================ 预编 $GT ================"
          try_build "$GT" || die_with_log "Go ${GOVER} 工具链"
          else
          echo "::warning::找不到 golang${GOVER} 目录，跳过工具链预编"
          fi

          # ② mosdns（唯一从源码编译的 Go 运行时组件）
          echo "================ 预编 mosdns ================"
          go_build "package/feeds/packages/mosdns/compile" "mosdns" || die_with_log "mosdns"

          # ③ xray-core（24.10 的 feeds 里它是"预编译二进制"包，只做下载+校验，几十秒）
          # 这一步专门抓"上游 release 地址变了 / 校验和对不上"，否则要等整机编译一小时才暴露。
          echo "================ 预编 xray-core ================"
          try_build "package/feeds/packages/xray-core/compile" || die_with_log "xray-core"

          echo "✅ 代理侧组件预编译通过"

          build_once() {
            RC=0
            make -j"$(nproc)" 2>&1 | tee -a build.log || RC=$?
            return "$RC"
          }

          echo "🚀 第 1 次编译 (-j$(nproc))"
          if build_once; then
            echo "✅ 编译完成"
            ccache -s || true
            exit 0
          fi

          # ================= 自动降级重试（最多 2 次）=================
          for attempt in 1 2; do
            echo "::warning::编译失败，进入第 ${attempt} 次自动修复"
            FIXED=0

            if grep -qE "requires go >= *[0-9]" build.log; then
              NEED=$(grep -oE "requires go >= *[0-9]+\.[0-9]+" build.log | head -n1 | grep -oE "[0-9]+\.[0-9]+")
              CUR=$(sed -n 's/^GO_DEFAULT_VERSION:=//p' feeds/packages/lang/golang/golang-values.mk)
              if [ -n "$NEED" ] && [ "$NEED" != "$CUR" ]; then
                echo "  · Go 版本不足：当前 ${CUR} → 需要 ${NEED}，自动切换"
                sed -i "s/^GO_DEFAULT_VERSION:=.*/GO_DEFAULT_VERSION:=$NEED/" \
                  feeds/packages/lang/golang/golang-values.mk
                rm -rf staging_dir/hostpkg/lib/go-* staging_dir/hostpkg/bin/go*
                make defconfig >/dev/null 2>&1 || true
                FIXED=1
              fi
            fi

            if [ "$FIXED" -eq 0 ] && grep -qE "package/turboacc/[^ ]* failed to build" build.log; then
              if grep -q "^CONFIG_PACKAGE_luci-app-turboacc=y" .config; then
                echo "  · TurboACC 编译失败，自动移出本次构建（加速由 firewall4 分载 + BBR 承担）"
                sed -i -E 's/^(CONFIG_PACKAGE_luci-app-turboacc.*)$/# \1/' .config
                echo "false" > /workdir/state-turboacc
                make defconfig >/dev/null 2>&1 || true
                FIXED=1
              fi
            fi

            # 阶段 3：Go 主版本已对上但仍报 requires go（说明要的是补丁版本，
            # 例如 1.27.3 而 feeds 只提供 1.27.1）→ 允许 Go 在构建时自动取工具链
            if [ "$FIXED" -eq 0 ] && grep -q "requires go >=" build.log; then
              if grep -q "GOTOOLCHAIN=local" feeds/packages/lang/golang/golang-package.mk; then
                echo "  · 需要更高的 Go 补丁版本，切换为 GOTOOLCHAIN=auto（构建时自动下载对应工具链）"
                sed -i 's/GOTOOLCHAIN=local/GOTOOLCHAIN=auto/' \
                  feeds/packages/lang/golang/golang-package.mk
                FIXED=1
              fi
            fi

            if [ "$FIXED" -eq 0 ]; then
              break
            fi

            echo "🔁 修复完成，重新编译 ..."
            if build_once; then
              echo "✅ 降级重试后编译完成（日志见 build.log）"
              ccache -s || true
              exit 0
            fi
          done

          # ================= 仍失败：明确报错 =================
          echo "---- 失败包清单 ----"
          grep -oE "package/[A-Za-z0-9_./-]+ failed to build" build.log | sed 's/ failed to build//' | sort -u || true
          echo "::group::📋 编译失败诊断（最后 40 行）"
          tail -n 40 build.log || true
          echo "::endgroup::"
          if grep -q "requires go >=" build.log; then
            echo "::error::编译失败：Go 版本仍不满足（自动切换已尝试），请手动把 go_version 设为日志要求的版本"
          elif grep -qE "package/turboacc/[^ ]* failed to build" build.log; then
            echo "::error::编译失败：TurboACC 编译错误（自动移除已尝试），请用 with_turboacc=false 重跑"
          elif grep -q "No space left on device" build.log; then
            echo "::error::编译失败：磁盘不足，重跑（缓存复用）或改用 larger runner"
          else
            echo "::error::编译失败且无法自动修复，详见上方日志末 40 行"
          fi
          exit 1

      # ---------------------------------------------------------------
      - name: 12. 固件内容审计（缺失自动补齐，最多 3 轮）
        id: audit
        if: steps.build.outcome == 'success'
        run: |
          cd immortalwrt

          # ================= 审计脚本（可重复调用）=================
          # 退出码：0=通过  1=有缺失（可补齐）  2=致命（无产物）
          cat > /workdir/fw-audit.sh << 'EOS'
          #!/bin/sh
          MISS_PKG=/workdir/missing-pkgs.txt
          MISS_FILE=/workdir/missing-files.txt
          : > "$MISS_PKG"
          : > "$MISS_FILE"
          LOST=0

          cd bin/targets/ramips/mt7621 2>/dev/null || { echo "::error::产物目录不存在"; exit 2; }
          MANIFEST=$(ls -1 *.manifest 2>/dev/null | head -n1)
          [ -n "$MANIFEST" ] || { echo "::error::未找到 .manifest"; exit 2; }
          echo "包清单: $MANIFEST（$(wc -l < "$MANIFEST") 个包）"

          # ---- 镜像体积：Newifi D2 的固件分区只有 32448 KB，超了刷机会被拒 ----
          _IMG=$(ls -1 *squashfs-sysupgrade.bin 2>/dev/null | head -n1)
          if [ -n "$_IMG" ]; then
            _KB=$(( $(wc -c < "$_IMG") / 1024 ))
            printf '  · %s 体积 %s KB（分区上限 32448 KB，余量 %s KB）\n' "$_IMG" "$_KB" "$((32448 - _KB))"
            if [ "$_KB" -gt 32448 ]; then
                      printf '::error::镜像 %s KB 已超过固件分区 32448 KB —— 需要缩小包集合（xray-core 与 mosdns 是最大的两块，先考虑去掉 TurboACC 或换轻量上游）\n' "$_KB"
            elif [ "$_KB" -gt 31000 ]; then
              printf '::warning::镜像 %s KB，距分区上限只剩 %s KB\n' "$_KB" "$((32448 - _KB))"
            fi
          fi

          MUST="luci-app-passwall xray-core mosdns dnsmasq-full luci-app-ksmbd ksmbd-server p910nd zram-swap luci-compat"
          [ "$1" = "true" ] && MUST="$MUST luci-app-turboacc"

          echo "---- 软件包 ----"
          for p in $MUST; do
            L=$(grep -m1 "^$p " "$MANIFEST")
            if [ -n "$L" ]; then
              printf '  ✅ %-22s %s\n' "$p" "$(echo "$L" | awk '{print $3}')"
            else
              printf '  ❌ %-22s 缺失\n' "$p"
              echo "$p" >> "$MISS_PKG"
              LOST=$((LOST + 1))
            fi
          done

          ROOTFS=$(ls -d ../../../../build_dir/target-*/root-ramips 2>/dev/null | head -n1)
          if [ -n "$ROOTFS" ]; then
            echo "---- 关键文件 ----"
            chk() {
              _n="$1"; shift
              _paths="$*"
              for c in "$@"; do
                if [ -e "$ROOTFS/$c" ]; then
                  printf '  ✅ %-40s %s\n' "$c" "$(du -h "$ROOTFS/$c" 2>/dev/null | cut -f1)"
                  return 0
                fi
              done
              printf '  ❌ %-40s 缺失（查过：%s）\n' "$_n" "$_paths"
              echo "$_n（查过：$_paths）" >> "$MISS_FILE"
              LOST=$((LOST + 1))
              return 0
            }
            chk passwall-init  etc/init.d/passwall
            chk passwall-app   usr/share/passwall/app.sh
            chk passwall-rules usr/share/passwall/rules/chnroute
            chk passwall-gfw   usr/share/passwall/rules/gfwlist
            chk passwall-luci  usr/lib/lua/luci/model/cbi/passwall/client/global.lua
            chk xray-bin       usr/bin/xray
                      # /etc/config/passwall 构建期不存在（首启由 92-services 从 0_default_config 生成），
                      # 所以这里不查文件，改查"兜底逻辑在不在"，避免把正常状态判成缺失。
                      if [ -e "$ROOTFS/etc/config/passwall" ]; then
                        echo "  ✅ etc/config/passwall"
                      elif grep -q "0_default_config" "$ROOTFS/etc/uci-defaults/92-services" 2>/dev/null; then
                        echo "  ✅ PassWall 配置首启生成（92-services 已兜底）"
                      else
                        echo "::warning::既没有 /etc/config/passwall，92-services 也没有兜底（PassWall 会停在出厂默认）"
                      fi
          # dnsmasq-full 是整条 DNS 链路的地基：nftset 支持（PassWall 域名分流）+ 我们的上游锁定都靠它
            chk dnsmasq-bin  usr/sbin/dnsmasq
            chk p910nd-bin  usr/sbin/p910nd usr/bin/p910nd
            chk ksmbd-init  etc/init.d/ksmbd
            if [ -e "$ROOTFS/usr/share/v2ray/geosite.dat" ] || [ -e "$ROOTFS/usr/share/v2ray/geoip.dat" ]; then
              echo "::warning::geoip/geosite 数据仍在镜像里（合计约 25MB），检查 INCLUDE_V2ray_Geodata / INCLUDE_V2ray_Geoview"
            else
              echo "  ✅ 未带 geo 数据（省约 25MB 安装空间）"
            fi
            chk mosdns-bin   usr/bin/mosdns
            chk mosdns-init  etc/init.d/mosdns
            chk mosdns-conf  etc/mosdns/config.yaml
            # 覆盖层必须赢过软件包自带的那份：v4 语法的 config.yaml 会让 mosdns 直接起不来
            if [ -f "$ROOTFS/etc/mosdns/config.yaml" ] && grep -q "type: sequence" "$ROOTFS/etc/mosdns/config.yaml"; then
              echo "  ✅ MosDNS 配置为覆盖版（v5 语法）"
            else
              echo "  ❌ MosDNS 配置不是覆盖版（v4 语法会让服务起不来）"
              echo "mosdns-conf-v5" >> "$MISS_FILE"
              LOST=$((LOST + 1))
            fi
            chk adblock      etc/mosdns/adblock.txt
            chk mosdns-ctl   usr/libexec/mosdns-ctl
            chk mosdns-set   etc/mosdns/settings.conf
            chk mosdns-up    etc/mosdns/upstreams.conf
            chk mosdns-bl    etc/mosdns/custom_blacklist.txt
            chk mosdns-wl    etc/mosdns/custom_whitelist.txt
            chk mosdns-ui    www/luci-static/resources/view/mosdns/overview.js
            chk mosdns-menu  usr/share/luci/menu.d/luci-app-mosdns-lite.json
            chk mosdns-acl   usr/share/rpcd/acl.d/luci-app-mosdns-lite.json
            chk uci-90      etc/uci-defaults/90-luci
            chk uci-91      etc/uci-defaults/91-wireless
            chk uci-92      etc/uci-defaults/92-services
            chk usbwan      etc/hotplug.d/net/20-usbwan
            chk dns-recover usr/bin/dns-recover
            chk fw-selftest usr/bin/fw-selftest
            chk wifi-doctor usr/bin/wifi-doctor
            chk rule-refresh usr/bin/rule-refresh
            chk memguard    usr/bin/memguard
            chk quick-check usr/bin/quick-check
            chk proxy-host  usr/share/passwall/rules/proxy_host
            chk cfg-ksmbd   etc/config/ksmbd
            chk cfg-p910nd  etc/config/p910nd
            chk sysctl      etc/sysctl.conf
            # 屏蔽列表条数：构建期下载失败时会退化成一个空文件，这里显式警告一次
            if [ -f "$ROOTFS/etc/mosdns/adblock.txt" ]; then
              _an=$(wc -l < "$ROOTFS/etc/mosdns/adblock.txt" | tr -d " ")
              [ -n "$_an" ] || _an=0
              echo "  广告域名: $_an 条"
              [ "$_an" -ge 50000 ] || echo "::warning::广告域名条数偏少($_an)，去广告基本不生效"
            fi
                      # 分流名单条数：上游格式漂移或下载失败会退化成几十行，这里点名
                      if [ -f "$ROOTFS/usr/share/passwall/rules/proxy_host" ]; then
                        _pn=$(wc -l < "$ROOTFS/usr/share/passwall/rules/proxy_host" | tr -d " ")
                        [ -n "$_pn" ] || _pn=0
                        echo "  代理域名清单(proxy_host 覆盖层): $_pn 条"
                        [ "$_pn" -ge 1000 ] || echo "::warning::proxy_host 只有 $_pn 行，覆盖层可能没盖过包内那份"
                      fi
                      # 包自带的规则：这两份是"绕过大陆"的地基，缺了等于全量走代理
                      for _r in gfwlist chnroute; do
                        _f="$ROOTFS/usr/share/passwall/rules/$_r"
                        if [ -f "$_f" ]; then
                          _rn=$(wc -l < "$_f" | tr -d " ")
                          [ -n "$_rn" ] || _rn=0
                          echo "  包内规则 $_r: $_rn 条"
                          [ "$_rn" -ge 1000 ] || echo "::warning::$_r 只有 $_rn 行，分流基本失效"
                        else
                          echo "::warning::镜像里没有 /usr/share/passwall/rules/$_r"
                        fi
                      done
          else
            echo "::warning::未找到 root-ramips，跳过文件级检查"
          fi

                    # ---- TPROXY 相关内核模块：PassWall 的透明代理靠它们 ----
          # config 里选了不等于编进了镜像（kmod 会随依赖变化被静默丢掉），
          # 所以拿 .manifest 复核一遍；缺 TProxy 的表现是"能连上、网页打不开"。
          for p in kmod-nft-tproxy kmod-nft-socket kmod-nft-nat kmod-tun; do
            if grep -q "^$p " "$MANIFEST"; then
              printf '  ✅ %s\n' "$p"
            else
                        printf '::warning::镜像里没有 %s（PassWall 的 TProxy 或转发会失效）\n' "$p"
            fi
          done

                    # ---- 版本记录：PassWall 与 Xray 的版本要能对上，打进日志便于回溯 ----
                    for _v in luci-app-passwall xray-core mosdns; do
                      _vv=$(grep -m1 "^$_v " "$MANIFEST" | awk '{print $3}')
                      [ -n "$_vv" ] && printf '  ✅ %-22s %s\n' "$_v" "$_vv"
                    done

          echo "缺失合计: $LOST（包 $(wc -l < "$MISS_PKG") / 文件 $(wc -l < "$MISS_FILE")）"
          echo "$LOST" > /workdir/audit-count.txt
          [ "$LOST" -eq 0 ] || exit 1
          exit 0
          EOS
          chmod +x /workdir/fw-audit.sh

          # ================= 审计 → 补齐 → 再审计（无进展立即中断）=================
          diag_repair() {
            echo "::group::📋 缺失原因诊断"
            echo "--- 缺失包（config / feeds / ipk 三处状态）---"
            if [ -s /workdir/missing-pkgs.txt ]; then
              while read -r p; do
                [ -n "$p" ] || continue
                printf '  · %s\n' "$p"
                if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
                  echo "      config: 已选中"
                else
                  echo "      config: 未被 defconfig 保留（依赖不满足，或包名不存在）"
                fi
                if ./scripts/feeds list -n 2>/dev/null | grep -qx "$p"; then
                  echo "      feeds : 存在"
                else
                  echo "      feeds : 不存在（包名拼错 / 未加入 feeds / 源码未克隆）"
                fi
                _ipk=$(find bin/packages -name "${p}_*.ipk" 2>/dev/null | head -n1)
                if [ -n "$_ipk" ]; then
                  echo "      ipk   : $_ipk"
                else
                  echo "      ipk   : 未生成（包没有编译成功）"
                fi
              done < /workdir/missing-pkgs.txt
            else
              echo "  （无）"
            fi
            echo "--- 缺失文件 ---"
            if [ -s /workdir/missing-files.txt ]; then
              sed 's/^/  · /' /workdir/missing-files.txt
              echo "  → 说明 files/ 覆盖层没有生效，或对应包未安装"
            else
              echo "  （无）"
            fi
            echo "--- defconfig 告警（最后 15 条）---"
            grep -i 'warning' defconfig.log 2>/dev/null | tail -n 15 || echo "  （无）"
            echo "::endgroup::"
            echo "处理建议：按上面三行状态定位——config 未选中＝依赖问题；feeds 不存在＝包名或源问题；ipk 未生成＝编译失败"
            # 失败时把缺件清单写进本次运行的总结页，不用翻整份日志
            {
              echo "### 固件缺件清单（补齐失败）"
              echo ""
              if [ -s /workdir/missing-pkgs.txt ]; then
                echo "**缺失软件包**"
                sed 's/^/- `/; s/$/`/' /workdir/missing-pkgs.txt
                echo ""
              fi
              if [ -s /workdir/missing-files.txt ]; then
                echo "**缺失文件**"
                sed 's/^/- `/; s/$/`/' /workdir/missing-files.txt
              fi
            } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          }

          OK=0
          PREV=999
          # 读"实际生效"的 TurboACC 状态（第 11 步可能已自动降级关掉它）
          EFF_TURBO=$(cat /workdir/state-turboacc 2>/dev/null || echo "true")
          echo "TurboACC 实际生效状态: ${EFF_TURBO}"
          for round in 1 2 3; do
            echo "================ 审计第 $round 轮 ================"
            RC=0
            /workdir/fw-audit.sh "$EFF_TURBO" || RC=$?

            if [ "$RC" -eq 0 ]; then
              OK=1
              break
            fi

            if [ "$RC" -eq 2 ]; then
              echo "::error::产物缺失（没有 manifest 或输出目录），无法补齐，立即中断"
              exit 1
            fi

            COUNT=$(cat /workdir/audit-count.txt 2>/dev/null || echo 999)

            # 补齐后缺失数没有下降 → 补不动了，立即中断，不再空跑第 2/3 轮
            if [ "$round" -gt 1 ] && [ "$COUNT" -ge "$PREV" ]; then
              echo "::error::第 $round 轮缺失数未下降（${PREV} → ${COUNT}），继续补齐无效，立即中断。缺失项：$(cat /workdir/missing-pkgs.txt /workdir/missing-files.txt 2>/dev/null | tr "\n" " ")"
              diag_repair
              exit 1
            fi
            PREV=$COUNT

            if [ "$round" -eq 3 ]; then
              echo "::error::已补齐 3 轮仍有 ${COUNT} 项缺失，中断构建。缺失项：$(cat /workdir/missing-pkgs.txt /workdir/missing-files.txt 2>/dev/null | tr "\n" " ")"
              diag_repair
              exit 1
            fi

            echo "⚙️  发现缺失（${COUNT} 项），执行第 $round 轮补齐"

            # (a) 重新部署 files/ 覆盖层（用第 5 步的快照还原）
            if [ -f /workdir/files-overlay.tgz ]; then
              rm -rf files
              tar -C . -xzf /workdir/files-overlay.tgz
              echo "  · files/ 覆盖层已重新部署"
            fi

            # (b) 缺失软件包写回 .config 并重建配置
            if [ -s /workdir/missing-pkgs.txt ]; then
              echo "  · 补装软件包: $(tr '\n' ' ' < /workdir/missing-pkgs.txt)"
              while read -r p; do
                [ -n "$p" ] || continue
                grep -q "^CONFIG_PACKAGE_${p}=y" .config || echo "CONFIG_PACKAGE_${p}=y" >> .config
              done < /workdir/missing-pkgs.txt
              make defconfig 2>&1 | tail -n 15
            fi

            # (c) 重建根文件系统与镜像（只重装+重打包，不重编已完成的包）
            rm -rf build_dir/target-*/root-ramips build_dir/target-*/stamp
            echo "  · 重建 rootfs + 镜像 ..."
            RC2=0
            make -j"$(nproc)" 2>&1 | tee -a build.log || RC2=$?
            if [ "$RC2" -ne 0 ]; then
              echo "::error::补齐重建失败（退出码 ${RC2}），最后 40 行："
              tail -n 40 build.log || true
              exit 1
            fi
          done

          [ "$OK" -eq 1 ] || { echo "::error::审计未通过，拒绝输出固件"; exit 1; }

          # ================= 体积 / 哈希 / 产物 =================
          cd bin/targets/ramips/mt7621
          ls -lh

          FIRMWARE=$(ls -1 *sysupgrade.bin 2>/dev/null | head -n1)
          [ -n "$FIRMWARE" ] || { echo "::error::未找到 sysupgrade.bin"; exit 1; }

          SIZE=$(stat -c%s "$FIRMWARE")
          SIZE_MB=$(awk -v s="$SIZE" 'BEGIN{printf "%.2f", s/1048576}')
          LIMIT_MB=$(awk -v s="$MAX_FIRMWARE_SIZE" 'BEGIN{printf "%.2f", s/1048576}')
          echo "文件: $FIRMWARE"
          echo "体积: ${SIZE_MB} MiB (${SIZE} B) / 分区上限 ${LIMIT_MB} MiB (${MAX_FIRMWARE_SIZE} B)"
          [ "$SIZE" -gt 0 ] || { echo "::error::固件为 0 字节"; exit 1; }
          [ "$SIZE" -le "$MAX_FIRMWARE_SIZE" ] || { echo "::error::固件超出 firmware 分区，刷入会变砖"; exit 1; }

          PKG_COUNT=$(wc -l < "$(ls -1 *.manifest | head -n1)")

          # 余量告警：overlay（可写分区）太小时，LuCI 改配置容易写失败
          SPARE=$((MAX_FIRMWARE_SIZE - SIZE))
          if [ "$SPARE" -lt 2097152 ]; then
            echo "::warning::固件余量只有 $(awk -v s="$SPARE" 'BEGIN{printf "%.2f", s/1048576}') MiB，overlay 会很紧张"
          fi

          # ================= 版本快照（本次构建到底用了哪些版本）=================
          {
            echo "# ImmortalWrt 24.10 for Newifi-D2 — 构建版本快照"
            echo ""
            echo "构建时间 : $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "源码分支 : openwrt-24.10 @ $(git -C ../../../.. log -1 --format='%h %cd' --date=format:'%Y-%m-%d')"
            echo "固件体积 : ${SIZE_MB} MiB / ${LIMIT_MB} MiB"
            echo "包总数   : ${PKG_COUNT}"
            echo ""
            echo "## 关键组件"
            grep -E '^(luci-app-passwall|xray-core|chinadns-ng|mosdns|luci-app-turboacc|dnsmasq-full|ksmbd-server|luci-app-ksmbd|p910nd|zram-swap) ' \
                 "$(ls -1 *.manifest | head -n1)" | sort
          } > versions.txt
          cat versions.txt

          sha256sum "$FIRMWARE" > sha256sums.txt
          cat sha256sums.txt

          {
            echo "### ✅ 固件审计通过（含内容核对）"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 文件 | \`$FIRMWARE\` |"
            echo "| 体积 | **${SIZE_MB} MiB** |"
            echo "| 分区上限 | ${LIMIT_MB} MiB (0x1FB0000) |"
            echo "| 余量 | $(awk -v a="$MAX_FIRMWARE_SIZE" -v b="$SIZE" 'BEGIN{printf "%.2f", (a-b)/1048576}') MiB |"
            echo "| 固件内包数 | ${PKG_COUNT} |"
            echo "| 关键包/文件缺失 | 0 |"
            echo "| 自动补齐轮次 | ${round} |"
            echo "| TurboACC | ${EFF_TURBO} |"
            echo ""
            echo "<details><summary>本次构建的组件版本</summary>"
            echo ""
            echo '```'
            echo "源码: openwrt-24.10 @ $(git -C ../../../.. log -1 --format='%h %cd' --date=format:'%Y-%m-%d')"
            grep -E '^(luci-app-passwall|xray-core|chinadns-ng|mosdns|dnsmasq-full|luci-app-turboacc) ' \
                 "$(ls -1 *.manifest | head -n1)" | sort
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "FIRMWARE_DIR=$PWD" >> "$GITHUB_ENV"
          echo "FIRMWARE_NAME=$FIRMWARE" >> "$GITHUB_ENV"
          echo "TAG_DATE=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------
      - name: 13. 上传固件 artifact
        if: steps.audit.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-d2-${{ env.TAG_DATE }}
          path: |
            ${{ env.FIRMWARE_DIR }}/*sysupgrade.bin
            ${{ env.FIRMWARE_DIR }}/sha256sums.txt
            ${{ env.FIRMWARE_DIR }}/versions.txt
          if-no-files-found: error
          retention-days: 7

      # ---------------------------------------------------------------
      - name: 14. 记录回退点（上一个可用版本）
        if: steps.audit.outcome == 'success'
        run: |
          # 本步骤只读，不删任何东西：历史 Release 全部保留，随时可回退
          PREV=$(git ls-remote --tags --refs origin 2>/dev/null \
                 | awk -F'refs/tags/' '{print $2}' | grep -E '^D2-' | sort -V | tail -n1)
          echo "PREV_TAG=${PREV:-（这是首个版本）}" >> "$GITHUB_ENV"
          echo "本次源码提交: ${{ github.sha }}"
          echo "上一个可用版本: ${PREV:-无}"
          {
            echo ""
            echo "### 回退点"
            echo "- 本次源码提交: \`${{ github.sha }}\`"
            echo "- 上一个可用版本: \`${PREV:-无}\`"
            echo "- 触发方式: \`${{ github.event_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------
      - name: 15. 发布 Release
        if: steps.audit.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: D2-${{ env.TAG_DATE }}-r${{ github.run_number }}
          name: ImmortalWrt 24.10 for Newifi-D2 [${{ env.TAG_DATE }}]
          body: |
            ## ImmortalWrt 24.10 · Newifi-D2

            > **冻结版本，完全不自动**：软件版本锁定在编译时，**不自升级**；规则（gfwlist /
            > chnroute）与广告清单一律在构建时打进镜像，运行时**不联网下载、不自动更新、不自动重启**。
            > geo 数据不随固件提供，分流只用文本规则。唯一例外是你自己的订阅：默认每日 05:10 更新一次，
            > 每个「设置 → 订阅自动更新」都能关掉（订阅列表为空时不会联网）。
            >
            > 本仓库已**关闭定时构建**：要新固件就手动 Actions → Run workflow，源码取
            > `openwrt-24.10` / feeds / 第三方 `main` 的最新提交。

            默认管理地址 **192.168.2.1** · 无 root 密码（首次登录请自行设置）

            ### 本次使用的版本
            见 Release 附件 **`versions.txt`**（含源码提交号与各组件版本号）。

            ### ↩️ 回退（出问题时）
            - 本次源码提交：`${{ github.sha }}`
            - 上一个可用版本：**`${{ env.PREV_TAG }}`**
            - 方法：在下方 Releases 列表里找到上一个版本，下载它的 `sysupgrade.bin`，
              在 LuCI「系统 → 备份/升级」中**保留配置**刷入即可（3 分钟内完成）。
            - 历史 Release 一律不删，都是可回退点。

            ### 内置组件
            - **PassWall + Xray**（服务 → PassWall）：官方前端，节点列表 / 节点订阅 / 规则列表 / 组件设置全在页面里；
              xray-core 预编译二进制（feeds 提供，不需要 Go 工具链），nftables 透明代理（TPROXY），
              UDP 代理默认关闭（浏览器自动回落 TCP，避免 QUIC 乱序与额外开销）
            - **分流**：绕过大陆（`chn_list=direct` + 包自带 gfwlist/chnroute + 构建期补充的 proxy_host 高频域名），
              规则随包发布、运行时不联网；无节点时直连，不会断网
            - **去广告**：MosDNS 的域名集合吃 anti-AD（约 11 万条域名，命中返回 0.0.0.0；
              清单构建期下载、运行时不联网、不占 overlay）
            - **DNS**：客户端 53 → 系统 dnsmasq → MosDNS（127.0.0.1:5335，去广告 + DoH 加密上游阿里/腾讯，
              明文只做兜底）；PassWall 不抢 53（`dns_redirect=0`），只用 chinadns-ng 给被代理域名做 TCP 上游；
              不装 luci-app-mosdns、不编 geo 数据，省约 30MB 闪存
            - **TurboACC**（流量分载 + BBR；全锥 NAT 视 `kmod-nft-fullcone` 可用性）
            - **Ksmbd**（`/mnt/sda1` 共享）· **p910nd**（`/dev/usb/lp0`）
            - **USB 网卡全家桶**：RNDIS / NCM / ECM / EEM / MBIM / QMI / IPheth / WWAN，热插拔自动挂 WAN
            - 性能调优：BBR + `fq` + `rmem/wmem 8MB` + conntrack 32K + CPU 锁 `performance` + ZRAM
              + `tcp_mtu_probing`（代理链路 MTU 黑洞自愈）+ dnsmasq 缓存 1000 条
            - **必要的本地自动化**（全部不联网）：每日释放页缓存、每 10 分钟的内存看门狗 `memguard`、
              MosDNS 存活检查、每周截断超期日志；`/var/log/memguard.log` 可查它做过什么
            - **不预置 geo 数据**：`geoip.dat` / `geosite.dat` 约 25MB，32MB 闪存装不下；
              只有使用「分流节点」时才需要，用到时在 PassWall → 规则列表里按需更新

            ### 无线
            - 2.4G：`alon` @ 自动信道 HT20 · 5G：`alon-5G` @ ch149 VHT80 · WPA2 `alon12345678`（**请立即修改**）

            ### 出问题怎么办
            一键体检：SSH 执行 **quick-check**（DNS / 去广告 / 代理 / 共享 / USB / 内存 / 无线，一页汇总 + 结尾给下一步）
            逐项细节：SSH 执行 **fw-selftest**（每项 ✅/❌，一眼看出哪个功能没起来）

            | 现象 | 处理 |
            | --- | --- |
            | 能 ping 通 IP、但网页打不开 | SSH 执行 **`dns-recover`** |
            | 某个 App / 网站突然不通 | SSH 执行 `dns-recover`，或到「PassWall → 规则列表」检查规则 |
            | 广告还在（没被拦） | SSH 执行 **fw-selftest** 看「广告域名 N 条」；清单在 `/etc/mosdns/adblock.txt` |
            | 改了广告清单不生效 | SSH 执行 **/etc/init.d/mosdns restart**（域名集合只在启动时读） |
            | 代理域名下的广告拦不到 | 正常现象：gfwlist 域名走隧道解析，不经过 MosDNS |
            | 科学上网时快时慢 | TurboACC 里把硬件分载 `hw_flow` 关掉再试 |

            ### 校验
            `sha256sums.txt`；体积已通过 32MB(0x1FB0000) 分区上限审计。
          files: |
            ${{ env.FIRMWARE_DIR }}/*sysupgrade.bin
            ${{ env.FIRMWARE_DIR }}/sha256sums.txt
            ${{ env.FIRMWARE_DIR }}/versions.txt
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------------
      # 放在最后：编译 / 审计 / 发布任一阶段失败都能捞到日志
      - name: 16. 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            immortalwrt/build.log
            immortalwrt/defconfig.log
            immortalwrt/.config
          if-no-files-found: warn
          retention-days: 7

# ============================================================
#  ImmortalWrt 25.12 (openwrt-25.12) — newifi-d2 自动构建
#  设计原则：
#   1. 依赖一律走官方 feeds，不再手工克隆 PassWall（避免同名包重复定义）
#   2. 只保留 2 个第三方源码：GeoData / TurboACC（DNS 交给 PassWall + dnsmasq，不用 MosDNS）
#   3. defconfig 之后做"硬校验"，缺包直接失败，拒绝产出残缺固件
#   4. 全流程日志落盘 build.log，失败必留日志
# ============================================================
name: Build ImmortalWrt 25.12 for Newifi-D2

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: "丢弃 ccache / dl 缓存（改依赖后建议勾选）"
        type: boolean
        default: false
      go_version:
        description: "Go 工具链版本（auto = 跟随 feeds 默认；报 go.mod requires go >= 1.XX 时改成对应版本）"
        type: choice
        options:
          - auto
          - "1.26"
          - "1.27"
        default: auto
      with_turboacc:
        description: "是否编入 TurboACC（若它编译失败，设为 false 重跑即可；加速不依赖它）"
        type: boolean
        default: true

  # ---- 每周自动构建：每周六 02:17（北京）= 每周五 18:17 UTC ----
  # 只在默认分支生效；公开仓库 60 天无提交会被 GitHub 自动暂停（偶尔手动 Run 一次即可续上）。
  # 避开整点：GitHub 的 cron 在 :00 排队最挤，延迟可能 20~40 分钟。
  schedule:
    - cron: '17 18 * * 5'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  CONFIG_FILE: newifi-d2.config
  TZ: Asia/Shanghai
  # d-team_newifi-d2 的 firmware 分区 = 0x1FB0000 = 33226752 字节
  MAX_FIRMWARE_SIZE: 33226752
  CCACHE_DIR: /workdir/immortalwrt/.ccache
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 420

    steps:
      # ---------------------------------------------------------------
      - name: 1. 检出本仓库
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      - name: 2. 准备编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 释放 runner 空间（immortalwrt 全量构建约需 15~20GB）
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/powershell /usr/local/share/chromium \
                      /usr/share/swift /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          echo "---- 清理后磁盘 ----"
          df -h /
          AVAIL_GB=$(df -Pk / | awk 'NR==2{printf "%d", $4/1048576}')
          echo "可用空间: ${AVAIL_GB} GB"
          if [ "$AVAIL_GB" -lt 15 ]; then
            echo "::warning::可用空间仅 ${AVAIL_GB}GB，可能不足；如失败请改用 larger runner"
          fi
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache cmake cpio curl \
            device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libelf-dev libglib2.0-dev libgmp3-dev \
            liblzo2-dev libncurses5-dev libssl-dev libtool lrzsz mkisofs nano \
            ninja-build p7zip-full patch pkg-config python3 python3-dev python3-pip \
            python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip wget xmlto xxd zlib1g-dev

          sudo ln -sf /usr/share/zoneinfo/$TZ /etc/localtime
          echo "$TZ" | sudo tee /etc/timezone > /dev/null
          sudo timedatectl set-ntp true || true

          sudo mkdir -p /workdir
          sudo chown -R "$USER":"$USER" /workdir

          ccache --version | head -n1
          df -h / /workdir

      # ---------------------------------------------------------------
      - name: 3. 克隆 ImmortalWrt 25.12
        working-directory: /workdir
        run: |
          git clone --depth=1 -b "$REPO_BRANCH" "$REPO_URL" immortalwrt
          ln -sfn /workdir/immortalwrt "$GITHUB_WORKSPACE/immortalwrt"
          cd immortalwrt
          git log -1 --format='分支 %D | %h %s'

      # ---------------------------------------------------------------
      - name: 4. 安装官方 feeds 并植入 3 个第三方源码
        run: |
          cd immortalwrt

          # --- 官方 feeds（PassWall / Xray / chinadns-ng 等全部由 feeds 提供）---
          cat > feeds.conf.default << 'EOF'
          src-git packages https://github.com/immortalwrt/packages.git;openwrt-25.12
          src-git luci https://github.com/immortalwrt/luci.git;openwrt-25.12
          src-git routing https://github.com/openwrt/routing.git;openwrt-25.12
          EOF

          ./scripts/feeds update -a
          # 关键：必须是 -a。原脚本的 "-d default" 什么都没装
          ./scripts/feeds install -a

          # 规避 Kconfig 递归依赖（25.12 里 weechat 三件套互相 select，defconfig 会报
          # recursive dependency detected）。这两个包我们永远不用，直接摘掉。
          rm -rf package/feeds/packages/weechat package/feeds/luci/luci-app-weechat
          # 同理，gst1-plugins-base 的 3 个可选依赖在 25.12 里不存在，只是噪声
          echo "已摘要无关包：weechat / luci-app-weechat"

          # --- PassWall 依赖预检（1 分钟内就能知道缺不缺，不用等编译）---
          echo "---- PassWall 依赖预检 ----"
          DEP_MISS=0
          for p in chinadns-ng dns2socks ipt2socks microsocks tcping lyaml \
                   xray-core luci-compat luci-lib-jsonc; do
            if [ -d "package/feeds/packages/$p" ] || [ -d "package/feeds/luci/$p" ] \
               || [ -d "package/$p" ]; then
              printf '  ✅ %s\n' "$p"
            else
              printf '::warning::依赖缺失 %s\n' "$p"
              DEP_MISS=$((DEP_MISS + 1))
            fi
          done
          if [ "$DEP_MISS" -gt 0 ]; then
            echo "::warning::有 $DEP_MISS 个依赖不在 feeds 中，第 7 步会再确认一次"
          fi

          # --- 第三方源码 ---
          rm -rf package/luci-app-mosdns package/mosdns package/geo2txt package/v2ray-geodata package/turboacc

          # MosDNS：本固件【不包含】。客户端 DNS 由 PassWall 的 chinadns-ng 接管，
          # 路由器自身走系统 dnsmasq 直连上游，不再克隆 sbwml/luci-app-mosdns。
          # 省下约 6MB 二进制 + 1.3MB geodata 覆盖写入，开机也少一个进程。

          # GeoData：提供 v2ray-geoip / v2ray-geosite（不是 v2ray-geodata）
          git clone --depth=1 https://github.com/sbwml/v2ray-geodata.git package/v2ray-geodata

          # TurboACC：25.12 的 luci feed 已经没有 luci-app-turboacc
          git clone --depth=1 https://github.com/chenmozhijin/turboacc.git package/turboacc

          # --- xray-core 版本对齐（必须）---
          # feeds 的 xray-core 是 26.3.27，而 luci-app-passwall 是 26.10.x，
          # 新版 PassWall 生成的配置要求 xray >= 26.7.11，否则报
          #   "this config must be run on version 26.7.11 or higher" 并启动失败。
          # 因此只从 PassWall 官方包仓库取同期的 xray-core 替换，其余依赖仍用 feeds。
          rm -rf /tmp/pp
          git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git /tmp/pp
          rm -rf package/xray-core package/feeds/packages/xray-core
          cp -r /tmp/pp/xray-core package/xray-core
          rm -rf /tmp/pp

          # 该仓库的 Makefile 用相对路径 include golang，挪到 package/ 下会找不到 → 改绝对路径
          sed -i -E 's#include[[:space:]]+\.\./\.\./lang/golang/#include $(TOPDIR)/feeds/packages/lang/golang/#' \
            package/xray-core/Makefile || true

          XV=$(sed -n 's/^PKG_VERSION:=//p' package/xray-core/Makefile)
          PV=$(sed -n 's/^PKG_VERSION:=//p' package/feeds/luci/luci-app-passwall/Makefile)
          echo "  · luci-app-passwall : $PV"
          echo "  · xray-core         : $XV   （PassWall 要求 ≥ 26.7.11）"

          # 硬断言：版本不够就直接失败，绝不产出"能刷但不能用"的固件
          if [ -z "$XV" ]; then
            echo "::error::读不到 xray-core 版本，passwall-packages 结构与预期不符"
            exit 1
          fi
          LOWEST=$(printf '%s\n%s\n' "26.7.11" "$XV" | sort -V | head -n1)
          if [ "$LOWEST" != "26.7.11" ]; then
            echo "::error::xray-core $XV 低于 PassWall $PV 要求的 26.7.11，构建中止（先别刷）"
            exit 1
          fi
          echo "  ✅ 版本对齐通过"

          # --- 同名包去重：一律以本地源码为准 ---
          rm -rf package/feeds/luci/luci-app-turboacc \
                 package/feeds/packages/v2ray-geoip \
                 package/feeds/packages/v2ray-geosite
          # MosDNS 全家（含 geo2txt）在所有位置都清掉，防止被任何依赖拖进镜像
          rm -rf package/feeds/luci/luci-app-mosdns \
                 package/feeds/packages/mosdns \
                 package/feeds/packages/geo2txt

          # --- 源码完整性硬校验（绝不 || true）---
          MISSING_SRC=0
          for m in package/v2ray-geodata \
                   package/turboacc/luci-app-turboacc \
                   package/feeds/luci/luci-app-passwall \
                   package/xray-core; do
            if [ -f "$m/Makefile" ]; then
              echo "  ✅ $m"
            else
              echo "::error::源码缺失：$m"
              MISSING_SRC=1
            fi
          done
          [ "$MISSING_SRC" -eq 0 ] || exit 1
          echo "✅ feeds 与第三方源码全部就绪"

      # ---------------------------------------------------------------
      - name: 5. 生成预置配置 (files/)
        run: |
          cd immortalwrt
          mkdir -p files/etc/uci-defaults files/etc/hotplug.d/net \
                   files/etc/config files/etc/crontabs files/usr/bin

          # ---------- A. 系统 / LuCI 默认语言 / 主机名 / NTP ----------
          # ⚠️ 铁律：首次启动脚本【只改已存在的配置段】，绝不新建
          #    新建空的 network/system 段会让 config_generate 认为配置已存在而跳过，
          #    结果是 LAN 没有 proto/device → br-lan 建不出来 → 全屋拿不到 IP。
          cat > files/etc/uci-defaults/90-luci << 'EOF'
          #!/bin/sh

          # 系统信息：段存在才改
          if uci -q get system.@system[0] >/dev/null 2>&1; then
              uci set system.@system[0].hostname='Newifi-D2'
              uci set system.@system[0].timezone='CST-8'
              uci set system.@system[0].zonename='Asia/Shanghai'
              if uci -q get system.ntp >/dev/null 2>&1; then
                  uci -q delete system.ntp.server
                  uci add_list system.ntp.server='ntp.aliyun.com'
                  uci add_list system.ntp.server='cn.pool.ntp.org'
                  uci add_list system.ntp.server='time.cloudflare.com'
              fi
              uci commit system
          fi

          # 默认中文：段存在才改
          if uci -q get luci.main >/dev/null 2>&1; then
              uci set luci.main.lang='zh_cn'
              uci commit luci
          fi

          # LAN 地址：这里【不写】。由构建时对 config_generate 的 sed 决定（与原配置同一做法），
          # 避免在配置尚未生成时创建残段。万一仍然异常，由 /etc/rc.local 的自愈逻辑兜底修复。
          exit 0
          EOF

          # ---------- B. 无线：双频开启 + 中国区 + WPA2 ----------
          # 同样遵守铁律：无线配置不存在就完全不碰，交给系统自己生成
          cat > files/etc/uci-defaults/91-wireless << 'EOF'
          #!/bin/sh
          [ -f /etc/config/wireless ] || exit 0
          uci -q get wireless.radio0 >/dev/null 2>&1 || exit 0

          uci set wireless.radio0.disabled='0'
          uci set wireless.radio0.country='CN'
          uci set wireless.radio0.channel='11'
          uci set wireless.radio0.htmode='HT20'
          uci set wireless.radio1.disabled='0'
          uci set wireless.radio1.country='CN'
          uci set wireless.radio1.channel='36'
          uci set wireless.radio1.htmode='VHT80'

          uci set wireless.default_radio0.ssid='alon'
          uci set wireless.default_radio0.encryption='psk2'
          uci set wireless.default_radio0.key='alon12345678'
          uci set wireless.default_radio0.disabled='0'
          uci set wireless.default_radio1.ssid='alon-5G'
          uci set wireless.default_radio1.encryption='psk2'
          uci set wireless.default_radio1.key='alon12345678'
          uci set wireless.default_radio1.disabled='0'

          uci commit wireless
          exit 0
          EOF

          # ---------- C. PassWall / TurboACC 默认参数（DNS 不再经由 MosDNS）----------
          cat > files/etc/uci-defaults/92-services << 'EOF'
          #!/bin/sh
          # ---- DNS 架构：不使用 MosDNS ----
          #   客户端   :53 → nft 劫持 → PassWall 副本 dnsmasq(11400) → chinadns-ng（分流/去广告）
          #   路由器自身 :53 → 系统 dnsmasq → WAN 上游 DNS（直连，无插件中转）
          # 所以这里没有任何 mosdns.* 的 uci 写入；镜像里也不存在 mosdns 包，
          # 从旧固件"保留配置"升上来时残留的 /etc/config/mosdns 不会被任何进程读取。

          # ---- PassWall ----
          # 分流链路（任何一条都别随手改，改错会直接断网）：
          #   局域网客户端 →53→ nft 劫持 → PassWall 副本 dnsmasq(11400)
          #      → chinadns-ng：屏蔽列表命中 → group null（NXDOMAIN，即去广告）
          #                     gfwlist 命中   → 走代理解析，并把结果写进 psw_gfw nftset
          #                     其余           → 用 direct_dns(默认 223.5.5.5) 直连解析
          # 为什么这么配：
          #   1) dns_mode 合法值只有 udp / tcp / dns2socks / sing-box / xray。
          #      旧配置写的 dns_mode=dnsmasq 是非法值：app.sh 的 case 没有对应分支，
          #      NEXT_DNS_LISTEN_PORT 没人监听，而副本 dnsmasq 的
          #      server=127.0.0.1#那个端口 → 凡是"该走代理"的域名全部解析失败。
          #   2) dns_shunt 必须是 chinadns-ng：屏蔽列表只有走它才会编译成
          #      group-dnl / group null；换成 dnsmasq 就只剩 address=/域名/ 的老写法。
          #   3) dns_redirect=1：gfwlist 模式靠 DNS 劫持把域名写进 psw_gfw nftset，
          #      关掉它等于关掉域名分流（只剩 IP 段硬碰）。
          #   4) 不再有 MosDNS 中转：客户端查询被 nft 截到 11400 走 PassWall，
          #      路由器自身走系统 dnsmasq(53) 直接向上游解析，两条链路互不干扰。
          if uci -q get passwall.@global[0] >/dev/null 2>&1; then
              uci set passwall.@global[0].enabled='1'
              uci set passwall.@global[0].tcp_proxy_mode='gfwlist'
              uci set passwall.@global[0].udp_proxy_mode='gfwlist'
              uci set passwall.@global[0].dns_shunt='chinadns-ng'
              uci set passwall.@global[0].dns_mode='tcp'
              uci set passwall.@global[0].remote_dns='1.1.1.1'
              uci set passwall.@global[0].dns_redirect='1'
              uci set passwall.@global[0].use_block_list='1'
              uci set passwall.@global[0].tcp_fastopen='1'
              uci commit passwall
          fi

          # ---- TurboACC ----
          if uci -q get turboacc.@turboacc[0] >/dev/null 2>&1; then
              uci set turboacc.@turboacc[0].sw_flow='1'
              uci set turboacc.@turboacc[0].hw_flow='1'
              uci set turboacc.@turboacc[0].bbr_cca='1'
              # 全锥 NAT 默认关：需要 kmod-nft-fullcone，当前镜像未编入。
              # 想开：先确认 feeds 有该 kmod（.config 里 INCLUDE_NFT_FULLCONE 改 y），再把这里改 1
              uci set turboacc.@turboacc[0].fullcone_nat='0'
              uci commit turboacc
          fi

          # 与 PassWall 的兼容性（别轻易关掉，也理解它为什么不会打断代理）：
          #   直连流量走 forward → 进 flowtable 分载，提速；
          #   被代理的流量在 prerouting 就被 redirect/tproxy 抓成本地连接，根本走不到
          #   forward，所以分载和透明代理不冲突。真遇到"代理通、网页卡"再依次关
          #   hw_flow → sw_flow 排查。
          # ---- 防火墙流量分载：不依赖 TurboACC，装了/没装都生效 ----
          # TurboACC 只是 UI + 额外选项；核心加速走 firewall4 原生 offload。
          if uci -q get firewall.@defaults[0] >/dev/null 2>&1; then
              uci set firewall.@defaults[0].flow_offloading='1'
              uci commit firewall
          fi

          # ---- 只 enable，不在这里 start（此时网络还没起来）----
          for s in ksmbd p910nd zram cron; do
              [ -x "/etc/init.d/$s" ] && /etc/init.d/$s enable
          done
          exit 0
          EOF

          # ---------- C2. DNS 应急回滚：一条命令停掉 PassWall，把 53 还给 dnsmasq ----------
          # 万一 DNS 出问题（网页打不开但能 ping 通 IP），SSH 里执行 dns-recover 即可
          cat > files/usr/bin/dns-recover << 'EOF'
          #!/bin/sh
          # 应急回滚：停掉 PassWall 的 DNS 接管，让所有查询回到 dnsmasq 直连
          #   正常情况下客户端 :53 被 nft 劫持到 11400（chinadns-ng 分流）；
          #   这里停掉 PassWall 并清残留 nft 链，再把 dnsmasq 的上游还原。
          
          echo "== 1/2 停用 PassWall =="
          uci -q set passwall.@global[0].enabled='0'
          uci -q commit passwall
          /etc/init.d/passwall stop 2>/dev/null
          # 兜底：PassWall 异常退出时可能残留 nft 链，重启防火墙一次清干净
          /etc/init.d/firewall restart 2>/dev/null
          
          echo "== 2/2 让 dnsmasq 直连上游 =="
          # 旧固件（MosDNS 时代）会往 dnsmasq 塞 127.0.0.1#5335，可能有重复项，循环删干净
          while uci -q del_list dhcp.@dnsmasq[0].server='127.0.0.1#5335'; do :; done
          # noresolv=1 说明上游是 dns-secure 配的加密 DNS，别顺手关掉
          if [ "$(uci -q get dhcp.@dnsmasq[0].noresolv)" != "1" ]; then
              uci -q set dhcp.@dnsmasq[0].noresolv='0'
          fi
          uci -q delete dhcp.@dnsmasq[0].cachesize
          uci -q commit dhcp
          /etc/init.d/dnsmasq restart
          sleep 2
          
          if nslookup www.baidu.com 127.0.0.1 >/dev/null 2>&1; then
              echo "✅ DNS 已恢复（PassWall 已停用，dnsmasq 直连上游）"
              echo "   排查完想恢复原状：uci set passwall.@global[0].enabled=1 && uci commit passwall && /etc/init.d/passwall restart"
          else
              # dns-recover 的承诺是"一定能上网"：DoT 要是坏了就退回明文再试一次
              if [ "$(uci -q get dhcp.@dnsmasq[0].noresolv)" = "1" ]; then
                  echo "   解析失败，先关掉 DoT 再试一次"
                  /usr/bin/dns-secure off >/dev/null 2>&1
                  sleep 2
              fi
              if nslookup www.baidu.com 127.0.0.1 >/dev/null 2>&1; then
                  echo "✅ DNS 已恢复（已退回 WAN 明文上游）"
              else
                  echo "⚠️ 仍无法解析，可能 WAN 断线。执行 logread | tail -n 50 看日志"
              fi
          fi
          exit 0
          EOF

          # ---------- C3. 加密 DNS（DoT）+ 劫持状态守护 ----------
          # 补上两个"不合逻辑"的地方：
          #   1) PassWall 只管局域网客户端的 53；路由器自己（升级、NTP、插件）走的是
          #      dnsmasq -> WAN 明文上游。PassWall 一关，客户端也落回这条路。
          #      dns-secure 把 dnsmasq 上游换成 DoT（853/TLS），自检失败自动回滚明文。
          #   2) dns_redirect=1 但 chinadns-ng 没跑（典型：刚刷机还没导入节点）时，
          #      53 被劫到没人监听的端口 = 全家断 DNS。dns-guard 让"劫持状态"始终与
          #      "PassWall 是否真的可用"一致：不可用就先把 53 还给 dnsmasq。
          cat > files/usr/bin/dns-secure << 'EOF'
          #!/bin/sh
          # 路由器自身的加密 DNS（DoT）
          #   背景：PassWall 的 53 劫持只作用于局域网客户端；路由器自己（opkg 升级、NTP、
          #   插件下载）走 dnsmasq -> WAN 下发的上游，默认是明文，ISP 能看到查询内容；
          #   PassWall 一关，客户端也落回这条链路。
          #   做法：dnsmasq-full 若编译了 DNSSEC 就具备 DoT 能力（server=IP#853 走 TLS），
          #   把它设成唯一上游，再跑一次真实解析自检，不通立即回滚，绝不断网。
          #   用法：dns-secure [on|off|status]；开机/巡检用 --boot / --check
          SERVERS="223.5.5.5#853 223.6.6.6#853"
          MARK=/etc/dns-secure.on
          LOG=/var/log/dns-secure.log

          log() {
              echo "$(date '+%F %T') $*" >>"$LOG" 2>/dev/null
              logger -t dns-secure "$*" 2>/dev/null
              return 0
          }

          dot_supported() {
              dnsmasq --version 2>/dev/null | grep -q DNSSEC
          }

          dot_active() {
              [ "$(uci -q get dhcp.@dnsmasq[0].noresolv)" = "1" ] || return 1
              uci -q get dhcp.@dnsmasq[0].server 2>/dev/null | grep -q '#853'
          }

          dot_reachable() {
              # 先摸一下 853 通不通；不通就别折腾 dnsmasq（省一段开机空窗）
              if command -v nc >/dev/null 2>&1; then
                  nc -w 4 223.5.5.5 853 </dev/null >/dev/null 2>&1
              else
                  return 0
              fi
          }

          dns_ok() {
              _i=0
              while [ "$_i" -lt 3 ]; do
                  if nslookup www.baidu.com 127.0.0.1 >/dev/null 2>&1; then
                      nslookup www.github.com 127.0.0.1 >/dev/null 2>&1 && return 0
                  fi
                  _i=$((_i + 1))
                  sleep 4
              done
              return 1
          }

          rollback() {
              for _s in $SERVERS; do
                  uci -q del_list dhcp.@dnsmasq[0].server="$_s"
              done
              uci -q delete dhcp.@dnsmasq[0].noresolv
              uci -q commit dhcp
              rm -f "$MARK"
              /etc/init.d/dnsmasq restart >/dev/null 2>&1
              log "已回滚为明文上游（WAN 下发），DNS 不会断"
          }

          enable() {
              if ! dot_supported; then
                  log "当前 dnsmasq 没有 DNSSEC/DoT 支持，保持 WAN 明文上游"
                  return 1
              fi
              if ! dot_reachable; then
                  log "上游 853 不可达（被拦或不在直连范围），保持 WAN 明文上游"
                  return 1
              fi
              for _s in $SERVERS; do
                  uci -q del_list dhcp.@dnsmasq[0].server="$_s"
              done
              for _s in $SERVERS; do
                  uci add_list dhcp.@dnsmasq[0].server="$_s"
              done
              uci set dhcp.@dnsmasq[0].noresolv='1'
              uci commit dhcp
              /etc/init.d/dnsmasq restart >/dev/null 2>&1
              sleep 4
              if dns_ok; then
                  date '+%F %T' > "$MARK" 2>/dev/null
                  log "DoT 已启用：路由器自身查询走 853/TLS，不再明文出网"
                  return 0
              fi
              log "DoT 自检失败（853 被拦或上游证书不被接受），回滚明文"
              rollback
              return 1
          }

          case "$1" in
              off)
                  rollback
                  echo "已关闭 DoT，dnsmasq 回到 WAN 下发的明文上游"
                  ;;
              status)
                  if dot_active; then
                      echo "DoT：已开启（上游 $(uci -q get dhcp.@dnsmasq[0].server | tr '\n' ' ')）"
                  elif dot_supported; then
                      echo "DoT：未开启（dnsmasq 支持，执行 dns-secure 打开）"
                  else
                      echo "DoT：不支持（dnsmasq 未编译 DNSSEC）"
                  fi
                  ;;
              --boot)
                  [ -f "$MARK" ] && exit 0
                  dot_active && exit 0
                  _w=0
                  while [ "$_w" -lt 18 ]; do
                      ip route 2>/dev/null | grep -q '^default' && break
                      sleep 10
                      _w=$((_w + 1))
                  done
                  ip route 2>/dev/null | grep -q '^default' || exit 0
                  sleep 3
                  enable || true
                  ;;
              --check)
                  dot_active || exit 0
                  dns_ok && exit 0
                  log "DoT 健康检查失败，回滚明文保证可用"
                  rollback
                  ;;
              ""|on)
                  enable
                  ;;
              *)
                  echo "用法: dns-secure [on|off|status]"
                  ;;
          esac
          exit 0
          EOF

          cat > files/usr/bin/dns-guard << 'EOF'
          #!/bin/sh
          # DNS 劫持状态守护
          #   要防的场景：PassWall 的 nft 规则把客户端 53 劫到 11400，但 chinadns-ng 没起来
          #   （最常见：刚刷机还没导入节点）。这时查询没人应答 = 能 ping 通 IP 却打不开网页。
          #   策略（幂等，不会来回抖）：
          #     1) chinadns-ng 在跑：什么都不用做；若曾因故障关过劫持，这里恢复并重启 PassWall
          #     2) chinadns-ng 没跑：先重启一次 PassWall；还不行就把 53 还给 dnsmasq，
          #        保证全家不断网，等节点装好后自动恢复
          MARK=/etc/passwall/.dns_guard_down

          _uptime=$(cut -d. -f1 /proc/uptime 2>/dev/null)
          if [ -n "$_uptime" ] && [ "$_uptime" -lt 120 ]; then
              exit 0
          fi

          uci -q get passwall.@global[0] >/dev/null 2>&1 || exit 0

          _enabled=$(uci -q get passwall.@global[0].enabled)
          _redirect=$(uci -q get passwall.@global[0].dns_redirect)
          [ -n "$_redirect" ] || _redirect=0

          if pidof chinadns-ng >/dev/null 2>&1; then
              if [ "$_redirect" != "1" ] && [ -f "$MARK" ]; then
                  uci set passwall.@global[0].dns_redirect='1'
                  uci commit passwall
                  rm -f "$MARK"
                  logger -t dns-guard "chinadns-ng 已就绪，恢复 53 劫持并重启 PassWall"
                  /etc/init.d/passwall restart >/dev/null 2>&1
              fi
              exit 0
          fi

          # 已经在"暂不接管"状态：只等上面的复活分支，不再反复重启
          [ -f "$MARK" ] && exit 0
          [ "$_enabled" = "1" ] || exit 0

          logger -t dns-guard "chinadns-ng 未运行，重启 PassWall 尝试恢复"
          /etc/init.d/passwall restart >/dev/null 2>&1
          sleep 15
          if pidof chinadns-ng >/dev/null 2>&1; then
              logger -t dns-guard "PassWall 已恢复，53 劫持正常"
              exit 0
          fi

          uci set passwall.@global[0].dns_redirect='0'
          uci commit passwall
          mkdir -p /etc/passwall 2>/dev/null
          # 目录写不进去就退到 /tmp，否则 MARK 永远不存在 = 每 5 分钟重启一次 PassWall
          date '+%F %T' > "$MARK" 2>/dev/null || { MARK=/tmp/dns_guard_down; date '+%F %T' > "$MARK" 2>/dev/null; }
          logger -t dns-guard "PassWall 起不来（多半没有可用节点），临时关闭 53 劫持；装好节点后自动恢复"
          /etc/init.d/firewall reload >/dev/null 2>&1
          exit 0
          EOF

          # ---------- D. USB 网卡 / 随身 WiFi 热插拔自动挂 WAN ----------
          cat > files/etc/hotplug.d/net/20-usbwan << 'EOF'
          #!/bin/sh
          [ -n "$INTERFACE" ] || exit 0
          case "$INTERFACE" in usb*|wwan*|eth1|eth2) ;; *) exit 0 ;; esac

          is_usb() {
              _d=$(readlink -f "/sys/class/net/$INTERFACE/device" 2>/dev/null)
              case "$_d" in */usb*) return 0 ;; esac
              [ -f "/sys/class/net/$INTERFACE/device/uevent" ] && \
                  grep -q 'DEVTYPE=usb_interface' "/sys/class/net/$INTERFACE/device/uevent"
          }

          wan_zone() {
              uci show firewall 2>/dev/null \
                  | sed -n "s/^firewall\.\(@zone\[[0-9]*\]\)\.name='wan'$/\1/p" \
                  | head -n1
          }

          case "$ACTION" in
            add)
              is_usb || exit 0
              [ "$(uci -q get network.usbwan.device)" = "$INTERFACE" ] && exit 0
              uci set network.usbwan=interface
              uci set network.usbwan.proto='dhcp'
              uci set network.usbwan.device="$INTERFACE"
              uci set network.usbwan.metric='10'
              uci commit network
              _z=$(wan_zone)
              if [ -n "$_z" ]; then
                  uci -q del_list "firewall.$_z.network=usbwan"
                  uci add_list "firewall.$_z.network=usbwan"
                  uci commit firewall
                  /etc/init.d/firewall reload
              fi
              /etc/init.d/network reload
              logger -t usbwan "已绑定 $INTERFACE -> usbwan"
              ;;
            remove)
              [ "$(uci -q get network.usbwan.device)" = "$INTERFACE" ] || exit 0
              uci -q delete network.usbwan
              uci commit network
              _z=$(wan_zone)
              if [ -n "$_z" ]; then
                  uci -q del_list "firewall.$_z.network=usbwan"
                  uci commit firewall
                  /etc/init.d/firewall reload
              fi
              /etc/init.d/network reload
              logger -t usbwan "$INTERFACE 已移除，清理 usbwan"
              ;;
          esac
          exit 0
          EOF

          # ---------- E. ksmbd / p910nd ----------
          cat > files/etc/config/ksmbd << 'EOF'
          config globals
              option workgroup 'WORKGROUP'
              option description 'Newifi-D2'

          config share
              option name 'usb'
              option path '/mnt/sda1'
              option read_only 'no'
              option guest_ok 'yes'
              option create_mask '0666'
              option dir_mask '0777'
          EOF

          cat > files/etc/config/p910nd << 'EOF'
          config p910nd
              option enabled '1'
              option device '/dev/usb/lp0'
              option port '0'
              option bidirectional '0'
          EOF

          # ---------- F. 内核调优（针对 MT7621 双核 / 128MB 内存）----------
          cat > files/etc/sysctl.conf << 'EOF'
          # ---- 缓冲与队列：BBR 需要 fq，rmem/wmem 上限要放开否则 tcp_rmem 白设 ----
          net.core.default_qdisc = fq
          net.core.somaxconn = 1024
          net.core.rmem_max = 8388608
          net.core.wmem_max = 8388608
          net.ipv4.tcp_rmem = 4096 87380 8388608
          net.ipv4.tcp_wmem = 4096 65536 8388608
          net.ipv4.tcp_congestion_control = bbr
          net.ipv4.tcp_fastopen = 3
          net.ipv4.tcp_max_syn_backlog = 8192
          net.ipv4.tcp_syncookies = 1
          net.ipv4.tcp_tw_reuse = 1
          # ---- 内存：小内存机器不要把 16MB 锁死，8MB 足够 ----
          vm.min_free_kbytes = 8192
          vm.swappiness = 10
          # ---- 保留 VFS 缓存：ksmbd/USB 共享读写更稳 ----
          vm.vfs_cache_pressure = 50
          # ---- 内核 panic 后 10 秒自动重启，避免软路由挂着 ----
          kernel.panic = 10
          EOF

          cat > files/etc/crontabs/root << 'EOF'
          # 每日 04:00 释放页缓存，缓解 128MB 内存压力
          0 4 * * * sync; echo 3 > /proc/sys/vm/drop_caches
          # 每周六 04:30 刷新 PassWall 文本规则（gfwlist / chnlist），失败自动回滚
          30 4 * * 6 /usr/bin/rule-refresh
          # 每 5 分钟校正一次"PassWall 是否真的接管了 53"：没节点时别让全家断 DNS
          */5 * * * * /usr/bin/dns-guard
          # 每 6 小时确认加密上游还活着；被拦就回滚明文（宁可明文，不可断网）
          23 */6 * * * /usr/bin/dns-secure --check
          EOF

          # ---------- G. 开机后调优（必须在模块加载之后，故放在 rc.local）----------
          cat > files/etc/rc.local << 'EOF'
          #!/bin/sh
          # conntrack 上限：128MB 机器上 32K 是性价比最高的档位（默认 16K，P2P 会打满）
          if [ -e /proc/sys/net/netfilter/nf_conntrack_max ]; then
              echo 32768 > /proc/sys/net/netfilter/nf_conntrack_max
              echo 3600  > /proc/sys/net/netfilter/nf_conntrack_tcp_timeout_established
          fi

          # CPU 调频：MT7621 有 cpufreq 就锁 performance，软路由不需要省电
          for g in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
              [ -e "$g" ] && echo performance > "$g"
          done

          # ---- 自愈看门狗（后台，20 秒后检查一次）----
          # 1) LAN 段不完整 → 自动补齐并重载网络（这是"全家断网"的兜底）
          # 2) dnsmasq 没跑 → 重启一次；还起不来只记日志（"53 劫不劫持"由 dns-guard 统一决策）
          (
              sleep 20
              _dirty=0
              if ! uci -q get network.lan.proto >/dev/null 2>&1; then
                  logger -t netguard "LAN 段缺少 proto，自动修复"
                  uci set network.lan='interface'
                  [ -n "$(uci -q get network.lan.device)" ] || uci set network.lan.device='br-lan'
                  uci set network.lan.proto='static'
                  uci set network.lan.ipaddr='192.168.2.1'
                  uci set network.lan.netmask='255.255.255.0'
                  _dirty=1
              fi
              if ! uci -q get network.lan.device >/dev/null 2>&1; then
                  uci set network.lan.device='br-lan'
                  _dirty=1
              fi
              if [ "$_dirty" = "1" ]; then
                  uci commit network
                  logger -t netguard "网络配置已修复，重载中"
                  /etc/init.d/network reload
                  sleep 5
              fi

              if ! pidof dnsmasq >/dev/null 2>&1; then
                  logger -t netguard "dnsmasq 未运行，尝试重启"
                  /etc/init.d/dnsmasq restart
                  sleep 3
                  if ! pidof dnsmasq >/dev/null 2>&1; then
                      # "要不要劫持 53"归 dns-guard 管：两个看门狗各改各的会互相覆盖
                      logger -t netguard "dnsmasq 仍起不来，检查 /tmp/resolv.conf.d 与 WAN 上游"
                  fi
              fi
          ) &

          # ---- 加密 DNS：等 WAN 拿到地址后再试，失败自动回滚，不会断网 ----
          ( sleep 25; /usr/bin/dns-secure --boot ) &
          # ---- 劫持守护：PassWall 没节点/没起来时把 53 还给 dnsmasq ----
          ( sleep 40; /usr/bin/dns-guard ) &

          exit 0
          EOF

          # ---------- H. 规则自更新（每周六 04:30，见 crontabs）----------
          # 只刷文本规则 gfwlist/chnlist（合计约 1.4MB）：
          #   geoip.dat / geosite.dat 是 ROM 里的 6MB 二进制库，在 32MB 闪存上原地覆盖
          #   会把 overlay 撑爆，所以那两份只随"每周重编固件"更新。
          # 下载 → 校验 → 备份 → 替换 → 重启 PassWall → 确认 xray 还活着，否则回滚。
          cat > files/usr/bin/rule-refresh << 'EOF'
          #!/bin/sh
          LOG=/var/log/rule-refresh.log
          RULES=/usr/share/passwall/rules
          TMP=/tmp/rules.$$
          log() { echo "$(date '+%F %T') $*" >> "$LOG"; logger -t rule-refresh "$*"; }

          [ -d "$RULES" ] || { log "跳过：$RULES 不存在（未装 PassWall）"; exit 0; }
          mkdir -p "$TMP" || exit 1

          # 空间预检：两份规则约 1.4MB，留 3MB 余量，不够就安静跳过
          FREE=$(df -Pk /overlay 2>/dev/null | awk 'NR==2{print int($4/1024)}')
          if [ -n "$FREE" ] && [ "$FREE" -lt 3 ]; then
              log "跳过：overlay 仅剩 ${FREE}MB"
              rm -rf "$TMP"; exit 0
          fi

          fetch() {
              _url="$1"; _out="$2"
              curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 15 -m 300 \
                   "$_url" -o "$TMP/$_out" || { log "失败：$_out 下载出错"; return 1; }
              _n=$(wc -l < "$TMP/$_out" | tr -d ' ')
              [ "$_n" -ge 1000 ] || { log "失败：$_out 行数异常($_n)"; return 1; }
              if grep -qE '^(domain|full|regexp|keyword|include):' "$TMP/$_out"; then
                  log "失败：$_out 是 v2ray 格式，不能直接当 gfwlist"; return 1
              fi
              log "完成：$_out 下载($_n 行)"
          }

          fetch "https://fastly.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/gfw.txt" gfwlist \
              || { rm -rf "$TMP"; exit 0; }
          fetch "https://fastly.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/china-list.txt" chnlist \
              || { rm -rf "$TMP"; exit 0; }

          cp -f "$RULES/gfwlist" "$TMP/gfwlist.bak" 2>/dev/null
          cp -f "$RULES/chnlist" "$TMP/chnlist.bak" 2>/dev/null
          mv -f "$TMP/gfwlist" "$RULES/gfwlist"
          mv -f "$TMP/chnlist" "$RULES/chnlist"

          if [ -x /etc/init.d/passwall ]; then
              /etc/init.d/passwall restart >/dev/null 2>&1
              sleep 20
              if ! pidof xray >/dev/null 2>&1; then
                  log "回滚：重启后 xray 未运行"
                  [ -f "$TMP/gfwlist.bak" ] && cp -f "$TMP/gfwlist.bak" "$RULES/gfwlist"
                  [ -f "$TMP/chnlist.bak" ] && cp -f "$TMP/chnlist.bak" "$RULES/chnlist"
                  /etc/init.d/passwall restart >/dev/null 2>&1
              else
                  log "生效：规则已替换，xray 运行中"
              fi
          fi

          rm -rf "$TMP"
          exit 0
          EOF

          # ---------- I. 固件自检脚本（刷机后 SSH 执行 fw-selftest）----------
          mkdir -p files/usr/bin
          cat > files/usr/bin/fw-selftest << 'EOF'
          #!/bin/sh
          # 固件自检：一条命令看全系统状态
          P=0; F=0
          ok() { printf '  \033[32m✅\033[0m %s\n' "$1"; P=$((P + 1)); }
          ng() { printf '  \033[31m❌\033[0m %s\n' "$1"; F=$((F + 1)); }
          t()  { d="$1"; shift; if "$@" >/dev/null 2>&1; then ok "$d"; else ng "$d"; fi; }

          echo "===== Newifi-D2 固件自检 ====="
          t "xray 可执行"        xray -version
          t "dnsmasq 运行中"     pidof dnsmasq
          t "DNS 解析正常"       nslookup www.baidu.com 127.0.0.1
          t "NAT 转发开启"       test -e /proc/sys/net/ipv4/ip_forward

          [ "$(cat /proc/sys/net/ipv4/ip_forward 2>/dev/null)" = "1" ] && ok "ip_forward=1" || ng "ip_forward≠1"
          [ "$(uci -q get passwall.@global[0].enabled)" = "1" ] && ok "PassWall 已启用" || ng "PassWall 未启用"
          [ "$(uci -q get passwall.@global[0].dns_shunt)" = "chinadns-ng" ] && ok "DNS 分流器=chinadns-ng" || ng "DNS 分流器不是 chinadns-ng"
          [ "$(uci -q get passwall.@global[0].use_block_list)" = "1" ] && ok "屏蔽列表已启用" || ng "屏蔽列表未启用"
          BLOCK_N=$(wc -l < /etc/passwall/rules/block_host 2>/dev/null | tr -d ' ')
          [ -n "$BLOCK_N" ] || BLOCK_N=0
          [ "$BLOCK_N" -ge 50000 ] && ok "屏蔽列表 $BLOCK_N 条" || ng "屏蔽列表异常（$BLOCK_N 条）"
          t "chinadns-ng 运行中" pidof chinadns-ng
          if [ "$(uci -q get dhcp.@dnsmasq[0].noresolv)" = "1" ]; then
              ok "路由器 DNS 上游=DoT 加密"
          else
              ng "路由器 DNS 上游=明文（执行 dns-secure 可加密）"
          fi
          [ "$(cat /proc/sys/net/ipv4/tcp_congestion_control 2>/dev/null)" = "bbr" ] && ok "BBR 生效" || ng "BBR 未生效"
          [ "$(cat /proc/sys/net/netfilter/nf_conntrack_max 2>/dev/null)" = "32768" ] && ok "conntrack=32768" || ng "conntrack 未调优"
          [ -d /mnt/sda1 ] && ok "U 盘已挂载 /mnt/sda1" || ng "未检测到 U 盘（未插可忽略）"

          echo
          printf '通过 %d 项，失败 %d 项\n' "$P" "$F"
          if [ "$F" -eq 0 ]; then echo "🎉 一切正常"; else echo "⚠️  有失败项，按上面 ❌ 对应功能排查"; fi
          exit 0
          EOF

          # ---------- J. 内置使用说明页（http://192.168.2.1/guide.html）----------
          mkdir -p files/www
          cat > files/www/guide.html << 'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Newifi-D2 使用说明</title>
          <style>
          body{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;max-width:760px;margin:24px auto;padding:0 16px;line-height:1.75;color:#222}
          h1{font-size:1.4em;border-bottom:2px solid #4a90d9;padding-bottom:6px}
          h2{font-size:1.05em;margin-top:26px;color:#1a5fb4}
          code{background:#f2f4f7;padding:1px 5px;border-radius:3px;font-size:.92em}
          table{border-collapse:collapse;width:100%}
          td,th{border:1px solid #ddd;padding:6px 8px;text-align:left;font-size:.95em}
          .warn{background:#fff6e5;border-left:4px solid #f0a020;padding:8px 12px;margin:12px 0}
          </style>
          </head>
          <body>
          <h1>Newifi-D2 使用说明</h1>
          <p>固件已预配置完毕，刷入后基本不需要再设置。</p>

          <h2>1. 登录</h2>
          <p>浏览器打开 <code>http://192.168.2.1</code>，首次登录会要求设置 root 密码。</p>

          <h2>2. 无线</h2>
          <table><tr><th>频段</th><th>名称</th><th>密码</th></tr>
          <tr><td>2.4G</td><td>alon</td><td>alon12345678</td></tr>
          <tr><td>5G</td><td>alon-5G</td><td>alon12345678</td></tr></table>
          <div class="warn">建议改掉默认密码：网络 → 无线 → 修改。</div>

          <h2>3. 科学上网（PassWall）</h2>
          <p>固件<b>不含节点</b>：服务 → PassWall → 节点列表 → 导入订阅链接 → 保存并应用。</p>
          <p>模式已设为 gfwlist：名单内走代理，其余直连。</p>

          <h2>4. DNS 与去广告</h2>
          <p>客户端 DNS 由 PassWall 接管：chinadns-ng 分流（国内直连 / 国外走代理），
             所以"该不该走代理"是按域名判断的。</p>
          <p><b>去广告已开启</b>：PassWall「屏蔽列表」内置 anti-AD 规则（约 11 万条域名，
             构建时打入固件，随每周固件一起更新），命中直接返回 NXDOMAIN。</p>
          <p>想临时增删某条：服务 → PassWall → 规则列表 → 屏蔽列表（每行一个域名）。
             路由器自身的查询走系统 dnsmasq（53 → WAN 上游，默认明文）。</p>
          <p><b>路由器自身可以加密</b>：SSH 执行 <code>dns-secure</code> 会把 dnsmasq 的上游换成
             DoT（853/TLS，阿里 DNS）；开机也会自动试一次，853 被拦就自检失败、立刻回滚明文，
             不会把 DNS 弄死。看状态：<code>dns-secure status</code>；长期用明文：<code>dns-secure off</code>。</p>
          <div class="warn">PassWall 没启用 / 还没导入节点时，固件会在 5 分钟内自动把 53 还给 dnsmasq，
             上网不受影响；节点导入并应用后也会自动恢复劫持（最多等 5 分钟，急用可 SSH 执行 <code>dns-guard</code>）。</div>
          <div class="warn">去广告依赖 PassWall 在运行：PassWall 一停，既不走代理也不拦广告。</div>
          <p>网站/App 突然打不开，多半是分流规则误判：SSH 执行 <code>dns-recover</code> 会把 PassWall 停掉、把 53 还给 dnsmasq（代理同时失效，属于应急手段）。</p>

          <h2>5. 文件共享 / 打印</h2>
          <table>
          <tr><td>共享</td><td>插上 U 盘后访问 <code>\\192.168.2.1\usb</code>（/mnt/sda1，匿名可写）</td></tr>
          <tr><td>打印</td><td>USB 打印机接上，客户端添加网络打印机 <code>192.168.2.1:9100</code></td></tr>
          </table>

          <h2>6. 随身 WiFi / 4G 网卡</h2>
          <p>直接插上即可，自动作为备份线路（主线路优先）。</p>

          <h2>7. 出问题三招</h2>
          <table><tr><th>现象</th><th>处理</th></tr>
          <tr><td>能 ping 通 IP、网页打不开</td><td>SSH 执行 <code>dns-recover</code></td></tr>
          <tr><td>某个 App 突然不通</td><td>SSH 执行 <code>dns-recover</code>，或检查 PassWall 分流规则</td></tr>
          <tr><td>广告还在（没被拦）</td><td>SSH 执行 <code>fw-selftest</code> 看「屏蔽列表 N 条」；再进 服务 → PassWall → 规则列表 → 屏蔽列表 确认条目存在</td></tr>
          <tr><td>科学上网时快时慢</td><td>TurboACC 关掉硬件分载</td></tr></table>
          <p>看整体状态：SSH 执行 <code>fw-selftest</code>。</p>

          <h2>8. 更新固件</h2>
          <p>固件本体不自动升级：要新版本请重新构建，再「系统 → 备份/升级」刷入 sysupgrade 包（配置保留）。</p>
          <p>但 <b>PassWall 规则会自己更新</b>：每周六 04:30 跑一次 <code>rule-refresh</code>
             （gfwlist / chnlist，约 1.4MB）。想看日志：<code>cat /var/log/rule-refresh.log</code>；
             想立即刷一次：<code>rule-refresh</code>。失败会自动回滚，不会断网。</p>
          <p>去广告清单（<code>/etc/passwall/rules/block_host</code>）不走运行时更新，
             它跟固件一起打包：每次重新构建都会重新拉一份 anti-AD，所以更新固件即顺带更新规则。</p>
          </body>
          </html>
          EOF

          # ---------- K. 去广告：把 anti-AD 打进 PassWall 的"屏蔽列表" ----------
          # 为什么不用 PassWall 自带的 geosite:CATEGORY-ADS-ALL：
          #   那要 geoview（Go 静态二进制，mipsel 上 6~10MB）+ 展开 geosite.dat，
          #   32MB 闪存 / 128MB 内存的机器扛不住。这里只放纯域名，chinadns-ng 按域名
          #   哈希匹配，命中直接返回 NXDOMAIN，最省资源。
          # 路径是 PassWall 写死的：USER_RULES_PATH=/etc/passwall/rules
          #   （helper_chinadns_add.lua）。运行时它只写 /tmp 缓存，不动闪存。
          mkdir -p files/etc/passwall/rules
          BLOCK=files/etc/passwall/rules/block_host
          RAW=/tmp/ad-raw.txt
          : > "$RAW"
          for u in \
            "https://fastly.jsdelivr.net/gh/privacy-protection-tools/anti-AD@master/anti-ad-domains.txt" \
            "https://cdn.jsdelivr.net/gh/privacy-protection-tools/anti-AD@master/anti-ad-domains.txt" \
            "https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-domains.txt" \
            "https://gitee.com/privacy-protection-tools/anti-AD/raw/master/anti-ad-domains.txt" \
            "https://small.oisd.nl/domainswild" ; do
            echo "下载广告域名清单: $u"
            if curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 15 -m 240 "$u" -o "$RAW"; then
              [ "$(wc -c < "$RAW")" -gt 400000 ] && break
              echo "::warning::内容过小，换下一个源"
            fi
            : > "$RAW"
          done

          if [ -s "$RAW" ]; then
            # 只保留合法域名：去 CR/空白、去注释与空行、去 *. 前缀、统一小写、去重排序
            sed -e 's/\r$//' "$RAW" \
              | awk '{ gsub(/^[ \t]+|[ \t]+$/, ""); if ($0 ~ /^#/ || length($0) == 0) next; sub(/^\*\./, ""); sub(/^\./, ""); print tolower($0) }' \
              | grep -E '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$' \
              | LC_ALL=C sort -u > "$BLOCK" || true
          else
            echo "::warning::所有广告清单源都下载失败，本次固件不含去广告规则"
            : > "$BLOCK"
          fi

          BLOCK_N=$(wc -l < "$BLOCK" | tr -d ' ')
          BLOCK_B=$(wc -c < "$BLOCK" | tr -d ' ')
          [ -n "$BLOCK_N" ] || BLOCK_N=0
          [ -n "$BLOCK_B" ] || BLOCK_B=0
          echo "屏蔽列表: $BLOCK_N 条 / $BLOCK_B 字节（squashfs 压缩后约 +$((BLOCK_B / 3 / 1024)) KB）"
          if [ "$BLOCK_N" -lt 50000 ]; then
            echo "::warning::屏蔽列表只有 $BLOCK_N 条（预期 >=50000），去广告效果会很差；上游格式可能变了"
          fi
          if [ "$BLOCK_N" -gt 250000 ] || [ "$BLOCK_B" -gt 5000000 ]; then
            echo "::error::屏蔽列表异常膨胀（$BLOCK_N 条 / $BLOCK_B 字节），拒绝塞爆 32MB 闪存"
            exit 1
          fi
          chmod +x files/usr/bin/dns-recover files/usr/bin/fw-selftest files/usr/bin/rule-refresh \
                   files/usr/bin/dns-secure files/usr/bin/dns-guard \
                   files/etc/hotplug.d/net/20-usbwan files/etc/uci-defaults/* files/etc/rc.local
          # ---- 生成物语法自检：构建机是 dash，bashism 会在这里被抓出来 ----
          for f in files/usr/bin/* files/etc/uci-defaults/* files/etc/hotplug.d/net/* files/etc/rc.local; do
            [ -f "$f" ] || continue
            sh -n "$f" || { echo "::error::脚本语法错误：$f"; exit 1; }
          done
          echo "🔧 files/ 预置完成："
          find files -type f | sort

          # 打包覆盖层快照：第 12 步"缺失补齐"时可一键还原，不用重跑整个 step
          tar -C . -czf /workdir/files-overlay.tgz files
          echo "覆盖层快照: $(du -h /workdir/files-overlay.tgz | cut -f1)"

      # ---------------------------------------------------------------
      - name: 6. 缓存 ccache 与 dl
        if: inputs.clean_build != true
        uses: actions/cache@v4
        with:
          path: |
            /workdir/immortalwrt/.ccache
            /workdir/immortalwrt/dl
          key: ${{ runner.os }}-d2-v17-${{ hashFiles('newifi-d2.config', '.github/workflows/build-immortalwrt.yml') }}
          restore-keys: |
            ${{ runner.os }}-d2-v17-

      # ---------------------------------------------------------------
      - name: 7. 应用 .config 并做依赖硬校验
        run: |
          cd immortalwrt

          # ---------- Go 工具链版本 ----------
          # feeds 的 GO_DEFAULT_VERSION 决定 xray-core 用哪个 Go 编译。
          # openwrt-25.12 默认 1.26，正好满足 xray 26.3.27 的 go>=1.26。
          # 若日志出现 "go.mod requires go >= 1.XX"，把 go_version 输入改成 1.XX 重跑。
          GO_VER="${{ inputs.go_version }}"
          if [ -n "$GO_VER" ] && [ "$GO_VER" != "auto" ]; then
            sed -i "s/^GO_DEFAULT_VERSION:=.*/GO_DEFAULT_VERSION:=$GO_VER/" \
              feeds/packages/lang/golang/golang-values.mk
            echo "🔧 已强制 Go 版本为 $GO_VER"
          fi
          echo "---- 当前 Go 工具链 ----"
          grep -n '^GO_DEFAULT_VERSION' feeds/packages/lang/golang/golang-values.mk
          ls -d feeds/packages/lang/golang/golang[0-9]* 2>/dev/null | sed 's/^/  可用版本: /'
          echo "xray-core 版本: $(sed -n 's/^PKG_VERSION:=//p' package/xray-core/Makefile)"
          echo "passwall 版本 : $(sed -n 's/^PKG_VERSION:=//p' package/feeds/luci/luci-app-passwall/Makefile)"

          # ---------- Go 模块缓存移出 dl（关键）----------
          # dl/ 会被 actions/cache 缓存。之前构建中断时把"残缺的模块目录"也存进了缓存，
          # 下次恢复后 Go 把残缺副本当完整用，于是出现一堆
          #   "no required module provides package X/internal/y"
          #   "build constraints exclude all Go files"
          # 把 GOMODCACHE 指到不进缓存的目录，从根上消除这个隐患（代价：每次多下 1~2 分钟）
          sed -i 's#^GO_MOD_CACHE_DIR:=.*#GO_MOD_CACHE_DIR:=/workdir/gomod#' \
            feeds/packages/lang/golang/golang-values.mk
          mkdir -p /workdir/gomod
          grep -n '^GO_MOD_CACHE_DIR' feeds/packages/lang/golang/golang-values.mk
          # 清掉旧缓存里可能残缺的那份
          rm -rf dl/go-mod-cache

          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config

          # ---------- 可选：关闭 TurboACC ----------
          # 它是第三方 v1.4；万一与 25.12 的 LuCI 不兼容导致编译失败，
          # 用 with_turboacc=false 重跑即可，加速能力不受影响
          #（flow offload 走 firewall4，BBR 走 sysctl + kmod-tcp-bbr）
          EFF_TURBO="true"
          # 定时触发（schedule）时 inputs.* 全是空串，这里统一回落到默认值 true，
          # 否则每周自动构建会误把 TurboACC 当成"用户要求关闭"而悄悄漏掉。
          TURBO="${{ inputs.with_turboacc }}"
          [ -z "$TURBO" ] && TURBO="true"
          if [ "$TURBO" != "true" ]; then
            sed -i -E 's/^(CONFIG_PACKAGE_luci-app-turboacc.*)$/# \1/' .config
            EFF_TURBO="false"
            echo "⏭  已按输入关闭 TurboACC"
          fi
          # 记录"实际生效状态"：第 11 步可能自动降级把它关掉，第 12 步审计要读这个文件
          echo "$EFF_TURBO" > /workdir/state-turboacc

          make defconfig 2>&1 | tee defconfig.log

          if grep -q 'recursive dependency detected' defconfig.log; then
            echo "::error::Kconfig 检测到递归依赖（未知新增的冲突包），可能已丢包"
            grep -A4 'recursive dependency' defconfig.log | head -n 20
            exit 1
          fi

          if grep -qi 'warning' defconfig.log; then
            echo "::warning::defconfig 存在告警，以下符号可能被丢弃："
            grep -i 'warning' defconfig.log | head -n 50
          fi

          echo "======== 关键组件校验 ========"
          MISSING=0
          check() {
            if grep -qx "$1=y" .config; then
              printf '  ✅ %s\n' "$1"
            else
              printf '::error::未生效：%s（包不存在或依赖不满足）\n' "$1"
              MISSING=1
            fi
          }
          check CONFIG_PACKAGE_dnsmasq-full
          if grep -qx 'CONFIG_PACKAGE_dnsmasq_full_dnssec=y' .config; then
            echo "  ✅ dnsmasq 带 DNSSEC（DoT 可用）"
          else
            echo "  ⚠️  dnsmasq 未编 DNSSEC：路由器上游只能明文（固件仍可用）"
          fi
          check CONFIG_PACKAGE_luci-app-passwall
          check CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray
          check CONFIG_PACKAGE_chinadns-ng
          check CONFIG_PACKAGE_xray-core
          check CONFIG_PACKAGE_v2ray-geoip
          check CONFIG_PACKAGE_v2ray-geosite
          if [ "$TURBO" = "true" ]; then
            check CONFIG_PACKAGE_luci-app-turboacc
          else
            echo "  ⏭  TurboACC 按要求跳过（不影响 offload / BBR）"
          fi
          check CONFIG_PACKAGE_zram-swap
          check CONFIG_PACKAGE_luci-app-ksmbd
          check CONFIG_PACKAGE_ksmbd-server
          check CONFIG_PACKAGE_kmod-fs-ksmbd
          check CONFIG_PACKAGE_luci-app-p910nd
          check CONFIG_PACKAGE_p910nd
          check CONFIG_PACKAGE_kmod-usb-net-rndis
          check CONFIG_PACKAGE_kmod-usb-net-cdc-ncm

          if [ "$MISSING" -ne 0 ]; then
            echo "::error::存在未生效的组件，拒绝继续构建（否则会产出残缺固件）"
            echo "---- feeds 里这些包是否存在（1=有，0=没有）----"
            for p in luci-app-passwall xray-core chinadns-ng dns2socks ipt2socks \
                     microsocks tcping lyaml luci-app-turboacc \
                     v2ray-geoip v2ray-geosite; do
              printf '  %-24s %s\n' "$p" "$(./scripts/feeds list -n 2>/dev/null | grep -cx "$p")"
            done
            echo "排查建议："
            echo "  1) 缺哪个包，就把对应源码加进第 4 步（或改成 feeds 里已有的等价包）"
            echo "  2) 看本步骤上方 make defconfig 的告警，通常会点出缺失的依赖"
            echo "  3) 若是编译期报 'go.mod requires go >= 1.XX'，把 go_version 输入改成 1.XX 重跑"
            exit 1
          fi
          echo "🎉 全部组件校验通过"

          {
            echo "### 📦 参与构建的关键包"
            echo ""
            echo '```'
            grep -E '^CONFIG_PACKAGE_(luci-app-passwall|xray-core|luci-app-turboacc|v2ray-geoip|v2ray-geosite|dnsmasq-full|luci-app-ksmbd|zram-swap)=' .config | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------
      - name: 8. LAN 网段改为 192.168.2.1
        run: |
          cd immortalwrt
          GEN="package/base-files/files/bin/config_generate"
          if [ -f "$GEN" ]; then
            sed -i 's/192\.168\.1\.1/192.168.2.1/g' "$GEN"
            grep -q '192.168.2.1' "$GEN" \
              || { echo "::error::LAN IP 注入失败"; exit 1; }
            echo "✅ config_generate 已改为 192.168.2.1"
          else
            echo "::warning::$GEN 不存在，跳过（首启仍由 uci-defaults/90-luci 设置）"
          fi

      # ---------------------------------------------------------------
      - name: 9. 预置 PassWall 分流规则（带格式校验，失败则保留包内自带）
        run: |
          cd immortalwrt
          RULES="files/usr/share/passwall/rules"
          mkdir -p "$RULES"

          fetch_rule() {
            _url="$1"; _out="$2"
            curl -fsSL --retry 3 --retry-delay 2 "$_url" -o "$_out.tmp" || {
              echo "⚠️ 下载失败，跳过：$_out"; rm -f "$_out.tmp"; return 0; }
            _lines=$(wc -l < "$_out.tmp" | tr -d ' ')
            if [ "$_lines" -lt 1000 ] \
               || grep -qE '^(domain|full|regexp|keyword|include):' "$_out.tmp"; then
              echo "⚠️ 格式不符（行数 $_lines 或带 v2ray 前缀），保留包内自带：$_out"
              rm -f "$_out.tmp"
            else
              mv "$_out.tmp" "$_out"
              echo "✅ $_out（$_lines 行）"
            fi
          }

          fetch_rule "https://fastly.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/gfw.txt" \
                     "$RULES/gfwlist"
          fetch_rule "https://fastly.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/china-list.txt" \
                     "$RULES/chnlist"

          echo "ℹ️  GeoIP/GeoSite 不在此处下载：v2ray-geoip / v2ray-geosite 会在编译期"
          echo "    自动拉取 geoip-only-cn-private.dat(≈90KB) 与 geosite.dat(≈1.2MB) 并校验 sha256。"

      # ---------------------------------------------------------------
      - name: 10. 下载源码包（失败重试；无进展立即中断并诊断）
        run: |
          cd immortalwrt
          # 只下载 .config 已选中的包所需源码：make download 按依赖图遍历，未选中的包不会下载
          export GIT_HTTP_LOW_SPEED_LIMIT=1000
          export GIT_HTTP_LOW_SPEED_TIME=60

          diag_download() {
            echo "::group::📋 下载失败诊断"
            echo "--- 残缺/异常文件（<1KB）---"
            find dl -type f -size -1024c -exec ls -l {} \; 2>/dev/null || echo "  （无）"
            echo "--- 日志里的失败线索 ---"
            grep -hE "Download failed|Hash mismatch|404 Not Found|404:|ERROR|Connection (timed out|refused|reset)|Temporary failure|Could not resolve|unable to|No space left" /tmp/dl-*.log 2>/dev/null | sort -u | head -n 25 || echo "  （未匹配到关键字）"
            echo "--- 涉及的源码包 ---"
            grep -hoE "dl/[A-Za-z0-9._+@-]+\.(tar\.gz|tar\.xz|tar\.bz2|zip|tgz|git)" /tmp/dl-*.log 2>/dev/null | sort -u | tail -n 30 || true
            echo "--- 磁盘 ---"
            df -h . | tail -n1
            echo "::endgroup::"
            echo "处理建议：① 直接重跑（dl 缓存复用，只补缺的）"
            echo "          ② 勾选 clean_build 清空 dl 重下"
            echo "          ③ 日志为 404/哈希不符 → 该包源地址或版本在 feeds 里已失效，需要改版本"
            echo "          ④ 大量 403/404 且集中在 GitHub → 限流，隔几分钟重跑"
          }

          DL_OK=0
          PREV_FILES=-1
          PREV_BAD=-1
          for i in 1 2 3 4 5; do
            JOBS=8
            if [ "$i" -gt 1 ]; then JOBS=4; fi
            echo "================ 下载第 $i 轮（-j${JOBS}）================"

            RC=0
            make download -j"$JOBS" V=s 2>&1 | tee "/tmp/dl-$i.log" || RC=$?

            FILES=$(find dl -type f 2>/dev/null | wc -l)
            BAD=$(find dl -type f -size -1024c 2>/dev/null | wc -l)

            if [ "$RC" -eq 0 ] && [ "$BAD" -eq 0 ]; then
              echo "✅ 下载完整：${FILES} 个文件，共 $(du -sh dl | cut -f1)"
              DL_OK=1
              break
            fi

            echo "⚠️  第 $i 轮结果：退出码=${RC}，残缺=${BAD}，总文件=${FILES}"

            if [ "$i" -gt 1 ] && [ "$FILES" -le "$PREV_FILES" ] && [ "$BAD" -ge "$PREV_BAD" ]; then
              echo "::error::下载连续两轮零进展（文件数 ${PREV_FILES}→${FILES}，残缺 ${PREV_BAD}→${BAD}），提前中断，不再空跑"
              diag_download
              exit 1
            fi
            PREV_FILES=$FILES
            PREV_BAD=$BAD

            find dl -type f -size -1024c -print -delete 2>/dev/null || true
            if [ "$i" -lt 5 ]; then sleep 10; fi
          done

          if [ "$DL_OK" -ne 1 ]; then
            echo "::error::5 轮下载仍未完成，已中断构建（不进入编译，避免浪费 2 小时）"
            diag_download
            exit 1
          fi

      # ---------------------------------------------------------------
      - name: 11. 编译固件
        id: build
        run: |
          cd immortalwrt
          export CCACHE_DIR="$CCACHE_DIR"
          export CCACHE_MAXSIZE="$CCACHE_MAXSIZE"
          set -o pipefail

          : > build.log
          {
            echo "==== 构建环境 ===="
            echo "Go: $(sed -n 's/^GO_DEFAULT_VERSION:=//p' feeds/packages/lang/golang/golang-values.mk)"
            echo "xray-core: $(sed -n 's/^PKG_VERSION:=//p' package/xray-core/Makefile)"
            echo "passwall : $(sed -n 's/^PKG_VERSION:=//p' package/feeds/luci/luci-app-passwall/Makefile)"
            echo "===================="
          } >> build.log

          # ---- 阶段 0：先装 host 工具与交叉工具链（必须！）----
          # 关键教训：`make package/xxx/compile` 这类单包目标【不会】自动构建 tools/ 和
          # toolchain/。在干净工作区里直接跑，会因 staging_dir/host/bin/sed 不存在而报
          #   bash: .../staging_dir/host/bin/sed: No such file or directory
          #   ERROR: package/utils/lua [host] failed to build.
          # 于是把本该在整机编译里做的事，提前到这里做完。
          echo "🏗  阶段0：构建 host 工具 + 交叉工具链（约 20~30 分钟）..."
          if ! make -j"$(nproc)" prereq tools/install toolchain/install 2>&1 | tee -a build.log; then
            echo "::error::host 工具 / 工具链构建失败"
            echo "::group::📋 失败详情"
            tail -n 80 build.log
            echo "::endgroup::"
            exit 1
          fi
          echo "✅ host 工具与工具链就绪（$(ls staging_dir/host/bin/sed 2>/dev/null || echo '无 sed')）"

          # ---- 阶段 1：单独预编 2 个 Go 组件（-j1 V=s）----
          # 1) 失败能在几十分钟内暴露真实错误（整机 -j 编译时错误会被 make 吞掉）
          # 2) 顺序执行，消除"Go 工具链还没就绪就开始编"的竞态
          GOVER=$(sed -n 's/^GO_DEFAULT_VERSION:=//p' feeds/packages/lang/golang/golang-values.mk)
          echo "🔧 预编译 Go 组件（Go ${GOVER} + xray）..."

          try_build() {
            make -j1 V=s "$1" 2>&1 | tee -a build.log
          }

          # Go 构建统一入口：遇到"模块缓存残缺"类错误，自动清空 GOMODCACHE 重试一次
          # 典型报错：build constraints exclude all Go files / no required module provides package
          go_build() {
            _t="$1"; _n="$2"
            try_build "$_t" && return 0
            if grep -qE "build constraints exclude all Go files|no required module provides package" build.log; then
              echo "::warning::${_n} 报 Go 模块缓存残缺，清空 /workdir/gomod 后重试一次"
              rm -rf /workdir/gomod
              mkdir -p /workdir/gomod
              make "${_t%/compile}/clean" >/dev/null 2>&1 || true
              try_build "$_t" && return 0
            fi
            return 1
          }

          die_with_log() {
            echo "::error::$1 预编译失败（真实错误见下）"
            echo "::group::📋 失败详情"
            tail -n 80 build.log
            echo "::endgroup::"
            exit 1
          }

          # ① host Go 工具链
          GT="package/feeds/packages/golang${GOVER}/host/compile"
          if [ -d "$(dirname "${GT%/compile}")" ]; then
            echo "================ 预编 $GT ================"
            try_build "$GT" || die_with_log "Go ${GOVER} 工具链"
          else
            echo "::warning::找不到 golang${GOVER} 目录，跳过工具链预编"
          fi

          # ② xray（必须 ≥26.7.11，只能跟随主 Go 版本）
          echo "================ 预编 xray-core ================"
          go_build "package/xray-core/compile" "xray-core" || die_with_log "xray-core"

          echo "✅ Go 组件预编译全部通过"

          build_once() {
            RC=0
            make -j"$(nproc)" 2>&1 | tee -a build.log || RC=$?
            return "$RC"
          }

          echo "🚀 第 1 次编译 (-j$(nproc))"
          if build_once; then
            echo "✅ 编译完成"
            ccache -s || true
            exit 0
          fi

          # ================= 自动降级重试（最多 2 次）=================
          for attempt in 1 2; do
            echo "::warning::编译失败，进入第 ${attempt} 次自动修复"
            FIXED=0

            if grep -qE "requires go >= *[0-9]" build.log; then
              NEED=$(grep -oE "requires go >= *[0-9]+\.[0-9]+" build.log | head -n1 | grep -oE "[0-9]+\.[0-9]+")
              CUR=$(sed -n 's/^GO_DEFAULT_VERSION:=//p' feeds/packages/lang/golang/golang-values.mk)
              if [ -n "$NEED" ] && [ "$NEED" != "$CUR" ]; then
                echo "  · Go 版本不足：当前 ${CUR} → 需要 ${NEED}，自动切换"
                sed -i "s/^GO_DEFAULT_VERSION:=.*/GO_DEFAULT_VERSION:=$NEED/" \
                  feeds/packages/lang/golang/golang-values.mk
                rm -rf staging_dir/hostpkg/lib/go-* staging_dir/hostpkg/bin/go*
                make defconfig >/dev/null 2>&1 || true
                FIXED=1
              fi
            fi

            if [ "$FIXED" -eq 0 ] && grep -qE "package/turboacc/[^ ]* failed to build" build.log; then
              if grep -q "^CONFIG_PACKAGE_luci-app-turboacc=y" .config; then
                echo "  · TurboACC 编译失败，自动移出本次构建（加速由 firewall4 分载 + BBR 承担）"
                sed -i -E 's/^(CONFIG_PACKAGE_luci-app-turboacc.*)$/# \1/' .config
                echo "false" > /workdir/state-turboacc
                make defconfig >/dev/null 2>&1 || true
                FIXED=1
              fi
            fi

            # 阶段 3：Go 主版本已对上但仍报 requires go（说明要的是补丁版本，
            # 例如 1.27.3 而 feeds 只提供 1.27.1）→ 允许 Go 在构建时自动取工具链
            if [ "$FIXED" -eq 0 ] && grep -q "requires go >=" build.log; then
              if grep -q "GOTOOLCHAIN=local" feeds/packages/lang/golang/golang-package.mk; then
                echo "  · 需要更高的 Go 补丁版本，切换为 GOTOOLCHAIN=auto（构建时自动下载对应工具链）"
                sed -i 's/GOTOOLCHAIN=local/GOTOOLCHAIN=auto/' \
                  feeds/packages/lang/golang/golang-package.mk
                FIXED=1
              fi
            fi

            if [ "$FIXED" -eq 0 ]; then
              break
            fi

            echo "🔁 修复完成，重新编译 ..."
            if build_once; then
              echo "✅ 降级重试后编译完成（日志见 build.log）"
              ccache -s || true
              exit 0
            fi
          done

          # ================= 仍失败：明确报错 =================
          echo "---- 失败包清单 ----"
          grep -oE "package/[A-Za-z0-9_./-]+ failed to build" build.log | sed 's/ failed to build//' | sort -u || true
          echo "::group::📋 编译失败诊断（最后 40 行）"
          tail -n 40 build.log || true
          echo "::endgroup::"
          if grep -q "requires go >=" build.log; then
            echo "::error::编译失败：Go 版本仍不满足（自动切换已尝试），请手动把 go_version 设为日志要求的版本"
          elif grep -qE "package/turboacc/[^ ]* failed to build" build.log; then
            echo "::error::编译失败：TurboACC 编译错误（自动移除已尝试），请用 with_turboacc=false 重跑"
          elif grep -q "No space left on device" build.log; then
            echo "::error::编译失败：磁盘不足，重跑（缓存复用）或改用 larger runner"
          else
            echo "::error::编译失败且无法自动修复，详见上方日志末 40 行"
          fi
          exit 1

      # ---------------------------------------------------------------
      - name: 12. 固件内容审计（缺失自动补齐，最多 3 轮）
        id: audit
        if: steps.build.outcome == 'success'
        run: |
          cd immortalwrt

          # ================= 审计脚本（可重复调用）=================
          # 退出码：0=通过  1=有缺失（可补齐）  2=致命（无产物）
          cat > /workdir/fw-audit.sh << 'EOS'
          #!/bin/sh
          MISS_PKG=/workdir/missing-pkgs.txt
          MISS_FILE=/workdir/missing-files.txt
          : > "$MISS_PKG"
          : > "$MISS_FILE"
          LOST=0

          cd bin/targets/ramips/mt7621 2>/dev/null || { echo "::error::产物目录不存在"; exit 2; }
          MANIFEST=$(ls -1 *.manifest 2>/dev/null | head -n1)
          [ -n "$MANIFEST" ] || { echo "::error::未找到 .manifest"; exit 2; }
          echo "包清单: $MANIFEST（$(wc -l < "$MANIFEST") 个包）"

          MUST="xray-core luci-app-passwall chinadns-ng v2ray-geoip v2ray-geosite dnsmasq-full luci-app-ksmbd ksmbd-server p910nd zram-swap luci-compat"
          [ "$1" = "true" ] && MUST="$MUST luci-app-turboacc"

          echo "---- 软件包 ----"
          for p in $MUST; do
            L=$(grep -m1 "^$p " "$MANIFEST")
            if [ -n "$L" ]; then
              printf '  ✅ %-22s %s\n' "$p" "$(echo "$L" | awk '{print $3}')"
            else
              printf '  ❌ %-22s 缺失\n' "$p"
              echo "$p" >> "$MISS_PKG"
              LOST=$((LOST + 1))
            fi
          done

          ROOTFS=$(ls -d ../../../../build_dir/target-*/root-ramips 2>/dev/null | head -n1)
          if [ -n "$ROOTFS" ]; then
            echo "---- 关键文件 ----"
            chk() {
              _n="$1"; shift
              for c in "$@"; do
                if [ -e "$ROOTFS/$c" ]; then
                  printf '  ✅ %-40s %s\n' "$c" "$(du -h "$ROOTFS/$c" 2>/dev/null | cut -f1)"
                  return 0
                fi
              done
              printf '  ❌ %-40s 缺失\n' "$_n"
              echo "$_n" >> "$MISS_FILE"
              LOST=$((LOST + 1))
              return 0
            }
            chk xray        usr/bin/xray
            chk p910nd-bin  usr/sbin/p910nd usr/bin/p910nd
            chk ksmbd-init  etc/init.d/ksmbd
            chk geoip       usr/share/v2ray/geoip.dat
            chk geosite     usr/share/v2ray/geosite.dat
            chk dns-secure  usr/bin/dns-secure
            chk dns-guard   usr/bin/dns-guard
            chk uci-90      etc/uci-defaults/90-luci
            chk uci-91      etc/uci-defaults/91-wireless
            chk uci-92      etc/uci-defaults/92-services
            chk usbwan      etc/hotplug.d/net/20-usbwan
            chk dns-recover usr/bin/dns-recover
            chk fw-selftest usr/bin/fw-selftest
            chk rule-refresh usr/bin/rule-refresh
            chk chinadns-ng usr/bin/chinadns-ng
            chk block-list  etc/passwall/rules/block_host
            chk guide       www/guide.html
            chk cfg-ksmbd   etc/config/ksmbd
            chk cfg-p910nd  etc/config/p910nd
            chk sysctl      etc/sysctl.conf
            # 屏蔽列表条数：构建期下载失败时会退化成一个空文件，这里显式警告一次
            if [ -f "$ROOTFS/etc/passwall/rules/block_host" ]; then
              _bn=$(wc -l < "$ROOTFS/etc/passwall/rules/block_host" | tr -d ' ')
              [ -n "$_bn" ] || _bn=0
              echo "  屏蔽列表: $_bn 条"
              [ "$_bn" -ge 50000 ] || echo "::warning::屏蔽列表条数偏少($_bn)，去广告基本不生效"
            fi
          else
            echo "::warning::未找到 root-ramips，跳过文件级检查"
          fi

          # ---- 版本对齐复查：Xray 必须 ≥ PassWall 要求的 26.7.11 ----
          XRAY_MV=$(grep -m1 '^xray-core ' "$MANIFEST" | awk '{print $3}' | cut -d- -f1)
          if [ -n "$XRAY_MV" ]; then
            _low=$(printf '%s\n%s\n' "26.7.11" "$XRAY_MV" | sort -V | head -n1)
            if [ "$_low" != "26.7.11" ]; then
              printf '  ❌ %-22s %s（低于 26.7.11，PassWall 无法启动）\n' "xray-core" "$XRAY_MV"
              echo "xray-core" >> "$MISS_PKG"
              LOST=$((LOST + 1))
            else
              printf '  ✅ %-22s %s（版本对齐）\n' "xray-core" "$XRAY_MV"
            fi
          fi

          echo "缺失合计: $LOST（包 $(wc -l < "$MISS_PKG") / 文件 $(wc -l < "$MISS_FILE")）"
          echo "$LOST" > /workdir/audit-count.txt
          [ "$LOST" -eq 0 ] || exit 1
          exit 0
          EOS
          chmod +x /workdir/fw-audit.sh

          # ================= 审计 → 补齐 → 再审计（无进展立即中断）=================
          diag_repair() {
            echo "::group::📋 缺失原因诊断"
            echo "--- 缺失包（config / feeds / ipk 三处状态）---"
            if [ -s /workdir/missing-pkgs.txt ]; then
              while read -r p; do
                [ -n "$p" ] || continue
                printf '  · %s\n' "$p"
                if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
                  echo "      config: 已选中"
                else
                  echo "      config: 未被 defconfig 保留（依赖不满足，或包名不存在）"
                fi
                if ./scripts/feeds list -n 2>/dev/null | grep -qx "$p"; then
                  echo "      feeds : 存在"
                else
                  echo "      feeds : 不存在（包名拼错 / 未加入 feeds / 源码未克隆）"
                fi
                _ipk=$(find bin/packages -name "${p}_*.ipk" 2>/dev/null | head -n1)
                if [ -n "$_ipk" ]; then
                  echo "      ipk   : $_ipk"
                else
                  echo "      ipk   : 未生成（包没有编译成功）"
                fi
              done < /workdir/missing-pkgs.txt
            else
              echo "  （无）"
            fi
            echo "--- 缺失文件 ---"
            if [ -s /workdir/missing-files.txt ]; then
              sed 's/^/  · /' /workdir/missing-files.txt
              echo "  → 说明 files/ 覆盖层没有生效，或对应包未安装"
            else
              echo "  （无）"
            fi
            echo "--- defconfig 告警（最后 15 条）---"
            grep -i 'warning' defconfig.log 2>/dev/null | tail -n 15 || echo "  （无）"
            echo "::endgroup::"
            echo "处理建议：按上面三行状态定位——config 未选中＝依赖问题；feeds 不存在＝包名或源问题；ipk 未生成＝编译失败"
          }

          OK=0
          PREV=999
          # 读"实际生效"的 TurboACC 状态（第 11 步可能已自动降级关掉它）
          EFF_TURBO=$(cat /workdir/state-turboacc 2>/dev/null || echo "true")
          echo "TurboACC 实际生效状态: ${EFF_TURBO}"
          for round in 1 2 3; do
            echo "================ 审计第 $round 轮 ================"
            RC=0
            /workdir/fw-audit.sh "$EFF_TURBO" || RC=$?

            if [ "$RC" -eq 0 ]; then
              OK=1
              break
            fi

            if [ "$RC" -eq 2 ]; then
              echo "::error::产物缺失（没有 manifest 或输出目录），无法补齐，立即中断"
              exit 1
            fi

            COUNT=$(cat /workdir/audit-count.txt 2>/dev/null || echo 999)

            # 补齐后缺失数没有下降 → 补不动了，立即中断，不再空跑第 2/3 轮
            if [ "$round" -gt 1 ] && [ "$COUNT" -ge "$PREV" ]; then
              echo "::error::第 $round 轮缺失数未下降（${PREV} → ${COUNT}），继续补齐无效，立即中断"
              diag_repair
              exit 1
            fi
            PREV=$COUNT

            if [ "$round" -eq 3 ]; then
              echo "::error::已补齐 3 轮仍有 ${COUNT} 项缺失，中断构建"
              diag_repair
              exit 1
            fi

            echo "⚙️  发现缺失（${COUNT} 项），执行第 $round 轮补齐"

            # (a) 重新部署 files/ 覆盖层（用第 5 步的快照还原）
            if [ -f /workdir/files-overlay.tgz ]; then
              rm -rf files
              tar -C . -xzf /workdir/files-overlay.tgz
              echo "  · files/ 覆盖层已重新部署"
            fi

            # (b) 缺失软件包写回 .config 并重建配置
            if [ -s /workdir/missing-pkgs.txt ]; then
              echo "  · 补装软件包: $(tr '\n' ' ' < /workdir/missing-pkgs.txt)"
              while read -r p; do
                [ -n "$p" ] || continue
                grep -q "^CONFIG_PACKAGE_${p}=y" .config || echo "CONFIG_PACKAGE_${p}=y" >> .config
              done < /workdir/missing-pkgs.txt
              make defconfig 2>&1 | tail -n 15
            fi

            # (c) 重建根文件系统与镜像（只重装+重打包，不重编已完成的包）
            rm -rf build_dir/target-*/root-ramips build_dir/target-*/stamp
            echo "  · 重建 rootfs + 镜像 ..."
            RC2=0
            make -j"$(nproc)" 2>&1 | tee -a build.log || RC2=$?
            if [ "$RC2" -ne 0 ]; then
              echo "::error::补齐重建失败（退出码 ${RC2}），最后 40 行："
              tail -n 40 build.log || true
              exit 1
            fi
          done

          [ "$OK" -eq 1 ] || { echo "::error::审计未通过，拒绝输出固件"; exit 1; }

          # ================= 体积 / 哈希 / 产物 =================
          cd bin/targets/ramips/mt7621
          ls -lh

          FIRMWARE=$(ls -1 *sysupgrade.bin 2>/dev/null | head -n1)
          [ -n "$FIRMWARE" ] || { echo "::error::未找到 sysupgrade.bin"; exit 1; }

          SIZE=$(stat -c%s "$FIRMWARE")
          SIZE_MB=$(awk -v s="$SIZE" 'BEGIN{printf "%.2f", s/1048576}')
          LIMIT_MB=$(awk -v s="$MAX_FIRMWARE_SIZE" 'BEGIN{printf "%.2f", s/1048576}')
          echo "文件: $FIRMWARE"
          echo "体积: ${SIZE_MB} MiB (${SIZE} B) / 分区上限 ${LIMIT_MB} MiB (${MAX_FIRMWARE_SIZE} B)"
          [ "$SIZE" -gt 0 ] || { echo "::error::固件为 0 字节"; exit 1; }
          [ "$SIZE" -le "$MAX_FIRMWARE_SIZE" ] || { echo "::error::固件超出 firmware 分区，刷入会变砖"; exit 1; }

          PKG_COUNT=$(wc -l < "$(ls -1 *.manifest | head -n1)")

          # 余量告警：overlay（可写分区）太小时，LuCI 改配置容易写失败
          SPARE=$((MAX_FIRMWARE_SIZE - SIZE))
          if [ "$SPARE" -lt 2097152 ]; then
            echo "::warning::固件余量只有 $(awk -v s="$SPARE" 'BEGIN{printf "%.2f", s/1048576}') MiB，overlay 会很紧张"
          fi

          # ================= 版本快照（本次构建到底用了哪些版本）=================
          {
            echo "# ImmortalWrt 25.12 for Newifi-D2 — 构建版本快照"
            echo ""
            echo "构建时间 : $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "源码分支 : openwrt-25.12 @ $(git -C ../../../.. log -1 --format='%h %cd' --date=format:'%Y-%m-%d')"
            echo "固件体积 : ${SIZE_MB} MiB / ${LIMIT_MB} MiB"
            echo "包总数   : ${PKG_COUNT}"
            echo ""
            echo "## 关键组件"
            grep -E '^(luci-app-passwall|xray-core|luci-app-turboacc|v2ray-geoip|v2ray-geosite|dnsmasq-full|ksmbd-server|luci-app-ksmbd|p910nd|zram-swap) ' \
                 "$(ls -1 *.manifest | head -n1)" | sort
          } > versions.txt
          cat versions.txt

          sha256sum "$FIRMWARE" > sha256sums.txt
          cat sha256sums.txt

          {
            echo "### ✅ 固件审计通过（含内容核对）"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 文件 | \`$FIRMWARE\` |"
            echo "| 体积 | **${SIZE_MB} MiB** |"
            echo "| 分区上限 | ${LIMIT_MB} MiB (0x1FB0000) |"
            echo "| 余量 | $(awk -v a="$MAX_FIRMWARE_SIZE" -v b="$SIZE" 'BEGIN{printf "%.2f", (a-b)/1048576}') MiB |"
            echo "| 固件内包数 | ${PKG_COUNT} |"
            echo "| 关键包/文件缺失 | 0 |"
            echo "| 自动补齐轮次 | ${round} |"
            echo "| TurboACC | ${EFF_TURBO} |"
            echo ""
            echo "<details><summary>本次构建的组件版本</summary>"
            echo ""
            echo '```'
            echo "源码: openwrt-25.12 @ $(git -C ../../../.. log -1 --format='%h %cd' --date=format:'%Y-%m-%d')"
            grep -E '^(luci-app-passwall|xray-core|luci-app-turboacc|v2ray-geoip|v2ray-geosite|dnsmasq-full) ' \
                 "$(ls -1 *.manifest | head -n1)" | sort
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "FIRMWARE_DIR=$PWD" >> "$GITHUB_ENV"
          echo "FIRMWARE_NAME=$FIRMWARE" >> "$GITHUB_ENV"
          echo "TAG_DATE=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------
      - name: 13. 上传固件 artifact
        if: steps.audit.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-d2-${{ env.TAG_DATE }}
          path: |
            ${{ env.FIRMWARE_DIR }}/*sysupgrade.bin
            ${{ env.FIRMWARE_DIR }}/sha256sums.txt
            ${{ env.FIRMWARE_DIR }}/versions.txt
          if-no-files-found: error
          retention-days: 7

      # ---------------------------------------------------------------
      - name: 14. 记录回退点（上一个可用版本）
        if: steps.audit.outcome == 'success'
        run: |
          # 本步骤只读，不删任何东西：历史 Release 全部保留，随时可回退
          PREV=$(git ls-remote --tags --refs origin 2>/dev/null \
                 | awk -F'refs/tags/' '{print $2}' | grep -E '^D2-' | sort -V | tail -n1)
          echo "PREV_TAG=${PREV:-（这是首个版本）}" >> "$GITHUB_ENV"
          echo "本次源码提交: ${{ github.sha }}"
          echo "上一个可用版本: ${PREV:-无}"
          {
            echo ""
            echo "### 回退点"
            echo "- 本次源码提交: \`${{ github.sha }}\`"
            echo "- 上一个可用版本: \`${PREV:-无}\`"
            echo "- 触发方式: \`${{ github.event_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------
      - name: 15. 发布 Release
        if: steps.audit.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: D2-${{ env.TAG_DATE }}-r${{ github.run_number }}
          name: ImmortalWrt 25.12 for Newifi-D2 [${{ env.TAG_DATE }}]
          body: |
            ## ImmortalWrt 25.12 · Newifi-D2

            > **固件本体是"冻结"版本**：软件版本锁定在编译时，**不自升级**；要新版本就刷入新构建。
            > **规则会自更新**：PassWall 的 gfwlist / chnlist 每周六 04:30 由 `rule-refresh` 刷新
            > （失败自动回滚，不会把路由器停在半坏状态）。geoip/geosite 二进制库仍随固件版本。
            >
            > 本仓库已开启**每周六 02:17（北京）定时构建**，源码每次取
            > `openwrt-25.12` / feeds / 第三方 `main` 的最新提交，所以每周都会有新 Release。

            默认管理地址 **192.168.2.1** · 无 root 密码（首次登录请自行设置）

            ### 本次使用的版本
            见 Release 附件 **`versions.txt`**（含源码提交号与各组件版本号）。

            ### ↩️ 回退（出问题时）
            - 本次源码提交：`${{ github.sha }}`
            - 上一个可用版本：**`${{ env.PREV_TAG }}`**
            - 方法：在下方 Releases 列表里找到上一个版本，下载它的 `sysupgrade.bin`，
              在 LuCI「系统 → 备份/升级」中**保留配置**刷入即可（3 分钟内完成）。
            - 历史 Release 一律不删，都是可回退点。

            ### 内置组件
            - **PassWall + Xray**（nftables 透明代理；仅编入 Xray，省掉 SS-Rust / Simple-Obfs）
            - **去广告**：PassWall「屏蔽列表」内置 anti-AD（约 11 万条域名，命中返回 NXDOMAIN；
              不装 geoview、不占 overlay，清单随每次构建更新）
            - **DNS**：客户端查询由 PassWall 的 chinadns-ng 接管（分流 + 去广告）；
              路由器自身走系统 dnsmasq，开机自动尝试 DoT 加密（853/TLS），
              失败立即回滚明文、不会断网；不装 MosDNS，省约 6MB 闪存
            - **TurboACC**（流量分载 + BBR；全锥 NAT 视 `kmod-nft-fullcone` 可用性）
            - **Ksmbd**（`/mnt/sda1` 共享）· **p910nd**（`/dev/usb/lp0`）
            - **USB 网卡全家桶**：RNDIS / NCM / ECM / EEM / MBIM / QMI / IPheth / WWAN，热插拔自动挂 WAN
            - 性能调优：BBR + `fq` + `rmem/wmem 8MB` + conntrack 32K + CPU 锁 `performance` + ZRAM

            ### 无线
            - 2.4G：`alon` @ ch11 HT20 · 5G：`alon-5G` @ ch36 VHT80 · WPA2 `alon12345678`（**请立即修改**）

            ### 出问题怎么办
            路由器里已内置说明页：**http://192.168.2.1/guide.html**
            自检命令：SSH 执行 **`fw-selftest`**（逐项 ✅/❌，一眼看出哪个功能没起来）

            | 现象 | 处理 |
            | --- | --- |
            | 能 ping 通 IP、但网页打不开 | SSH 执行 **`dns-recover`** |
            | 某个 App / 网站突然不通 | SSH 执行 `dns-recover`，或检查 PassWall 分流规则 |
            | 广告还在（没被拦） | SSH 执行 **`fw-selftest`** 看「屏蔽列表 N 条」；服务 → PassWall → 规则列表 → 屏蔽列表 确认条目在 |
            | 导入节点后代理没马上生效 | 最多等 5 分钟自动接管，或 SSH 执行 **`dns-guard`** |
            | 想关掉路由器自身的 DNS 加密 | SSH 执行 **`dns-secure off`** |
            | 科学上网时快时慢 | TurboACC 里把硬件分载 `hw_flow` 关掉再试 |

            ### 校验
            `sha256sums.txt`；体积已通过 32MB(0x1FB0000) 分区上限审计。
          files: |
            ${{ env.FIRMWARE_DIR }}/*sysupgrade.bin
            ${{ env.FIRMWARE_DIR }}/sha256sums.txt
            ${{ env.FIRMWARE_DIR }}/versions.txt
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------------
      # 放在最后：编译 / 审计 / 发布任一阶段失败都能捞到日志
      - name: 16. 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            immortalwrt/build.log
            immortalwrt/defconfig.log
            immortalwrt/.config
          if-no-files-found: warn
          retention-days: 7
